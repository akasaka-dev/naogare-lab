<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>たすけあいヒーロー ふわお（2.5D）</title>
<style>
  :root{
    --sky:#8FE3FF;
    --grass:#8FDD7A;
    --cream:#FFF7E8;
    --bread:#F2B463;
    --accent:#FF6B4A;
    --ink:#5A3E22;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:#3a3a50;
    display:flex;align-items:center;justify-content:center;
    font-family:'Hiragino Maru Gothic Pro','Yu Gothic',sans-serif;
    overflow:hidden;
  }
  #wrap{
    position:relative;
    padding:14px;
    background:var(--cream);
    border-radius:24px;
    box-shadow:0 10px 0 #E8B96A, 0 16px 34px rgba(0,0,0,0.35);
    max-height:100vh;
    display:flex;flex-direction:column;align-items:center;
  }
  #title{
    text-align:center;
    font-size:19px;font-weight:900;color:var(--accent);
    letter-spacing:1px;margin-bottom:4px;
    text-shadow:1px 1px 0 #fff;
  }
  #hud{
    display:flex;justify-content:space-between;width:100%;
    padding:0 4px 8px 4px;font-size:12px;font-weight:700;color:var(--ink);
  }
  #hud b{color:var(--accent);}
  #powerBarOuter{
    flex:1;margin:0 8px;height:12px;background:#e0d3ba;border-radius:8px;overflow:hidden;
    border:2px solid #c9aa74;
  }
  #powerBarInner{height:100%;width:100%;background:linear-gradient(90deg,#FFD36B,#FF6B4A);transition:width 0.15s;}
  #stageArea{position:relative;border-radius:14px;overflow:hidden;
    width:min(420px, 94vw, 66vh);aspect-ratio:3/4;margin:0 auto;
    border:5px solid #fff;}
  #backdrop{position:absolute;inset:0;background-image:url('images/background.webp');background-size:cover;background-position:center 40%;}
  canvas{position:absolute;inset:0;display:block;background:transparent;width:100%;height:100%;touch-action:none;}
  #ui{background:transparent;pointer-events:none;}
  #bossBar{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:170px;text-align:center;pointer-events:none;display:none;}
  #audioControls{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:20;}
  #audioControls button{
    width:30px;height:30px;padding:0;border-radius:50%;
    background:rgba(255,247,232,0.9);border:2px solid #E8B96A;
    font-size:14px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  #audioControls button.off{opacity:0.45;}
  #bossName{font:900 13px sans-serif;text-shadow:1px 1px 0 rgba(0,0,0,0.25);margin-bottom:2px;}
  #bossBarOuter{background:rgba(0,0,0,0.3);height:10px;border-radius:2px;border:1.5px solid #fff;overflow:hidden;}
  #bossBarInner{height:100%;width:100%;background:#8B5CF6;transition:width 0.1s linear;}
  #overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(60,40,20,0.82);color:#fff;text-align:center;padding:0 16px;
  }
  #overlay h1{font-size:24px;margin:0 0 8px 0;color:#FFD36B;text-shadow:2px 2px 0 #B23E2A;}
  #overlay p{margin:3px 0;font-size:12px;color:#FFF3DD;line-height:1.7;}
  #overlay button{
    margin-top:16px;background:var(--accent);border:none;color:#fff;
    padding:11px 28px;font-family:inherit;font-weight:900;letter-spacing:1px;
    font-size:14px;border-radius:26px;cursor:pointer;
    box-shadow:0 5px 0 #C24A32;
  }
  #overlay button:active{transform:translateY(4px);box-shadow:none;}
  #overlay .secbtn{
    margin-top:10px;background:rgba(255,247,232,0.15);border:2px solid #FFD36B;color:#FFD36B;
    padding:8px 22px;font-family:inherit;font-weight:900;letter-spacing:1px;
    font-size:12px;border-radius:20px;cursor:pointer;box-shadow:none;
  }
  #overlay .secbtn:active{transform:translateY(2px);}
  #overlay .secbtn:disabled{opacity:0.5;cursor:default;}
  #rankForm{margin-top:10px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;}
  #rankNameInput{
    font-family:inherit;font-size:13px;padding:7px 10px;border-radius:16px;border:2px solid #E8B96A;
    width:140px;text-align:center;
  }
  #rankList{
    margin-top:10px;width:100%;max-width:280px;max-height:180px;overflow-y:auto;
    background:rgba(0,0,0,0.2);border-radius:10px;padding:8px 12px;text-align:left;
  }
  #rankList ol{margin:0;padding:0 0 0 20px;}
  #rankList li{font-size:12px;color:#FFF3DD;padding:3px 0;display:flex;justify-content:space-between;gap:8px;}
  #rankList li span.rankScore{color:#FFD36B;font-weight:900;flex:none;}
  #rankEmpty{font-size:12px;color:#FFF3DD;opacity:0.7;margin:10px 0 0 0;}
  #hint{text-align:center;color:#8A6A46;font-size:11px;margin-top:6px;font-weight:700;}
</style>
</head>
<body>
<div id="wrap">
  <div id="title">🍞 たすけあいヒーロー ふわお 🍞</div>
  <div id="hud">
    <div>スコア <b id="scoreVal">0</b></div>
    <div id="powerBarOuter"><div id="powerBarInner"></div></div>
    <div>助けた数 <b id="helpVal">0</b></div>
  </div>
  <div id="stageArea">
    <div id="backdrop"></div>
    <canvas id="game" width="420" height="560"></canvas>
    <canvas id="ui" width="420" height="560"></canvas>
    <div id="bossBar">
      <div id="bossName"></div>
      <div id="bossBarOuter"><div id="bossBarInner"></div></div>
    </div>
    <div id="audioControls">
      <button id="bgmToggle" title="BGM">🎵</button>
      <button id="sfxToggle" title="効果音">🔔</button>
    </div>
    <div id="overlay">
      <h1>ふわおの町たすけ隊</h1>
      <p>矢印キー / WASD で移動(スマホはスワイプ or ドラッグ操作)</p>
      <p>「たすけて〜」の人に近づいてパワーを分けてあげよう。<br>
      ばい菌をよけながら、時々パン屋さんで元気を補給してね。</p>
      <button id="startBtn">スタート</button>
    </div>
  </div>
  <div id="hint">パワーが0になるとゲームオーバー</div>
</div>

<audio id="bgmAudio" loop preload="auto">
  <source src="bgm/bgm.mp3" type="audio/mpeg">
</audio>
<audio id="bossBgmAudio" loop preload="auto">
  <source src="bgm/boss.mp3" type="audio/mpeg">
</audio>

<script src="lib/three.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById('game');
  const uiCanvas = document.getElementById('ui');
  const uiCtx = uiCanvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('scoreVal');
  const helpEl = document.getElementById('helpVal');
  const powerBar = document.getElementById('powerBarInner');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const bossBarEl = document.getElementById('bossBar');
  const bossNameEl = document.getElementById('bossName');
  const bossBarInnerEl = document.getElementById('bossBarInner');

  const bakery = {x:60, y:60, r:34};
  const BAKERY_SAFE_R_INITIAL = bakery.r + 14; // 安全地帯の初期半径（ばい菌の体当たりで少しずつ削れていく）
  const PERSON_HORIZON_Y = 200; // 背景イラストの地平線あたりのY座標（これより上＝空には町人を出現させない）

  function worldX(x){ return x - W/2; }
  function worldZ(y){ return y - H/2; }

  // ---------- 主人公: 前向き/後ろ向きスプライト ----------
  const heroFrontImg = new Image();
  const heroBackImg = new Image();
  let heroFrontLoaded=false, heroBackLoaded=false;
  let heroFrontAspect=1, heroBackAspect=1;
  const heroFrontTex = new THREE.Texture(heroFrontImg);
  const heroBackTex = new THREE.Texture(heroBackImg);
  heroFrontImg.onload = ()=>{ heroFrontLoaded=true; heroFrontAspect = heroFrontImg.naturalWidth/heroFrontImg.naturalHeight; heroFrontTex.needsUpdate=true; };
  heroBackImg.onload = ()=>{ heroBackLoaded=true; heroBackAspect = heroBackImg.naturalWidth/heroBackImg.naturalHeight; heroBackTex.needsUpdate=true; };
  heroFrontImg.src = "images/hero_front.webp";
  heroBackImg.src = "images/hero_back.webp";

  const bgmAudio = document.getElementById('bgmAudio');
  bgmAudio.volume = 0.5;
  const bossBgmAudio = document.getElementById('bossBgmAudio');
  bossBgmAudio.volume = 0.5;
  const ENDING_BGM_FILES = ['bgm/ending1.mp3', 'bgm/ending2.mp3']; // ゲームオーバー画面でランダム再生
  let currentEndingAudio = null; // 効果音と同じく、再生のたびに新しいAudioを生成する（file://での使い回しによる不具合を避けるため）

  // ---------- スコアランキング（Cloudflare D1 / naogare-lab の /api/fuwao/*） ----------
  const FUWAO_API_BASE = '/api/fuwao';
  const RANKING_QUALIFY_COUNT = 10; // サーバー側のランキング表示件数と合わせる
  let fuwaoSessionToken = null; // スタート時に発行、スコア登録で一度だけ使う（不正投稿対策）
  let fuwaoRankSubmitted = false; // 今回のプレイですでに登録済みか（ランキング画面から戻った時の二重表示防止）

  async function beginFuwaoSession(){
    fuwaoSessionToken = null;
    fuwaoRankSubmitted = false;
    try {
      const res = await fetch(FUWAO_API_BASE + '/session', { method:'POST' });
      const data = await res.json();
      if(data && data.ok) fuwaoSessionToken = data.token;
    } catch(e){}
  }
  async function fetchFuwaoRanking(){
    try {
      const res = await fetch(FUWAO_API_BASE + '/ranking');
      const data = await res.json();
      return (data && data.ok && Array.isArray(data.results)) ? data.results : [];
    } catch(e){ return []; }
  }
  function loadNamePref(){
    try { return localStorage.getItem('fuwao_playerName') || ''; } catch(e){ return ''; }
  }
  function saveNamePref(name){
    try { localStorage.setItem('fuwao_playerName', name); } catch(e){}
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- BGM・効果音 オン/オフ設定 ----------
  const bgmToggleBtn = document.getElementById('bgmToggle');
  const sfxToggleBtn = document.getElementById('sfxToggle');
  function loadPref(key, def){
    try { const v = localStorage.getItem(key); return v===null ? def : v==='1'; }
    catch(e){ return def; }
  }
  function savePref(key, val){
    try { localStorage.setItem(key, val ? '1':'0'); } catch(e){}
  }
  let bgmEnabled = loadPref('fuwao_bgmEnabled', true);
  let sfxEnabled = loadPref('fuwao_sfxEnabled', true);

  function updateAudioButtons(){
    bgmToggleBtn.textContent = bgmEnabled ? '🎵' : '🔇';
    bgmToggleBtn.classList.toggle('off', !bgmEnabled);
    sfxToggleBtn.textContent = sfxEnabled ? '🔔' : '🔕';
    sfxToggleBtn.classList.toggle('off', !sfxEnabled);
  }
  bgmToggleBtn.addEventListener('click', ()=>{
    bgmEnabled = !bgmEnabled;
    savePref('fuwao_bgmEnabled', bgmEnabled);
    if(!bgmEnabled){ stopBgm(); }
    else if(running){ playBgm(); }
    updateAudioButtons();
  });
  sfxToggleBtn.addEventListener('click', ()=>{
    sfxEnabled = !sfxEnabled;
    savePref('fuwao_sfxEnabled', sfxEnabled);
    updateAudioButtons();
  });
  updateAudioButtons();

  function stopEndingBgm(){
    if(currentEndingAudio){ currentEndingAudio.pause(); currentEndingAudio = null; }
  }
  function playBgm(){
    bossBgmAudio.pause();
    stopEndingBgm();
    if(!bgmEnabled) return;
    bgmAudio.currentTime = 0;
    bgmAudio.play().catch(()=>{});
  }
  function playBossBgm(){
    bgmAudio.pause();
    stopEndingBgm();
    if(!bgmEnabled) return;
    bossBgmAudio.currentTime = 0;
    bossBgmAudio.play().catch(()=>{});
  }
  function playEndingBgm(){
    bgmAudio.pause();
    bossBgmAudio.pause();
    stopEndingBgm();
    if(!bgmEnabled) return;
    const file = ENDING_BGM_FILES[Math.floor(Math.random()*ENDING_BGM_FILES.length)];
    // 効果音と同じく、再生のたびに新しいAudioインスタンスを作る
    const a = new Audio(file);
    a.loop = true;
    a.volume = 0.5;
    a.play().catch(()=>{});
    currentEndingAudio = a;
  }
  function stopBgm(){ bgmAudio.pause(); bossBgmAudio.pause(); stopEndingBgm(); }

  // 効果音: Web Audio API で事前にデコードしたバッファを鳴らす。
  // new Audio()を毎回生成して.play()する方式は、特にモバイルでは再生のたびに
  // 取得・デコードのパイプラインが走り直しになり体感の遅延が大きい（ファイルを
  // 短くしても改善しなかったのはこれが原因）。事前デコードしておけば再生開始は
  // ほぼ即時になる。AudioContext / decodeAudioData 非対応の環境向けに
  // new Audio() 方式へフォールバックする。ファイル未設置でもエラーにならないよう
  // 静かに失敗させる。
  // sfx/help.mp3        … 町人を助けた時
  // sfx/hit.mp3         … ふわおがばい菌/ボスの弾に当たった時
  // sfx/person_hit.mp3  … 町人がボスの弾に当たって消える時
  // sfx/boss_appear.mp3 … ボス出現時
  // sfx/boss_clear.mp3  … 生き延びボーナス時
  // sfx/bakery_hit.mp3  … 家が欠ける時
  // sfx/game_over.mp3   … 力尽きた瞬間（昇天開始時）
  const SFX_NAMES = ['help','hit','person_hit','boss_appear','boss_clear','bakery_hit','game_over'];
  let audioCtx = null;
  const sfxBuffers = {}; // name -> AudioBuffer（デコード完了後にセットされる）

  function getAudioCtx(){
    if(audioCtx) return audioCtx;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
    return audioCtx;
  }

  function loadSfxBuffers(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    SFX_NAMES.forEach(name=>{
      fetch('sfx/' + name + '.mp3')
        .then(res => res.arrayBuffer())
        .then(data => ctx.decodeAudioData(data))
        .then(buf => { sfxBuffers[name] = buf; })
        .catch(()=>{});
    });
  }
  loadSfxBuffers();

  function playSfx(name){
    if(!sfxEnabled) return;
    const ctx = getAudioCtx();
    const buf = ctx && sfxBuffers[name];
    if(ctx && buf){
      if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
      try {
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
        return;
      } catch(e){}
    }
    // AudioContext未対応、またはまだデコードが終わっていない場合のフォールバック
    try {
      const a = new Audio('sfx/' + name + '.mp3');
      a.volume = 0.5;
      a.play().catch(()=>{});
    } catch(e){}
  }

  // パワーが減るほど体が「小さくなる」演出（ゲームオーバー間際はかなり小さくなる）
  const HERO_MIN_SHRINK = 0.3;
  function getHeroShrink(powerVal){
    const ratio = Math.max(0, Math.min(1, powerVal/100));
    return HERO_MIN_SHRINK + (1-HERO_MIN_SHRINK)*ratio;
  }

  // ---------- 10体のボス画像読み込み ----------
  const BOSS_IMG_COUNT = 10;
  const bossImgs = [];
  const bossImgLoaded = [];
  const bossImgAspect = [];
  const bossTextures = [];
  for(let i=0;i<BOSS_IMG_COUNT;i++){
    const img = new Image();
    bossImgLoaded[i] = false;
    bossImgAspect[i] = 1;
    const tex = new THREE.Texture(img);
    bossTextures.push(tex);
    img.onload = (function(idx){ return ()=>{
      bossImgLoaded[idx] = true;
      bossImgAspect[idx] = img.naturalWidth / img.naturalHeight;
      bossTextures[idx].needsUpdate = true;
    };})(i);
    img.src = 'images/boss' + i + '.webp';
    bossImgs.push(img);
  }

  // ---------- ばい菌キャラクター ----------
  const germImg = new Image();
  let germImgLoaded = false;
  const germTex = new THREE.Texture(germImg);
  germImg.onload = ()=>{ germImgLoaded = true; germTex.needsUpdate = true; };
  germImg.src = "images/germ.webp";

  // ---------- 町の人（年齢別キャラクター） ----------
  const PERSON_TYPES = [
    {name:'男の子',     age:'child', speedMul:1.55, bobSpeed:4.6, cropRatio:0.60},
    {name:'女の子',     age:'child', speedMul:1.55, bobSpeed:4.6, cropRatio:0.56},
    {name:'大人の男性', age:'adult', speedMul:1.0,  bobSpeed:4.0, cropRatio:0.62},
    {name:'おじいさん', age:'elder', speedMul:0.55, bobSpeed:2.2, cropRatio:0.62, limp:true},
    {name:'おばあさん', age:'elder', speedMul:0.6,  bobSpeed:2.4, cropRatio:0.62, limp:true},
  ];
  const PERSON_IMG_FILES = [
    "chara/helper_hero_boy.webp",
    "chara/helper_hero_girl.webp",
    "chara/helper_hero_man.webp",
    "chara/helper_hero_oldman.webp",
    "chara/helper_hero_oldwoman.webp",
  ];
  const personImgs = [], personImgLoaded = [], personImgAspect = [];
  const personTextures = [];
  for(let i=0;i<PERSON_TYPES.length;i++){
    const img = new Image();
    personImgLoaded[i] = false;
    personImgAspect[i] = 1;
    const tex = new THREE.Texture(img);
    personTextures.push(tex);
    img.onload = (function(idx){ return ()=>{
      personImgLoaded[idx] = true;
      personImgAspect[idx] = img.naturalWidth / img.naturalHeight;
      personTextures[idx].needsUpdate = true;
    };})(i);
    img.src = PERSON_IMG_FILES[i];
    personImgs.push(img);
  }

  // =========================================================
  // ---------- three.js: シーン / カメラ / 地面 / 建物 ----------
  // =========================================================
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(W, H, false);
  renderer.setClearColor(0x000000, 0); // 背景はCSSの画像(#backdrop)を透過して見せる

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, W/H, 1, 3000);
  camera.position.set(0, 520, 420);
  camera.lookAt(0, 0, -60);

  // パン屋（静止した看板スプライト）
  const bakeryCanvas = document.createElement('canvas');
  bakeryCanvas.width = 100; bakeryCanvas.height = 100;
  const BAKERY_MAX_HITS = 5; // これくらいの被弾数で家がほぼ消える
  const BAKERY_BITE_SPOTS = [
    {x:50, y:38, r:22},
    {x:27, y:64, r:20},
    {x:73, y:64, r:20},
    {x:50, y:82, r:20},
    {x:50, y:58, r:26},
  ];
  function renderBakeryTexture(hits){
    const b = bakeryCanvas.getContext('2d');
    b.clearRect(0,0,100,100);
    b.save();
    b.translate(50,68);
    b.fillStyle='#E8A65A';
    b.fillRect(-30,-16,60,40);
    b.fillStyle='#B23E2A';
    b.beginPath();
    b.moveTo(-36,-16); b.lineTo(0,-42); b.lineTo(36,-16);
    b.closePath(); b.fill();
    b.fillStyle='#fff';
    b.font='bold 13px sans-serif';
    b.textAlign='center';
    b.fillText('🍞パン屋', 0, 8);
    b.restore();
    if(hits>0){
      b.save();
      b.globalCompositeOperation = 'destination-out';
      for(let i=0;i<Math.min(hits,BAKERY_BITE_SPOTS.length);i++){
        const s = BAKERY_BITE_SPOTS[i];
        b.beginPath();
        b.arc(s.x, s.y, s.r, 0, Math.PI*2);
        b.fill();
      }
      b.restore();
    }
    if(bakeryTex) bakeryTex.needsUpdate = true;
  }
  const bakeryTex = new THREE.CanvasTexture(bakeryCanvas);
  renderBakeryTexture(0);
  const bakerySprite = new THREE.Sprite(new THREE.SpriteMaterial({map:bakeryTex, transparent:true}));
  bakerySprite.scale.set(76,76,1);
  bakerySprite.position.set(worldX(bakery.x), 38, worldZ(bakery.y));
  scene.add(bakerySprite);

  // 主人公スプライト（パン屋など他のオブジェクトに隠れないよう常に最前面に表示）
  const heroSprite = new THREE.Sprite(new THREE.SpriteMaterial({map:heroFrontTex, transparent:true, depthTest:false}));
  heroSprite.renderOrder = 999;
  scene.add(heroSprite);

  // ボススプライト＋発光ハロー（四角く透過されないよう円形グラデーションのテクスチャを使用）
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = 128; glowCanvas.height = 128;
  (function drawGlowTexture(){
    const gl = glowCanvas.getContext('2d');
    const grad = gl.createRadialGradient(64,64,0, 64,64,64);
    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.35)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    gl.fillStyle = grad;
    gl.fillRect(0,0,128,128);
  })();
  const glowTex = new THREE.CanvasTexture(glowCanvas);
  const bossGlow = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:0xffffff, transparent:true, opacity:0.8, depthTest:false}));
  bossGlow.visible = false;
  scene.add(bossGlow);
  const bossSprite = new THREE.Sprite(new THREE.SpriteMaterial({transparent:true}));
  bossSprite.visible = false;
  scene.add(bossSprite);

  function disposeSprite(spr){
    scene.remove(spr);
    if(spr.material.map && spr.material.map.dispose) spr.material.map.dispose();
    spr.material.dispose();
  }

  function createPersonSprite(typeIdx){
    const mat = new THREE.SpriteMaterial({map: personTextures[typeIdx].clone(), transparent:true});
    mat.map.needsUpdate = true;
    const spr = new THREE.Sprite(mat);
    scene.add(spr);
    return spr;
  }

  function createGermSprite(){
    const mat = new THREE.SpriteMaterial({map: germTex, transparent:true});
    const spr = new THREE.Sprite(mat);
    scene.add(spr);
    return spr;
  }

  let keys={};
  window.addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
    keys[k]=true;
  });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

  // touch: floating virtual joystick (touch point becomes the stick's center)
  let joystick = null; // {originX, originY, dx, dy, mag}
  const JOY_RADIUS = 46;
  const JOY_DEADZONE = 6;

  function updateJoystick(clientX, clientY){
    const r = canvas.getBoundingClientRect();
    const x = (clientX-r.left)/r.width*W;
    const y = (clientY-r.top)/r.height*H;
    let dx = x - joystick.originX, dy = y - joystick.originY;
    const dist = Math.hypot(dx,dy);
    if(dist > JOY_RADIUS){ dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
    joystick.dx = dx; joystick.dy = dy;
    joystick.mag = Math.min(dist, JOY_RADIUS)/JOY_RADIUS;
  }

  canvas.addEventListener('touchstart', e=>{
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    const x = (t.clientX-r.left)/r.width*W;
    const y = (t.clientY-r.top)/r.height*H;
    joystick = {originX:x, originY:y, dx:0, dy:0, mag:0};
  }, {passive:true});
  canvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(!joystick) return;
    const t = e.touches[0];
    updateJoystick(t.clientX, t.clientY);
  }, {passive:false});
  canvas.addEventListener('touchend', ()=>{ joystick=null; }, {passive:true});
  canvas.addEventListener('touchcancel', ()=>{ joystick=null; }, {passive:true});

  let running=false;
  let frame=0;
  let hero, power, score, helped, invuln, spawnPersonTimer, spawnGermTimer, elapsed;
  let people=[], germs=[], particles=[], floaters=[];
  let bossActive=false, boss=null, bossTimer=0, bossFireTimer=0, bossBullets=[], lastBossHelped=0, bossPhase=0;
  let bossHouseFireTimer=0; // 通常の攻撃パターンとは別に、定期的に家を狙い撃ちする弾
  const DEATH_ANIM_TIME = 2.5; // 力尽きてからくるくる回って昇天するまでの時間
  const DEATH_GROW_TARGET = 2.2; // 昇天中にここまで大きくなる（小さすぎて分かりにくいのを防ぐ）
  let dying=false, dyingTimer=0, heroDeathSpin=0, heroDeathRise=0, heroDeathStartShrink=1;
  let bossesDefeated=0; // 倒したボスの総数（10種類すべて倒すたびに弾幕が濃くなる判定に使う）
  let bakerySafeR = BAKERY_SAFE_R_INITIAL; // ばい菌の体当たりで少しずつ削れる安全地帯の半径
  let bakeryHits = 0; // 家が被弾した回数（見た目が欠けていく演出に使う）
  let germsRetreating = false; // ボス出現直前、ばい菌が退散を始めたか

  function resetGame(){
    people.forEach(p=>disposeSprite(p.sprite));
    germs.forEach(g=>disposeSprite(g.sprite));
    hero = {x:W/2, y:H/2, dir:1, facing:'front'};
    power = 100;
    score = 0; helped = 0; invuln = 1.5; elapsed=0;
    people = []; germs = []; particles = []; floaters=[];
    spawnPersonTimer = 1.2;
    spawnGermTimer = 3;
    bossActive=false; boss=null; bossTimer=0; bossFireTimer=0; bossBullets=[]; lastBossHelped=0; bossPhase=0;
    bossHouseFireTimer=0;
    dying=false; dyingTimer=0; heroDeathSpin=0; heroDeathRise=0; heroDeathStartShrink=1;
    bossesDefeated=0;
    bakerySafeR = BAKERY_SAFE_R_INITIAL;
    bakeryHits = 0;
    renderBakeryTexture(0);
    germsRetreating = false;
    updateHud();
  }

  function updateHud(){
    scoreEl.textContent = Math.floor(score);
    helpEl.textContent = helped;
    powerBar.style.width = Math.max(0,power)+'%';
  }

  function spawnParticles(x,y,color,n){
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = Math.random()*2.5+0.8;
      particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:30+Math.random()*16,color});
    }
  }

  function spawnFloater(x,y,text,color,big){
    floaters.push({x,y,text,color,life:50,big:!!big});
  }

  function spawnPerson(){
    // 町人は上空から出てこない。地平線より下・画面外（左／右／下）から現れる
    const edge = Math.floor(Math.random()*3);
    let x,y;
    if(edge===0){ x=-20; y = PERSON_HORIZON_Y + Math.random()*(H-PERSON_HORIZON_Y); }
    else if(edge===1){ x=W+20; y = PERSON_HORIZON_Y + Math.random()*(H-PERSON_HORIZON_Y); }
    else { x=Math.random()*W; y=H+20; }
    const tx = W*0.2+Math.random()*W*0.6, ty = H*0.25+Math.random()*H*0.55;
    const typeIdx = Math.floor(Math.random()*PERSON_TYPES.length);
    const sprite = createPersonSprite(typeIdx);
    people.push({x,y,tx,ty,r:14,helped:false,bob:Math.random()*10,typeIdx,sprite,cropApplied:false});
  }

  // ばい菌：コミカルで憎めないけどいやらしい動き
  const GERM_SPEED = 40 * Math.max(...PERSON_TYPES.map(t=>t.speedMul)); // 町人の最高速度くらい
  const GERM_HERO_PRIORITY_RANGE = 90; // これより近くをふわおが通ったら町人より優先して狙い直す
  const GERM_FADE_IN_TIME = 2.0;  // 出現してから実体化して動き出すまで（じわじわ焦らす）
  const GERM_FADE_OUT_TIME = 0.7; // ボス出現直前に消えるまで
  const GERM_BOUNCE_DIST = 220;   // 安全地帯にぶつかった時に吹っ飛ぶ距離（画面の半分くらい）
  const GERM_BOUNCE_TIME = 0.35;  // 吹っ飛んでいる時間
  const BAKERY_SAFE_R_MIN = 18;   // 安全地帯が縮みすぎないための下限（BAKERY_MAX_HITS回でここまで縮む）
  const GERM_MAX_CONCURRENT_BASE = 1; // 1周目（ボス未撃破）は画面に1匹程度
  const GERM_MAX_CONCURRENT_CAP = 8;  // 同時出現数の上限
  function getMaxConcurrentGerms(){
    const steps = Math.floor(bossesDefeated / 2); // ボスを2体倒すごとに同時出現数+1
    return Math.min(GERM_MAX_CONCURRENT_CAP, GERM_MAX_CONCURRENT_BASE + steps);
  }

  function spawnGerm(){
    // 画面内のどこからでもランダムに出現する（ただし安全地帯の中は避ける）
    let x, y, tries = 0;
    do {
      x = Math.random()*W; y = Math.random()*H; tries++;
    } while(Math.hypot(x-bakery.x, y-bakery.y) < bakerySafeR && tries < 10);
    const sprite = createGermSprite();
    germs.push({
      x, y, wobble:Math.random()*10, sprite,
      state:'spawning', stateTimer:GERM_FADE_IN_TIME, opacity:0,
      bounceDX:0, bounceDY:0, bounceTimer:0
    });
  }

  const BOSS_TYPES = [
    {name:'大魔王ボス',   color:'#8B5CF6', pattern:0, imgIdx:0, fireInterval:1.15, swayAmp:0.32, swaySpeed:1.4},
    {name:'鉄壁ボス',     color:'#5B8DEF', pattern:3, imgIdx:1, fireInterval:1.5,  swayAmp:0.18, swaySpeed:0.6},
    {name:'ふたごボス',   color:'#FF6B4A', pattern:1, imgIdx:2, fireInterval:0.6,  swayAmp:0.26, swaySpeed:2.0},
    {name:'クラゲボス',   color:'#4DD8FF', pattern:2, imgIdx:3, fireInterval:0.14, swayAmp:0.14, swaySpeed:0.9},
    {name:'剛腕ボス',     color:'#FF4D6D', pattern:1, imgIdx:4, fireInterval:0.5,  swayAmp:0.24, swaySpeed:2.6},
    {name:'うねうねボス', color:'#7ED957', pattern:3, imgIdx:5, fireInterval:1.3,  swayAmp:0.42, swaySpeed:1.0},
    {name:'たつまきボス', color:'#B388FF', pattern:2, imgIdx:6, fireInterval:0.1,  swayAmp:0.3,  swaySpeed:1.6},
    {name:'がんせきボス', color:'#C9A24B', pattern:0, imgIdx:7, fireInterval:1.0,  swayAmp:0.28, swaySpeed:1.2},
    {name:'どくどくボス', color:'#2FB86B', pattern:2, imgIdx:8, fireInterval:0.16, swayAmp:0.2,  swaySpeed:0.7},
    {name:'すいしょうボス', color:'#66E0D3', pattern:1, imgIdx:9, fireInterval:0.5, swayAmp:0.2,  swaySpeed:2.2},
  ];

  function startBoss(){
    bossActive = true;
    bossTimer = 9;
    const typeIdx = Math.max(0, Math.floor(helped/10)-1) % BOSS_TYPES.length;
    const bt = BOSS_TYPES[typeIdx];
    bossFireTimer = 0.7;
    bossHouseFireTimer = 1.5; // 開始直後は少し猶予を置く
    bossPhase = 0;
    germs.forEach(g=>disposeSprite(g.sprite));
    germs = [];
    germsRetreating = false;
    boss = {x:W/2, y:90, wobble:0, type:typeIdx, spiralAngle:0};
    spawnFloater(W/2, 130, bt.name+' 出現！', bt.color);
    playSfx('boss_appear');
    // ボス戦で中断するとオリジナル曲を最後まで聴いてもらえないため、一旦コメントアウト（bgm.mp3を継続再生）
    // playBossBgm();
  }

  function fireBossPattern(){
    const bt = BOSS_TYPES[boss.type];
    const bossCycles = Math.floor(bossesDefeated / BOSS_TYPES.length); // 10種類のボスを1周倒すごとに1上がる
    const extra = Math.min(bossCycles, 6); // 弾の数が増える（上限あり）
    if(bt.pattern===0){
      // radial burst <-> aimed spread, alternating
      bossPhase = (bossPhase+1) % 2;
      if(bossPhase===0){
        const n = 12 + extra*3;
        for(let i=0;i<n;i++){
          const a = (i/n)*Math.PI*2;
          bossBullets.push({x:boss.x,y:boss.y, vx:Math.cos(a)*110, vy:Math.sin(a)*110, life:3, color:bt.color});
        }
      } else {
        const baseAng = Math.atan2(hero.y-boss.y, hero.x-boss.x);
        const half = 2 + extra;
        for(let i=-half;i<=half;i++){
          const a = baseAng + i*0.18;
          bossBullets.push({x:boss.x,y:boss.y, vx:Math.cos(a)*160, vy:Math.sin(a)*160, life:3, color:bt.color});
        }
      }
    } else if(bt.pattern===1){
      // fast aimed 3-way spread, tracks hero aggressively
      const baseAng = Math.atan2(hero.y-boss.y, hero.x-boss.x);
      const half = 1 + Math.floor(extra/2);
      for(let i=-half;i<=half;i++){
        const a = baseAng + i*0.22;
        bossBullets.push({x:boss.x,y:boss.y, vx:Math.cos(a)*200, vy:Math.sin(a)*200, life:2.6, color:bt.color});
      }
    } else if(bt.pattern===2){
      // continuously fires a slowly-rotating spiral of bullets（腕の本数が増える）
      boss.spiralAngle += 0.55;
      const arms = 2 + extra;
      for(let k=0;k<arms;k++){
        const a = boss.spiralAngle + (k/arms)*Math.PI*2;
        bossBullets.push({x:boss.x,y:boss.y, vx:Math.cos(a)*95, vy:Math.sin(a)*95, life:3.4, color:bt.color});
      }
    } else {
      // pattern 3: wide downward fan sweep
      const n = 9 + extra*2;
      for(let i=0;i<n;i++){
        const a = Math.PI/2 + (i/(n-1)-0.5)*Math.PI*0.7;
        bossBullets.push({x:boss.x,y:boss.y, vx:Math.cos(a)*130, vy:Math.sin(a)*130, life:3.2, color:bt.color});
      }
    }
  }

  // 攻撃パターンによっては弾が家の方向へまったく飛ばないことがあるため、
  // パターンに関係なく一定間隔で家を狙い撃ちする弾を別枠で発射する
  function fireAtBakery(){
    const bt = BOSS_TYPES[boss.type];
    const baseAng = Math.atan2(bakery.y-boss.y, bakery.x-boss.x);
    for(let i=-1;i<=1;i++){
      const a = baseAng + i*0.1;
      bossBullets.push({x:boss.x,y:boss.y, vx:Math.cos(a)*150, vy:Math.sin(a)*150, life:3, color:bt.color});
    }
  }

  function update(dt){
    frame++;

    // 力尽きた瞬間ではなく、くるくる回って昇天してからゲームオーバー画面を出す
    if(dying){
      dyingTimer -= dt;
      heroDeathSpin += dt*16;
      heroDeathRise += dt*60;
      if(dyingTimer<=0){
        dying = false;
        doGameOver();
      }
      return;
    }

    elapsed += dt;

    // movement
    let dx=0, dy=0;
    if(keys['arrowleft']||keys['a']) dx-=1;
    if(keys['arrowright']||keys['d']) dx+=1;
    if(keys['arrowup']||keys['w']) dy-=1;
    if(keys['arrowdown']||keys['s']) dy+=1;
    if(joystick && joystick.mag > JOY_DEADZONE/JOY_RADIUS){
      const d = Math.hypot(joystick.dx, joystick.dy);
      dx = joystick.dx/d; dy = joystick.dy/d;
    }
    const len = Math.hypot(dx,dy)||1;
    const speed = 150;
    hero.x += (dx/len)*speed*dt;
    hero.y += (dy/len)*speed*dt;
    hero.x = Math.max(16, Math.min(W-16, hero.x));
    hero.y = Math.max(16, Math.min(H-16, hero.y));
    if(dx>0.1) hero.dir=1; else if(dx<-0.1) hero.dir=-1;
    if(dy<-0.15) hero.facing='back'; else if(dy>0.15) hero.facing='front';

    // power drains slowly, refills near bakery（ばい菌に削られると回復範囲も一緒に狭くなり、家が完全に欠けると回復できなくなる）
    const dBakery = Math.hypot(hero.x-bakery.x, hero.y-bakery.y);
    const bakeryDestroyed = bakeryHits >= BAKERY_MAX_HITS;
    const heroAtHome = dBakery < bakerySafeR;
    if(heroAtHome && !bakeryDestroyed){
      power = Math.min(100, power + 26*dt);
    } else {
      power -= (1.2 + elapsed*0.01)*dt;
    }
    if(invuln>0) invuln -= dt;

    // spawn timers, ramp up over time (paused during boss fight)
    if(!bossActive){
      spawnPersonTimer -= dt;
      if(spawnPersonTimer<=0){ spawnPerson(); spawnPersonTimer = Math.max(1.0, 2.6-elapsed*0.01); }
      if(!germsRetreating && germs.length < getMaxConcurrentGerms()){
        spawnGermTimer -= dt;
        if(spawnGermTimer<=0){ spawnGerm(); spawnGermTimer = Math.max(1.6, 4-elapsed*0.012); }
      }
    }

    // people move toward their target spot then wait（年齢によって移動速度・歩き方が変わる）
    people.forEach(p=>{
      const pt = PERSON_TYPES[p.typeIdx];
      if(!p.helped){
        const dx2=p.tx-p.x, dy2=p.ty-p.y;
        const d2=Math.hypot(dx2,dy2);
        let spd = 40*pt.speedMul;
        if(pt.limp) spd *= (0.85 + Math.sin(p.bob*0.5)*0.15); // お年寄りは歩調が少し不安定
        if(d2>4){ p.x += dx2/d2*spd*dt; p.y += dy2/d2*spd*dt; }
        p.bob += dt*pt.bobSpeed;

        const dh = Math.hypot(hero.x-p.x, hero.y-p.y);
        if(dh < 26 && power>8){
          p.helped = true;
          power -= 10;
          score += 100;
          helped++;
          spawnParticles(p.x,p.y,'#FF6B4A',16);
          spawnFloater(p.x,p.y-10,'ありがとう！','#FF6B4A');
          playSfx('help');
          updateHud();

          // ボス出現の1人前でばい菌が退散を始める（フェードアウトして消える）
          if(helped%10===9 && !bossActive && !germsRetreating){
            germsRetreating = true;
            germs.forEach(g=>{
              if(g.state!=='fading'){ g.state='fading'; g.stateTimer=GERM_FADE_OUT_TIME; }
            });
          }

          if(helped>0 && helped%10===0 && helped>lastBossHelped && !bossActive){
            lastBossHelped = helped;
            startBoss();
          }
        }
      } else {
        p.y -= 30*pt.speedMul*dt; // 助けた後も年齢なりのペースで歩き去る
      }
    });
    people.forEach(p=>{
      if(!(p.y>-40 && p.y<H+40 && p.x>-40 && p.x<W+40)) disposeSprite(p.sprite);
    });
    people = people.filter(p=> p.y>-40 && p.y<H+40 && p.x>-40 && p.x<W+40);

    // ばい菌：コミカルで憎めないけどいやらしい動き（フェード→実体化→直進→安全地帯で派手に跳ね返り）
    if(!bossActive){
      germs.forEach(g=>{
        g.wobble += dt*3;

        if(g.state==='spawning'){
          // 出現直後はフェードインしながら実体化するだけで動かない
          g.stateTimer -= dt;
          g.opacity = 1 - Math.max(0, g.stateTimer)/GERM_FADE_IN_TIME;
          if(g.stateTimer<=0){ g.state='active'; g.opacity=1; }
          return;
        }
        if(g.state==='fading'){
          // ボス出現直前はその場でフェードアウトして消える
          g.stateTimer -= dt;
          g.opacity = Math.max(0, g.stateTimer/GERM_FADE_OUT_TIME);
          return;
        }

        if(g.state==='bounced'){
          // 安全地帯にぶつかった直後、派手に吹っ飛んでいる最中
          g.bounceTimer -= dt;
          g.x += g.bounceDX*dt; g.y += g.bounceDY*dt;
          if(g.bounceTimer<=0) g.state='active';
        } else {
          // まだ助けていない町人 or ふわお、どちらかへ一定速度でまっすぐ向かう（減速なし）
          // ふわおが近く（GERM_HERO_PRIORITY_RANGE以内）を通ったら、町人に張り付いていてもふわお優先で狙い直す
          // ふわおが家に接触している間は、町人がいてもふわお目掛けて向かう
          let tx=hero.x, ty=hero.y, dh=Math.hypot(hero.x-g.x, hero.y-g.y);
          if(!heroAtHome && dh > GERM_HERO_PRIORITY_RANGE){
            people.forEach(p=>{
              if(p.helped) return;
              const d = Math.hypot(p.x-g.x, p.y-g.y);
              if(d<dh){ dh=d; tx=p.x; ty=p.y; }
            });
          }
          if(dh>1){
            g.x += (tx-g.x)/dh*GERM_SPEED*dt;
            g.y += (ty-g.y)/dh*GERM_SPEED*dt;
          }
        }

        // 家（安全地帯）にぶつかると派手に跳ね返り、安全地帯が少し削れる
        const gdx = g.x-bakery.x, gdy = g.y-bakery.y;
        const gdBakery = Math.hypot(gdx,gdy) || 0.001;
        if(gdBakery < bakerySafeR && g.state!=='bounced'){
          const nx = gdx/gdBakery, ny = gdy/gdBakery;
          g.x = bakery.x + nx*bakerySafeR;
          g.y = bakery.y + ny*bakerySafeR;
          g.bounceDX = nx*(GERM_BOUNCE_DIST/GERM_BOUNCE_TIME);
          g.bounceDY = ny*(GERM_BOUNCE_DIST/GERM_BOUNCE_TIME);
          g.bounceTimer = GERM_BOUNCE_TIME;
          g.state = 'bounced';
          spawnParticles(g.x,g.y,'#FFD36B',16);
          // 家がだんだん欠けていく演出。BAKERY_MAX_HITS回でほぼ消える
          bakeryHits = Math.min(BAKERY_MAX_HITS, bakeryHits+1);
          bakerySafeR = BAKERY_SAFE_R_INITIAL - (bakeryHits/BAKERY_MAX_HITS)*(BAKERY_SAFE_R_INITIAL-BAKERY_SAFE_R_MIN);
          renderBakeryTexture(bakeryHits);
          playSfx('bakery_hit');
        }

        if(invuln<=0 && (g.state==='active' || g.state==='bounced')){
          const dhero = Math.hypot(hero.x-g.x, hero.y-g.y);
          if(dhero < 24){
            power -= 18;
            invuln = 1.2;
            spawnParticles(hero.x,hero.y,'#8bd18b',12);
            playSfx('hit');
            updateHud();
          }
        }
      });
      germs.forEach(g=>{
        const offscreen = !(g.x>-60 && g.x<W+60 && g.y>-60 && g.y<H+60);
        const fadedOut = g.state==='fading' && g.opacity<=0;
        if(offscreen || fadedOut) disposeSprite(g.sprite);
      });
      germs = germs.filter(g=>{
        const offscreen = !(g.x>-60 && g.x<W+60 && g.y>-60 && g.y<H+60);
        const fadedOut = g.state==='fading' && g.opacity<=0;
        return !offscreen && !fadedOut;
      });
    }

    // ---------- boss battle ----------
    if(bossActive){
      const bt = BOSS_TYPES[boss.type];
      bossTimer -= dt;
      if(bt.pattern===1){
        // 追尾系ボス: sways but leans toward the hero's x
        boss.x += ((hero.x - boss.x)*0.4 + Math.sin(elapsed*bt.swaySpeed)*(W*bt.swayAmp) - (boss.x-W/2)) * dt*1.5;
        boss.x = Math.max(40, Math.min(W-40, boss.x));
      } else {
        boss.x = W/2 + Math.sin(elapsed*bt.swaySpeed)*(W*bt.swayAmp);
      }
      boss.y = 90 + Math.sin(elapsed*0.9)*14;
      boss.wobble += dt*3;

      bossFireTimer -= dt;
      if(bossFireTimer<=0){
        fireBossPattern();
        bossFireTimer = bt.fireInterval - Math.min(bt.fireInterval*0.4, bossTimer<3 ? bt.fireInterval*0.35:0);
      }

      // ふわおが家に籠もっている間だけ、家を狙い撃つ弾を発射する
      if(heroAtHome && !bakeryDestroyed){
        bossHouseFireTimer -= dt;
        if(bossHouseFireTimer<=0){
          fireAtBakery();
          bossHouseFireTimer = 2.2;
        }
      }

      bossBullets.forEach(b=>{ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; });
      bossBullets = bossBullets.filter(b=> b.life>0 && b.x>-30 && b.x<W+30 && b.y>-30 && b.y<H+30);

      // ボスの弾が家に当たると欠ける（安全地帯に籠もり続けるズルを防ぐ）。壊れきった家はもう吸収しない
      if(!bakeryDestroyed){
        for(let i=bossBullets.length-1;i>=0;i--){
          const b = bossBullets[i];
          if(Math.hypot(b.x-bakery.x, b.y-bakery.y) < bakerySafeR){
            bossBullets.splice(i,1);
            spawnParticles(bakery.x, bakery.y, '#FFD36B', 14);
            bakeryHits = Math.min(BAKERY_MAX_HITS, bakeryHits+1);
            bakerySafeR = BAKERY_SAFE_R_INITIAL - (bakeryHits/BAKERY_MAX_HITS)*(BAKERY_SAFE_R_INITIAL-BAKERY_SAFE_R_MIN);
            renderBakeryTexture(bakeryHits);
            playSfx('bakery_hit');
          }
        }
      }

      // ボスの弾に当たった住民（助けた後も含む）は驚いて消える。弾は貫通して消えない
      for(let j=people.length-1;j>=0;j--){
        const p = people[j];
        for(const b of bossBullets){
          if(Math.hypot(p.x-b.x, p.y-b.y) < 20){
            spawnParticles(p.x,p.y,'#8B5CF6',12);
            spawnFloater(p.x,p.y-14,'うわあ！','#8B5CF6');
            playSfx('person_hit');
            disposeSprite(p.sprite);
            people.splice(j,1);
            break;
          }
        }
      }

      if(invuln<=0){
        for(let i=bossBullets.length-1;i>=0;i--){
          const b = bossBullets[i];
          if(Math.hypot(hero.x-b.x, hero.y-b.y) < 15){
            power -= 14;
            invuln = 1.0;
            bossBullets.splice(i,1);
            spawnParticles(hero.x,hero.y,'#8B5CF6',10);
            spawnFloater(hero.x,hero.y-20,'弾幕ヒット！','#8B5CF6');
            playSfx('hit');
            updateHud();
            break;
          }
        }
      }

      if(bossTimer<=0){
        score += 300;
        bossesDefeated++;
        spawnFloater(W/2, H*0.58, '生き延びボーナス！', '#000', true);
        playSfx('boss_clear');
        // bgm.mp3を止めずに継続再生しているため、ここでの再生し直しも不要
        // playBgm();
        bossActive=false; boss=null; bossBullets=[];
        spawnPersonTimer = 0.6; spawnGermTimer = 1.5;
        // ボスを倒すと、ばい菌に欠けさせられた家が完全に復活する
        bakeryHits = 0;
        bakerySafeR = BAKERY_SAFE_R_INITIAL;
        renderBakeryTexture(0);
        updateHud();
      }
    }

    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--; });
    particles = particles.filter(p=>p.life>0);
    floaters.forEach(f=>{ f.y -= 0.4; f.life--; });
    floaters = floaters.filter(f=>f.life>0);

    score += dt*2;
    updateHud();

    if(power<=0 && !dying){
      dying = true;
      dyingTimer = DEATH_ANIM_TIME;
      heroDeathSpin = 0;
      heroDeathRise = 0;
      heroDeathStartShrink = getHeroShrink(power);
      playSfx('game_over');
    }
  }

  const CERT_W = 1432, CERT_H = 1013;

  function doGameOver(){
    running=false;
    playEndingBgm();
    renderGameOverScreen();
  }

  // ランキング画面から「もどる」で結果画面へ戻る時に呼ぶ。BGM(エンディング曲)は
  // 一度鳴らしたら止めずに継続させたいので、ここでは触らない（doGameOver()と分離）。
  function renderGameOverScreen(){
    const finalScore = Math.floor(score);
    overlay.style.display='flex';
    overlay.innerHTML = `
      <svg viewBox="0 0 ${CERT_W} ${CERT_H}" style="width:100%;max-width:300px;display:block;margin:0 auto;">
        <image href="images/certificate.webp" x="0" y="0" width="${CERT_W}" height="${CERT_H}"/>
        <text x="731" y="503" text-anchor="middle" font-size="70" font-weight="900"
              fill="#3a2412" font-family="'Hiragino Maru Gothic Pro','Yu Gothic',sans-serif">${helped}</text>
      </svg>
      <p>スコア: ${finalScore}</p>
      <div id="rankArea"></div>
      <button class="mainbtn" id="startBtn2">もう一度がんばる</button>
      <button class="secbtn" id="rankingBtn">🏆 ランキング</button>
    `;
    document.getElementById('startBtn2').addEventListener('click', ()=>{
      overlay.style.display='none';
      resetGame();
      running=true;
      beginFuwaoSession();
      playBgm();
    });
    document.getElementById('rankingBtn').addEventListener('click', renderRankingScreen);
    updateHud();

    if(fuwaoRankSubmitted){
      document.getElementById('rankArea').innerHTML = `<p style="color:#FFD36B;">とうろくしたよ！</p>`;
      return;
    }

    // ハイスコア判定は非同期で後から追記する（通信が遅くても操作を止めない）
    fetchFuwaoRanking().then(results=>{
      const area = document.getElementById('rankArea');
      if(!area || fuwaoRankSubmitted) return; // 戻る/やり直すが先に押された、または既に登録済み
      const isHighScore = finalScore > 0 &&
        (results.length < RANKING_QUALIFY_COUNT || finalScore > results[results.length-1].score);
      if(isHighScore) renderRankRegisterForm(area, finalScore);
    });
  }

  function renderRankRegisterForm(area, finalScore){
    area.innerHTML = `
      <p style="color:#FFD36B;font-weight:900;">✨ ハイスコア！なまえを入れてね</p>
      <div id="rankForm">
        <input id="rankNameInput" maxlength="20" placeholder="なまえ">
        <button class="secbtn" id="rankSubmitBtn">とうろく</button>
      </div>
    `;
    const nameInput = document.getElementById('rankNameInput');
    nameInput.value = loadNamePref();
    document.getElementById('rankSubmitBtn').addEventListener('click', async ()=>{
      const name = (nameInput.value || '').trim().slice(0, 20) || 'ふわお';
      const btn = document.getElementById('rankSubmitBtn');
      if(!fuwaoSessionToken){ return; } // トークン未発行なら静かに何もしない
      btn.disabled = true;
      btn.textContent = 'とうろく中…';
      saveNamePref(name);
      try {
        const res = await fetch(FUWAO_API_BASE + '/score', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ name, score: finalScore, token: fuwaoSessionToken })
        });
        const data = await res.json();
        if(data && data.ok){
          fuwaoSessionToken = null; // 一度使ったトークンは使い切り
          fuwaoRankSubmitted = true;
          area.innerHTML = `<p style="color:#FFD36B;">とうろくしたよ！</p>`;
        } else {
          btn.disabled = false;
          btn.textContent = 'とうろく';
        }
      } catch(e){
        btn.disabled = false;
        btn.textContent = 'とうろく';
      }
    });
  }

  // ゲームオーバー画面とランキング画面の行き来ではBGM(エンディング曲)を止めずに
  // 継続再生する（タイトルに戻る時だけオフになる想定）。
  function renderRankingScreen(){
    overlay.innerHTML = `
      <h1>🏆 ランキング</h1>
      <div id="rankList"><p id="rankEmpty">よみこみちゅう…</p></div>
      <button class="mainbtn" id="rankBackBtn">もどる</button>
    `;
    document.getElementById('rankBackBtn').addEventListener('click', renderGameOverScreen);
    fetchFuwaoRanking().then(results=>{
      const listEl = document.getElementById('rankList');
      if(!listEl) return; // 戻るが先に押された場合
      if(results.length === 0){
        listEl.innerHTML = `<p id="rankEmpty">まだ記録がありません</p>`;
        return;
      }
      listEl.innerHTML = '<ol>' + results.map((r,i)=>
        `<li><span>${i+1}. ${escapeHtml(r.name)}</span><span class="rankScore">${r.score}</span></li>`
      ).join('') + '</ol>';
    });
  }

  // =========================================================
  // ---------- 3D オブジェクトの状態を毎フレーム同期 ----------
  // =========================================================
  function syncPersonSprite(p){
    const pt = PERSON_TYPES[p.typeIdx];
    const aspect = personImgAspect[p.typeIdx] || 1;
    const size = 42;
    const sway = (pt.limp && !p.helped) ? Math.sin(p.bob*1.6)*2 : 0; // お年寄りの左右にゆれる足取り
    const bobLift = Math.max(0, Math.sin(p.bob))*3; // ぴょこぴょこ跳ねる動き
    let dw, dh = size;
    if(p.helped){
      if(!p.cropApplied){
        const tex = p.sprite.material.map;
        tex.repeat.set(pt.cropRatio, 1);
        tex.offset.set(0, 0);
        tex.needsUpdate = true;
        p.cropApplied = true;
      }
      dw = size*aspect*pt.cropRatio;
      p.sprite.material.opacity = 0.85;
    } else {
      dw = size*aspect;
      p.sprite.material.opacity = 1;
    }
    p.sprite.scale.set(dw, dh, 1);
    p.sprite.position.set(worldX(p.x+sway), dh/2+bobLift, worldZ(p.y));
  }

  function syncGermSprite(g){
    const wob = Math.sin(g.wobble)*2;
    const size = 40 + wob*0.3;
    g.sprite.scale.set(size, size, 1);
    g.sprite.position.set(worldX(g.x), size/2, worldZ(g.y));
    g.sprite.material.opacity = g.opacity;
  }

  function syncHero(){
    heroSprite.visible = running;
    if(!running) return;
    const useBack = hero.facing==='back';
    const tex = useBack ? heroBackTex : heroFrontTex;
    if(heroSprite.material.map !== tex){ heroSprite.material.map = tex; heroSprite.material.needsUpdate = true; }
    const aspect = useBack ? heroBackAspect : heroFrontAspect;
    const size = 46;
    let dw0, dh0;
    if(aspect >= 1){ dw0 = size; dh0 = size/aspect; }
    else { dh0 = size; dw0 = size*aspect; }
    let shrink;
    if(dying){
      // 小さいままだと分かりにくいので、くるくる回りながらだんだん大きくなって昇天する
      const progress = Math.min(1, 1 - Math.max(0,dyingTimer)/DEATH_ANIM_TIME);
      shrink = heroDeathStartShrink + (DEATH_GROW_TARGET - heroDeathStartShrink)*progress;
    } else {
      shrink = getHeroShrink(power);
    }
    const dw = dw0*shrink, dh = dh0*shrink;
    heroSprite.scale.set(dw, dh, 1);
    heroSprite.position.set(worldX(hero.x), dh/2 + heroDeathRise, worldZ(hero.y));
    if(dying){
      heroSprite.material.rotation = heroDeathSpin;
      heroSprite.material.opacity = Math.max(0, dyingTimer/DEATH_ANIM_TIME);
    } else {
      heroSprite.material.rotation = 0;
      const blink = invuln>0 && Math.floor(frame/4)%2===0;
      heroSprite.material.opacity = blink ? 0.4 : 1;
    }
  }

  function syncBoss(){
    if(!bossActive || !boss){
      bossSprite.visible = false;
      bossGlow.visible = false;
      bossBarEl.style.display = 'none';
      return;
    }
    const bt = BOSS_TYPES[boss.type];
    const idx = bt.imgIdx;
    const tex = bossTextures[idx];
    if(bossSprite.material.map !== tex){ bossSprite.material.map = tex; bossSprite.material.needsUpdate = true; }
    bossSprite.visible = true;
    bossGlow.visible = true;
    const aspect = bossImgAspect[idx] || 1;
    const wob = Math.sin(boss.wobble)*3;
    const size = 108 + wob;
    let dw, dh;
    if(aspect >= 1){ dw = size; dh = size/aspect; }
    else { dh = size; dw = size*aspect; }
    const liftY = dh/2 + 46; // ボスは宙に浮いているように見せる
    bossSprite.scale.set(dw, dh, 1);
    bossSprite.position.set(worldX(boss.x), liftY, worldZ(boss.y));
    bossGlow.scale.set(size*1.5, size*1.5, 1);
    bossGlow.position.copy(bossSprite.position);
    bossGlow.material.color.set(bt.color);

    bossBarEl.style.display = 'block';
    bossNameEl.textContent = bt.name;
    bossNameEl.style.color = bt.color;
    bossBarInnerEl.style.width = (Math.max(0,bossTimer/9)*100)+'%';
    bossBarInnerEl.style.background = bt.color;
  }

  // ---------- 2D オーバーレイ（弾・パーティクル・吹き出し・ジョイスティック） ----------
  function drawBossBullets(){
    bossBullets.forEach(b=>{
      const col = b.color || '#B388FF';
      uiCtx.save();
      uiCtx.shadowColor=col; uiCtx.shadowBlur=8;
      uiCtx.fillStyle=col;
      uiCtx.beginPath(); uiCtx.arc(b.x,b.y,6,0,Math.PI*2); uiCtx.fill();
      uiCtx.fillStyle='#fff';
      uiCtx.beginPath(); uiCtx.arc(b.x,b.y,2.2,0,Math.PI*2); uiCtx.fill();
      uiCtx.restore();
    });
  }

  function drawJoystick(){
    if(!joystick) return;
    uiCtx.save();
    uiCtx.globalAlpha = 0.55;
    uiCtx.strokeStyle = '#fff';
    uiCtx.lineWidth = 3;
    uiCtx.beginPath();
    uiCtx.arc(joystick.originX, joystick.originY, JOY_RADIUS, 0, Math.PI*2);
    uiCtx.stroke();
    uiCtx.globalAlpha = 0.75;
    uiCtx.fillStyle = '#FF6B4A';
    uiCtx.beginPath();
    uiCtx.arc(joystick.originX+joystick.dx, joystick.originY+joystick.dy, 20, 0, Math.PI*2);
    uiCtx.fill();
    uiCtx.restore();
  }

  function draw(){
    people.forEach(syncPersonSprite);
    germs.forEach(syncGermSprite);
    syncHero();
    syncBoss();
    renderer.render(scene, camera);

    uiCtx.clearRect(0,0,W,H);
    if(bossActive) drawBossBullets();
    drawJoystick();

    particles.forEach(p=>{
      uiCtx.globalAlpha = Math.max(p.life/40,0);
      uiCtx.fillStyle=p.color;
      uiCtx.beginPath(); uiCtx.arc(p.x,p.y,2.4,0,Math.PI*2); uiCtx.fill();
    });
    uiCtx.globalAlpha=1;

    floaters.forEach(f=>{
      uiCtx.globalAlpha = Math.max(f.life/50,0);
      uiCtx.textAlign='center';
      if(f.big){
        uiCtx.font='bold 22px sans-serif';
        uiCtx.lineWidth=4;
        uiCtx.strokeStyle='#fff';
        uiCtx.strokeText(f.text, f.x, f.y);
      } else {
        uiCtx.font='bold 12px sans-serif';
      }
      uiCtx.fillStyle=f.color;
      uiCtx.fillText(f.text, f.x, f.y);
    });
    uiCtx.globalAlpha=1;
  }

  let lastTime = performance.now();
  function loop(now){
    const dt = Math.min((now-lastTime)/1000, 0.05);
    lastTime = now;
    if(running) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', ()=>{
    overlay.style.display='none';
    resetGame();
    running=true;
    beginFuwaoSession();
    playBgm();
    // iOS等はユーザー操作の中でAudioContextを再開しておかないと鳴らないことがある
    const ctx = getAudioCtx();
    if(ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
  });

  resetGame();
  draw();
  requestAnimationFrame(loop);
})();

</script>
