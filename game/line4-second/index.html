  let endingCrawlAnim = null;
  let endingBgmTimer = null;
  let endingCrawlTotalMs = 0;
  let endingCrawlFinished = false; // click-to-title is only honored once this is true

  function stopEndingCrawl() {
    if (endingCrawlAnim) { endingCrawlAnim.cancel(); endingCrawlAnim = null; }
    if (endingBgmTimer) { clearTimeout(endingBgmTimer); endingBgmTimer = null; }
  }

  function showEndingScreen() {
    SoundMgr.stop(); // the previous track (e.g. LV5's battle theme) would
                      // otherwise just keep looping until ending.mp3 kicks in
    const el = document.getElementById('endingScreen');
    const img = el.querySelector('img');
    // ending2.webp is the OLD puppeteer-ending artwork — wrong scene for
    // this sequel's new ending text below. Hiding it for now so the crawl
    // just runs over #endingScreen's own plain black background (per spec:
    // "黒バックスクロールで白字で") until matching art exists; re-enable the
    // pan by restoring the three lines this replaced.
    img.classList.add('hidden');
    document.getElementById('endingVista').classList.remove('show'); // reset in case the ending is replayed
    el.classList.remove('hidden');
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));

    stopEndingCrawl();
    endingCrawlFinished = false;
    const wrap = document.getElementById('endingTextWrap');
    const crawl = document.getElementById('endingTextCrawl');
    const lines = kanaMode ? ENDING_TEXT_KANA : ENDING_TEXT;
    crawl.innerHTML = '';
    lines.forEach(text => {
      const p = document.createElement('p');
      p.textContent = text.replace(/\{name\}/g, getPlayerName());
      crawl.appendChild(p);
    });

    // Pace the crawl by how much text there actually is, so editing ENDING_TEXT
    // later doesn't require re-tuning a hardcoded duration.
    const charCount = lines.join('').length;
    const totalMs = Math.max(45000, Math.min(120000, charCount * 150));
    endingCrawlTotalMs = totalMs;
    const startY = wrap.clientHeight;
    const endY = -crawl.scrollHeight;
    crawl.style.transform = `translate(-50%, ${startY}px)`;
    endingCrawlAnim = crawl.animate(
      [
        { transform: `translate(-50%, ${startY}px)` },
        { transform: `translate(-50%, ${endY}px)` },
      ],
      { duration: totalMs, easing: 'linear', fill: 'forwards' }
    );
    endingCrawlAnim.onfinish = () => {
      endingCrawlFinished = true;
      document.getElementById('endingVista').classList.add('show');
    };
    // The ending theme plays from the moment the screen appears (it used to
    // be cued ~5s before the crawl's end).
    SoundMgr.playTrack('ending', 'title');
  }

  // Drag up/down to scrub the crawl back and forth (a young player found the
  // auto-pace too fast to read) — pauses the WAAPI animation and scrubs its
  // currentTime while dragging, then resumes auto-play on release. Shares
  // the "was this a drag or a tap" pattern already used by the emote
  // scroller, since a plain tap still needs to return to the title screen.
  (function setupEndingCrawlDrag() {
    const screen = document.getElementById('endingScreen');
    let isDown = false;
    let dragged = false;
    let startClientY = 0;
    let startTime = 0;

    screen.addEventListener('pointerdown', (e) => {
      if (!endingCrawlAnim) return;
      isDown = true;
      dragged = false;
      startClientY = e.clientY;
      startTime = endingCrawlAnim.currentTime || 0;
      endingCrawlAnim.pause();
    });
    screen.addEventListener('pointermove', (e) => {
      if (!isDown || !endingCrawlAnim) return;
      const dy = e.clientY - startClientY;
      if (Math.abs(dy) > 6) dragged = true;
      if (!dragged) return;
      screen.classList.add('dragging');
      const wrap = document.getElementById('endingTextWrap');
      const crawl = document.getElementById('endingTextCrawl');
      const travelPx = wrap.clientHeight + crawl.scrollHeight;
      // Dragging down (positive dy) reveals earlier text — i.e. rewinds.
      const deltaTime = travelPx > 0 ? -(dy / travelPx) * endingCrawlTotalMs : 0;
      const newTime = Math.max(0, Math.min(endingCrawlTotalMs, startTime + deltaTime));
      endingCrawlAnim.currentTime = newTime;
    });
    function endDrag() {
      if (!isDown) return;
      isDown = false;
      screen.classList.remove('dragging');
      if (dragged && endingCrawlAnim) {
        if (endingCrawlAnim.currentTime >= endingCrawlTotalMs) {
          // .play() on an animation already at its end rewinds it to the
          // start instead of finishing it (per spec) — .finish() is what
          // actually fires onfinish here, so dragged-to-the-end doesn't
          // silently restart the whole crawl.
          endingCrawlAnim.finish();
        } else {
          endingCrawlAnim.play();
        }
      }
    }
    screen.addEventListener('pointerup', endDrag);
    screen.addEventListener('pointercancel', endDrag);
    screen.addEventListener('pointerleave', endDrag);

    screen.addEventListener('click', () => {
      if (dragged) { dragged = false; return; } // that was a drag, not a tap
      if (!endingCrawlFinished) return; // a slightly-off drag can register as a click — ignore it until the crawl has actually played through
      SoundMgr.seClick();
      stopEndingCrawl();
      screen.classList.remove('show');
      setTimeout(() => screen.classList.add('hidden'), 500);
      goToTitle();
    });
  })();

  titleBtn.addEventListener('click', () => { SoundMgr.seClick(); goToTitle(); });

  // ---------- Ladder progression (win → next challenger, lose → run over) ----------
  // `portraits` is a list of 0-2 entries ({img, emoji, position, mirror}) —
  // CPU戦 passes both opponents (see charPortraits()) so the result screen
  // matches the in-match dual backdrop; other modes that don't pass any
  // portraits at all leave resultPortrait truly empty, so :empty still hides
  // the box for them.
  // titleBold/messageBold default to the normal look (bold title, regular
  // message) — the CPU戦 "stage cleared, next opponents incoming" screen
  // flips this (see its call below) so the upcoming-challenger line reads
  // as the more important one.
  function showResultOverlay({ title, message, portraits, buttons, titleBold, messageBold }) {
    const overlay = document.getElementById('resultOverlay');
    const portraitEl = document.getElementById('resultPortrait');
    const titleEl = document.getElementById('resultTitle');
    const messageEl = document.getElementById('resultMessage');
    titleEl.textContent = title;
    titleEl.style.fontWeight = titleBold === false ? '400' : '700';
    messageEl.textContent = message;
    messageEl.style.fontWeight = messageBold ? '700' : '400';
    portraitEl.innerHTML = '';
    (portraits || []).forEach(p => {
      if (!p) return;
      const half = document.createElement('div');
      half.className = 'portrait-half';
      if (p.img) {
        const img = document.createElement('img');
        img.src = p.img;
        img.alt = '';
        img.style.objectPosition = p.position || 'left top';
        if (p.mirror) img.classList.add('mirrored');
        img.onerror = () => { half.textContent = p.emoji || ''; };
        half.appendChild(img);
      } else {
        half.textContent = p.emoji || '';
      }
      portraitEl.appendChild(half);
    });
    const actionsEl = document.getElementById('resultActions');
    actionsEl.innerHTML = '';
    buttons.forEach(btn => {
      const b = document.createElement('button');
      b.textContent = btn.label;
      if (!btn.primary) b.classList.add('secondary');
      b.addEventListener('click', () => {
        SoundMgr.seClick();
        overlay.classList.add('hidden');
        btn.onClick();
      });
      actionsEl.appendChild(b);
    });
    overlay.classList.remove('hidden');
  }

  // Left half as drawn, right half mirrored — same convention as the
  // in-match dual backdrop and mode-label icons.
  function charPortraits(left, right) {
    return [
      { img: left.img, emoji: left.emoji, position: left.avatarPosition },
      { img: right.img, emoji: right.emoji, position: right.avatarPosition, mirror: true },
    ];
  }

  function handleLadderOutcome(result) {
    const [opp2, opp3] = stageOpponents;
    const stageNum = ladderIndex + 1;
    const bothNames = `${opp2.name} & ${opp3.name}`;

    if (result === 'draw') {
      showResultOverlay({
        title: K('引き分け', 'ひきわけ'),
        message: `${bothNames} ${K('との勝負は引き分けに終わりました。', 'とのしょうぶはひきわけにおわりました。')}`,
        portraits: charPortraits(opp2, opp3),
        buttons: [
          { label: K('もう一度対戦する', 'もういちどたいせんする'), primary: true, onClick: () => initGame() },
          { label: K('タイトルに戻る', 'タイトルにもどる'), onClick: goToTitle },
        ],
      });
      return;
    }

    if (result === 'lose') {
      showResultOverlay({
        title: K('敗北……', 'はいぼく……'),
        message: `LV.${stageNum} ${bothNames} ${K('に敗れました。', 'にやぶれました。')}\n${K('到達ステージ', 'とうたつステージ')}: LV.${stageNum}`,
        portraits: charPortraits(opp2, opp3),
        buttons: [
          { label: K('このステージに再挑戦する', 'このステージにさいちょうせんする'), primary: true, onClick: () => startGame('cpu') },
          { label: K('LV1からやり直す', 'LV1からやりなおす'), onClick: startLadder },
          { label: K('タイトルに戻る', 'タイトルにもどる'), onClick: goToTitle },
        ],
      });
      return;
    }

    // result === 'win'
    if (ladderIndex >= STAGES.length - 1) {
      showEndingScreen();
      return;
    }

    // Stage cleared: fade the battle theme out here rather than letting it
    // keep looping under the "撃破！" card and (for LV6) the story screen
    // until the next match's own track takes over in startGame().
    SoundMgr.stop();

    // Rolled once here (not re-rolled on click) so stage 3's random LV2 pick
    // stays consistent between this preview and the match that actually starts.
    const nextOpponents = STAGES[ladderIndex + 1]();
    const [next2, next3] = nextOpponents;
    showResultOverlay({
      title: `LV.${stageNum} ${bothNames} ${K('撃破！', 'げきは！')}`,
      message: `${K('次の刺客が現れた……', 'つぎのしかくがあらわれた……')}\nLV.${stageNum + 1} ${next2.name} & ${next3.name}`,
      titleBold: false,
      messageBold: true,
      portraits: charPortraits(next2, next3),
      buttons: [
        { label: K('対戦開始', 'たいせんかいし'), primary: true, onClick: () => {
            ladderIndex++;
            stageOpponents = nextOpponents;
            maybeShowStory(ladderIndex, () => startGame('cpu'));
          } },
        { label: K('ここでやめる（タイトルへ）', 'ここでやめる（タイトルへ）'), onClick: goToTitle },
      ],
    });
  }

  // ---------- Core game ----------
  function initGame() {
    if (ladderOutcomeTimer) { clearTimeout(ladderOutcomeTimer); ladderOutcomeTimer = null; }
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    gameOver = false;
    resetBtn.disabled = false;
    cpuThinking = false;
    buildBoard();
    hideBubble();
    updateStatus(K('先攻・後攻を決めています…', 'せんこう・こうこうをきめています…'));
    boardWrap.classList.add('locked');
    decideStartingPlayer((starter) => {
      currentPlayer = starter;
      boardWrap.classList.remove('locked');
      updateStatus();
      if (isCpuSeat(currentPlayer) && !gameOver) {
        triggerCpuMove(1); // match just started — nothing to protect a read-time for yet
      }
    });
  }

  // Brief (~2s) coin-toss animation deciding who moves first, run before
  // every match (fresh game, reset, and each new CPU ladder opponent).
  function decideStartingPlayer(onDone, forcedStarter) {
    const overlay = document.getElementById('turnDecideOverlay');
    const coin = document.getElementById('turnCoin');
    const textEl = document.getElementById('turnDecideText');
    const starter = forcedStarter != null ? forcedStarter : (Math.floor(Math.random() * 3) + 1);
    const labelFor = (p) => p === 1 ? player1Label() : p === 2 ? player2Label() : player3Label();
    const colorFor = (p) => p === 1 ? 'var(--p1)' : p === 2 ? 'var(--p2)' : 'var(--p3)';
    const starterLabel = labelFor(starter);

    coin.classList.remove('settled');
    coin.style.background = colorFor(1);
    textEl.classList.remove('show');
    textEl.textContent = K('先攻・後攻を決めています…', 'せんこう・こうこうをきめています…');
    overlay.classList.remove('hidden');

    let flip = 0;
    const flickerTimer = setInterval(() => {
      flip++;
      coin.style.background = colorFor((flip % 3) + 1);
    }, 110);

    setTimeout(() => {
      clearInterval(flickerTimer);
      coin.style.background = colorFor(starter);
      coin.classList.add('settled');
      SoundMgr.seDrop();
      textEl.textContent = `${starterLabel}${K('の先攻です！', 'のせんこうです！')}`;
      textEl.classList.add('show');
    }, 1250);

    setTimeout(() => {
      overlay.classList.add('hidden');
      onDone(starter);
    }, 2000);
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    cellEls = [];
    for (let r = 0; r < ROWS; r++) {
      cellEls.push([]);
      for (let c = 0; c < COLS; c++) {
        const hitzone = document.createElement('div');
        hitzone.className = 'col-hitzone';
        hitzone.dataset.col = c;
        const cell = document.createElement('div');
        cell.className = 'cell';
        hitzone.appendChild(cell);
        hitzone.addEventListener('click', () => handleColumnClick(c));
        boardEl.appendChild(hitzone);
        cellEls[r].push(cell);
      }
    }
  }

  // Player-1 side: PvP keeps the plain label (no single "you" when two
  // people share a screen); CPU/online show the chosen player name instead
  // — with no color suffix, since the turn indicator dot already conveys
  // that everywhere this is used.
  // For online mode: my own slot always shows my current name (so a mid-match
  // kana-mode toggle etc. never goes stale); the other two slots show
  // whatever name the server told us in beginOnlineMatch() (online.names).
  function onlineNameFor(playerNum) {
    return online.myPlayer === playerNum ? getPlayerName() : online.names[playerNum];
  }
  function player1Label() {
    if (mode === 'pvp') return K('プレイヤー1（赤）', 'プレイヤー1（あか）');
    if (mode === 'online') return onlineNameFor(1);
    return getPlayerName();
  }
  function player2Label() {
    if (mode === 'cpu') { const ch = charForPlayer(2); return ch ? ch.name : K('プレイヤー2（黄）', 'プレイヤー2（き）'); }
    if (mode === 'online') return onlineNameFor(2);
    return K('プレイヤー2（黄）', 'プレイヤー2（き）');
  }
  function player3Label() {
    if (mode === 'cpu') { const ch = charForPlayer(3); return ch ? ch.name : K('プレイヤー3（緑）', 'プレイヤー3（みどり）'); }
    if (mode === 'online') return onlineNameFor(3);
    if (mode === 'pvp' && pvpCpu) return pvpCpu.label;
    return K('プレイヤー3（緑）', 'プレイヤー3（みどり）');
  }

  function updateStatus(message) {
    if (message) {
      statusEl.innerHTML = message;
      return;
    }
    const colorVar = currentPlayer === 1 ? '--p1' : currentPlayer === 2 ? '--p2' : '--p3';
    const name = currentPlayer === 1 ? player1Label() : currentPlayer === 2 ? player2Label() : player3Label();
    const activeChar = mode === 'cpu' ? charForPlayer(currentPlayer) : null;
    const indicator = activeChar
      ? `<img class="turn-avatar" src="${activeChar.img}" alt="" style="object-position: ${activeChar.avatarPosition || 'left top'};" onerror="this.outerHTML='<span class=&quot;turn-indicator&quot; style=&quot;background:var(${colorVar})&quot;></span>'">`
      : `<span class="turn-indicator" style="background:var(${colorVar})"></span>`;
    statusEl.innerHTML = `${indicator} ${escapeHtml(name)}${K('の番です', 'のばんです')}`;
  }

  function handleColumnClick(col) {
    if (gameOver || cpuThinking) return;
    if (isCpuSeat(currentPlayer)) return; // block manual clicks during a CPU's turn
    if (mode === 'online') { submitOnlineMove(col); return; }
    dropPiece(col, currentPlayer);
  }

  function dropPiece(col, player) {
    const targetRow = getNextOpenRow(grid, col);
    if (targetRow === -1) return false;

    grid[targetRow][col] = player;
    const cellEl = cellEls[targetRow][col];
    cellEl.classList.add(player === 1 ? 'p1' : player === 2 ? 'p2' : 'p3', 'drop');
    SoundMgr.seDrop();

    const winLine = checkWin(targetRow, col, player);
    if (winLine) {
      gameOver = true;
      winLine.forEach(([r, c]) => cellEls[r][c].classList.add('win'));
      scores[player]++;
      updateScoreboard();
      const name = player === 1 ? player1Label() : player === 2 ? player2Label() : player3Label();
      updateStatus(`🎉 ${escapeHtml(name)}${K('の勝利！', 'のしょうり！')}`);
      if (mode === 'cpu') {
        resetBtn.disabled = true; // re-enabled by initGame() once the next match actually starts
        if (player === 1) {
          SoundMgr.seWin();
          const spokenMs = speakSequential([charForPlayer(2), charForPlayer(3)], 'defeat');
          ladderOutcomeTimer = setTimeout(() => handleLadderOutcome('win'), Math.max(1800, spokenMs + 600));
        } else {
          SoundMgr.seLose();
          const spokenMs = speak(charForPlayer(player), 'victory');
          ladderOutcomeTimer = setTimeout(() => handleLadderOutcome('lose'), Math.max(1800, spokenMs + 600));
        }
      } else {
        SoundMgr.seWin();
      }
      return true;
    }

    if (isBoardFull()) {
      gameOver = true;
      updateStatus(K('引き分けです！', 'ひきわけです！'));
      hideBubble();
      SoundMgr.seDraw();
      if (mode === 'cpu') {
        resetBtn.disabled = true; // re-enabled by initGame() once the next match actually starts
        ladderOutcomeTimer = setTimeout(() => handleLadderOutcome('draw'), 1000);
      }
      return true;
    }

    currentPlayer = currentPlayer % 3 + 1; // 1→2→3→1 (pvp/cpu are 3-player; online is still 2-player and unreachable for now)
    updateStatus();

    if (mode === 'cpu' && player !== 1) {
      const ch = charForPlayer(player);
      const others = [1, 2, 3].filter(p => p !== player);
      if (others.some(p => findImmediateWin(grid, p) !== null)) speak(ch, 'aboutToLose');
      else if (findImmediateWin(grid, player) !== null) speak(ch, 'aboutToWin');
      else speak(ch, 'normal');
    }

    if (isCpuSeat(currentPlayer) && !gameOver) {
      triggerCpuMove(player); // who just moved — see triggerCpuMove's own comment on why this matters
    }
    return true;
  }

  // ---------- CPU speech bubble ----------
  // Most characters speak a single line per category. LV5 (傀儡師) instead has
  // multi-speaker conversations (master + 4 puppets) — see PUPPETS above.
  // speak() returns how long (ms) the bubble will be showing, so callers can
  // delay any follow-up (e.g. the ladder result overlay) until it's done —
  // that total is always the full un-skipped duration, even if the player
  // clicks through early, so downstream pacing (e.g. the result overlay)
  // never arrives faster than it would without clicking.
  //
  // Multi-line runs (playConversation/speakSequential) go through this one
  // shared, click-skippable sequencer instead of independent setTimeouts, so
  // "the first of two lines vanishes before it can be read" (the bug this
  // replaced) can't happen — see handleBubbleClick().
  let bubbleSequence = null; // { steps: [{name, text}], index, timer } | null

  function clearBubbleSequence() {
    if (bubbleSequence && bubbleSequence.timer) clearTimeout(bubbleSequence.timer);
    bubbleSequence = null;
  }

  // ~3s floor even for a short line, so a reader always gets a real chance
  // to read it before the next one in a sequence replaces it; scales up for
  // longer lines rather than clipping them at a fixed ceiling.
  function lineDelay(text) {
    return Math.max(3000, Math.min(5500, text.length * 110));
  }

  // The OTHER place two lines could clobber each other: in CPU mode, the
  // board itself cycles turns independently of how long a bubble has been
  // showing. On two human-free turns in a row (P2 then P3, neither one you),
  // triggerCpuMove() used to always wait a flat 450ms "thinking" pause no
  // matter what — so opponent 2's just-shown line got overwritten by
  // opponent 3's well before anyone could read it. bubbleReadyAt is "don't
  // let a NEW bubble line replace this one before this timestamp"; the fix
  // in triggerCpuMove() below waits for it instead of the flat 450ms when
  // that's longer. Reset to 0 (no wait) on an explicit skip-click, since a
  // player who dismissed a line early clearly doesn't want the game to keep
  // pausing for it.
  let bubbleReadyAt = 0;

  function showSingleLine(name, text) {
    const bubble = document.getElementById('speechBubble');
    document.getElementById('bubbleName').textContent = name;
    document.getElementById('bubbleText').textContent = text;
    bubble.classList.remove('show');
    void bubble.offsetWidth; // restart the fade/slide animation
    bubble.classList.add('show');
    const delay = lineDelay(text);
    bubbleReadyAt = Date.now() + delay;
    return delay;
  }

  function advanceBubbleSequence() {
    if (!bubbleSequence) return;
    bubbleSequence.index++;
    if (bubbleSequence.index >= bubbleSequence.steps.length) {
      bubbleSequence = null; // last line stays on screen until something else replaces/hides it
      return;
    }
    const step = bubbleSequence.steps[bubbleSequence.index];
    showSingleLine(step.name, step.text);
    bubbleSequence.timer = setTimeout(advanceBubbleSequence, lineDelay(step.text));
  }

  // Shared by playConversation/speakSequential: shows steps[0] now, auto-
  // advances on a timer, and leaves the sequence in `bubbleSequence` so a
  // click (handleBubbleClick) can jump ahead of the timer at any point.
  function runBubbleSequence(steps) {
    clearBubbleSequence();
    if (!steps.length) return 0;
    bubbleSequence = { steps, index: 0, timer: null };
    showSingleLine(steps[0].name, steps[0].text);
    bubbleSequence.timer = setTimeout(advanceBubbleSequence, lineDelay(steps[0].text));
    return steps.reduce((sum, s) => sum + lineDelay(s.text), 0);
  }

  // Click anywhere on the bubble: jump straight to the next queued line
  // (for a multi-line run), or dismiss the bubble immediately if this was
  // the last one — "もう読まなくていい人はクリックして飛ばせるように". Dismissing
  // (rather than just silently ending the sequence, as the natural
  // timer-driven finish does) is what makes clicking through to the end
  // take exactly as many clicks as there are lines, not one extra.
  function handleBubbleClick() {
    if (bubbleSequence && bubbleSequence.index < bubbleSequence.steps.length - 1) {
      clearTimeout(bubbleSequence.timer);
      advanceBubbleSequence();
    } else {
      hideBubble();
    }
  }

  function playConversation(ch, convo) {
    return runBubbleSequence(convo.map((line) => ({ name: speakerName(ch, line.speaker), text: line.text })));
  }

  function speak(ch, category) {
    if (!ch || !ch.lines) return 0;
    const lineSet = (kanaMode && ch.linesKana) ? ch.linesKana : ch.lines;
    const data = lineSet[category];
    if (!data) return 0;

    if (category === 'victory' || category === 'defeat') {
      return Array.isArray(data) && typeof data[0] === 'object'
        ? playConversation(ch, data)
        : showSingleLine(ch.name, data);
    }

    if (!data.length) return 0;
    const picked = data[Math.floor(Math.random() * data.length)];
    return Array.isArray(picked)
      ? playConversation(ch, picked)
      : showSingleLine(ch.name, picked);
  }

  // Queues each character's fixed victory/defeat line one after another in
  // the single shared speech bubble (used when the human beats both CPU
  // opponents at once, so each gets to react instead of only one). Only
  // handles the plain-string case (victory/defeat are always a fixed string,
  // never the multi-speaker conversation array).
  function speakSequential(chars, category) {
    const steps = [];
    chars.filter(Boolean).forEach((ch) => {
      const lineSet = (kanaMode && ch.linesKana) ? ch.linesKana : ch.lines;
      const text = lineSet && lineSet[category];
      if (typeof text === 'string') steps.push({ name: ch.name, text });
    });
    return runBubbleSequence(steps);
  }

  function hideBubble() {
    clearBubbleSequence();
    bubbleReadyAt = 0; // nothing left to protect a read-time for
    document.getElementById('speechBubble').classList.remove('show');
  }

  document.getElementById('speechBubble').addEventListener('click', () => {
    SoundMgr.seClick();
    handleBubbleClick();
  });

  // previousMover: who moved just before this CPU's turn came up (1 = the
  // human, or the match just started — see call sites). Only a CPU-to-CPU
  // handoff (previousMover 2 or 3) ever applies the dialogue-wait delay —
  // see the comment on `delay` below for why.
  function triggerCpuMove(previousMover) {
    const player = currentPlayer; // 2 or 3
    const ch = charForPlayer(player); // null for a 対人戦 CPU seat (no character art/lines)
    const colorVar = player === 2 ? '--p2' : '--p3';
    const label = player === 2 ? player2Label() : player3Label();
    cpuThinking = true;
    boardWrap.classList.add('locked');
    const thinkingAvatar = ch
      ? `<img class="turn-avatar" src="${ch.img}" alt="" style="object-position: ${ch.avatarPosition || 'left top'};" onerror="this.outerHTML='<span class=&quot;turn-indicator&quot; style=&quot;background:var(${colorVar})&quot;></span>'">`
      : `<span class="turn-indicator" style="background:var(${colorVar})"></span>`;
    updateStatus(`${thinkingAvatar} ${escapeHtml(label)}${K('が考え中...', 'がかんがえちゅう...')}`);
    // The dialogue-wait toggle only ever holds up a CPU-to-CPU handoff
    // (opponent 2 → opponent 3), never the move right after the player's
    // own turn — waiting there felt laggy/unresponsive (you just acted, and
    // the game stalls on "thinking..." before anything happens), whereas the
    // gap between the two CPUs' moves is fine since the player has nothing
    // to do but watch anyway. With the toggle off, or right after the
    // player's own move, it's always just the brief 450ms "thinking" pause.
    const delay = (mode === 'cpu' && dialogueWaitEnabled && previousMover !== 1)
      ? Math.max(3000, bubbleReadyAt - Date.now())
      : 450;
    setTimeout(() => {
      const col = getCpuMoveFor(player, ch || (mode === 'pvp' ? pvpCpu : null));
      cpuThinking = false;
      boardWrap.classList.remove('locked');
      if (col !== null) dropPiece(col, player);
    }, delay);
  }

  function isBoardFull() {
    return grid[0].every(cell => cell !== 0);
  }

  function getNextOpenRow(g, col) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (g[r][col] === 0) return r;
    }
    return -1;
  }

  function checkWin(row, col, player) {
    const directions = [
      [[0, 1], [0, -1]],   // horizontal
      [[1, 0], [-1, 0]],   // vertical
      [[1, 1], [-1, -1]],  // diagonal \
      [[1, -1], [-1, 1]],  // diagonal /
    ];

    for (const pair of directions) {
      let line = [[row, col]];
      for (const [dr, dc] of pair) {
        let r = row + dr;
        let c = col + dc;
        while (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] === player) {
          line.push([r, c]);
          r += dr;
          c += dc;
        }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }

  function updateScoreboard() {
    score1El.textContent = `${player1Label()}: ${scores[1]}${K('勝', 'しょう')}`;
    score2El.textContent = `${player2Label()}: ${scores[2]}${K('勝', 'しょう')}`;
    score3El.textContent = `${player3Label()}: ${scores[3]}${K('勝', 'しょう')}`;
  }

  resetBtn.addEventListener('click', () => { SoundMgr.seClick(); initGame(); });

  // ---------- CPU AI (heuristic, 3-player-aware) ----------
  // A true minimax/alpha-beta search assumes a 2-player zero-sum game and
  // doesn't generalize cleanly to 3 (that's a much harder "maxn" search
  // problem, and the bigger 8x7 board makes deep search expensive anyway).
  // Instead: always grab a free win, always block whichever of the OTHER
  // two players has one, and otherwise score each candidate column by how
  // much it helps the mover's own open lines while hurting both opponents'
  // — reusing the same per-window scoring idea the old minimax eval used,
  // just generalized to "one active player vs every other value on the
  // board" instead of a hardcoded piece===1/2 pair.
  function getValidCols(g) {
    const cols = [];
    for (let c = 0; c < COLS; c++) if (g[0][c] === 0) cols.push(c);
    return cols;
  }

  function cloneGrid(g) {
    return g.map(row => row.slice());
  }

  function winningMoveGrid(g, player) {
    // horizontal
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        if (g[r][c] === player && g[r][c+1] === player && g[r][c+2] === player && g[r][c+3] === player) return true;
      }
    }
    // vertical
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r <= ROWS - 4; r++) {
        if (g[r][c] === player && g[r+1][c] === player && g[r+2][c] === player && g[r+3][c] === player) return true;
      }
    }
    // diagonal down-right
    for (let r = 0; r <= ROWS - 4; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        if (g[r][c] === player && g[r+1][c+1] === player && g[r+2][c+2] === player && g[r+3][c+3] === player) return true;
      }
    }
    // diagonal up-right
    for (let r = 3; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        if (g[r][c] === player && g[r-1][c+1] === player && g[r-2][c+2] === player && g[r-3][c+3] === player) return true;
      }
    }
    return false;
  }

  // Returns a column that would immediately win for `player`, or null.
  function findImmediateWin(g, player) {
    for (const col of getValidCols(g)) {
      const row = getNextOpenRow(g, col);
      const gCopy = cloneGrid(g);
      gCopy[row][col] = player;
      if (winningMoveGrid(gCopy, player)) return col;
    }
    return null;
  }

  function evaluateWindowMulti(win, self) {
    let score = 0;
    const countSelf = win.filter(v => v === self).length;
    const countEmpty = win.filter(v => v === 0).length;
    if (countSelf === 3 && countEmpty === 1) score += 5;
    else if (countSelf === 2 && countEmpty === 2) score += 2;
    for (const opp of [1, 2, 3]) {
      if (opp === self) continue;
      const countOpp = win.filter(v => v === opp).length;
      if (countOpp === 3 && countEmpty === 1) score -= 4;
    }
    return score;
  }

  function scorePositionMulti(g, self) {
    let score = 0;
    // 8 columns have two middle columns (3 and 4); rewarding only one made
    // every CPU lean right of centre and open the same way each game.
    const centerCols = COLS % 2 === 0 ? [COLS / 2 - 1, COLS / 2] : [Math.floor(COLS / 2)];
    for (const centerCol of centerCols) {
      score += g.reduce((acc, row) => acc + (row[centerCol] === self ? 1 : 0), 0) * 3;
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        score += evaluateWindowMulti([g[r][c], g[r][c+1], g[r][c+2], g[r][c+3]], self);
      }
    }
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r <= ROWS - 4; r++) {
        score += evaluateWindowMulti([g[r][c], g[r+1][c], g[r+2][c], g[r+3][c]], self);
      }
    }
    for (let r = 0; r <= ROWS - 4; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        score += evaluateWindowMulti([g[r][c], g[r+1][c+1], g[r+2][c+2], g[r+3][c+3]], self);
      }
    }
    for (let r = 3; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        score += evaluateWindowMulti([g[r][c], g[r-1][c+1], g[r-2][c+2], g[r-3][c+3]], self);
      }
    }
    return score;
  }

  // How reliably a CPU spots-and-blocks an opponent's one-move win, derived
  // from its `wildness` so the ladder needs no extra per-character field:
  // 0.5 -> 50% (LV1), 0.35 -> 77%, 0.25 -> 95%, <= 0.22 -> always. Missing
  // blocks is what makes the early stages beatable by a plain "make three in
  // a row" threat; taking its own win is never skipped (see getCpuMoveFor).
  function cpuBlockRate(wildness) {
    return Math.max(0.3, Math.min(1, 1.4 - 1.8 * wildness));
  }

  // `player` is whichever CPU seat (2 or 3) is moving; `ch` is its character
  // (for depth/wildness — null falls back to a middling default).
  function getCpuMoveFor(player, ch) {
    const validCols = getValidCols(grid);
    if (validCols.length === 0) return null;

    // Always take a free win, regardless of character strength, so weaker
    // stages never look "broken" by missing an obvious win.
    const myWin = findImmediateWin(grid, player);
    if (myWin !== null) return myWin;

    // Block whichever OTHER player (human or the other CPU) has an immediate
    // win on offer — reliably at higher levels, only sometimes at LV1-3.
    const others = [1, 2, 3].filter(p => p !== player);
    const wildness = ch ? ch.wildness : 0.2;
    const blockRate = cpuBlockRate(wildness);
    for (const opp of others) {
      const blockCol = findImmediateWin(grid, opp);
      if (blockCol !== null && Math.random() < blockRate) return blockCol;
    }

    // Score every column. Stronger characters (depth >= 2) also check one ply
    // ahead: does this candidate hand ANY opponent an immediate win next turn?
    const depth = ch ? ch.depth : 2;
    const scored = validCols.map((col) => {
      const row = getNextOpenRow(grid, col);
      const gCopy = cloneGrid(grid);
      gCopy[row][col] = player;
      let s = scorePositionMulti(gCopy, player);
      if (depth >= 2 && others.some(opp => findImmediateWin(gCopy, opp) !== null)) {
        s -= 5000;
      }
      return { col, s };
    });
    // Shuffle before the (stable) sort so equally-scored columns come out in
    // random order — previously ties always went to the leftmost column.
    for (let i = scored.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [scored[i], scored[j]] = [scored[j], scored[i]];
    }
    scored.sort((a, b) => b.s - a.s);

    // A "wild" move is a real slip, but a plausible one rather than a
    // coin-flip column: pick at random among the 2nd-4th best-scoring columns
    // (never the best). Tuned offline against simulated players — choosing
    // from the top 3 *including* the best made LV1-2 harder than the old
    // uniform-random slips, and uniform random again was too erratic.
    if (wildness > 0 && Math.random() < wildness) {
      const pool = scored.length > 1 ? scored.slice(1, Math.min(4, scored.length)) : scored;
      return pool[Math.floor(Math.random() * pool.length)].col;
    }
    return scored[0].col;
  }

  applyKanaMode(); // render the title/online screens in the persisted mode
})();
</script>
