<!DOCTYPE html>
<html lang="ja">
<head>
<!--
  黄昏のフォー・イン・ア・ロウ 地平の行方
  Created by naogare — https://www.youtube.com/@NMLabo
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="naogare">
<title>黄昏のフォー・イン・ア・ロウ 地平の行方 - 4個並べ対戦ゲーム</title>
<style>
  :root {
    --bg: #1e293b;
    --board: #2563eb;
    --slot: #0f172a;
    --p1: #ef4444;
    --p2: #eab308;
    --p3: #22c55e;
    --text: #f1f5f9;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* ---- Audio toggles (always visible, above every screen) ---- */
  #audioControls {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    z-index: 20;
    display: flex;
    gap: 8px;
  }
  .audio-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(15, 23, 42, 0.72);
    border: 1.5px solid rgba(148, 163, 184, 0.45);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(4px);
  }
  .audio-btn .audio-icon { font-size: 0.95rem; line-height: 1; }
  .audio-btn .kana-icon {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--accent);
  }
  .audio-btn.muted .kana-icon { color: inherit; }
  .audio-btn.muted {
    border-color: rgba(148, 163, 184, 0.25);
    color: rgba(241, 245, 249, 0.45);
  }
  .audio-btn.muted .audio-icon { filter: grayscale(1); opacity: 0.6; }
  @media (max-width: 480px) {
    .audio-btn .audio-label { display: none; }
    .audio-btn { padding: 8px; }
  }

  /* ---- Splash / title screen ---- */
  #splashScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  #splashScreen.show { opacity: 1; }
  #splashScreen.hide { opacity: 0; pointer-events: none; }
  #splashScreen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* title.webp is a wide landscape illustration — on narrow/portrait screens
     "cover" crops off the characters and part of the logo at the sides, so
     switch to "contain" (full artwork visible, letterboxed) there instead. */
  @media (max-aspect-ratio: 1/1) {
    #splashScreen img { object-fit: contain; }
  }

  /* ---- Full-screen CPU character backdrop (shown during play) ---- */
  /* Two opponents now, flanking the board — left one as drawn, right one
     mirrored (every character is illustrated facing left; see setCharBackground()
     and the LV1〜6 STAGES roster). --avatar-pos is set inline per character
     (only consumed on narrow screens, see the media query below) since each
     illustration's face sits somewhere different — the tall desktop view
     never crops so it doesn't need it. */
  #charBgWrap {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #charBgWrap.show { opacity: 1; }
  #charBgImgLeft, #charBgImgRight {
    height: 96vh;
    max-width: 46vw;
    object-fit: contain;
    filter: drop-shadow(0 10px 34px rgba(0,0,0,0.65));
  }
  #charBgImgLeft {
    object-position: bottom left;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 85%);
    mask-image: linear-gradient(to right, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 85%);
  }
  #charBgImgRight {
    object-position: bottom right;
    transform: scaleX(-1);
    -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 85%);
    mask-image: linear-gradient(to left, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 85%);
  }
  #charBgOverlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
    /* Flat tint rather than the old single-side gradient — with characters
       now peeking in from BOTH edges, a flat dim keeps the center (board/UI
       text) readable regardless of which side is brighter. */
    background: rgba(10, 15, 30, 0.55);
  }
  #charBgOverlay.show { opacity: 1; }

  /* On narrow screens there's no side-by-side space for two full-height
     figures: shrink both into a header band above the board, cropped to
     each character's own face position (--avatar-pos, set inline per
     character) via object-fit:cover instead of the desktop's uncropped
     object-fit:contain. */
  @media (max-width: 640px) {
    #charBgWrap { align-items: flex-start; }
    #charBgImgLeft, #charBgImgRight {
      width: 48vw;
      max-width: 48vw;
      height: 30vh;
      max-height: 30vh;
      object-fit: cover;
      object-position: var(--avatar-pos, top center);
      opacity: 0.6;
    }
    #charBgImgLeft {
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 55%, rgba(0,0,0,0) 100%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 55%, rgba(0,0,0,0) 100%);
    }
    #charBgImgRight {
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 55%, rgba(0,0,0,0) 100%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 55%, rgba(0,0,0,0) 100%);
    }
  }

  .page-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.15rem, 6.2vw, 1.8rem);
    letter-spacing: 0.05em;
    overflow-wrap: break-word;
    max-width: 100%;
  }
  #titleSequelSubtitle {
    display: block;
    font-size: clamp(0.75rem, 3.2vw, 1rem);
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-top: 2px;
  }
  .hidden { display: none !important; }

  /* ---- Title screen ---- */
  #titleScreen, #onlineScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 36px 30px;
    background: rgba(15, 23, 42, 0.55);
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    width: 100%;
    max-width: min(820px, 92vw);
    box-sizing: border-box;
  }
  @media (max-width: 480px) {
    #titleScreen, #onlineScreen { padding: 28px 18px; gap: 14px; }
  }
  #titleScreen p.subtitle, #onlineScreen p.subtitle {
    margin: -8px 0 4px;
    opacity: 0.75;
    font-size: 0.95rem;
  }
  #debugTrigger { user-select: none; }

  /* ---- Online multiplayer (create/join room) ---- */
  .player-name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.85rem;
    opacity: 0.9;
    margin-top: -6px;
  }
  #playerNameInput, .name-input {
    background: #0f172a;
    border: 2px solid #334155;
    color: var(--text);
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 0.95rem;
    width: 130px;
    text-align: center;
  }
  #playerNameInput:focus, .name-input:focus { outline: none; border-color: var(--accent); }
  #onlineJoinConfirm {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .online-join-row {
    display: flex;
    gap: 8px;
  }
  #onlineJoinCode {
    background: #0f172a;
    border: 2px solid #334155;
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    width: 140px;
    text-align: center;
  }
  #onlineJoinCode:focus { outline: none; border-color: var(--accent); }
  #onlineJoinBtn {
    padding: 10px 18px;
    border-radius: 10px;
  }
  .online-error {
    color: var(--p1);
    font-size: 0.85rem;
    min-height: 1.2em;
    margin: 0;
  }
  .online-room-code {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: var(--accent);
    background: #0f172a;
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 14px 24px;
  }
  .online-waiting-text {
    font-size: 0.95rem;
    margin: 0;
    animation: onlinePulse 1.6s ease-in-out infinite;
  }
  @keyframes onlinePulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.95; }
  }
  .mode-options {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-btn {
    background: #0f172a;
    border: 2px solid var(--accent);
    color: var(--text);
    padding: 22px 28px;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 180px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .mode-btn .emoji { font-size: 1.8rem; display: block; margin-bottom: 6px; }
  .mode-btn-sub {
    display: block;
    font-size: 0.68rem;
    font-weight: 500;
    opacity: 0.65;
    margin-top: 4px;
  }
  .mode-btn:hover {
    background: var(--accent);
    color: #0f172a;
    transform: translateY(-3px);
  }
  .mode-btn:hover .mode-btn-sub { color: #0f172a; opacity: 0.8; }

  .back-to-splash-btn {
    background: transparent;
    border: none;
    color: var(--text);
    opacity: 0.65;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 6px 10px;
  }
  .back-to-splash-btn:hover { opacity: 1; text-decoration: underline; }

  .credit {
    margin: 4px 0 0;
    font-size: 0.72rem;
    opacity: 0.45;
    letter-spacing: 0.02em;
  }
  .credit strong { font-weight: 700; opacity: 0.9; }
  .credit a {
    color: inherit;
    opacity: 0.8;
    text-decoration: none;
    border-bottom: 1px dotted currentColor;
  }
  .credit a:hover { opacity: 1; }

  /* ---- Ladder result overlay (shown between/after CPU matches) ---- */
  #resultOverlay {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 8, 18, 0.82);
    padding: 20px;
  }
  .result-card {
    background: rgba(15, 23, 42, 0.96);
    border: 2px solid var(--accent);
    border-radius: 18px;
    padding: 28px 30px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  }
  .result-portrait {
    width: 100%;
    height: 190px;
    border-radius: 12px;
    background: #0f172a;
    overflow: hidden;
    display: flex;
    align-items: stretch;
    justify-content: center;
    font-size: 3rem;
    margin-bottom: 14px;
  }
  .result-portrait:empty { display: none; margin: 0; }
  .result-portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  /* CPU戦 shows both opponents side by side (see charPortraits()) — each
     half gets its own emoji-fallback slot so one broken image doesn't wipe
     out its neighbor the way a single shared portraitEl.innerHTML did. */
  .result-portrait .portrait-half {
    flex: 1 1 50%;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .result-portrait .portrait-half + .portrait-half {
    border-left: 1px solid rgba(255, 255, 255, 0.08);
  }
  .result-portrait .portrait-half img.mirrored { transform: scaleX(-1); }
  .result-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .result-message {
    font-size: 0.9rem;
    opacity: 0.85;
    line-height: 1.6;
    margin-bottom: 20px;
    white-space: pre-line;
  }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-actions button {
    width: 100%;
  }
  .result-actions .secondary {
    background: transparent;
    border: 2px solid #475569;
    color: var(--text);
  }
  /* Online post-game countdown ("leave in N seconds") — see tickPostGameCountdown() */
  .result-note {
    margin-top: 12px;
    font-size: 0.8rem;
    opacity: 0.7;
  }

  /* ---- CPU ladder intro story, shown before LV1 and LV6 (see maybeShowStory()) ---- */
  #storyOverlay {
    position: fixed;
    inset: 0;
    z-index: 15;
    background-color: #000;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    cursor: pointer;
  }
  #storyOverlay.hidden { display: none; }
  #storyText {
    color: #fff;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "MS PMincho", serif;
    font-size: 1.05rem;
    line-height: 2.1;
    white-space: pre-line;
    max-width: 480px;
    text-align: left;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #storyText.show { opacity: 1; }
  #storyHint {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    right: max(20px, env(safe-area-inset-right));
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.8rem;
  }

  /* ---- All-clear ending ---- */
  #endingScreen {
    position: fixed;
    inset: 0;
    z-index: 9;
    background: #000;
    overflow: hidden;
    cursor: grab;
    touch-action: none; /* the crawl is drag-scrubbed by hand, not natively scrolled */
    user-select: none; /* otherwise a mouse-drag over the crawl text selects it instead of scrubbing */
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #endingScreen.dragging { cursor: grabbing; }
  #endingScreen.show { opacity: 1; }
  #endingScroll {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  #endingScroll img {
    display: block;
    position: absolute;
    left: 50%;
    top: 0;
    -webkit-user-drag: none; /* native image drag would otherwise hijack the crawl-scrub gesture on desktop */
    /* min-width/min-height (not plain width/height) is the pure-CSS
       "cover" trick: the browser grows whichever axis is needed to fully
       cover the screen, so no black #endingScreen background can ever
       show through even on a phone taller than ending2.webp's own 2:1
       ratio — it crops a bit off the sides instead. */
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    /* Base centering, also the animation's 0% state — starts on the
       BOTTOM of the artwork (feet) and pans up to the top (sky/faces) by
       the end, so the scene doesn't close on a close-up of someone's boots. */
    transform: translate(-50%, calc(-100% + 100vh));
  }
  #endingScroll img.pan {
    animation: endingPan 90s ease-in-out forwards;
  }
  @keyframes endingPan {
    0%, 10% { transform: translate(-50%, calc(-100% + 100vh)); }
    90%, 100% { transform: translate(-50%, 0); }
  }
  /* Payoff image revealed once the crawl finishes (see showEndingScreen()'s
     endingCrawlAnim.onfinish) — overrides #endingScroll img's pan-start
     transform with a plain centered cover-fit, since this one doesn't pan. */
  #endingScroll img#endingVista {
    transform: translate(-50%, 0);
    opacity: 0;
    transition: opacity 1.8s ease;
    pointer-events: none; /* clicking through it still returns to title */
  }
  #endingScroll img#endingVista.show { opacity: 1; }
  /* Narration crawl overlaid on the artwork — see showEndingScreen(). Its
     start/end transform is set inline (via the Web Animations API) once the
     text is built and its rendered height is known, so it always scrolls
     fully clear of the screen regardless of how much text is in it. */
  #endingTextWrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #endingTextCrawl {
    position: absolute;
    left: 50%;
    top: 0;
    width: min(560px, 86vw);
    text-align: center;
    color: #f6f1e7;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "MS PMincho", serif;
    font-size: clamp(0.95rem, 2.6vw, 1.1rem);
    line-height: 1.9;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.9);
  }
  #endingTextCrawl p { margin: 0 0 2.6em; white-space: pre-line; }
  .ending-hint {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 10;
    color: var(--text);
    background: rgba(15, 23, 42, 0.65);
    border: 1.5px solid rgba(148, 163, 184, 0.45);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    pointer-events: none;
    opacity: 0;
    animation: endingHintFade 2s ease 1s forwards;
  }
  @keyframes endingHintFade {
    to { opacity: 0.9; }
  }

  /* ---- Online emote picker (flick/drag-scroll strip) + incoming popup ---- */
  /* max-width must stay tied to the viewport (vw), not just a flat px cap:
     #emoteScroller's 25 fixed-width icons give it a large intrinsic content
     width, and on portrait phones a flat 480px let that intrinsic width
     inflate #gameScreen (an auto-width flex column) past the viewport,
     clipping the board's side columns under body's overflow-x:hidden. */
  #onlineEmoteBar {
    width: 100%;
    max-width: min(480px, 92vw);
    margin-top: 14px;
  }
  /* Applied for the post-game grace window (see resultNote/POST_GAME_WINDOW_MS)
     so the emote strip stays reachable above the result overlay's backdrop
     instead of being hidden underneath it — pinned to the bottom of the
     viewport with a higher z-index than #resultOverlay (6). */
  #onlineEmoteBar.postgame {
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 7;
    background: rgba(15, 23, 42, 0.9);
    border: 2px solid #334155;
    border-radius: 16px;
    padding: 6px 8px 2px;
    margin-top: 0;
  }
  #emoteScroller {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    padding: 4px 4px 10px;
    cursor: grab;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #emoteScroller::-webkit-scrollbar { display: none; }
  #emoteScroller.dragging { cursor: grabbing; }
  .emote-icon-btn {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    padding: 4px;
    border-radius: 12px;
    background: #0f172a;
    border: 2px solid #334155;
    cursor: pointer;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .emote-icon-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .emote-icon-btn:hover { border-color: var(--accent); }
  .emote-icon-btn:active { transform: scale(0.92); }

  #incomingEmote {
    position: fixed;
    top: 16vh;
    left: 50%;
    z-index: 8;
    width: 120px;
    height: 120px;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -12px) scale(0.5);
    transition: opacity 0.25s ease, transform 0.25s ease;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
  }
  #incomingEmote img { width: 100%; height: 100%; object-fit: contain; }
  #incomingEmote.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  /* Feedback for your OWN tap: a clone of the tapped icon rises from the
     button and fades, so it's clear the tap registered (opponent's popup
     via #incomingEmote is the only feedback that existed before). */
  .emote-fly {
    position: fixed;
    width: 44px;
    height: 44px;
    object-fit: contain;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: none;
    z-index: 9;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.9s ease 0.2s;
  }
  .emote-fly.rise {
    transform: translate(-50%, calc(-50% - 38vh)) scale(1.3);
    opacity: 0;
  }

  /* ---- Turn-order coin toss ---- */
  #turnDecideOverlay {
    position: fixed;
    inset: 0;
    z-index: 7;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 8, 18, 0.82);
  }
  .turn-decide-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .coin-wrap { perspective: 400px; }
  .coin {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--p1);
    box-shadow: 0 0 20px 6px rgba(255,255,255,0.18), 0 8px 20px rgba(0,0,0,0.5);
    animation: coinSpin 0.15s linear infinite;
  }
  .coin.settled { animation: coinSettle 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes coinSpin {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(0.12); }
  }

  .turn-decide-text {

  /* ---- Game screen ---- */
  /* On short phones the vertically-centered game column can ride up under the
     fixed BGM/SE/かな buttons (top-left) — keep it clear of that strip. */
  body:has(#gameScreen:not(.hidden)) { padding-top: 56px; }

    display: flex;

  /* All character art is drawn facing left — mirror whichever one is shown

  /* ---- CPU speech bubble ---- */
  /* Sits where the game title used to be — reserves its slot only in CPU

<script>
(function () {
  // ---------- Audio: looping BGM (file-based, per-screen tracks) + synthesized SFX (Web Audio API) ----------
  // Music lives in bgm/: title.mp3 plays on the splash/title screens, bgm.mp3
  // plays during actual matches. Either file can be missing (bgm.mp3 isn't
  // made yet) — playback just silently no-ops until it shows up. SFX are
  // generated on the fly via Web Audio API so they work immediately, no files
  // needed. Both toggles persist via localStorage and stay visible/functional
  // across every screen (splash, title, game, result overlay).
  // Some contexts (sandboxed embeds, certain mobile in-app browsers, strict
  // private-browsing modes) throw on any localStorage access rather than
  // just failing quietly — guard every call so a blocked storage API can
  // never take the rest of the game down with it.
  function safeStorageGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeStorageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
  }

  const SoundMgr = (function () {
    const STORAGE_BGM = 'lineup4_bgm_on';
    const STORAGE_SE = 'lineup4_se_on';
    let bgmOn = safeStorageGet(STORAGE_BGM) !== '0';
    let seOn = safeStorageGet(STORAGE_SE) !== '0';
    let unlocked = false;
    let ctx = null;

    // 'title' and 'game' are fixed tracks; 'level:N' is resolved to bgm/LVN.mp3
    // for a per-character theme, falling back to the generic game track (and
    // from there, silence) wherever a more specific file hasn't been added yet.
    const TITLE_URL = 'bgm/title.mp3';
    const GAME_URL = 'bgm/bgm.mp3';
    const ENDING_URL = 'bgm/ending.mp3';
    function levelUrl(level) { return 'bgm/LV' + level + '.mp3'; }
    function urlForKey(key) {
      if (key === 'title') return TITLE_URL;
      if (key === 'game') return GAME_URL;
      if (key === 'ending') return ENDING_URL;
      if (key.indexOf('level:') === 0) return levelUrl(key.slice(6));
      return null;
    }

    const BGM_VOLUME = 0.35;
    const trackMissing = {};
    let currentTrackKey = null;

    const bgmEl = document.getElementById('bgmAudio');
    bgmEl.volume = BGM_VOLUME;

    function ensureContext() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function fadeVolume(target, duration) {
      const start = bgmEl.volume;
      const t0 = performance.now();
      function step(now) {
        const t = Math.min(1, (now - t0) / duration);
        bgmEl.volume = start + (target - start) * t;
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function playTrack(key, fallbackKey) {
      if (trackMissing[key]) {
        if (fallbackKey) playTrack(fallbackKey, fallbackKey === 'game' ? null : 'game');
        return;
      }
      if (currentTrackKey === key) {
        if (bgmOn && unlocked) bgmEl.play().catch(() => {});
        return;
      }
      currentTrackKey = key;
      const switchSrc = () => {
        const thisKey = key;
        bgmEl.onerror = () => {
          trackMissing[thisKey] = true;
          if (fallbackKey && currentTrackKey === thisKey) {
            playTrack(fallbackKey, fallbackKey === 'game' ? null : 'game');
          }
        };
        bgmEl.src = urlForKey(key);
        bgmEl.loop = key !== 'ending'; // the ending theme plays once, not on repeat
        if (bgmOn && unlocked) {
          bgmEl.volume = 0;
          bgmEl.play().then(() => fadeVolume(BGM_VOLUME, 500)).catch(() => {});
        } else {
          bgmEl.volume = BGM_VOLUME;
        }
      };
      if (!bgmEl.paused) {
        fadeVolume(0, 250);
        setTimeout(() => { bgmEl.pause(); switchSrc(); }, 260);
      } else {
        switchSrc();
      }
    }

    // Prefer a level-specific theme (bgm/LV{level}.mp3); silently falls back
    // to the shared game track if that file doesn't exist for this level yet.
    function playLevelTrack(level) {
      playTrack('level:' + level, 'game');
    }

    function tone(freq, duration, type, gainPeak, delay) {
      if (!seOn) return;
      const audioCtx = ensureContext();
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(gainPeak || 0.15, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    }

    return {
      unlock() {
        if (unlocked) return;
        unlocked = true;
        ensureContext();
        playTrack(currentTrackKey || 'title');
      },
      playTrack,
      playLevelTrack,
      stop() {
        fadeVolume(0, 250);
        setTimeout(() => bgmEl.pause(), 260);
        currentTrackKey = null; // so a later playTrack() re-inits fully instead of just resuming
      },
      setBgmOn(v) {
        bgmOn = v;
        safeStorageSet(STORAGE_BGM, v ? '1' : '0');
        if (v) {
          if (unlocked) bgmEl.play().catch(() => {});
        } else {
          bgmEl.pause();
        }
      },
      setSeOn(v) {
        seOn = v;
        safeStorageSet(STORAGE_SE, v ? '1' : '0');
      },
      isBgmOn: () => bgmOn,
      isSeOn: () => seOn,
      seClick() { tone(520, 0.09, 'triangle', 0.12); },
      seDrop() { tone(160, 0.16, 'sine', 0.22); tone(90, 0.22, 'sine', 0.15, 0.03); },
      seWin() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, i * 0.09)); },
      seLose() { [392, 329.63, 261.63, 196].forEach((f, i) => tone(f, 0.28, 'sawtooth', 0.1, i * 0.11)); },

  const DEFAULT_PLAYER_NAME = 'マスク';

  playerNameInput.value = safeStorageGet(NAME_STORAGE_KEY) || DEFAULT_PLAYER_NAME;

  // Minimal HTML-escaping for the couple of spots that build a status string
  // via innerHTML (for a colored-dot/avatar prefix) and splice a name into
  // it — online mode means that name can be the OPPONENT's, so it must never
  // be trusted as markup. Everywhere else a name is used with .textContent,
  // which is already safe regardless.
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // `bg` is optional — omitted (as for LV1) just keeps #storyOverlay's plain
  // black background; a dark scrim is layered under the text either way so
  // it stays readable over a busy image like LV6's gate scene.
  const STORY_BY_STAGE = {
    0: { lines: STORY_LV1_LINES, linesKana: STORY_LV1_LINES_KANA },
    [STAGES.length - 1]: { lines: STORY_LV6_LINES, linesKana: STORY_LV6_LINES_KANA, bg: 'story_lv6.webp' },
  };
  let storyLineIndex = 0;
  let storyTransitioning = false;
  const STORY_FADE_MS = 400; // must match #storyText's transition duration
  // Double rAF: forces the browser to register the opacity:0 state (class
  // just removed/absent) as a real paint before adding it back, otherwise
  // the two changes can collapse into one and the fade silently never plays.
  function fadeStoryTextIn(textEl) {
    requestAnimationFrame(() => requestAnimationFrame(() => textEl.classList.add('show')));
  }
  // Each line gets a brand-new #storyText element instead of rewriting the
  // old one's textContent. On some phones (GPU-composited opacity layer),
  // reusing the element left stale pixels from the previous line behind
  // wherever the new, shorter line didn't repaint over them — e.g. a stray
  // "マ" and "。" at the edges of the next line. A fresh element means a
  // fresh layer, so there's nothing stale to leave behind.
  function freshStoryTextEl(text) {
    const old = document.getElementById('storyText');
    const el = old.cloneNode(false);
    el.classList.remove('show');
    el.textContent = text;
    old.replaceWith(el);
    return el;
  }
  // Looks up STORY_BY_STAGE for the given ladder stage index — shows the
  // story and defers onDone until it's dismissed, or just calls onDone
  // immediately for a stage with no story of its own (LV2-5, for now).
  function maybeShowStory(stageIndex, onDone) {
    const story = STORY_BY_STAGE[stageIndex];
    if (!story) { onDone(); return; }
    showStoryScreen(story, onDone);
  }
  function showStoryScreen({ lines: kanjiLines, linesKana, bg }, onDone) {
    const lines = (kanaMode && linesKana) ? linesKana : kanjiLines;
    const overlay = document.getElementById('storyOverlay');
    storyLineIndex = 0;
    storyTransitioning = false;
    const firstEl = freshStoryTextEl(lines[0]);
    overlay.style.backgroundImage = bg
      ? `linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('${bg}')`
      : '';
    overlay.classList.remove('hidden');
    fadeStoryTextIn(firstEl);
    overlay.onclick = () => {
      if (storyTransitioning) return; // ignore clicks mid-fade
      SoundMgr.seClick();
      storyTransitioning = true;
      document.getElementById('storyText').classList.remove('show'); // fade out the current line
      setTimeout(() => {
        storyLineIndex++;
        if (storyLineIndex >= lines.length) {
          overlay.classList.add('hidden');
          overlay.onclick = null;
          onDone();
          return;
        }
        const nextEl = freshStoryTextEl(lines[storyLineIndex]);
        storyTransitioning = false;
        fadeStoryTextIn(nextEl); // fade in the next line
      }, STORY_FADE_MS);
    };
  }

  // ---------- Online multiplayer (friend invite via room code / URL) ----------
  // Server is authoritative: the Worker (src/line4-online.js) owns the grid,
  // turn order and win/draw detection in a dedicated D1 database. This client
  // only ever sends "I choose column N" and renders whatever state comes back
  // — it never decides a win/turn locally the way the pvp/cpu modes do.
  const ONLINE_API = '/api/line4-second';
  const ONLINE_POLL_MS = 1300;

  // Mirrors TURN_TIMEOUT_MS / the 30s warning point in src/line4-online.js —
  // the server is what actually enforces the forfeit (checked lazily on the
  // next /state poll from either side); this is purely the countdown display.
  const TURN_TIMEOUT_MS = 60000;
  const TURN_TIMEOUT_WARNING_MS = 30000;
  // How long the post-game emote/leave window stays open — mirrors (and
  // must stay a bit under) FINISHED_ROOM_GRACE_MS in src/line4-online.js.
  const POST_GAME_WINDOW_MS = 30000;

  // #resultOverlay is a direct child of <body>, but #onlineEmoteBar normally
  // lives inside .page-content (position:relative + z-index:1, its own
  // stacking context) — so no z-index on the emote bar, however high, could
  // ever out-rank the overlay; it only LOOKED like it was on top while
  // actually eating no clicks (confirmed via elementFromPoint). Reparenting
  // it to <body> during the post-game window makes it a real sibling of
  // #resultOverlay so z-index:7 vs 6 finally applies, then it's moved back
  // next to the board once the window ends.
  function pinEmoteBarForPostGame() {
    document.body.appendChild(document.getElementById('onlineEmoteBar'));
  }
  function restoreEmoteBarPosition() {
    document.getElementById('board-wrap').insertAdjacentElement('afterend', document.getElementById('onlineEmoteBar'));
  }

  // Called from the finished/leave room after either a decisive win/loss/draw:
  // stops the post-game countdown, tears down the emote bar's temporary
  // "postgame" positioning, and returns to the title screen. If *I* was the
  // winner, also tells the server so the room frees up immediately instead
  // of waiting for FINISHED_ROOM_GRACE_MS — a loser leaving needs no such
  // call (the winner might still request a rematch), so this is skipped
  // when online.wonLastMatch is falsy. Fire-and-forget: the values are read
  // synchronously before goToTitle() clears `online`, so it's safe even
  // though the request itself resolves after we've already left.
  function leavePostGameRoom() {
    if (online) {
      online.postGameDeadline = null;
      if (online.wonLastMatch) {
        apiPost(`/room/${online.code}/leave`, { token: online.token }).catch(() => {});
      }
    }
    document.getElementById('resultOverlay').classList.add('hidden');
    goToTitle();
  }

  function tickPostGameCountdown() {
    const noteEl = document.getElementById('resultNote');
    if (mode !== 'online' || !online || !online.postGameDeadline) {
      noteEl.textContent = '';
      return;
    }
    const remaining = online.postGameDeadline - Date.now();
    if (remaining <= 0) {
      leavePostGameRoom();
      return;
    }
    const seconds = Math.ceil(remaining / 1000);
    noteEl.textContent = `⏱ ${K(`あと${seconds}秒で退室します`, `あと${seconds}びょうでたいしゅつします`)}`;
  }

  setInterval(() => {
    tickPostGameCountdown();
    const warnEl = document.getElementById('turnTimeoutWarning');
    if (mode !== 'online' || !online || gameOver || !online.turnStartedAt) {
      warnEl.classList.add('hidden');
      return;
    }
    const remaining = TURN_TIMEOUT_MS - (Date.now() - online.turnStartedAt);
    if (remaining <= 0 || remaining > TURN_TIMEOUT_WARNING_MS) {
      warnEl.classList.add('hidden');
      return;
    }
    const seconds = Math.ceil(remaining / 1000);
    const isMyTurn = currentPlayer === online.myPlayer;
    // With 3 players an AFK turn is skipped (not a forfeit — see
    // resolveTimeout() in line4-second-online.js), so this names whichever
    // opponent is stalling rather than claiming a win is coming.
    const afkName = onlineNameFor(currentPlayer);
    warnEl.textContent = isMyTurn
      ? `⏱ ${K(`あと${seconds}秒で時間切れになります`, `あと${seconds}びょうでじかんぎれになります`)}`
      : `⏱ ${K(`${afkName}さんが操作していません…あと${seconds}秒で番が飛ばされます`, `${afkName}さんがそうさしていません…あと${seconds}びょうでばんがとばされます`)}`;
    warnEl.classList.remove('hidden');
  }, 1000);

  const onlineScreenEl = document.getElementById('onlineScreen');
  const onlineMenuEl = document.getElementById('onlineMenu');
  const onlineWaitingEl = document.getElementById('onlineWaiting');
  const onlineErrorEl = document.getElementById('onlineError');
  const onlineRoomCodeEl = document.getElementById('onlineRoomCode');
  const onlineJoinCodeEl = document.getElementById('onlineJoinCode');

  async function apiPost(path, body) {
    const res = await fetch(ONLINE_API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    return res.json();
  }
  async function apiGet(path) {
    const res = await fetch(ONLINE_API + path);
    return res.json();
  }

  // 赤/黄/緑 — matches --p1/--p2/--p3 and the color each player's disc uses.
  function onlineColorLabel(playerNum) {
    return playerNum === 1 ? K('赤', 'あか') : playerNum === 2 ? K('黄', 'き') : K('緑', 'みどり');
  }

  function onlineErrorMessages() {
    return {
      room_not_found: K('部屋が見つかりませんでした。コードを確認してください。', 'へやがみつかりませんでした。コードをかくにんしてください。'),
      room_full: K('その部屋は現在対戦中です。', 'そのへやはげんざいたいせんちゅうです。'),
      invalid_body: K('コードを入力してください。', 'コードをにゅうりょくしてください。'),
      server_error: K('通信エラーが発生しました。もう一度お試しください。', 'つうしんエラーがはっせいしました。もういちどおためしください。'),
    };
  }
  // "3分12秒" / "45秒" — used only for the room_full detail message below.
  function formatElapsed(ms) {
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    if (min <= 0) return K(`${sec}秒`, `${sec}びょう`);
    return K(`${min}分${sec}秒`, `${min}ふん${sec}びょう`);
  }
  // room_full carries the occupied room's state (names/streaks/match start
  // time) so we can tell a blocked joiner who's playing instead of just
  // "in use" — falls back to the plain message if state is missing.
  function roomFullDetailMessage(state) {
    if (!state || !state.p1Name || !state.p2Name || !state.p3Name) return null;
    const entries = [
      { name: state.p1Name, streak: state.p1Streak },
      { name: state.p2Name, streak: state.p2Streak },
      { name: state.p3Name, streak: state.p3Streak },
    ];
    let msg = `${entries.map((e) => e.name).join(K('さん、', 'さん、'))}${K('さんが対戦中', 'さんがたいせんちゅう')}`;
    const parts = [];
    if (state.matchStartedAt) {
      parts.push(`${K('経過', 'けいか')}${formatElapsed(Date.now() - state.matchStartedAt)}`);
    }
    const leader = entries.reduce((a, b) => (b.streak > a.streak ? b : a));
    if (leader.streak > 0) {
      parts.push(`${leader.name}${K('さんが', 'さんが')}${leader.streak}${K('連勝中', 'れんしょうちゅう')}`);
    }
    if (parts.length) msg += `（${parts.join('／')}）`;
    return msg;
  }
  function showOnlineError(code, res) {
    const detail = code === 'room_full' && res && roomFullDetailMessage(res.state);
    onlineErrorEl.textContent = detail || onlineErrorMessages()[code] || onlineErrorMessages().server_error;
  }
  function clearOnlineError() {
    onlineErrorEl.textContent = '';
  }

  function showOnlineMenu() {
    stopOnlinePolling();
    online = null;
    onlineWaitingEl.classList.add('hidden');
    hideJoinConfirm();
    onlineMenuEl.classList.remove('hidden');
    clearOnlineError();
  }

  function goToOnlineScreen() {
    titleScreen.classList.add('hidden');
    onlineScreenEl.classList.remove('hidden');
    showOnlineMenu();
  }

  onlineBtn.addEventListener('click', () => { SoundMgr.seClick(); goToOnlineScreen(); });
  document.getElementById('onlineBackBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    onlineScreenEl.classList.add('hidden');
    titleScreen.classList.remove('hidden');
  });
  document.getElementById('onlineCancelBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    // Waiting for a *new challenger* after a win is a different context than
    // waiting right after creating a room — cancelling there should abandon
    // the streak and go home, not drop into the create/join menu.
    if (online && online.awaitingRematch) goToTitle();
    else showOnlineMenu();
  });

  function inviteUrl(code) {
    const url = new URL(location.href);
    url.search = '?room=' + code;
    return url.toString();
  }

  document.getElementById('onlineCopyBtn').addEventListener('click', async (e) => {
    SoundMgr.seClick();
    const url = inviteUrl(online.code);
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(url);
      const original = btn.textContent;
      btn.textContent = 'コピーしました！';
      setTimeout(() => { btn.textContent = original; }, 1500);
    } catch (err) {
      window.prompt('このURLをコピーして送ってください:', url);
    }
  });

  async function createOnlineRoom() {
    clearOnlineError();
    const res = await apiPost('/room', { name: getPlayerName() });
    if (!res.ok) { showOnlineError(res.error); return; }
    online = { code: res.code, token: res.token, myPlayer: 1, rev: res.state.rev, emoteRev: res.state.emoteRev || 0, timer: null, busy: false, awaitingRematch: false, waitingPrefix: '', askedCpuFallback: false };
    onlineMenuEl.classList.add('hidden');
    onlineWaitingEl.classList.remove('hidden');
    onlineRoomCodeEl.textContent = res.code;
    updateWaitingText(1);
    pollForOpponent();
  }

  // "N/3人" — shown while a room waits for the other two seats to fill, both
  // right after creating a room and after a win (requestRematch), where
  // waitingPrefix carries the streak message in the latter case.
  function updateWaitingText(filled) {
    const prefix = (online && online.waitingPrefix) || '';
    document.getElementById('onlineWaitingText').textContent =
      `${prefix}${K(`対戦相手を待っています…（${filled}/3人）`, `たいせんあいてをまっています…（${filled}/3にん）`)}`;
  }

  // Used both right after creating a room (waiting for p2/p3) and after a
  // win, once the winner opts to stay (waiting for two new challengers to
  // fill the two slots the losers just vacated) — so it just watches for the
  // room going back to 'playing' (all three seats filled) rather than
  // checking any specific slot.
  function pollForOpponent() {
    online.timer = setInterval(async () => {
      if (!online) return;
      try {
        const res = await apiGet(`/room/${online.code}/state`);
        if (!res.ok) return;
        if (res.state.status === 'playing') {
          stopOnlinePolling();
          beginOnlineMatch(res.state);
          return;
        }
        const filled = [res.state.hasP1, res.state.hasP2, res.state.hasP3].filter(Boolean).length;
        updateWaitingText(filled);
        // Only the room's creator (myPlayer 1) gets asked, and only once per
        // wait — a friend has just filled the 2nd seat, so offer to skip
        // waiting for a 3rd human and let a CPU take the last seat instead.
        if (online.myPlayer === 1 && filled === 2 && !online.askedCpuFallback) {
          online.askedCpuFallback = true;
          stopOnlinePolling();
          promptCpuFallback();
        }
      } catch (e) { /* transient — try again next tick */ }
    }, ONLINE_POLL_MS);
  }

  function promptCpuFallback() {
    showResultOverlay({
      title: K('もう一人待ちますか？', 'もうひとりまちますか？'),
      message: K('あと1人揃えば対戦を始められます。待たずにCPUを3人目に迎えて始めますか？', 'あと1にんそろえばたいせんをはじめられます。またずにCPUを3にんめにむかえてはじめますか？'),
      buttons: [
        { label: K('待つ', 'まつ'), primary: true, onClick: pollForOpponent },
        { label: K('CPUと対戦する', 'CPUとたいせんする'), onClick: promptCpuDifficulty },
      ],
    });
  }

  // Server-side labels (CPU_DIFFICULTIES in line4-second-online.js) are baked
  // straight into the seat's display name ("CPU（ふつう）" etc.) once chosen —
  // this list only drives the picker itself.
  const CPU_DIFFICULTY_OPTIONS = [
    { key: 'easy', label: K('弱め', 'よわめ') },
    { key: 'normal', label: K('ふつう', 'ふつう') },
    { key: 'hard', label: K('強め', 'つよめ') },
  ];

  function promptCpuDifficulty() {
    showResultOverlay({
      title: K('CPUの強さを選んでください', 'CPUのつよさをえらんでください'),
      message: K('選んだ強さでCPUが3人目として参戦します。', 'えらんだつよさでCPUが3にんめとしてさんせんします。'),
      buttons: [
        ...CPU_DIFFICULTY_OPTIONS.map((opt) => ({
          label: opt.label,
          primary: opt.key === 'normal',
          onClick: () => fillRoomWithCpu(opt.key),
        })),
        { label: K('やっぱり待つ', 'やっぱりまつ'), onClick: pollForOpponent },
      ],
    });
  }

  async function fillRoomWithCpu(difficulty) {
    try {
      const res = await apiPost(`/room/${online.code}/fill-cpu`, { token: online.token, difficulty });
      if (!res.ok) { pollForOpponent(); return; } // e.g. a 3rd human beat us to it — just resume waiting normally
      beginOnlineMatch(res.state);
    } catch (e) {
      pollForOpponent();
    }
  }

  // Entering a code no longer joins immediately — it peeks at the room first
  // (GET /state, no side effects) so we can ask "play against 〇〇さん?"
  // before actually taking a seat. Both the manual join button and the
  // ?room=CODE invite-link auto-join (see the splash click handler above)
  // go through this same confirm step.
  let pendingJoinCode = null;
  let pendingJoinState = null;

  function renderJoinConfirmText() {
    const el = document.getElementById('onlineJoinConfirmText');
    if (!pendingJoinState) return;
    const state = pendingJoinState;
    const names = [
      state.hasP1 && state.p1Name,
      state.hasP2 && state.p2Name,
      state.hasP3 && state.p3Name,
    ].filter(Boolean);
    el.textContent = names.length
      ? `${names.join(K('さん、', 'さん、'))}${K('さんと対戦します。開始しますか？', 'さんとたいせんします。かいししますか？')}`
      : K('この部屋に参加します。開始しますか？', 'このへやにさんかします。かいししますか？');
  }

  function showJoinConfirm(code, state) {
    pendingJoinCode = code;
    pendingJoinState = state;
    renderJoinConfirmText();
    document.getElementById('onlineJoinNameInput').value = getPlayerName();
    onlineMenuEl.classList.add('hidden');
    document.getElementById('onlineJoinConfirm').classList.remove('hidden');
  }

  function hideJoinConfirm() {
    pendingJoinCode = null;
    pendingJoinState = null;
    document.getElementById('onlineJoinConfirm').classList.add('hidden');
  }

  async function joinOnlineRoom(code) {
    clearOnlineError();
    if (!code) { showOnlineError('invalid_body'); return; }
    const res = await apiGet(`/room/${code}/state`);
    if (!res.ok) { showOnlineError(res.error); return; }
    if (res.state.hasP1 && res.state.hasP2 && res.state.hasP3) {
      onlineErrorEl.textContent = roomFullDetailMessage(res.state) || onlineErrorMessages().room_full;
      return;
    }
    showJoinConfirm(code, res.state);
  }

  document.getElementById('onlineJoinConfirmBtn').addEventListener('click', async () => {
    SoundMgr.seClick();
    const code = pendingJoinCode;
    // The name field here IS playerNameInput's value everywhere else reads
    // from (getPlayerName()) — write-through to storage so a change made
    // right before this match sticks for later matches too.
    playerNameInput.value = document.getElementById('onlineJoinNameInput').value;
    safeStorageSet(NAME_STORAGE_KEY, getPlayerName());
    hideJoinConfirm();
    const res = await apiPost(`/room/${code}/join`, { name: getPlayerName() });
    if (!res.ok) {
      onlineMenuEl.classList.remove('hidden');
      showOnlineError(res.error, res);
      return;
    }
    online = { code, token: res.token, myPlayer: res.player, rev: res.state.rev, emoteRev: res.state.emoteRev || 0, timer: null, busy: false, awaitingRematch: false, waitingPrefix: '', askedCpuFallback: false };
    if (res.state.status === 'playing') {
      beginOnlineMatch(res.state);
    } else {
      // Joined but a 3rd player hasn't shown up yet — drop into the same
      // waiting screen createOnlineRoom() uses, watching for the room to
      // fill the rest of the way.
      onlineMenuEl.classList.add('hidden');
      onlineWaitingEl.classList.remove('hidden');
      onlineRoomCodeEl.textContent = code;
      const filled = [res.state.hasP1, res.state.hasP2, res.state.hasP3].filter(Boolean).length;
      updateWaitingText(filled);
      pollForOpponent();
    }
  });
  document.getElementById('onlineJoinCancelBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    hideJoinConfirm();
    onlineMenuEl.classList.remove('hidden');
  });

  // "Winner stays on": called from the win result overlay. Vacates BOTH
  // losers' slots server-side and reuses the same waiting-room UI/polling as
  // a freshly created room while two new challengers join via the same code.
  async function requestRematch() {
    online.postGameDeadline = null;
    restoreEmoteBarPosition();
    document.getElementById('onlineEmoteBar').classList.remove('postgame');
    document.getElementById('onlineEmoteBar').classList.add('hidden');
    document.getElementById('resultNote').textContent = '';
    try {
      const res = await apiPost(`/room/${online.code}/rematch`, { token: online.token });
      if (!res.ok) { goToTitle(); return; }
      online.rev = res.state.rev;
      online.awaitingRematch = true;
      const myStreak = online.myPlayer === 1 ? res.state.p1Streak : online.myPlayer === 2 ? res.state.p2Streak : res.state.p3Streak;
      online.waitingPrefix = `${myStreak}${K('連勝中！', 'れんしょうちゅう！')}`;
      online.askedCpuFallback = false;
      gameScreen.classList.add('hidden');
      onlineScreenEl.classList.remove('hidden');
      onlineMenuEl.classList.add('hidden');
      onlineWaitingEl.classList.remove('hidden');
      onlineRoomCodeEl.textContent = online.code;
      updateWaitingText(1);
      pollForOpponent();
    } catch (e) {
      goToTitle();
    }
  }

  document.getElementById('onlineCreateBtn').addEventListener('click', () => { SoundMgr.seClick(); createOnlineRoom(); });
  document.getElementById('onlineJoinBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    joinOnlineRoom(onlineJoinCodeEl.value.trim().toUpperCase());
  });
  onlineJoinCodeEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('onlineJoinBtn').click();
  });

  function stopOnlinePolling() {
    if (online && online.timer) { clearInterval(online.timer); online.timer = null; }
  }

  function startOnlinePolling() {
    stopOnlinePolling();
    online.timer = setInterval(async () => {
      if (!online || online.busy) return;
      try {
        const res = await apiGet(`/room/${online.code}/state`);
        if (!res.ok) return;
        // Emote check rides on this same poll — no separate request needed.
        if (res.state.emoteRev !== online.emoteRev) {
          online.emoteRev = res.state.emoteRev;
          if (res.state.emoteBy && res.state.emoteBy !== online.myPlayer) {
            showIncomingEmote(res.state.emote);
          }
        }
        if (res.state.rev !== online.rev) applyOnlineState(res.state);
      } catch (e) { /* transient — try again next tick */ }
    }, ONLINE_POLL_MS);
  }

  const ONLINE_EMOTE_COOLDOWN_MS = 1500;
  let onlineEmoteCooldownUntil = 0;
  function flyEmoteFromButton(btn, iconId) {
    const rect = btn.getBoundingClientRect();
    const fly = document.createElement('img');
    fly.src = `emotes/${iconId}.webp`;
    fly.alt = '';
    fly.className = 'emote-fly';
    fly.style.left = `${rect.left + rect.width / 2}px`;
    fly.style.top = `${rect.top + rect.height / 2}px`;
    document.body.appendChild(fly);
    requestAnimationFrame(() => requestAnimationFrame(() => fly.classList.add('rise')));
    fly.addEventListener('transitionend', () => fly.remove());
    setTimeout(() => fly.remove(), 1400); // safety net if transitionend never fires
  }

  async function sendOnlineEmote(emoji, btn) {
    if (!online || mode !== 'online') return;
    const now = Date.now();
    if (now < onlineEmoteCooldownUntil) return;
    onlineEmoteCooldownUntil = now + ONLINE_EMOTE_COOLDOWN_MS;
    if (btn) flyEmoteFromButton(btn, emoji);
    try {
      const res = await apiPost(`/room/${online.code}/emote`, { token: online.token, emote: emoji });
      if (res.ok) online.emoteRev = res.state.emoteRev; // it's our own — don't pop it up for ourselves
    } catch (e) { /* not critical — just drop it */ }
  }

  function showIncomingEmote(iconId) {
    const el = document.getElementById('incomingEmote');
    document.getElementById('incomingEmoteIcon').src = `emotes/${iconId}.webp`;
    SoundMgr.seClick();
    el.classList.remove('show');
    void el.offsetWidth; // restart the pop animation even if one is already mid-flight
    el.classList.add('show');
    clearTimeout(showIncomingEmote._t);
    showIncomingEmote._t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // 25-icon picker: flicks/drags to scroll (native touch scrolling handles
  // that on its own), tap an icon to send. Only mouse pointers get a custom
  // click-and-drag pan, since a mouse has no native drag-to-scroll — touch
  // and pen are left to the browser's own momentum scrolling untouched, and
  // mobile browsers already suppress a click when a touch ends up scrolling.
  (function setupEmoteScroller() {
    const scroller = document.getElementById('emoteScroller');
    let isDown = false;
    let dragged = false;
    let startX = 0;
    let startScrollLeft = 0;

    scroller.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse') return;
      isDown = true;
      dragged = false;
      startX = e.clientX;
      startScrollLeft = scroller.scrollLeft;
      scroller.classList.add('dragging');
    });
    scroller.addEventListener('pointermove', (e) => {
      if (!isDown || e.pointerType !== 'mouse') return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 6) dragged = true;
      scroller.scrollLeft = startScrollLeft - dx;
    });
    function endDrag(e) {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      isDown = false;
      scroller.classList.remove('dragging');
    }
    scroller.addEventListener('pointerup', endDrag);
    scroller.addEventListener('pointercancel', endDrag);
    scroller.addEventListener('pointerleave', endDrag);

    scroller.addEventListener('click', (e) => {
      if (dragged) { dragged = false; return; } // that was a drag, not a tap
      const btn = e.target.closest('.emote-icon-btn');
      if (!btn) return;
      SoundMgr.seClick();
      sendOnlineEmote(btn.dataset.emote, btn);
    });
  })();

  function beginOnlineMatch(state) {
    mode = 'online';
    online.awaitingRematch = false;
    online.postGameDeadline = null;
    online.wonLastMatch = false;
    online.names = { 1: state.p1Name, 2: state.p2Name, 3: state.p3Name };
    online.turnStartedAt = state.turnStartedAt;
    onlineScreenEl.classList.add('hidden');
    titleScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    document.getElementById('speechBubbleRow').classList.add('hidden');
    document.getElementById('score').classList.add('hidden');
    resetBtn.classList.add('hidden');
    restoreEmoteBarPosition();
    document.getElementById('onlineEmoteBar').classList.remove('hidden', 'postgame');
    document.getElementById('resultNote').textContent = '';
    setCharBackground(null);
    SoundMgr.playTrack('game');
    const streakNotes = [1, 2, 3]
      .filter((p) => p !== online.myPlayer && state[`p${p}Streak`] > 0)
      .map((p) => `${online.names[p]}${K('さんが', 'さんが')}${state[`p${p}Streak`]}${K('連勝中', 'れんしょうちゅう')}`);
    modeLabelEl.textContent = `${K('オンライン対戦', 'オンラインたいせん')}（${K('部屋', 'へや')}: ${online.code}） ／ ${K('あなたは', 'あなたは')}${onlineColorLabel(online.myPlayer)}`
      + (streakNotes.length ? `（${streakNotes.join('／')}）` : '');

    grid = state.grid;
    gameOver = false;
    cellEls = [];
    buildBoard();
    hideBubble();
    updateStatus(K('先攻・後攻を決めています…', 'せんこう・こうこうをきめています…'));
    boardWrap.classList.add('locked');
    online.rev = state.rev;
    online.emoteRev = state.emoteRev || 0;
    // The server may already have played moves before this client got here —
    // e.g. a CPU seat that won the coin flip plays its opening move inside
    // the same fill-cpu response, and a 3rd player joining gets the room's
    // current state — so the board and whose turn it is come from `state`,
    // not from the coin-toss result (which is just the announcement of who
    // WAS first). Previously currentPlayer was set to the starter, so a CPU
    // opening left the client thinking it was still the CPU's turn (no
    // clicks accepted, and an invisible piece) until the server's turn
    // timeout skipped someone 60s later.
    decideStartingPlayer(() => {
      currentPlayer = state.currentPlayer;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const p = grid[r][c];
          if (p !== 0) {
            cellEls[r][c].classList.add(p === 1 ? 'p1' : p === 2 ? 'p2' : 'p3', 'drop');
            SoundMgr.seDrop();
          }
        }
      }
      boardWrap.classList.remove('locked');
      updateStatus();
      startOnlinePolling();
    }, state.startingPlayer);
  }

  async function submitOnlineMove(col) {
    if (!online || online.busy || gameOver) return;
    if (currentPlayer !== online.myPlayer) return;
    online.busy = true;
    boardWrap.classList.add('locked');
    try {
      const res = await apiPost(`/room/${online.code}/move`, { token: online.token, col });
      if (res.ok) {
        applyOnlineState(res.state);
      } else {
        boardWrap.classList.remove('locked');
      }
    } catch (e) {
      boardWrap.classList.remove('locked');
    }
    online.busy = false;
  }

  // Renders whatever the server says the room looks like now — used both for
  // the response to our own move and for a poll that picked up the opponent's.
  function applyOnlineState(state) {
    if (!online || state.rev === online.rev) return;
    // We're sitting on the post-game result screen and the room just went
    // back to "not game over" under us — that's not a new match starting,
    // it's the room having been vacated (the opponent left, or it expired
    // server-side per FINISHED_ROOM_GRACE_MS). Without this, the code below
    // would silently redraw an empty board underneath our still-visible
    // result overlay instead of just sending us home too.
    if (online.postGameDeadline && !state.gameOver) {
      showRoomClosedAfterMatch(state);
      return;
    }
    online.rev = state.rev;
    online.turnStartedAt = state.turnStartedAt;

    // Find the cells that changed since our local copy and animate them the
    // same way a local drop does, then adopt the server grid as-is. There can
    // be more than one: the server plays a CPU seat's reply inside the same
    // response as the move that triggered it, so a single update can hold
    // "your move, then the CPU's". Those are dropped one after another
    // (ordered by turn order starting from whoever was up before this
    // update) instead of all at once, so the CPU visibly takes its turn
    // rather than appearing to move simultaneously with you.
    const changes = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === 0 && state.grid[r][c] !== 0) changes.push({ r, c, player: state.grid[r][c] });
      }
    }
    const turnOffset = (p) => (p - currentPlayer + 3) % 3;
    changes.sort((a, b) => turnOffset(a.player) - turnOffset(b.player));
    const thisOnline = online;
    const dropCell = ({ r, c, player }) => {
      if (online !== thisOnline) return; // left/changed rooms in the meantime
      cellEls[r][c].classList.add(player === 1 ? 'p1' : player === 2 ? 'p2' : 'p3', 'drop');
      SoundMgr.seDrop();
    };
    changes.forEach((ch, i) => {
      if (i === 0) dropCell(ch);
      else setTimeout(() => dropCell(ch), i * ONLINE_REPLY_STEP_MS);
    });
    const finalizeDelay = Math.max(0, (changes.length - 1) * ONLINE_REPLY_STEP_MS);
    if (finalizeDelay > 0) {
      boardWrap.classList.add('locked');
      updateStatus(`${escapeHtml(onlineNameFor(changes[1].player))}${K('が考え中...', 'がかんがえちゅう...')}`);
    }
    grid = state.grid;
    currentPlayer = state.currentPlayer;
    gameOver = state.gameOver;

    // Everything from here (win highlight, result overlay, status, unlocking
    // the board) waits for the last queued drop so it never runs ahead of
    // what's actually on screen.
    const finalize = () => {
      if (online !== thisOnline) return;
      finishOnlineUpdate(state);
    };
    if (finalizeDelay > 0) setTimeout(finalize, finalizeDelay); else finalize();
  }

  const ONLINE_REPLY_STEP_MS = 700;

  // The winner left (room emptied) or chose to stay for the next challengers
  // (room reset, only their seat kept) while we were still on the post-game
  // screen. Instead of silently dropping us to the title mid-read, say what
  // happened and let the player leave when they're ready.
  function showRoomClosedAfterMatch(state) {
    stopOnlinePolling();
    online.postGameDeadline = null;
    online.wonLastMatch = false; // nothing for the server to free — it already reset
    const stayer = [1, 2, 3].find((p) => state[`hasP${p}`]);
    const stayerName = stayer ? (online.names && online.names[stayer]) || '' : '';
    const message = stayer
      ? K(`${stayerName}さんは次の挑戦者を待つことにしました。\nこの部屋での対戦は終了です。`, `${stayerName}さんはつぎのちょうせんしゃをまつことにしました。\nこのへやでのたいせんはしゅうりょうです。`)
      : K('勝者が退室したため、部屋は閉じられました。', 'しょうしゃがたいしゅつしたため、へやはとじられました。');
    showResultOverlay({
      title: K('対戦終了', 'たいせんしゅうりょう'),
      message,
      buttons: [{ label: K('退室する', 'たいしゅつする'), primary: true, onClick: leavePostGameRoom }],
    });
  }

  function finishOnlineUpdate(state) {
    if (state.gameOver) {
      // Polling stays on through the post-game grace window (see
      // tickPostGameCountdown/leavePostGameRoom below) — opponent emotes
      // still arrive via the same poll, and this early-return guard at the
      // top of applyOnlineState() makes re-entrant calls on the same rev a
      // no-op, so it's safe to keep ticking.
      if (state.winLine) state.winLine.forEach(([r, c]) => cellEls[r][c].classList.add('win'));
      const iWon = state.winner === String(online.myPlayer);
      online.wonLastMatch = iWon; // read by leavePostGameRoom() to notify the server
      const isDraw = state.winner === 'draw';
      const winnerLabel = isDraw ? null : (state.winner === '1' ? player1Label() : state.winner === '2' ? player2Label() : player3Label());
      if (isDraw) {
        updateStatus(K('引き分けです！', 'ひきわけです！'));
        SoundMgr.seDraw();
      } else {
        updateStatus(`🎉 ${escapeHtml(winnerLabel)}${K('の勝利！', 'のしょうり！')}`);
        if (iWon) SoundMgr.seWin(); else SoundMgr.seLose();
      }
      const myStreak = online.myPlayer === 1 ? state.p1Streak : online.myPlayer === 2 ? state.p2Streak : state.p3Streak;
      setTimeout(() => {
        if (!online) return;
        // Keep the emote strip up (re-pinned above the modal backdrop) so
        // both players can send a quick thanks/gg — see req: 30秒間スタンプ.
        pinEmoteBarForPostGame();
        document.getElementById('onlineEmoteBar').classList.add('postgame');
        online.postGameDeadline = Date.now() + POST_GAME_WINDOW_MS;
        if (iWon) {
          showResultOverlay({
            title: K('勝利！', 'しょうり！'),
            message: `${K('相手に勝利しました！', 'あいてにしょうりしました！')}\n${myStreak}${K('連勝中！', 'れんしょうちゅう！')}`,
            buttons: [
              { label: K('次の挑戦者を待つ', 'つぎのちょうせんしゃをまつ'), primary: true, onClick: requestRematch },
              { label: K('退室する', 'たいしゅつする'), onClick: leavePostGameRoom },
            ],
          });
        } else {
          const loseMessage = isDraw
            ? K('オンライン対戦は引き分けに終わりました。', 'オンラインたいせんはひきわけにおわりました。')
            : `${winnerLabel}${K('さんに敗れました……', 'さんにやぶれました……')}`;
          showResultOverlay({
            title: isDraw ? K('引き分け', 'ひきわけ') : K('敗北……', 'はいぼく……'),
            message: loseMessage,
            buttons: [{ label: K('退室する', 'たいしゅつする'), primary: true, onClick: leavePostGameRoom }],
          });
        }
      }, 1200);
      return;
    }

    boardWrap.classList.remove('locked');
    updateStatus();
  }

  // ---------- Hidden debug menu: double-click the "ロ" in the title ----------
  document.getElementById('debugTrigger').addEventListener('dblclick', (e) => {
    e.preventDefault();
    const overlay = document.getElementById('debugLevelOverlay');
    const actions = document.getElementById('debugLevelActions');
    actions.innerHTML = '';
    // STAGES (not CHARACTERS) — this menu jumps straight to any of the 6
    // two-opponent stages. Rolled once here just for the button label;
    // clicking re-rolls (stageOpponents = stageFn()) so stage 3's random
    // LV2 pick isn't locked to whatever the label happened to show.
    STAGES.forEach((stageFn, idx) => {
      const [a, b] = stageFn();
      const btn = document.createElement('button');
      btn.textContent = `LV.${idx + 1} ${a.name} & ${b.name}`;
      if (idx > 0) btn.classList.add('secondary');
      btn.addEventListener('click', () => {
        SoundMgr.seClick();
        overlay.classList.add('hidden');
        ladderIndex = idx;
        stageOpponents = stageFn();
        startGame('cpu');
      });
      actions.appendChild(btn);
    });
    const endingBtn = document.createElement('button');
    endingBtn.textContent = 'エンディング';
    endingBtn.classList.add('secondary');
    endingBtn.addEventListener('click', () => {
      SoundMgr.seClick();
      overlay.classList.add('hidden');
      showEndingScreen();
    });
    actions.appendChild(endingBtn);

    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'キャンセル';
    cancelBtn.classList.add('secondary');
    cancelBtn.addEventListener('click', () => overlay.classList.add('hidden'));
    actions.appendChild(cancelBtn);
    overlay.classList.remove('hidden');
  });

  function startGame(selectedMode) {
    mode = selectedMode;
    titleScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    resetBtn.classList.remove('hidden');
    // The win tally is only meaningful for local 対人戦 — in the CPU ladder a
    // match outcome drives stage progression instead, so it's just clutter
    // (and eats vertical space that pushes the speech bubble up under the
    // audio buttons).
    document.getElementById('score').classList.toggle('hidden', selectedMode === 'cpu');
    const speechBubbleEl = document.getElementById('speechBubbleRow');
    if (mode === 'cpu' && stageOpponents[0] && stageOpponents[1]) {
      const stageNum = ladderIndex + 1;
      const [opp2, opp3] = stageOpponents;
      SoundMgr.playLevelTrack(stageNum);
      modeLabelEl.innerHTML = `
        <img class="opponent-avatar-icon" src="${opp2.img}" alt="" style="object-position: ${opp2.avatarPosition || 'left top'};" onerror="this.style.display='none'">
        <img class="opponent-avatar-icon opponent-avatar-icon--mirrored" src="${opp3.img}" alt="" style="object-position: ${opp3.avatarPosition || 'left top'};" onerror="this.style.display='none'">
        LV.${stageNum}/6 ${escapeHtml(opp2.name)} & ${escapeHtml(opp3.name)} ／ ${K('あなたは赤', 'あなたはあか')}`;
      setCharBackground(opp2, opp3);
      speechBubbleEl.classList.remove('hidden');
    } else {
      SoundMgr.playTrack('game');
      modeLabelEl.textContent = K('対人戦モード', 'たいじんせんモード');
      setCharBackground(null);
      speechBubbleEl.classList.add('hidden');
    }
    scores = { 1: 0, 2: 0, 3: 0 };
    updateScoreboard();
    initGame();
  }

  // Returns the inline style attribute value for one character's art —
  // --avatar-pos feeds the mobile cover-crop media query (see CSS); the
  // desktop view never crops so it ignores the custom property entirely.
  function avatarStyle(ch) {
    return `--avatar-pos: ${(ch && ch.avatarPosition) || 'left top'};`;
  }

  // Shows both CPU opponents flanking the board (leftCh/rightCh) for the
  // rest of the match — unlike the old 1-opponent version, this is no longer
  // a per-turn "spotlight whoever's thinking" swap, it's just set once when
  // the stage starts. Call with no arguments (or leftCh falsy) to hide both,
  // e.g. leaving CPU mode.
  function setCharBackground(leftCh, rightCh) {
    const wrap = document.getElementById('charBgWrap');
    const overlay = document.getElementById('charBgOverlay');
    const leftImg = document.getElementById('charBgImgLeft');
    const rightImg = document.getElementById('charBgImgRight');
    if (!leftCh) {
      wrap.classList.remove('show');
      overlay.classList.remove('show');
      return;
    }
    let loaded = 0;
    const onOneLoaded = () => { if (++loaded >= 2) { wrap.classList.add('show'); overlay.classList.add('show'); } };
    const onOneErrored = () => { wrap.classList.remove('show'); overlay.classList.remove('show'); };
    leftImg.onload = onOneLoaded;
    leftImg.onerror = onOneErrored;
    leftImg.setAttribute('style', avatarStyle(leftCh));
    leftImg.src = leftCh.img;
    rightImg.onload = onOneLoaded;
    rightImg.onerror = onOneErrored;
    rightImg.setAttribute('style', avatarStyle(rightCh));
    rightImg.src = rightCh.img;
  }
