  updateSfxMuteUI();
  updateBgmMuteUI();

  // Audio Adjust dialog — lets a player compensate for their own device's
  // audio output latency (worst on Bluetooth headphones/speakers, which can
  // run well over 100ms behind the logic clock) by ear: play a steady click
  // track and nudge AUDIO_OFFSET until the flash lines up with what they
  // actually hear, not with when the browser thinks it just started the
  // sound. Reuses the already-preloaded tempo120 debug click track (0.0s
  // onset, exactly 120 BPM) rather than the real BGM tracks, since it needs
  // an unambiguous, always-available click regardless of level/BGM choice.
  var btnAudioAdjust = document.getElementById('btnAudioAdjust');
  var audioAdjustModal = document.getElementById('audioAdjustModal');
  var audioAdjustFlash = document.getElementById('audioAdjustFlash');
  var audioAdjustFlashInner = document.getElementById('audioAdjustFlashInner');
  var audioAdjustPlay = document.getElementById('audioAdjustPlay');
  var audioAdjustMinus = document.getElementById('audioAdjustMinus');
  var audioAdjustPlus = document.getElementById('audioAdjustPlus');
  var audioAdjustReset = document.getElementById('audioAdjustReset');
  var audioAdjustValue = document.getElementById('audioAdjustValue');
  var audioAdjustClose = document.getElementById('audioAdjustClose');
  var audioAdjustTapCalibrate = document.getElementById('audioAdjustTapCalibrate');
  var audioAdjustTapStatus = document.getElementById('audioAdjustTapStatus');
  var TEST_CLICK_BPM = 120;
  var testClickSource = null, testClickStartCtxTime = null, testClickLastBeatRaw = -1, testClickLastBeatAdj = -1;
  // ms-level nudging (the original -10ms/+10ms buttons) asks a beginner to
  // reason about a number with no physical meaning to them. Tapping along
  // with the click instead measures their own reaction directly: each tap's
  // offset from the *nominal* (zero-latency) beat time it landed nearest to
  // is a real sample of "how late the sound reaches this player, on this
  // device, right now" — averaging a handful of those cancels out ordinary
  // human tap jitter far better than one careful-but-still-imprecise manual
  // nudge ever could.
  var TAP_CALIBRATE_SAMPLES = 5;
  var tapSamples = [];
  function computeTapDelta(){
    var beatDur = 60/TEST_CLICK_BPM;
    var raw = (audioCtx.currentTime - testClickStartCtxTime) % beatDur;
    if (raw > beatDur/2) raw -= beatDur;
    return raw;
  }
  function updateAudioAdjustLabel(){
    audioAdjustValue.textContent = (AUDIO_OFFSET>=0?'+':'') + Math.round(AUDIO_OFFSET*1000) + 'ms';
  }
  function setAudioOffset(v){
    AUDIO_OFFSET = Math.max(-0.5, Math.min(0.5, v));
    try{ localStorage.setItem(AUDIO_OFFSET_KEY, String(AUDIO_OFFSET)); }catch(e){}
    updateAudioAdjustLabel();
  }
  function stopTestClick(){
    if (testClickSource){ try{ testClickSource.stop(); }catch(e){} testClickSource = null; }
    testClickStartCtxTime = null;
    testClickLastBeatRaw = -1;
    testClickLastBeatAdj = -1;
    audioAdjustPlay.textContent = 'Play Click';
    tapSamples = [];
    audioAdjustTapStatus.textContent = 'クリックに合わせてタップしてください';
  }
  function startTestClick(){
    var buf = bgmBufferCache.tempo120;
    if (!audioCtx || !buf) return;
    resumeAudioCtx();
    stopTestClick();
    testClickSource = audioCtx.createBufferSource();
    testClickSource.buffer = buf;
    testClickSource.loop = true;
    testClickSource.connect(bgmGain);
    var when = audioCtx.currentTime + 0.05;
    testClickSource.start(when, 0);
    testClickStartCtxTime = when;
    audioAdjustPlay.textContent = 'Stop Click';
  }
  function audioAdjustTick(){
    if (audioAdjustModal.hidden) return;
    if (testClickStartCtxTime !== null){
      var beatDur = 60/TEST_CLICK_BPM;
      // Two independent pulses on purpose: a lone flash shifting by a
      // constant offset is invisible to the eye (a shifted repeating pulse
      // looks identical to an unshifted one — there's nothing to compare it
      // against). The outer ring always pulses on the raw, un-offset clock
      // as a fixed reference; the inner dot pulses on the AUDIO_OFFSET-
      // compensated clock. With offset 0 they land together; as the offset
      // grows the gap between ring and dot becomes directly visible.
      var tRaw = audioCtx.currentTime - testClickStartCtxTime;
      if (tRaw >= 0){
        var beatIndexRaw = Math.floor(tRaw/beatDur);
        if (beatIndexRaw !== testClickLastBeatRaw){
          testClickLastBeatRaw = beatIndexRaw;
          audioAdjustFlash.classList.add('flash-raw');
          setTimeout(function(){ audioAdjustFlash.classList.remove('flash-raw'); }, 90);
        }
      }
      var tAdj = audioCtx.currentTime - testClickStartCtxTime - AUDIO_OFFSET;
      if (tAdj >= 0){
        var beatIndexAdj = Math.floor(tAdj/beatDur);
        if (beatIndexAdj !== testClickLastBeatAdj){
          testClickLastBeatAdj = beatIndexAdj;
          audioAdjustFlashInner.classList.add('flash');
          setTimeout(function(){ audioAdjustFlashInner.classList.remove('flash'); }, 90);
        }
      }
    }
    requestAnimationFrame(audioAdjustTick);
  }
  audioAdjustPlay.addEventListener('click', function(){
    if (testClickSource) stopTestClick(); else startTestClick();
  });
  audioAdjustMinus.addEventListener('click', function(){ setAudioOffset(AUDIO_OFFSET - 0.01); });
  audioAdjustPlus.addEventListener('click', function(){ setAudioOffset(AUDIO_OFFSET + 0.01); });
  // A tap-calibrated offset is some arbitrary measured value (e.g. +37ms) —
  // nudging back to exactly 0 with ±10ms steps is tedious and rarely lands
  // exactly on it anyway. One button, straight to no compensation at all.
  audioAdjustReset.addEventListener('click', function(){
    setAudioOffset(0);
    audioAdjustTapStatus.textContent = 'クリックに合わせてタップしてください';
  });
  audioAdjustTapCalibrate.addEventListener('click', function(){
    if (!testClickSource){
      startTestClick();
      tapSamples = [];
      audioAdjustTapStatus.textContent = 'クリックに合わせてもう一度タップしてください';
      return;
    }
    tapSamples.push(computeTapDelta());
    if (tapSamples.length < TAP_CALIBRATE_SAMPLES){
      audioAdjustTapStatus.textContent = 'タップ ' + tapSamples.length + '/' + TAP_CALIBRATE_SAMPLES;
    } else {
      var avg = tapSamples.reduce(function(a,b){ return a+b; }, 0) / tapSamples.length;
      setAudioOffset(avg);
      audioAdjustTapStatus.textContent = '調整完了: ' + (avg>=0?'+':'') + Math.round(avg*1000) + 'ms';
      tapSamples = [];
    }
  });
  // stopPropagation: btnAudioAdjust now lives inside #cardTitle, itself
  // inside #stageWrap — without this, opening the dialog from the title
  // screen would also bubble up into stageActivate() and immediately
  // beginRun() underneath it (same class of issue as the level-select
  // buttons' own stopPropagation, just discovered again once this button
  // moved from the below-canvas controls-row onto the title card itself).
  btnAudioAdjust.addEventListener('click', function(e){
    e.stopPropagation();

    requestAnimationFrame(audioAdjustTick);
  });
  audioAdjustClose.addEventListener('click', function(){
    stopTestClick();
    audioAdjustModal.hidden = true;
  });
  updateAudioAdjustLabel();

  stageWrap.addEventListener('click', stageActivate);

  if (!isCoarse){
    stageWrap.addEventListener('mousemove', function(e){
      var r = stageWrap.getBoundingClientRect();
      mouseNX = ((e.clientX - r.left)/r.width)*2 - 1;
      mouseNY = ((e.clientY - r.top)/r.height)*2 - 1;
      yawTarget = -mouseNX * MAX_YAW;
      pitchTarget = -mouseNY * MAX_PITCH;
    });
  } else {
    var lookTouchId = null, lastTX = 0, lastTY = 0;
    var TOUCH_SENS = 2.6;
    stageWrap.addEventListener('touchstart', function(e){
      if (lookTouchId === null && e.changedTouches.length){
        var touch = e.changedTouches[0];
        // Ignore touches landing on an actual on-screen control (Left/
        // Right/Sway/Eat, the level-select buttons, etc.) — all of them
        // live inside #stageWrap, and without this check every ordinary
        // gameplay tap also gets grabbed as a look-around drag. The tiny
        // press-to-release finger jitter each real tap has (a couple of
        // pixels even for a stationary-feeling press) then nudges yaw a
        // little further — individually invisible, but hundreds of taps
        // over one run compound into a real drift toward the yaw clamp,
        // eventually pushing the player model past the edge of a portrait
        // frame's narrower FOV. Confirmed as the cause of the "player keeps
        // sliding left" report.
        if (touch.target && touch.target.closest && touch.target.closest('button, kbd, .level-select')) return;
        lookTouchId = touch.identifier;
        lastTX = touch.clientX; lastTY = touch.clientY;
      }
    }, {passive:true});
    stageWrap.addEventListener('touchmove', function(e){
      for (var i=0;i<e.changedTouches.length;i++){
        var touch = e.changedTouches[i];
        if (touch.identifier === lookTouchId){
          var r = stageWrap.getBoundingClientRect();
          var dx = touch.clientX - lastTX, dy = touch.clientY - lastTY;
          lastTX = touch.clientX; lastTY = touch.clientY;
          yawTarget = Math.max(-MAX_YAW, Math.min(MAX_YAW, yawTarget - (dx/r.width)*TOUCH_SENS));
          pitchTarget = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, pitchTarget - (dy/r.height)*TOUCH_SENS));
        }
      }
    }, {passive:true});
    var releaseLookTouch = function(e){
      for (var i=0;i<e.changedTouches.length;i++){
        if (e.changedTouches[i].identifier === lookTouchId) lookTouchId = null;
      }
    };

  }

  function resize(){
    var r = stageWrap.getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / r.height;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var handWorldPos = new THREE.Vector3();
  var playerWorldPos = new THREE.Vector3();
  var lastT = performance.now();

  function frame(now){
    var dt = Math.max(0, Math.min(0.05, (now-lastT)/1000));
    lastT = now;
    var time = now/1000;

    // The glowing eyes are a child of the static `bear` group, but the actual
    // head moves with the animation — reparented to the scene root on load,
    // so this just keeps them riding the real head bone every frame instead
    // of sitting fixed at the bear's rest pose.
    if (headBone) headBone.getWorldPosition(eyeGroup.position);

    var t = gap/GAP_MAX;

    if (state === 'playing'){
      elapsed += dt;
      if (missReactionTimer > 0) missReactionTimer = Math.max(0, missReactionTimer - dt);
      // playerD itself only ever moves in handleLane()'s success branch (a
      // fixed amount per hit, plus a bonus per completed pass) and in the
      // 'knockback' branch below — never here, and never downward on a miss
      // or the passive WALK_SPEED decay. Moving a camera closer to whatever
      // is in front of it always looks like "I walked forward", no matter
      // the narrative intent, so the only way for a miss to read purely as
      // "the bear closed in" is for the camera to really not move at all.
      // Re-deriving player.position/rotation from playerD is done once,
      // unconditionally, near the bottom of frame() (alongside the sky/
      // ground/terrain sync) rather than here, since 'knockback' needs the
      // exact same derivation every frame too.

      // Metronome: beats alternate L/R forever, each with a fixed-width window
      // (tighter at high BPM so windows never overlap) centered on its exact
      // time. handleLane() above is what actually judges a press against
      // `beatOpen`/`currentLane`/`beatHit`; this block only owns the clock and
      // the on-screen highlight. Compared against beatClockNow() (the audio
      // hardware clock), not `elapsed` (a plain frame-accumulated JS clock)
      // — see beatClockNow()'s own comment for why that distinction is what
      // actually keeps this in sync with the music instead of slowly (or
      // not so slowly) drifting from it. AUDIO_OFFSET is subtracted right
      // here, and only here — it makes beatNow read as running behind the
      // raw schedule by however much the player's own device delays actual
      // playback, so the window opens/closes that much later in real time,
      // matching when they'll actually hear it rather than when the
      // hardware clock says the sound was handed off.
      var beatNow = beatClockNow() - AUDIO_OFFSET;
      beatDur = 60/BPM;
      var hitWindow = Math.min(HIT_WINDOW, beatDur*0.3);
      if (!beatOpen && beatNow >= nextBeatTime - hitWindow){
        beatOpen = true;
        beatHit = false;
        if (leadInBeats > 0){
          countdownLabel.textContent = String(leadInBeats);
          countdownLabel.style.opacity = 1;
        }
      }
      if (beatOpen && beatNow >= nextBeatTime + hitWindow){
        beatOpen = false;
        // The window closed with no press at all — same consequence as
        // pressing the wrong lane, otherwise standing still was strictly
        // safer than trying and missing. Not during the "3,2,1" lead-in,
        // though — those beats are free, matching the lane buttons staying
        // unlit for them just below.
        if (!beatHit && leadInBeats <= 0) applyMissPenalty(currentLane);
        nextBeatTime += beatDur;
        beatParity = !beatParity;
        currentLane = beatParity ? 'R' : 'L';
        if (leadInBeats > 0){
          leadInBeats -= 1;
          if (leadInBeats <= 0){
            countdownLabel.style.opacity = 0;
            // The toggle just above (beatParity flip + currentLane assign)
            // already ran for this beat close, same as every other one —
            // over exactly 3 lead-in beats that's an odd number of
            // toggles, so without this it lands on 'R' every single time,
            // fresh run or knockback recovery alike, even though both
            // start from currentLane='L' beatParity=false. Forced back to
            // 'L' here, once, right as real control is handed back, so the
            // first real beat is always the left foot regardless of how
            // many toggles the lead-in itself happened to use.
            beatParity = false;
            currentLane = 'L';
            // Real control is only handed back now — give a fresh cooldown
            // measured from THIS moment. The knockback hit-detection below
            // already sets one when a swing lands, but elapsed keeps
            // advancing through the whole "3,2,1" lead-in (unlike
            // 'knockback'/'gettingup', which freeze it), so that earlier
            // cooldown could already be half (or fully) burned through
            // before the player has any agency at all — resetting it here
            // guarantees the same real grace period regardless.
            nextLungeAt = elapsed + 1.2 + Math.random()*1.2;
          }
        }
      }
      var laneActive = leadInBeats <= 0;
      btnL.classList.toggle('beat-active', laneActive && beatOpen && currentLane==='L');
      btnR.classList.toggle('beat-active', laneActive && beatOpen && currentLane==='R');
      laneEls.L.forEach(function(el){ if (el!==btnL) el.classList.toggle('beat-active', laneActive && beatOpen && currentLane==='L'); });
      laneEls.R.forEach(function(el){ if (el!==btnR) el.classList.toggle('beat-active', laneActive && beatOpen && currentLane==='R'); });

      gapFill.style.width = (t*100).toFixed(1)+'%';
      gapFill.style.backgroundColor = t<0.25 ? 'var(--danger)' : (t>0.75 ? 'var(--safe)' : 'var(--accent)');
      scoreValue.textContent = Math.round(score);

      // Bear AI, hit-detection and gap decay are frozen through the "3,2,1"
      // lead-in — the same breather the old separate 'countdown' state gave,
      // just driven by this one real beat clock (leadInBeats) instead of a
      // second timer that could disagree with it.
      if (leadInBeats > 0){
        if (mixer){ mixer.update(0); if (rootBone) rootBone.position.set(0,0,0); }
      } else {

      // The attack sequence (telegraph + lunge + the swing itself) only
      // starts once the bear has actually closed to point-blank (t <
      // CLOSE_RANGE_T); nextLungeAt then paces how often it swings from there.
      if (lungeState==='idle' && elapsed>=nextLungeAt && t < CLOSE_RANGE_T){
        lungeState='telegraph'; lungeTimer=TELEGRAPH_DUR;
        // Pick which side this attack swings in from. Rather than a second
        // named clip (the bear's own animations don't have a clean left/right
        // pair), the same Sword_Attack/Sprint clips are mirrored by flipping
        // scale.x — Three.js's renderer already handles the resulting
        // negative-determinant winding correctly, so this is a cheap way to
        // get a real, readable directional swing out of one clip instead of
        // two that might not visually read as "from the left" vs "from the
        // right" anyway.
        attackSide = Math.random() < 0.5 ? 'L' : 'R';
        dodged = false; dodgeAttempted = false;
        if (bearModel) bearModel.scale.x = (attackSide === 'R' ? -1 : 1) * ENEMY_MODEL_SCALE;
        // Measured empirically: the Sword_Attack clip's own swing brings the
        // hand closest to the player around the midpoint of the telegraph
        // phase, not during the lunge that follows (lunge plays a Sprint
        // clip, not another swing) — so that's what the dodge window targets.
        lungeImpactAt = elapsed + TELEGRAPH_DUR/2;
      } else if (lungeState==='telegraph'){
        lungeTimer -= dt;
        if (lungeTimer<=0){ lungeState='lunge'; lungeTimer=0.9; }
      } else if (lungeState==='lunge'){
        lungeTimer -= dt;
        if (lungeTimer<=0){
          lungeState='idle';
          // Still point-blank when this swing ends: skip the long "wander back
          // in" cooldown and chain straight into the next one, so the bear
          // presses a close-range advantage with a combo instead of stepping
          // back to idle/run for several seconds between single swings.
          nextLungeAt = elapsed + (t < CLOSE_RANGE_T ? (0.35 + Math.random()*0.3) : (3 + Math.random()*2));
          // Keep gap consistent with wherever the charge actually left the bear,
          // so it doesn't snap back out to the pre-lunge distance next frame.
          // bear.position.z is already local to `player` (its literal
          // parent), so no subtraction is needed to recover the pure
          // t-equivalent distance — same as the original bear-only formula.
          gap = Math.max(0, Math.min(GAP_MAX, ((bear.position.z - Z_NEAR)/(Z_FAR-Z_NEAR)) * GAP_MAX));
          if (bearModel) bearModel.scale.x = ENEMY_MODEL_SCALE;
        }
      }
      var dodgeWindowOpen = (lungeState==='telegraph' || lungeState==='lunge') && Math.abs(elapsed - lungeImpactAt) <= DODGE_GOOD_WINDOW/2;
      dodgeEls.forEach(function(el){ el.classList.toggle('beat-active', dodgeWindowOpen); });

      var attacking = lungeState==='telegraph' || lungeState==='lunge';
      if (attacking){
        // Once it commits to a swing, staring alone doesn't stop it — only
        // keeping your distance beforehand does. No dash: the proximity gate
        // above only lets an attack start when the bear is already close
        // (t<0.05), so it just squares up and swings from where it's standing.
        bear.position.x += (0 - bear.position.x) * (1 - Math.pow(0.0005, dt));
      } else {
        gap = Math.max(0, gap - WALK_SPEED*dt);
        bear.position.x += (0 - bear.position.x) * (1 - Math.pow(0.002, dt));
        t = gap/GAP_MAX;
        // Eases toward the target instead of snapping straight to it, so a
        // sudden jump (a miss cutting `gap` sharply) reads as the bear
        // visibly *dashing* to close the new gap over the next few frames,
        // not teleporting — while the continuous WALK_SPEED-driven approach
        // (this branch, every frame) still tracks closely enough to feel
        // smooth and immediate. Local to `player` (its literal parent — see
        // player.add(bear) near player's own declaration): this alone is
        // "the bear-to-player distance", not a second world-space formula.
        var bearTargetZ = Z_NEAR + t*(Z_FAR-Z_NEAR);
        bear.position.z += (bearTargetZ - bear.position.z) * (1 - Math.pow(0.0006, dt));
      }

      if (mixer){
        // Between chained point-blank swings there's nowhere left to close,
        // so standing there mid-"run" read as pointless jogging in place —
        // idle (still facing/ready) instead, until the next telegraph fires.
        var wantAnim = attacking ? (lungeState==='telegraph' ? 'threat' : 'sprint')
          : (t < CLOSE_RANGE_T ? 'idle' : (missReactionTimer > 0 ? 'closing' : 'run'));
        setAnimState(wantAnim);
        mixer.update(dt);
        if (rootBone) rootBone.position.set(0,0,0);
      }

      // Getting hit costs one HP and hands off to the 'knockback' state so
      // Hit_Knockback_RM can actually play out; the run only actually ends
      // (state='gameover') once HP runs out — see the 'knockback' branch
      // below for where that's decided, once the reaction finishes.
      if (handBone && playerHitBone && !dodged){
        handBone.getWorldPosition(handWorldPos);
        playerHitBone.getWorldPosition(playerWorldPos);
        if (handWorldPos.distanceTo(playerWorldPos) < HIT_RADIUS){
          hp = Math.max(0, hp - 1); updateHpDisplay();
          setBPM(Math.max(BPM_MIN, BPM - 10));
          playSfx('hit');
          state = 'knockback'; reactionTimer = knockbackDuration; lastReason = 'You lost...';
          dyingStartD = playerD;
          dyingStartBearLocalZ = bear.position.z;
          // A hit only ever lands while the bear is already at point-blank
          // (t < CLOSE_RANGE_T) — left alone, gap is still pinned there
          // through the whole knockback/gettingup/lead-in (all three freeze
          // it), so the instant real control returns the bear is already
          // primed to re-trigger CLOSE_RANGE_T's chained-attack cooldown
          // again. Floor it back to GAP_START — the same distance a fresh
          // run starts at — so getting hit at least buys genuine breathing
          // room instead of a near-guaranteed immediate second hit.
          gap = Math.max(gap, GAP_START);
          // The swing that just landed was still live in lungeState/lungeTimer
          // (and possibly still mirrored via bearModel.scale.x) — left alone,
          // it would silently keep counting down through the whole knockback +
          // get-up, and resume the *same* interrupted attack the instant
          // 'playing' comes back, reconnecting again almost immediately with
          // no real chance to recover. Abort it here and hand the bear a fresh
          // cooldown instead, same shape as the natural post-swing one.
          lungeState = 'idle'; nextLungeAt = elapsed + 1.2 + Math.random()*1.2;
          if (bearModel) bearModel.scale.x = ENEMY_MODEL_SCALE;
          // A walk step can leave the player model mirrored (scale.x<0) —
          // Hit_Knockback_RM isn't a side-specific clip, so it should always
          // play un-mirrored.
          if (playerModel) playerModel.scale.x = PLAYER_MODEL_SCALE;
          // A successful dodge from the *previous* chained swing can still be
          // tailing off when this one lands (close-range attacks are chained
          // with only a short recovery beat) — stop it explicitly so it
          // doesn't blend with Hit_Knockback_RM on the same skeleton instead
          // of cutting cleanly to it.
          if (playerWalkAction) playerWalkAction.stop();
          if (playerIdleAction) playerIdleAction.stop();
          if (playerDodgeLeftAction) playerDodgeLeftAction.stop();
          if (playerDodgeRightAction) playerDodgeRightAction.stop();
          if (playerBonusAction) playerBonusAction.stop();
          if (playerRecoverAction) playerRecoverAction.stop();
          if (playerGetUpAction) playerGetUpAction.stop();
          if (playerKnockbackAction) playerKnockbackAction.reset().play();
        }
      }
      // Dropping out of green resets the streak even without a miss — see
      // GREEN_T/GREEN_STREAK_TARGET above. The actual increment-on-hit lives
      // in handleLane()'s success branch, since it only makes sense to count
      // at the moment a press actually lands.
      if (t <= GREEN_T) greenStreak = 0;
      }
    } else if (state === 'knockback'){
      reactionTimer -= dt;
      // Freeze the bear right where it struck; the player's own Hit_Knockback_RM
      // (in `mixers`, updated every frame regardless of state) is what plays here.
      // The player, on the other hand, recoils backward — ease-out so the
      // push lands with the hit and settles rather than snapping or sliding
      // at a constant rate. The camera is a child of `player`, so it just
      // follows this for free, regardless of state.
      var knockT = Math.min(1, 1 - reactionTimer/knockbackDuration);
      // Starts from dyingStartD (captured the instant the hit landed, see
      // above) and eases in the push on top of it — player.position/rotation
      // are re-derived from this fresh every frame near the bottom of
      // frame(), same as 'playing'. bear.position.z eases the opposite way,
      // by the same push — since it's local to `player` now, leaving it
      // alone would drag the bear along for the recoil instead of it
      // staying frozen exactly where it struck.
      var knockPush = KNOCKBACK_DISTANCE * (1 - Math.pow(1-knockT, 3));
      playerD = dyingStartD + knockPush;
      bear.position.z = dyingStartBearLocalZ - knockPush;
      if (mixer) mixer.update(0);
      if (rootBone) rootBone.position.set(0,0,0);
      if (reactionTimer <= 0){
        if (hp <= 0){
          state = 'gameover'; finishGame(); stopBgm(); playGameoverBgm(); gameoverEnteredAt = performance.now();
        } else {
          // Still got HP left: get back up (LayToIdle) instead of ending the
          // run. playerAnimState is left stale from before the hit (the
          // knockback/get-up clips play directly, bypassing setPlayerAnim's
          // own tracking) — null it so the idle/walk gate below is guaranteed
          // to actually (re)start an action once 'playing' resumes, rather
          // than seeing an unchanged target state and treating it as a no-op.
          state = 'gettingup'; reactionTimer = getUpDuration;
          playerAnimState = null;
          // Hit_Knockback_RM finished (clampWhenFinished) but was never
          // stopped, so it was still "active" and blending with LayToIdle —
          // same class of bug as the earlier dodge/Death_A mix-up. That blend
          // let the frozen knockback pose dominate, which is why the get-up
          // motion barely read as playing at all.
          if (playerKnockbackAction) playerKnockbackAction.stop();
          if (playerGetUpAction) playerGetUpAction.reset().play();
        }
      }
    } else if (state === 'gettingup'){
      reactionTimer -= dt;
      // Bear stays frozen through the get-up too — same breather as the
      // knockback itself, continuing into the "3,2,1" lead-in that follows
      // (handled inside 'playing' now — see leadInBeats there).
      if (mixer) mixer.update(0);
      if (rootBone) rootBone.position.set(0,0,0);
      if (reactionTimer <= 0){
        if (playerGetUpAction) playerGetUpAction.stop();
        state = 'playing';
        startLeadIn();
      }
    } else if (state === 'trackswitch'){
      // Bear frozen through the Victory pose the same way it is through
      // knockback/gettingup — playerVictoryAction itself plays via the
      // unconditional `mixers` update below regardless of state, so nothing
      // else needs to drive it here.
      reactionTimer -= dt;
      if (mixer) mixer.update(0);
      if (rootBone) rootBone.position.set(0,0,0);
      if (reactionTimer <= 0){
        if (playerVictoryAction) playerVictoryAction.stop();
        state = 'playing';
        startLeadIn(true);
      }
    } else {
      bear.position.x = Math.sin(time*0.25)*0.45;
      bear.position.z = Z_NEAR + t*(Z_FAR-Z_NEAR); // local to `player` — keeps bear-to-player distance identical to the old bear-only formula
      if (mixer){
        setAnimState('idle');
        mixer.update(0);
        if (rootBone) rootBone.position.set(0,0,0);
      }
    }

    // player.position/rotation (and the terrain wrap below) are derived
    // fresh from displayD every frame, regardless of state — not playerD
    // directly. Every ordinary hit adds its share to playerD in one instant
    // jump (see handleLane()'s success branch), and rendering that jump
    // within a single frame would read as the camera teleporting once per
    // beat instead of walking. 'knockback' already has its own tuned
    // ease-out curve (knockT, above) baked directly into playerD itself, so
    // easing *again* on top of that here would just be a second, redundant
    // lag — displayD tracks playerD exactly, with no smoothing, through
    // 'knockback' (and everywhere else playerD isn't the one place actually
    // advancing every frame), and only eases during 'playing', where the
    // per-hit jumps actually are instant.
    if (state === 'knockback') displayD = playerD;
    else displayD += (playerD - displayD) * (1 - Math.pow(0.0006, dt));
    var pp = pathAt(displayD);
    player.position.set(pp.x, 0, pp.z);
    player.rotation.y = -pp.phi;

    // The fallback ground plane just needs to translate to stay under
    // wherever the player currently is — it's an unlit flat color, so its
    // own rotation never matters. The sky dome now turns together with the
    // player (sky.rotation.y here matches player.rotation.y above) instead
    // of holding a fixed world orientation: the dome's own sky photo only
    // covers a deliberately narrow, tuned patch of its surface (see
    // skyTexture.repeat/offset near the dome's own declaration) sized for a
    // camera that's always roughly facing the same relative direction —
    // true while the player only ever walked a straight line, but not once
    // the track gained curves the player (and the camera, its child) turn
    // through. Rotating the dome with the player keeps that patch centered
    // on the camera's view no matter which way the track has turned,
    // trading away the sky visibly "sliding" as a turning cue (everything
    // else still turns with the player, so that cue isn't lost, just no
    // longer doubled up on the sky too) for never showing the dome's
    // unmapped far side. Every grass tile and tree slides to the copy of
    // its own original track position nearest the player (see
    // placeOnTrack() near the top), which is what actually makes the
    // corridor endless: the same ~150 objects forever, just relocated along
    // the curve, never created fresh. This runs after every state branch
    // above has had its chance to move playerD, so it's always working from
    // this frame's final position, never last frame's.
    sky.position.x = player.position.x;
    sky.position.z = player.position.z;
    sky.rotation.y = player.rotation.y;
    ground.position.x = player.position.x;
    ground.position.z = player.position.z;
    grassWrappers.forEach(function(g){ placeOnTrack(g.obj, g.baseD, g.lateralX, displayD, GRASS_WRAP_DEPTH, WRAP_BEHIND_MARGIN); });
    treeInstances.forEach(function(tr){ placeOnTrack(tr.obj, tr.baseD, tr.lateralX, displayD, TREE_WRAP_DEPTH, WRAP_BEHIND_MARGIN); });

    // kinokoSpawnD is null right after a pickup (handleRecover()) or a
    // fresh resetGame() — either way, the next spawn belongs some distance
    // *ahead* of wherever the player is right now, not behind, so ordinary
    // forward walking (D only ever increases) is what brings the player to
    // it. The camera looks *back* toward the bear (see WRAP_BEHIND_MARGIN's
    // own comment), so a kinoko ahead of the player is invisible right up
    // until the player's own D actually reaches and passes it. Once passed
    // (picked up or missed) it stays put behind the player for a while
    // rather than teleporting away the instant it's out of reach — now
    // finally on the visible side of that backward-facing camera, so a
    // missed one is at least seen receding into the distance instead of
    // just vanishing.
    if (kinokoObj){
      if (state === 'playing'){
        if (kinokoSpawnD === null || displayD > kinokoSpawnD + 40){
          kinokoSpawnD = displayD + KINOKO_SPAWN_LEAD_MIN + Math.random()*(KINOKO_SPAWN_LEAD_MAX-KINOKO_SPAWN_LEAD_MIN);
          // Never near zero: the player always walks exactly along
          // lateralX=0 (there's no strafing), and third-person cameras sit
          // directly behind whatever they're following, so a kinoko placed
          // close to that same line ends up almost exactly behind the
          // player's own body once passed — permanently hidden by their own
          // character model no matter how big the mesh is. Pushed off to
          // one side instead, still comfortably inside KINOKO_PICKUP_RADIUS
          // so it's reachable, but far enough from lateralX=0 to actually
          // clear the player's silhouette.
          kinokoLateralX = (Math.random() < 0.5 ? -1 : 1) * (KINOKO_LATERAL_MIN + Math.random()*(KINOKO_LATERAL_MAX-KINOKO_LATERAL_MIN));
        }
        var kp = pathAt(kinokoSpawnD);
        kinokoObj.position.x = kp.x + kinokoLateralX*kp.rightX;
        kinokoObj.position.z = kp.z + kinokoLateralX*kp.rightZ;
        kinokoObj.visible = true;
      } else {
        kinokoObj.visible = false;
      }
    }
    // Poison kinoko — identical spawn/recycle rules to the healing one
    // above (same constants, same independent random draw), just its own
    // separate spawnD/lateralX so the two don't have to stay in lockstep
    // or avoid each other; occasionally landing at the same D is fine,
    // they're offset to opposite-feeling sides often enough by the shared
    // Β±KINOKO_LATERAL_MIN..MAX draw that they rarely fully overlap.
    if (poisonKinokoObj){
      if (state === 'playing'){
        if (poisonKinokoSpawnD === null || displayD > poisonKinokoSpawnD + 40){
          poisonKinokoSpawnD = displayD + KINOKO_SPAWN_LEAD_MIN + Math.random()*(KINOKO_SPAWN_LEAD_MAX-KINOKO_SPAWN_LEAD_MIN);
          poisonKinokoLateralX = (Math.random() < 0.5 ? -1 : 1) * (KINOKO_LATERAL_MIN + Math.random()*(KINOKO_LATERAL_MAX-KINOKO_LATERAL_MIN));
        }
        var pkp = pathAt(poisonKinokoSpawnD);
        poisonKinokoObj.position.x = pkp.x + poisonKinokoLateralX*pkp.rightX;
        poisonKinokoObj.position.z = pkp.z + poisonKinokoLateralX*pkp.rightZ;
        poisonKinokoObj.visible = true;
      } else {
        poisonKinokoObj.visible = false;
      }
    }
    // Live "you can pick it up right now" cue on the V button/kbd — the
    // only previous feedback was the ~220ms flash *after* pressing V, which
    // is easy to miss entirely if the press itself was slightly early or
    // late (there was no way to tell "not yet" from "just missed it" from
    // "wrong entirely"). This uses the exact same distance check as
    // handleRecover() itself, so if the button is lit, pressing V right
    // now is guaranteed to succeed — same pattern as the beat lanes
    // (beat-active while beatOpen) and the dodge button (beat-active while
    // dodgeWindowOpen) above.
    var kinokoInRange = false;
    if (kinokoSpawnD !== null && kinokoObj && kinokoObj.visible && displayD >= kinokoSpawnD){
      var krx = kinokoObj.position.x - player.position.x, krz = kinokoObj.position.z - player.position.z;
      kinokoInRange = Math.sqrt(krx*krx + krz*krz) < KINOKO_PICKUP_RADIUS;
    }
    var poisonKinokoInRange = false;
    if (poisonKinokoSpawnD !== null && poisonKinokoObj && poisonKinokoObj.visible && displayD >= poisonKinokoSpawnD){
      var pkrx = poisonKinokoObj.position.x - player.position.x, pkrz = poisonKinokoObj.position.z - player.position.z;
      poisonKinokoInRange = Math.sqrt(pkrx*pkrx + pkrz*pkrz) < KINOKO_PICKUP_RADIUS;
    }
    // Poison and healing share the same accent-yellow "you can interact"
    // glow — same V button either way (handleRecover() below checks both),
    // and which one you'll actually get is only revealed by the mushroom's
    // own color, not the button.
    recoverEls.forEach(function(el){
      el.classList.toggle('beat-active', kinokoInRange || poisonKinokoInRange);
    });

    var smooth = 1 - Math.pow(0.0025, dt);
    yawCur += (yawTarget-yawCur)*smooth;
    pitchCur += (pitchTarget-pitchCur)*smooth;

    stepSpring(sp.camBounce, dt, 150, 10);
    stepSpring(sp.camSway, dt, 85, 8);
    stepSpring(sp.camRoll, dt, 55, 6);
    stepSpring(sp.fovKick, dt, 40, 7);

    var idleSway = reducedMotion ? 0 : Math.sin(time*0.9)*0.012;
    // Local offsets from `player` (its literal parent — see player.add(camera)
    // near player's own declaration) — no "+player.position.z" needed here at
    // all, that's the whole point: wherever the player is, this is where the
    // camera sits relative to them, structurally, every frame.
    camera.position.set(sp.camSway.cur, EYE_HEIGHT + THIRD_PERSON_UP + sp.camBounce.cur*0.05 + idleSway, THIRD_PERSON_BACK);
    camera.rotation.set(pitchCur, yawCur, sp.camRoll.cur);
    camera.fov = BASE_FOV + sp.fovKick.cur;
    camera.updateProjectionMatrix();

    if (bearModel){
      bearModel.position.y = reducedMotion ? 0 : Math.sin(time*2.1)*0.02;
    }

    // Gated to 'playing' so a held key during the 'knockback'/'gettingup'
    // states can't fight the Hit_Knockback_RM/LayToIdle pose those states
    // (or resetGame()) already put in charge.
    // Also holds off while a dodge clip or a walk step is playing
    // (dodgeTimer/walkStepTimer>0) so the idle switch doesn't cut either
    // short mid-animation — the walk step itself is triggered per successful
    // hit in handleLane(), not by raw key-held state.
    if (dodgeTimer > 0) dodgeTimer = Math.max(0, dodgeTimer - dt);
    if (walkStepTimer > 0) walkStepTimer = Math.max(0, walkStepTimer - dt);
    if (playerMixer && state === 'playing' && dodgeTimer <= 0 && walkStepTimer <= 0){
      setPlayerAnim('idle');
    }
    mixers.forEach(function(m){ m.update(dt); });
    // Same reason as the bear's own rootBone below: Hit_Knockback_RM (and
    // potentially other clips) bakes real translation into this bone. Left
    // alone it deforms the skinned mesh out from under the player group's own
    // position — invisible to player.position.z, so the camera (which only
    // tracks that) doesn't follow it, and the character visually rockets off
    // whatever distance the clip itself encodes, independent of and on top of
    // the scripted knockback push above. Re-zeroing it every frame makes our
    // own positioning the only thing moving the character, same as the bear.
    if (playerRootBone) playerRootBone.position.set(0,0,0);

    renderer.render(scene, camera);
    if (debugMapOn) drawDebugMap();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
