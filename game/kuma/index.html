<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boy meets Kuma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Antique+B1&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  :root{
    --bg:#12180f;
    --bg-panel:#1b2417;
    --bg-panel-2:#202b1b;
    --ink:#ede8d6;
    --ink-dim:#9fac8f;
    --accent:#f2b705;
    --accent-dim:#b98c12;
    --danger:#c4432b;
    --safe:#6f9c53;
    --line:#3a4430;
    --line-soft:#2a3222;
    --font-display:'Shippori Antique B1','Hiragino Mincho ProN',serif;
    --font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
    --font-mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    padding:10px;
    display:flex;
    justify-content:center;
  }

  .board{
    width:100%;
    max-width:1400px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .stage-wrap{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    max-height:88vh;
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
    background:var(--bg);
  }
  .stage-wrap.has-look{cursor:none;}
  canvas#glcanvas{display:block;width:100%;height:100%;}

  .hud{
    position:absolute; inset:0; pointer-events:none; z-index:4;
    font-family:var(--font-body);
  }
  #debugMap{
    position:absolute; right:8px; top:8px; z-index:6;
    background:rgba(10,14,8,0.78);
    border:1px solid rgba(255,255,255,0.35);
    pointer-events:none;
  }
  #debugMap[hidden]{ display:none; }
  .hud-gap{
    position:absolute; left:10px; top:10px;
    width:44%; height:22px;
    background:rgba(18,24,15,0.6);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .hud-gap-fill{
    height:100%; width:39%;
    background:var(--accent);
    transition:background-color 0.2s;
  }
  .hud-gap-label{
    position:absolute; left:6px; top:3px;
    font-size:10px; color:var(--ink); letter-spacing:0.06em;
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
  }
  .hud-timer{
    position:absolute; right:10px; top:10px;
    font-family:var(--font-mono); font-weight:700;
    font-size:66px;
    color:var(--accent);
    text-shadow:0 3px 6px rgba(0,0,0,0.7);
    letter-spacing:0.02em;
    font-variant-numeric:tabular-nums;
    line-height:1;
    text-align:right;
  }
  .hud-timer .score-label{
    display:block;
    font-size:20px;
  }
  .score-popup-anchor{
    position:absolute; left:78%; top:60%;
    width:0; height:0;
  }
  .score-popup{
    position:absolute; left:0; top:0;
    font-family:var(--font-mono); font-weight:700;
    font-size:28px;
    text-shadow:0 3px 6px rgba(0,0,0,0.7);
    white-space:nowrap;
    pointer-events:none;
    animation:scorePopUp 0.6s ease-out forwards;
  }
  .score-popup.gain{ color:var(--safe); }
  .score-popup.loss{ color:var(--danger); }
  @keyframes scorePopUp{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(1.3); }
    15%{ transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-75%) scale(1); }
  }
  .hud-hp{
    position:absolute; left:10px; top:40px;
    display:flex; gap:6px;
  }
  .hud-hp img{
    width:32px; height:34px;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,0.8));
  }
  .hud-hp .pip-lost{ opacity:0.25; filter:grayscale(1) drop-shadow(0 2px 5px rgba(0,0,0,0.8)); }
  .hud-countdown{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    font-family:var(--font-display);
    font-size:clamp(48px,14vw,96px);
    color:var(--accent);
    text-shadow:0 4px 16px rgba(0,0,0,0.9);
    opacity:0;
    letter-spacing:0.05em;
    pointer-events:none;
  }
  .preload-bar-track{
    width:min(260px,70%);
    height:10px;
    background:#e6ded0;
    border:1px solid var(--line);
    border-radius:5px;
    overflow:hidden;
    margin-top:6px;
  }
  .preload-bar-fill{
    height:100%; width:0%;
    background:var(--accent);
    transition:width 0.2s ease;
  }
  #preloadStatus{ color:#a1620a; font-size:12.5px; }

  .overlay-card{
    position:absolute; inset:0; z-index:6;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; padding:16px;
    background:#ffffff;
    opacity:0; pointer-events:none;
    transition:opacity 0.9s ease;
  }
  .overlay-card.visible{ opacity:1; pointer-events:auto; }
  .overlay-card h2{
    font-family:var(--font-display); font-weight:400;
    font-size:clamp(22px,6vw,30px); margin:0; color:var(--ink);
    text-wrap:balance;
  }
  .title-logo{
    display:block; width:min(360px,82%); height:auto;
    filter:drop-shadow(0 12px 18px rgba(0,0,0,0.6));
  }
  .title-logo.drop-in{
    animation:logoDrop 0.65s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes logoDrop{
    0%{ transform:translateY(-220%); opacity:0; }
    55%{ transform:translateY(4%); opacity:1; }
    62%{ transform:translateY(2%) scaleX(1.08) scaleY(0.9); }
    75%{ transform:translateY(-4%) scaleX(0.97) scaleY(1.04); }
    88%{ transform:translateY(1%) scaleX(1.02) scaleY(0.99); }
    100%{ transform:translateY(0) scale(1); }
  }
  .overlay-card p{margin:0; color:#6b6255; font-size:13.5px; max-width:34ch;}
  .overlay-card .cta{
    margin-top:8px; font-size:12.5px; font-weight:700;
    color:#a1620a; letter-spacing:0.08em;
  }

  .level-select{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .level-select button{
    font-family:var(--font-body);
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 14px;
    cursor:pointer;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    transition:background .08s,box-shadow .08s,color .08s;
  }
  .level-select button.selected{
    background:var(--accent); color:#1b1503;
    box-shadow:0 0 0 2px var(--accent-dim);
  }
  #btnAudioAdjust, #btnPauseToTitle{
    font-family:var(--font-body);
    font-weight:700;
    font-size:12.5px;
    color:var(--ink-dim);
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:5px;
    padding:7px 14px;
    cursor:pointer;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }

  .hud-controls{
    position:absolute; left:0; right:0; bottom:0; z-index:5;
    display:flex; align-items:flex-start; justify-content:center;
    gap:22px;
    padding:12px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(9,13,7,0.8), rgba(9,13,7,0));
  }
  .hud-btn-group{
    display:flex; flex-direction:column; align-items:center;
    gap:6px;
  }
  .hud-controls .key-hints{gap:4px; justify-content:center;}

  .controls-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .key-hints{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:0.04em;
  }
  kbd{
    font-family:var(--font-mono);
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-bottom:2px solid var(--line);
    border-radius:4px;
    padding:4px 9px;
    min-width:16px;
    text-align:center;
  }
  .key-sep{color:var(--line);padding:0 2px;}

  .modal-overlay{
    position:fixed; inset:0; z-index:20;
    background:rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center;
    padding:16px;
  }
  .modal-overlay[hidden]{display:none;}
  .modal-card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px;
    max-width:360px;
    width:100%;
    text-align:center;
    color:var(--ink);
  }
  .modal-card h3{
    font-family:var(--font-display); font-weight:400;
    margin:0 0 10px;
    color:var(--accent);
  }
  .modal-card p{
    font-size:13px;
    color:var(--ink-dim);
    margin:0 0 14px;
    line-height:1.5;
  }
  .modal-card button{
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:5px;
    padding:9px 16px;
    cursor:pointer;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }
  .audio-adjust-flash{
    width:80px; height:80px;
    margin:0 auto 6px;
    border-radius:50%;
    background:var(--bg-panel-2);
    border:3px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    transition:border-color 0.05s, transform 0.05s;
  }
  .audio-adjust-flash.flash-raw{
    border-color:var(--ink-dim);
    transform:scale(1.08);
  }
  .audio-adjust-flash-inner{
    width:46px; height:46px;
    border-radius:50%;
    background:var(--bg-panel-2);
    transition:background-color 0.05s, transform 0.05s;
  }
  .audio-adjust-flash-inner.flash{
    background:var(--accent);
    transform:scale(1.15);
  }
  .audio-adjust-flash-caption{
    font-size:11px; color:var(--ink-dim);
    margin:0 0 16px;
  }
  .audio-adjust-row{
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin-bottom:12px;
  }
  #audioAdjustValue{
    font-family:var(--font-mono); font-weight:700;
    min-width:5.5em; display:inline-block;
  }
  #audioAdjustTapCalibrate{
    background:var(--accent); color:#1b1503; border-color:var(--accent-dim);
    font-size:16px; padding:12px 22px;
  }
  #audioAdjustTapStatus{
    font-size:12.5px; color:var(--ink-dim); margin:0 0 14px;
  }
  .audio-adjust-finetune-label{
    font-size:11px; color:var(--ink-dim); margin:0 0 6px;
    letter-spacing:0.04em;
  }
  .modal-close{ margin-top:6px; }

  .touch-buttons{display:flex;gap:10px;}
  .touch-buttons button{
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:5px;
    padding:11px 18px;
    cursor:pointer;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    transition:background .08s,box-shadow .08s,color .08s;
  }
  .touch-buttons button:active{background:var(--accent-dim);color:#1b1503;}
  .touch-buttons button.muted{color:var(--ink-dim);border-color:var(--line-soft);background:var(--bg-panel);}
  .touch-buttons button.icon-btn{
    display:flex; align-items:center; justify-content:center;
    padding:10px; width:40px; height:40px;
  }
  .touch-buttons button.icon-btn svg{display:block;}
  .touch-buttons button:focus-visible,
  kbd:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  kbd{transition:background .08s,box-shadow .08s,color .08s;}

  .beat-active{
    background:var(--accent) !important;
    color:#1b1503 !important;
    box-shadow:0 0 0 2px var(--accent-dim), 0 0 12px 2px rgba(242,183,5,0.7);
  }
  .beat-good{background:var(--safe) !important;color:#08210f !important;box-shadow:0 0 12px 2px rgba(111,156,83,0.8);}
  .beat-bad{background:var(--danger) !important;color:#2a0a04 !important;box-shadow:0 0 12px 2px rgba(196,67,43,0.8);}

  .bpm-control{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:0.04em;
  }
  .bpm-control input[type="range"]{width:90px;accent-color:var(--accent);}
  .bpm-control #bpmValue{color:var(--ink);font-weight:700;min-width:2.2em;display:inline-block;}
  .bpm-control select{
    font-family:var(--font-body);
    font-size:12px;
    color:var(--ink);
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:4px 6px;
  }

  @media (pointer:coarse){
    .key-hints{display:none;}
  }
  @media (pointer:fine){
    .touch-buttons{opacity:0.55;}
  }
</style>
</head>
<body>

<div class="board">
  <div class="stage-wrap" id="stageWrap">
    <canvas id="glcanvas" aria-label="熊との遭遇シミュレーションゲーム(一人称視点)"></canvas>
    <div class="hud">
      <div class="hud-gap"><div class="hud-gap-fill" id="gapFill"></div><span class="hud-gap-label">distance</span></div>
      <div class="hud-hp" id="hpLabel"></div>
      <div class="hud-timer" id="scoreLabel"><span class="score-label">Score:</span> <span id="scoreValue">0</span></div>
      <div class="score-popup-anchor" id="scorePopupAnchor"></div>
      <div class="hud-countdown" id="countdownLabel"></div>
    </div>
    <canvas id="debugMap" width="220" height="320" hidden></canvas>
    <!-- Silent, plays once per run start (see beginRun()) purely so a real
         HTMLMediaElement is playing on the page — on iOS Safari this can be
         what puts the page's audio session in a category the mute switch
         doesn't silence, which otherwise-identical Web-Audio-only pages
         (no <audio>/<video> anywhere) don't get. -->
    <audio id="iosAudioUnlock" src="sound/silence-unlock.wav" playsinline hidden></audio>
    <div class="overlay-card visible" id="cardPreload">
      <h2>Loading...</h2>
      <div class="preload-bar-track"><div class="preload-bar-fill" id="preloadBarFill"></div></div>
      <p id="preloadPercent">0%</p>
      <p id="preloadStatus" hidden></p>
    </div>
    <div class="overlay-card" id="cardTitle">
      <img class="title-logo" id="titleLogo" src="title.webp" alt="Boy meets Kuma">
      <div class="level-select" id="levelSelect">
        <button type="button" data-bpm="72">LEVEL1</button>
        <button type="button" data-bpm="100">LEVEL2</button>
        <button type="button" data-bpm="120">LEVEL3</button>
        <button type="button" data-bpm="150">LEVEL4</button>
      </div>
      <button id="btnAudioAdjust" type="button">Audio Adjust</button>
      <div class="cta">Click or Tap to Start</div>
    </div>
    <div class="overlay-card" id="cardOver">
      <img class="title-logo" id="overReason" src="gameover.webp" alt="You lost...">
      <p id="overStats">Survival Time 0.0s</p>
      <p id="overScore">Score 0</p>
      <div class="cta">Click or Tap to Respawn</div>
    </div>
    <div class="overlay-card" id="cardPaused">
      <img class="title-logo" id="pausedLogo" src="paused.webp" alt="Paused">
      <div class="cta">Tap to Resume</div>
      <button id="btnPauseToTitle" type="button">Title</button>
    </div>
    <div class="hud-controls">
      <div class="hud-btn-group">
        <div class="touch-buttons">
          <button id="btnL" type="button">Left</button>
          <button id="btnR" type="button">Right</button>
        </div>
        <div class="key-hints">
          <kbd data-lane="L">Z</kbd><span class="key-sep">/</span><kbd data-lane="R">X</kbd>
        </div>
      </div>
      <div class="hud-btn-group">
        <div class="touch-buttons">
          <button id="btnDodge" type="button">Sway</button>
        </div>
        <div class="key-hints">
          <kbd data-dodge="1">C</kbd>
        </div>
      </div>
      <div class="hud-btn-group">
        <div class="touch-buttons">
          <button id="btnRecover" class="icon-btn" type="button" aria-label="Eat"></button>
        </div>
        <div class="key-hints">
          <kbd data-recover="1">V</kbd>
        </div>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <div class="bpm-control">
      <label for="bpmRange">BPM</label>
      <input type="range" id="bpmRange" min="50" max="210" step="1" value="92">
      <span id="bpmValue">92</span>
    </div>
    <div class="bpm-control">
      <label for="bgmTrackSelect">BGM</label>
      <select id="bgmTrackSelect">
        <option value="auto">自動(BPM追従)</option>
        <option value="kuma">くまさん</option>
        <option value="asobiba">サイコーのあそびば</option>
        <option value="oikakko">鬼ごっこ</option>
        <option value="doro">泥を蹴散らせ</option>
        <option value="tempo120">tempo120(debug)</option>
      </select>
    </div>
    <div class="touch-buttons">
      <button id="btnSfxMute" class="icon-btn" type="button" aria-label="効果音"></button>
      <button id="btnBgmMute" class="icon-btn" type="button" aria-label="BGM"></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="audioAdjustModal" hidden>
  <div class="modal-card">
    <h3>Audio Adjust</h3>
    <p>Bluetoothイヤホンなど、音が遅れて聞こえる環境向けの調整です。クリック音に合わせて「Tap to Calibrate」を数回タップするだけで自動調整できます。</p>
    <div class="audio-adjust-flash" id="audioAdjustFlash"><div class="audio-adjust-flash-inner" id="audioAdjustFlashInner"></div></div>
    <p class="audio-adjust-flash-caption">外側の枠＝無補正／中の丸＝オフセット後</p>
    <div class="audio-adjust-row">
      <button id="audioAdjustPlay" type="button">Play Click</button>
    </div>
    <div class="audio-adjust-row">
      <button id="audioAdjustTapCalibrate" type="button">Tap to Calibrate</button>
    </div>
    <p id="audioAdjustTapStatus">クリックに合わせてタップしてください</p>
    <p class="audio-adjust-finetune-label">手動での微調整</p>
    <div class="audio-adjust-row">
      <button id="audioAdjustMinus" type="button">-10ms</button>
      <span id="audioAdjustValue">0ms</span>
      <button id="audioAdjustPlus" type="button">+10ms</button>
      <button id="audioAdjustReset" type="button">Reset</button>
    </div>
    <button id="audioAdjustClose" class="modal-close" type="button">Close</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var stageWrap = document.getElementById('stageWrap');
  var canvas = document.getElementById('glcanvas');
  var gapFill = document.getElementById('gapFill');
  var hpLabel = document.getElementById('hpLabel');
  var scoreLabel = document.getElementById('scoreLabel');
  var scoreValue = document.getElementById('scoreValue');
  var scorePopupAnchor = document.getElementById('scorePopupAnchor');
  var countdownLabel = document.getElementById('countdownLabel');
  var debugMapCanvas = document.getElementById('debugMap');
  var debugMapCtx = debugMapCanvas.getContext('2d');
  var debugMapOn = false;
  var cardPreload = document.getElementById('cardPreload');
  var preloadBarFill = document.getElementById('preloadBarFill');
  var preloadPercent = document.getElementById('preloadPercent');
  var preloadStatus = document.getElementById('preloadStatus');
  var cardTitle = document.getElementById('cardTitle');
  var cardOver = document.getElementById('cardOver');
  var overReason = document.getElementById('overReason');
  var titleLogo = document.getElementById('titleLogo');
  var cardPaused = document.getElementById('cardPaused');
  var iosAudioUnlock = document.getElementById('iosAudioUnlock');
  var pausedLogo = document.getElementById('pausedLogo');
  var btnPauseToTitle = document.getElementById('btnPauseToTitle');
  var overStats = document.getElementById('overStats');
  var overScore = document.getElementById('overScore');
  var btnL = document.getElementById('btnL');
  var btnR = document.getElementById('btnR');
  var btnDodge = document.getElementById('btnDodge');
  var btnRecover = document.getElementById('btnRecover');
  var btnSfxMute = document.getElementById('btnSfxMute');
  var btnBgmMute = document.getElementById('btnBgmMute');

  var reducedMotion = false;
  try{ reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var isCoarse = false;
  try{ isCoarse = matchMedia('(pointer: coarse)').matches; }catch(e){}
  if (!isCoarse) stageWrap.classList.add('has-look');

  var COLOR_BG = 0x272f24; // nudged from pure forest green toward the sky photo's neutral gray so the horizon (fog-faded ground meeting the sky plane) doesn't show a hard color seam at steep look angles
  var COLOR_ACCENT = 0xf2b705;
  var COLOR_DANGER = 0xc4432b;

  var GAP_MAX = 140, GAP_START = 14;
  // Absolute ceiling for gap once a green-streak pass bonus pushes it past
  // GAP_MAX (see handleLane()'s success branch) — confirmed in play that
  // letting it climb unbounded across repeated back-to-back passes needed
  // a hard stop.
  var PASS_GAP_MAX = 270;

  var TRACK_STRAIGHT = 150; // length of each straight leg

  // grass tiles out to +-56.7 — placeOnTrack() offsets each one perpendicular
  // to the curve by that same lateral amount, which only stays sane while
  // the curve's own radius comfortably exceeds it. A radius too close to (or
  // smaller than) that spread folds the far tiles past the curve's own
  // center, showing up as overlapping/inverted terrain and visible holes in

  // corridor's width, the same way a real running track's curve radius
  // dwarfs its lane width.
  var TRACK_CURVE_R = 260; // radius of the semicircle at each end

      // center TRACK_CURVE_R to the right of Straight A's own end.

  // and every tree's original Z (before any wrapping) is kept in
  // treeInstances so frame() can recycle it into an endless corridor; see
  // wrapZ() near the top of the file. The two bands' own tree counts are
  // chosen so trees-per-unit-length stays close between them — an earlier
  // version packed the near band far denser (62 trees in 64 units) than the
  // far one (16 in 80), which looked fine walked past once on a straight
  // line, but on a looping track this same 144-unit stretch recycles past
  // the player over and over, so that density swing reads as a repeating
  // dense clump followed by a bare stretch instead of one continuous
  // forest.
  var TREE_WRAP_DEPTH = 144;
  var treeInstances = [];
  loadGltfTracked('tree.glb', function(gltf){
    gltf.scene.updateMatrixWorld(true);
    var treeBox = new THREE.Box3();
    var template = new THREE.Group();
    gltf.scene.traverse(function(o){
      if (o.isMesh && o.name !== 'Forest_A'){
        if (o.material.metalness === 1 && !o.material.map){
          o.material.metalness = 0;
          o.material.roughness = 0.85;
          o.material.color.setHex(0x39511f);
        }
        treeBox.expandByObject(o);
        var clone = o.clone();
        clone.matrix.copy(o.matrixWorld);
        clone.matrix.decompose(clone.position, clone.quaternion, clone.scale);
        template.add(clone);
      }
    });
    var center = treeBox.getCenter(new THREE.Vector3());
    template.children.forEach(function(c){ c.position.x -= center.x; c.position.z -= center.z; c.position.y -= treeBox.min.y; });

    var rng = 1;
    function rand(){ rng = (rng*9301+49297) % 233280; return rng/233280; } // deterministic, so the layout doesn't reshuffle on reload

    function plantForest(count, xMin, xMax, zMin, zMax, excludeXHalfWidth){
      for (var i=0;i<count;i++){
        var x, z;
        do {
          x = xMin + rand()*(xMax-xMin);
        } while (Math.abs(x) < excludeXHalfWidth);
        z = zMin + rand()*(zMax-zMin);
        var t = template.clone();
        t.rotation.y = rand()*Math.PI*2;
        var s = 1.55 + rand()*0.6; // averages ~1.85x, putting tree height around 3x the bear's (0.8948*ENEMY_MODEL_SCALE ≈ 4.47 units tall)
        t.scale.set(s, s, s);
        scene.add(t);
        treeInstances.push({ obj: t, baseD: z, lateralX: x });
      }
    }
    plantForest(45, -34, 34, -6, -70, 8);   // flanks the corridor, near-to-mid distance
    plantForest(33, -70, 70, -70, -150, 20); // wider spread, further back for depth
  }, undefined, function(err){ if (window.console) console.error(err); });

  // (Tried adding a CGTrader meadow asset — glass.glb — as background dressing
  // here, but its ~5000 flower/grass instances average ~2,300 triangles each
  // (offline-render density, not real-time-ready), so even one un-tiled ~2m
  // patch cost ~26% of the frame budget on desktop. No amount of draw-call
  // batching fixes that since the GPU still has to shade every triangle of
  // every instance. Skipped per "don't implement if it hurts performance.")

  // grass-mud.glb ("Grass, Mud, and Puddles", a third CGTrader asset) replaced
  // grass.glb here: a richer textured ground (grass/mud/small rocks, PBR normal
  // + roughness maps) at ~271k triangles. The source .gltf shipped as 392
  // separate mesh nodes (one per patch/puddle) — not the glass.glb problem of
  // one tiny mesh duplicated thousands of times, so `gltf-transform join` safely
  // batches them into 2 draw calls (one per material) without exploding file
  // size, and `resize` capped its 2048px textures at 1024px. Tiled in both X and
  // Z to cover the whole visible ground (rather than just a narrow strip down
  // the middle); the flat `ground` plane still shows through past the tiled
  // area as a matching-color fallback.
  //
  // Every tile used to sit at the exact same orientation, so the same rock/mud
  // arrangement repeated in an obviously aligned grid. Each tile is now wrapped
  // in its own Group: the patch is centered inside that wrapper first (its own
  // bbox isn't centered on its local origin, hence GRASS_CENTER), then the
  // *wrapper* is rotated by a pseudo-random multiple of 90° before being placed
  // — rotating the already-centered patch keeps its footprint aligned with the
  // grid slot instead of shifting off it. GRASS_TILE_SIZE is slightly smaller
  // than the patch's own ~13.3-unit bbox so neighboring tiles overlap a hair
  // rather than risk a gap at their (organically shaped, non-rectangular) edges.
  var GRASS_CENTER = {x:-3.19, z:-3.28};
  var GRASS_TILE_SIZE = 12.6;
  var GRASS_TILES_X = 9, GRASS_TILES_Z = 8;
  // Same recycling as the trees (see TREE_WRAP_DEPTH above): the 8 rows of
  // tiles span this much depth, and frame() slides each wrapper to whichever
  // copy of its baseZ is nearest the player every frame, via wrapZ().
  var GRASS_WRAP_DEPTH = GRASS_TILES_Z * GRASS_TILE_SIZE;
  var grassWrappers = [];
  loadGltfTracked('grass-mud.glb', function(gltf){
    var first = true;
    for (var tz=0; tz<GRASS_TILES_Z; tz++){
      for (var tx=0; tx<GRASS_TILES_X; tx++){
        var patch = first ? gltf.scene : gltf.scene.clone();
        first = false;
        patch.position.set(GRASS_CENTER.x, 0, GRASS_CENTER.z);
        var wrapper = new THREE.Group();
        wrapper.add(patch);
        wrapper.rotation.y = ((tx*7 + tz*13) % 4) * Math.PI/2;
        wrapper.position.y = 0.001;
        var baseD = 4 - tz*GRASS_TILE_SIZE;
        var lateralX = (tx - (GRASS_TILES_X-1)/2) * GRASS_TILE_SIZE;
        scene.add(wrapper);
        grassWrappers.push({ obj: wrapper, baseD: baseD, lateralX: lateralX });
      }
    }
  }, undefined, function(err){ if (window.console) console.error(err); });

  // recovery-kinoko.glb: an occasional pickup, unlike the endless tiled
  // trees/grass above — it doesn't use their wrapZ()/placeOnTrack()
  // recycling at all, deliberately. That recycling keeps each copy within a
  // window mostly *behind* the player in D (see WRAP_BEHIND_MARGIN above —
  // that's the side the camera actually looks toward, back at the bear),
  // which is exactly backwards for something the player has to walk *into*:
  // an object placed that way sits near wherever the player already is or
  // has been, not somewhere their own continuing walk will ever reach, so a
  // kinoko positioned that way could go a full lap before it's physically
  // reachable. Instead this always sits at a single fixed arc-length
  // (kinokoSpawnD) chosen some distance *ahead* of the player's own D (see
  // its update in frame()) — ahead being unambiguous here since D only ever
  // increases — so ordinary forward walking is what brings the player to
  // it, and it re-places itself further ahead once passed (picked up or
  // not), same as a real dropped item would need to.
  // The raw model is 2.77 units tall (a person-scale mushroom) — 0.18 was
  // picked to bring that down to a plausible small-mushroom size, but at
  // that scale (~0.46 units across) it subtends under 2° of view from any
  // distance it's actually first seen at, which in practice reads as not
  // there at all rather than just small. Scaled up well past "realistic"
  // instead, since being spottable matters far more here than being
  // correctly proportioned next to the player.
  var KINOKO_SCALE = 0.42;
  // A straight-line (Euclidean) radius around the kinoko's actual position —
  // but only counts once the player has actually passed it (displayD >=
  // kinokoSpawnD — see handleRecover()/frame()), i.e. a half-disk on the
  // visible side, not a full circle. A pure D-only window (no radius,
  // gated purely on having passed) was tried first and felt broken on the
  // track's curves, where straight-line distance and along-track distance
  // can diverge; a full circle (no gate at all) was tried after that and
  // fixed the curve problem but let the kinoko be picked up while it was
  // still ahead of the player and invisible — camera looks *back* toward
  // the bear (see WRAP_BEHIND_MARGIN's own comment), so anything not yet
  // passed is physically behind the retreating player's own back, same as
  // it would be for someone actually backing away from something. This is
  // the straight-line radius (so curves still behave), just clipped to the
  // half where it's actually visible.
  var KINOKO_PICKUP_RADIUS = 8;
  // Charged for a V press that lands on nothing (see handleRecover()) —
  // same idea as applyMissPenalty for a missed beat: stopping to crouch for
  // nothing still costs real distance, so spamming V "just in case" isn't
  // free.
  var KINOKO_FAIL_PENALTY = 6;
  // playerD only advances via handleLane()'s success branch, at roughly
  // HIT_GAIN*combo*(PLAYER_RETREAT_RANGE/GAP_MAX) per hit — averaging
  // combo's climb out, that's only around 0.5-0.6 per hit, or under 1
  // unit/second even landing every single beat perfectly. 60-200 (the
  // original range here) meant *at best* a full minute of flawless play
  // before the very first spawn was even in range, which in practice reads
  // identically to "there is no kinoko" for anything short of an extended,
  // highly skilled run. Cut down by roughly 4x so a first encounter is
  // realistic within the first half-minute of ordinary play, not reserved
  // for a best-case marathon.
  var KINOKO_SPAWN_LEAD_MIN = 15, KINOKO_SPAWN_LEAD_MAX = 45;
  var KINOKO_LATERAL_MIN = 1.0, KINOKO_LATERAL_MAX = 2.0;
  var kinokoObj = null, kinokoSpawnD = null, kinokoLateralX = 0;
  // The poison variant — same model, same spawn/pickup rules (shares every
  // KINOKO_* constant above), reused as its own separate clone rather than
  // a second load: no reason to fetch+decode the same 281KB file twice.
  // Distinguished purely by material tint (a sickly violet, swapped in on
  // every mesh the clone contains) plus two thin vertical stripes added on
  // top of the cap — real geometry, not a texture, sized/placed from the
  // clone's own post-scale bounding box so it holds up even if this model
  // is ever swapped for a differently-proportioned one later.
  var POISON_TINT = 0x6a2f7a;
  var poisonKinokoObj = null, poisonKinokoSpawnD = null, poisonKinokoLateralX = 0;
  loadGltfTracked('recovery-kinoko.glb', function(gltf){
    kinokoObj = gltf.scene;
    kinokoObj.scale.setScalar(KINOKO_SCALE);
    kinokoObj.position.y = 0.2 * KINOKO_SCALE; // the model's own base sits slightly below its own origin
    kinokoObj.visible = false;
    scene.add(kinokoObj);

    poisonKinokoObj = kinokoObj.clone(true);
    poisonKinokoObj.traverse(function(o){
      if (o.isMesh){
        o.material = o.material.clone();
        o.material.color.setHex(POISON_TINT);
        // Emphasize the tint's own value over whatever the source photo
        // texture's albedo already was — a plain color swap on a textured
        // material often reads as barely-tinted, since the texture's own
        // luminance dominates the multiply.
        o.material.map = null;
      }
    });
    var poisonBox = new THREE.Box3().setFromObject(poisonKinokoObj);
    var capTop = poisonBox.max.y, capHeight = (poisonBox.max.y-poisonBox.min.y) * 0.35;
    var capRadius = Math.max(poisonBox.max.x-poisonBox.min.x, poisonBox.max.z-poisonBox.min.z) * 0.3;
    var stripeMat = new THREE.MeshBasicMaterial({color:0xe8d8ff});
    [-1, 1].forEach(function(side){
      var stripe = new THREE.Mesh(new THREE.BoxGeometry(capRadius*0.16, capHeight, capRadius*0.16), stripeMat);
      stripe.position.set(side*capRadius*0.55, capTop-capHeight*0.55, 0);
      poisonKinokoObj.add(stripe);
    });
    poisonKinokoObj.visible = false;
    scene.add(poisonKinokoObj);
  }, undefined, function(err){ if (window.console) console.error(err); });

  // Local +Z is the bear's forward (toward the camera, which sits at very negative
  // world Z relative to the bear) so the eyes face the player. The visible mesh
  // loads asynchronously (see GLTFLoader call below); the eye anchor is added
  // immediately so the gaze mechanic works even before it finishes loading.
  var bear = new THREE.Group();

  var eyeMat = new THREE.MeshBasicMaterial({color:COLOR_ACCENT, fog:false});
  eyeMat.toneMapped = false;
  var eyeGroup = new THREE.Group();
  eyeGroup.position.set(0, MODEL_EYE_Y, MODEL_EYE_Z);
  [-1,1].forEach(function(sgn){
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6), eyeMat);
    eye.position.set(sgn*0.13,0,0);
    eyeGroup.add(eye);
  });
  bear.add(eyeGroup);
  // bear.add(...) to `player` below, once `player` exists — see the
  // camera's own parenting note for why.

  // bear-rigged.glb is a proper skinned mesh with a 28-bone skeleton and a full
  // Mixamo-style clip library. Poses are mapped to game state (see frame()):
  //   approaching      -> Walk (slow, deliberate creep — not a run; see WALK_SPEED)
  //   lunge telegraph  -> Sword_Attack (one shot "about to strike" threat display)
  //   lunge burst      -> Sprint (the actual fast charge)
  //   point-blank gap  -> Fighting_Idle (nowhere left to close, no reason to jog in place)
  // rootBone's translation is re-zeroed every frame so any root motion baked into
  // a clip can't drag the mesh out from under our own gap-driven positioning of
  // the whole `bear` group.
  var bearModel = null, headBone = null, handBone = null, rootBone = null, mixer = null;
  var animActions = {}, animState = null;
  function findClip(animations, name){
    for (var i=0;i<animations.length;i++){ if (animations[i].name === name) return animations[i]; }
    return null;
  }
  // Deliberately doesn't call markPreloaded() — the game can't run without
  // this model, so a failure here holds the preload bar exactly where it
  // was and shows this message instead of letting the player through into
  // a run with no bear, rather than silently counting it "done" like every
  // other (gracefully-degradable) asset's own error path does.
  function onModelError(err){
    preloadStatus.textContent = '熊のモデルを読み込めませんでした';
    preloadStatus.hidden = false;
    if (window.console) console.error(err);
  }
  function setAnimState(name){
    if (name === animState) return;
    var prev = animActions[animState];
    var next = animActions[name];
    if (prev) prev.stop();
    if (next) next.reset().play();
    animState = name;
  }
  function finishGame(){
    if (elapsed>highScore){ highScore=elapsed; try{ localStorage.setItem(HIGH_KEY, String(highScore)); }catch(e){} }
    if (score>highScoreScore){ highScoreScore=score; try{ localStorage.setItem(SCORE_HIGH_KEY, String(highScoreScore)); }catch(e){} }
    overStats.textContent = 'Survival Time '+elapsed.toFixed(1)+'s   Best Survival '+Math.max(highScore,elapsed).toFixed(1)+'s';
    overScore.textContent = 'Score '+Math.round(score)+'   Best Score '+Math.round(Math.max(highScoreScore,score));
    cardOver.classList.add('visible');
    playDropIn(overReason);
  }
  function playDropIn(img){
    img.classList.remove('drop-in');
    void img.offsetWidth; // reflow so re-adding the class restarts the animation
    img.classList.add('drop-in');
  }

  new THREE.GLTFLoader().load('bear-rigged.glb', function(gltf){
    bearModel = gltf.scene;
    bearModel.scale.setScalar(ENEMY_MODEL_SCALE);
    bearModel.rotation.y = MODEL_FRONT_Z > 0 ? 0 : Math.PI;
    bear.add(bearModel);

    headBone = bearModel.getObjectByName('head');
    handBone = bearModel.getObjectByName('hand_r');
    rootBone = bearModel.getObjectByName('root');
    if (headBone) scene.attach(eyeGroup); // reparent, keeping its current world position

    mixer = new THREE.AnimationMixer(bearModel);
    [['idle','Fighting_Idle'],['run','Walk'],['threat','Sword_Attack'],['sprint','Sprint'],['closing','Run_Anime']].forEach(function(pair){
      var clip = findClip(gltf.animations, pair[1]);
      if (clip){
        var action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopRepeat);
        animActions[pair[0]] = action;
      }
    });
    setAnimState('idle');
    markPreloaded();
  }, undefined, onModelError);

  // farmer.glb: a dedicated player character replacing the earlier debug
  // placeholder (the bear rig reused as a stand-in). Same Mixamo-style skeleton
  // naming as bear-rigged.glb (spine_02, hand_r, etc.), so the hit-bone lookup
  // carries over unchanged. It shipped as a single 453k-triangle skinned mesh —
  // simplified to ~27k (gltf-transform simplify, same approach as the bear
  // model) with no visible quality loss and all 18 animation clips intact.
  // Walk_Backwards replaces Dance_Charleston for the stepping-back loop — an
  // actual retreat animation instead of a placeholder — and Hit_Knockback_RM
  // plays once on a confirmed hit, only ending the game once it finishes
  // (swapped in for Death_A, which at 4.5s ran far too long for a quick
  // game-over beat and read more like an execution than a bear swatting you
  // away). Idle_Shield is the default pose; Walk_Backwards plays through once
  // (a single step) per successful on-beat press rather than looping for as
  // long as a key is held, so the farmer only actually moves in step with
  // real progress instead of pacing in place while a key is just held down.
  var player = new THREE.Group();
  player.position.set(0, 0, 0);
  scene.add(player);
  // The camera and the bear are both literal children of `player`, not
  // positions manually kept in sync with it — wherever player.position
  // ends up on the track, they structurally have to be there too, with zero
  // chance of drifting apart. Their own position/rotation below are local
  // offsets from the player (see the bottom of frame() for the camera, and
  // the 'playing' block for the bear), unaffected by whatever curve the
  // player's own position/rotation traces out.
  player.add(camera);
  player.add(bear);
  var playerModel = null, playerHitBone = null, playerRootBone = null;
  var playerMixer = null, playerWalkAction = null, playerIdleAction = null, playerKnockbackAction = null, knockbackDuration = 1.0;
  var playerGetUpAction = null, getUpDuration = 1.0;
  var playerDodgeLeftAction = null, playerDodgeRightAction = null, dodgeLeftDuration = 0.6, dodgeRightDuration = 0.6;
  var playerBonusAction = null, bonusDuration = 1.0;
  var playerVictoryAction = null, victoryDuration = 1.0;
  var playerRecoverAction = null, recoverDuration = 1.0;
  var playerAnimState = null;
  function setPlayerAnim(name){
    if (name === playerAnimState) return;
    var actions = {walk: playerWalkAction, idle: playerIdleAction, dodgeL: playerDodgeLeftAction, dodgeR: playerDodgeRightAction, bonus: playerBonusAction, recover: playerRecoverAction};
    var prev = actions[playerAnimState];
    var next = actions[name];
    if (prev) prev.stop();
    if (next) next.reset().play();
    playerAnimState = name;
  }

  loadGltfTracked('farmer.glb', function(gltf){
    playerModel = gltf.scene;
    playerModel.scale.setScalar(PLAYER_MODEL_SCALE);
    playerModel.rotation.y = MODEL_FRONT_Z > 0 ? Math.PI : 0; // face the bear, opposite of the bear's own convention
    player.add(playerModel);
    playerHitBone = playerModel.getObjectByName('spine_02') || playerModel.getObjectByName('head');
    playerRootBone = playerModel.getObjectByName('root');

    playerMixer = new THREE.AnimationMixer(playerModel);
    var walkClip = findClip(gltf.animations, 'Walk_Backwards');
    if (walkClip){
      playerWalkAction = playerMixer.clipAction(walkClip);
      // One physical step per successful on-beat press, not a loop for as
      // long as the key stays held — LoopOnce so it plays through once and
      // holds, retriggered fresh (reset().play()) on every hit instead of
      // continuously driven by raw key-down state.
      playerWalkAction.setLoop(THREE.LoopOnce);
      playerWalkAction.clampWhenFinished = true;
      walkStepDuration = walkClip.duration;
    }
    var idleClip = findClip(gltf.animations, 'Idle_Shield');
    if (idleClip){
      playerIdleAction = playerMixer.clipAction(idleClip);
      playerIdleAction.setLoop(THREE.LoopRepeat);
    }
    var dodgeLeftClip = findClip(gltf.animations, 'Dodge_left_RM');
    if (dodgeLeftClip){
      playerDodgeLeftAction = playerMixer.clipAction(dodgeLeftClip);
      playerDodgeLeftAction.setLoop(THREE.LoopOnce);
      playerDodgeLeftAction.clampWhenFinished = true;
      dodgeLeftDuration = dodgeLeftClip.duration;
    }
    var dodgeRightClip = findClip(gltf.animations, 'Dodge_right_RM');
    if (dodgeRightClip){
      playerDodgeRightAction = playerMixer.clipAction(dodgeRightClip);
      playerDodgeRightAction.setLoop(THREE.LoopOnce);
      playerDodgeRightAction.clampWhenFinished = true;
      dodgeRightDuration = dodgeRightClip.duration;
    }
    playerAnimState = null;
    setPlayerAnim('idle');
    var knockbackClip = findClip(gltf.animations, 'Hit_Knockback_RM');
    if (knockbackClip){
      playerKnockbackAction = playerMixer.clipAction(knockbackClip);
      playerKnockbackAction.setLoop(THREE.LoopOnce);
      playerKnockbackAction.clampWhenFinished = true;
      knockbackDuration = knockbackClip.duration;
    }
    var getUpClip = findClip(gltf.animations, 'LayToIdle');
    if (getUpClip){
      playerGetUpAction = playerMixer.clipAction(getUpClip);
      playerGetUpAction.setLoop(THREE.LoopOnce);
      playerGetUpAction.clampWhenFinished = true;
      getUpDuration = getUpClip.duration;
    }
    // Played once in place of the usual single-step Walk_Backwards on
    // whichever press actually completes a GREEN_STREAK_TARGET pass (see
    // handleLane()'s success branch) — that hit already moves playerD by a
    // full WORLD_SCROLL_PER_PASS bonus on top of the ordinary per-hit
    // trickle, and displayD easing that jump in smoothly (rather than
    // snapping) still reads as an unexplained sudden burst of speed with
    // nothing on screen accounting for it. Jog reads as a real hustle —
    // scrambling backward faster for a moment — selling the burst as an
    // intentional payoff instead of a glitch.
    var bonusClip = findClip(gltf.animations, 'Jog');
    if (bonusClip){
      playerBonusAction = playerMixer.clipAction(bonusClip);
      playerBonusAction.setLoop(THREE.LoopOnce);
      playerBonusAction.clampWhenFinished = true;
      bonusDuration = bonusClip.duration;
    }
    // Played once when handleRecover() actually picks up the nearby
    // kinokoObj — a kneel reads as "picking something up off the ground"
    // far better than the walk step it replaces.
    var recoverClip = findClip(gltf.animations, 'Fixing_Kneeling');
    if (recoverClip){
      playerRecoverAction = playerMixer.clipAction(recoverClip);
      playerRecoverAction.setLoop(THREE.LoopOnce);
      playerRecoverAction.clampWhenFinished = true;
      // The raw clip reads as a slow, deliberate kneel — fine as a one-off,
      // but noticeably sluggish for something that happens mid-retreat with
      // a bear still closing in. Doubled speed here; recoverDuration (what
      // walkStepTimer actually waits on before switching back to idle — see
      // handleRecover()) is halved to match, so the idle switch still lines
      // up with when the sped-up clip actually finishes instead of holding
      // the pose twice as long as it now takes to play.
      playerRecoverAction.timeScale = 2;
      recoverDuration = recoverClip.duration / 2;
    }
    // Played once whenever the BGM actually switches to a different track
    // mid-run (see loadBgmTrack()'s apply()) — a hard, silent cut straight
    // into the next song's own lead-in read as a glitch more than a reward,
    // even though the tempo-up it follows from is a genuinely good thing
    // that just happened. This gives that moment its own beat: the old
    // track stops, the player celebrates, then the normal "3,2,1" carries
    // straight into the new song exactly as any other lead-in would.
    var victoryClip = findClip(gltf.animations, 'Victory');
    if (victoryClip){
      playerVictoryAction = playerMixer.clipAction(victoryClip);
      playerVictoryAction.setLoop(THREE.LoopOnce);
      playerVictoryAction.clampWhenFinished = true;
      victoryDuration = victoryClip.duration;
    }
    mixers.push(playerMixer);
  }, undefined, onModelError);

  function resetGame(){
    gap = GAP_START; elapsed = 0; score = 0; reactionTimer = 0;
    hp = maxHP; updateHpDisplay();
    combo = 1; missReactionTimer = 0; greenStreak = 0; worldScroll = 0;
    beatDur = 60/BPM; nextBeatTime = beatDur; beatOpen = false; beatHit = false;
    currentLane = 'L'; beatParity = false;
    lungeState = 'idle'; lungeTimer = 0; nextLungeAt = 1.2 + Math.random()*1.2;
    dodged = false; dodgeAttempted = false; dodgeTimer = 0;
    if (bearModel) bearModel.scale.x = ENEMY_MODEL_SCALE;
    if (playerModel) playerModel.scale.x = PLAYER_MODEL_SCALE;
    dodgeEls.forEach(function(el){ el.classList.remove('beat-active'); });
    for (var k in sp){ sp[k].cur = 0; sp[k].vel = 0; sp[k].target = 0; }
    yawTarget=0; pitchTarget=0; yawCur=0; pitchCur=0;
    // Nulling this (rather than leaving whatever the previous run ended on)
    // makes frame()'s own kinoko update schedule a brand new spawn ahead of
    // this fresh run's own starting D, instead of one left over from
    // wherever the last run happened to end.
    kinokoSpawnD = null;
    if (kinokoObj) kinokoObj.visible = false;
    poisonKinokoSpawnD = null;
    if (poisonKinokoObj) poisonKinokoObj.visible = false;
    if (playerKnockbackAction) playerKnockbackAction.stop();
    if (playerGetUpAction) playerGetUpAction.stop();
    if (playerBonusAction) playerBonusAction.stop();
    if (playerRecoverAction) playerRecoverAction.stop();
    if (playerVictoryAction) playerVictoryAction.stop();
    walkStepTimer = 0;
    playerAnimState = null;
    setPlayerAnim('idle');
    // playerD restarts each run from the same small offset the initial gap
    // itself represents (matching the scale handleLane()'s success branch
    // uses for every later hit), back to the start of the track. displayD
    // (see its own declaration) starts exactly caught up — no easing lag to
    // play catch-up on at the start of a fresh run. Deriving
    // player.position/rotation and the bear's own local offset here too
    // (rather than waiting for the first frame() call) avoids a one-frame
    // flash at the origin facing the default direction.
    playerD = (GAP_START/GAP_MAX) * PLAYER_RETREAT_RANGE;
    displayD = playerD;
    var resetPP = pathAt(displayD);
    player.position.set(resetPP.x, 0, resetPP.z);
    player.rotation.y = -resetPP.phi;
    bear.position.z = Z_NEAR + (GAP_START/GAP_MAX)*(Z_FAR-Z_NEAR);
  }
  resetGame();

  // Shared by the "3,2,1" before a fresh run and the one after getting back
  // up — only the caller differs in whether resetGame() ran first. Enters
  // 'playing' right away; leadInBeats is what actually holds off scoring
  // and highlighting for the first 3 beats (see frame()'s 'playing' block).
  // `fresh` (only true from beginRun()) is what decides what happens to the
  // BGM: a real new run restarts it at beat 1, but the knockback-recovery
  // call (frame()'s 'gettingup' block, always passes nothing) leaves it
  // playing straight through and just resyncs the flash clock to wherever
  // the still-running music already is — cutting the music and jumping it
  // back to the start on every single hit read as harsh, and there was no
  // need for it: the music was never the thing that went out of sync, only
  // the flash clock's own zero-point did.
  function startLeadIn(fresh){
    leadInBeats = 3;
    beatDur = 60/BPM;
    if (fresh){
      restartBgm();
      nextBeatTime = beatClockNow();
    } else {
      // Catch nextBeatTime up to the present by whole beats, starting from
      // its own already-correct accumulated value — nextBeatTime was
      // tracking correctly the entire time leading up to this (via its own
      // += beatDur each cycle in frame()'s metronome block, each increment
      // using whatever BPM was current *at that moment*), right up until
      // knockback/gettingup froze the whole block. Recomputing it from
      // scratch as Math.ceil(beatClockNow()/beatDur)*beatDur was tried
      // first and is wrong whenever the BPM slider had been moved earlier
      // in the run: beatClockNow() is *total* real time elapsed since the
      // BGM itself started, and dividing all of that by only the *current*
      // beatDur ignores however much of it played at a different rate,
      // snapping to the wrong beat boundary — exactly the display/audio
      // mismatch this resync exists to prevent, not reintroduce.
      var now = beatClockNow();
      while (nextBeatTime < now) nextBeatTime += beatDur;
    }
    beatOpen = false; beatHit = false;
    // Not set to '3' here directly — that used to make the very first
    // digit appear immediately (right at this synchronous call), while '2'
    // and '1' only ever appear later, on each beatOpen rising edge in
    // frame()'s metronome block (see the same `if (leadInBeats > 0)` there).
    // For a fresh run nextBeatTime is ~0 already, so that gap was invisible
    // in practice — but for a knockback resync, nextBeatTime can land
    // anywhere up to a full beatDur after "now" (see the catch-up above),
    // so '3' was showing for a *different*, variable-length stretch than
    // '2' and '1' did right after it — the "ときどきあやしい" (occasionally
    // off) timing. Hidden here and left for that same rising-edge code to
    // show '3' itself, on-tempo, exactly like every other digit.
    countdownLabel.style.opacity = 0;
    // playerD is deliberately left alone here: for a fresh run, resetGame()
    // (called just before this from beginRun()) already set it; for a
    // post-getup lead-in, it should stay exactly wherever 'knockback' eased
    // it to (dyingStartD + KNOCKBACK_DISTANCE) rather than snapping down to
    // match current gap — see the ratchet comment in handleLane()'s success
    // branch for why the camera never moves backward like that.
  }
  function beginRun(){
    resumeAudioCtx();
    if (iosAudioUnlock){ iosAudioUnlock.currentTime = 0; iosAudioUnlock.play().catch(function(){}); }
    playSfx('start');
    stopGameoverBgm();
    // Applied fresh at the top of every run (not just once, on page load)
    // so BPM always starts at whichever LEVEL button was last picked on the
    // title card, regardless of where the auto tempo-up (or a manual
    // slider drag) left it during the previous attempt.
    setBPM(startBPM);
    resetGame();
    state = 'playing';
    startLeadIn(true);
  }

  // Floating "+N"/"-N" score feedback — anchored near the player (upper
  // right of where the third-person camera keeps them framed), not tucked
  // under the corner score readout where it went unnoticed. delta's own
  // sign picks the color (green gain / red loss), so this already supports
  // a future deduction event without any changes here. `prefix` is an
  // optional short label (e.g. 'PASS ') for a bonus that deserves calling
  // out as more than just another ordinary hit.
  // Stacked rather than dropped straight on top of each other: at high BPM
  // (or just a lucky streak), a new hit can land before the previous popup
  // has finished fading, and two/three landing on the exact same spot in
  // quick succession reads as one number stuck on screen, not several award
  // flashes — each extra one active at once climbs another notch higher so
  // a fast run of them fans out into a little rising column instead.
  var scorePopupDepth = 0;
  function showScorePopup(delta, prefix){
    var el = document.createElement('div');
    el.className = 'score-popup ' + (delta >= 0 ? 'gain' : 'loss');
    el.textContent = (prefix || '') + (delta >= 0 ? '+' : '') + delta;
    el.style.marginTop = (-scorePopupDepth * 24) + 'px';
    scorePopupDepth++;
    scorePopupAnchor.appendChild(el);
    setTimeout(function(){
      el.remove();
      scorePopupDepth = Math.max(0, scorePopupDepth - 1);
    }, 600);
  }

  function flashLane(lane, kind){
    var cls = kind === 'hit' ? 'beat-good' : 'beat-bad';
    laneEls[lane].forEach(function(el){
      el.classList.add(cls);
      setTimeout(function(){ el.classList.remove(cls); }, 220);
    });
  }

  function flashDodge(kind){
    var cls = kind === 'hit' ? 'beat-good' : 'beat-bad';
    dodgeEls.forEach(function(el){
      el.classList.add(cls);
      setTimeout(function(){ el.classList.remove(cls); }, 220);
    });
  }

  function flashRecover(kind){
    var cls = kind === 'hit' ? 'beat-good' : kind === 'warn' ? 'beat-active' : 'beat-bad';
    recoverEls.forEach(function(el){
      el.classList.add(cls);
      setTimeout(function(){ el.classList.remove(cls); }, 220);
    });
  }
  // One dodge attempt per telegraph/lunge cycle, and only one button — there's
  // no side to choose, only a timing window (lungeImpactAt ± DODGE_GOOD_WINDOW/2,
  // see the lungeState FSM below) to land the press in. Landing it plays the
  // dodge clip that actually matches attackSide and cancels the hit-radius
  // check below outright (there's no lateral player movement to simulate a
  // real dodge against, so this is a timing QTE rather than physical collision
  // avoidance). A mistimed or missing press used to play the *other* dodge
  // clip as a "flinched the wrong way" flourish, but blended so badly with
  // the hit reaction that followed it read as a glitch rather than a story —
  // it's a plain miss now: no animation of its own, the hit just lands.
  function handleDodge(){
    if (state !== 'playing') return;
    if (lungeState !== 'telegraph' && lungeState !== 'lunge') return;
    if (dodgeAttempted) return;
    dodgeAttempted = true;
    var onTime = Math.abs(elapsed - lungeImpactAt) <= DODGE_GOOD_WINDOW/2;
    // Dodge_left/right_RM are already the correct clip for each side — if a
    // walk step happened to leave the model mirrored (scale.x<0), a dodge
    // firing mid-mirror would render backwards on top of that. Un-mirror
    // before it plays, regardless of which side wins below.
    if (playerModel) playerModel.scale.x = PLAYER_MODEL_SCALE;
    if (onTime){
      dodged = true;
      setPlayerAnim(attackSide === 'L' ? 'dodgeL' : 'dodgeR');
      dodgeTimer = attackSide === 'L' ? dodgeLeftDuration : dodgeRightDuration;
      flashDodge('hit');
    } else {
      flashDodge('miss');
    }
  }

  // Always stops the player to crouch (Fixing_Kneeling) on a V press while
  // playing — a silent no-op read as "V doesn't work" the two times it
  // actually mattered (nothing in range, or HP already full), so every
  // press now visibly does *something*, and whether it actually finds a
  // kinoko or not is shown by the flash on the button/HUD, the same way a
  // dodge press always plays a dodge clip regardless of hit or miss.
  function handleRecover(){
    if (state !== 'playing') return;
    var inRange = false;
    if (kinokoSpawnD !== null && kinokoObj && kinokoObj.visible && displayD >= kinokoSpawnD){
      var dx = kinokoObj.position.x - player.position.x, dz = kinokoObj.position.z - player.position.z;
      if (Math.sqrt(dx*dx + dz*dz) < KINOKO_PICKUP_RADIUS) inRange = true;
    }
    var poisonInRange = false;
    if (poisonKinokoSpawnD !== null && poisonKinokoObj && poisonKinokoObj.visible && displayD >= poisonKinokoSpawnD){
      var pdx = poisonKinokoObj.position.x - player.position.x, pdz = poisonKinokoObj.position.z - player.position.z;
      if (Math.sqrt(pdx*pdx + pdz*pdz) < KINOKO_PICKUP_RADIUS) poisonInRange = true;
    }
    if (poisonInRange){
      // Same "always consumes on a successful press" logic as the healing
      // kinoko below — relocating it is what makes the pickup register as
      // having actually happened, not the crouch animation playing over a
      // mushroom that just sits there unchanged.
      poisonKinokoSpawnD = null;
      setBPM(Math.max(BPM_MIN, BPM - 10));
      flashRecover('warn');
      playSfx('poisonEating');
    } else if (inRange){
      // Setting this to null (rather than just hiding the mesh) is what
      // makes the pickup permanent for this spawn — frame()'s own update
      // sees a null kinokoSpawnD and schedules a brand new one further
      // ahead, same as if the player had simply walked past this one
      // unpicked. Consumed on ANY successful press now, even at full HP:
      // leaving it in place when there was nothing to heal meant the V
      // button's own live "in range" light (see frame()) stayed lit right
      // through the press, and the kinoko itself didn't move or react at
      // all — the crouch animation played, but with no HP change and the
      // mushroom still sitting right there unchanged, it read as the pickup
      // having silently failed rather than succeeded-but-nothing-to-gain.
      // Making it disappear (relocate far ahead, same as a real pickup)
      // every time the crouch actually connects gives an unambiguous
      // "yes, that worked" regardless of HP.
      kinokoSpawnD = null;
      if (hp < maxHP){
        hp = Math.min(maxHP, hp + 1);
        updateHpDisplay();
      }
      flashRecover('hit');
      playSfx('eating');
    } else {
      // Nothing was actually there to grab.
      gap = Math.max(0, gap - KINOKO_FAIL_PENALTY);
      flashRecover('miss');
    }
    // Fixing_Kneeling isn't a side-specific clip, so it always plays
    // un-mirrored regardless of whatever the last step happened to leave
    // scale.x at.
    if (playerModel) playerModel.scale.x = PLAYER_MODEL_SCALE;
    if (playerRecoverAction){
      if (playerIdleAction) playerIdleAction.stop();
      if (playerWalkAction) playerWalkAction.stop();
      if (playerBonusAction) playerBonusAction.stop();
      playerRecoverAction.reset().play();
      walkStepTimer = recoverDuration;
      playerAnimState = 'recover';
    }
  }

  // Retreating is now a rhythm check: a step only lands when `lane` matches the
  // currently-highlighted beat AND the press falls inside that beat's open window
  // (see frame() below). Anything else — wrong lane, a press outside the window,
  // or no press at all before the window closes (see the beatOpen-closing edge
  // in frame() below) — directly costs distance instead of being a no-op, which
  // is what makes blind button-mashing (and simply not playing) actively
  // counterproductive rather than merely neutral.
  function applyMissPenalty(lane){
    combo = 1; greenStreak = 0;
    var missPenalty = MISS_PENALTY_BASE + MISS_PENALTY_SCALE * (gap/GAP_MAX);
    gap = Math.max(0, gap - missPenalty);
    missReactionTimer = 0.55; // brief Run_Anime surge so the sudden jump forward reads as a lunge, not a teleport
    sp.fovKick.vel += 34;
    ['camSway','camRoll','camBounce'].forEach(function(k){ sp[k].vel += (Math.random()*2-1)*3.2; });
    flashLane(lane, 'miss');
  }
  function handleLane(lane){
    if (state === 'title'){ beginRun(); cardTitle.classList.remove('visible'); cardOver.classList.remove('visible'); return; }
    if (state === 'gameover'){
      if (performance.now() - gameoverEnteredAt < GAMEOVER_INPUT_DELAY) return;
      state='title'; resetGame(); stopGameoverBgm(); cardOver.classList.remove('visible'); cardTitle.classList.add('visible'); playDropIn(titleLogo); return;
    }
    if (state !== 'playing') return;
    if (leadInBeats > 0) return; // the "3,2,1" count-in — presses don't count either way

    if (beatOpen && !beatHit && lane === currentLane){
      beatHit = true;
      var sign = lane==='L' ? 1 : -1;
      sp.camSway.target = sign * 0.11;
      sp.camRoll.target = sign * 0.045;
      sp.camBounce.vel -= 1.9;
      var hitGainAmt = HIT_GAIN*combo;
      // max(gap, ...) rather than a plain clamp: gap can currently be
      // sitting above GAP_MAX from a just-landed pass bonus (see below), and
      // an ordinary hit landing right after one used to instantly clamp that
      // right back down to GAP_MAX — silently erasing almost the entire
      // bonus on the very next successful press, which is exactly what a
      // player good enough to land a pass was going to do. Never letting an
      // ordinary hit *decrease* gap keeps the bonus intact; it just stops
      // stacking further gain until WALK_SPEED/misses bring it back under
      // the normal ceiling.
      gap = Math.max(gap, Math.min(GAP_MAX, gap + hitGainAmt));
      // Every successful press moves playerD forward by a fixed share of
      // this same hit's gain — a direct, unconditional ratchet (see
      // playerD's own declaration), not the old `t*PLAYER_RETREAT_RANGE`
      // ceiling. That old formula capped out the instant gap first reached
      // GAP_MAX (t=1) and then went completely silent for the rest of the
      // run unless a full GREEN_STREAK_TARGET streak landed — which is
      // exactly the "background stops moving" bug: after the first minute
      // or so of ordinary play, nothing short of a flawless 10-in-a-row
      // streak advanced the track again. Scaled by PLAYER_RETREAT_RANGE/
      // GAP_MAX to match the pace that formula had before it hit that
      // ceiling, so normal play still feels the same early on — it just
      // never stops.
      playerD += hitGainAmt * (PLAYER_RETREAT_RANGE/GAP_MAX);
      combo = Math.min(COMBO_MAX, combo + COMBO_STEP);
      flashLane(lane, 'hit');
      var hitScoreGain = Math.round(SCORE_HIT_BASE * (BPM/SCORE_BASE_BPM));
      score += hitScoreGain;
      showScorePopup(hitScoreGain);
      // Counts toward a pass only if this hit landed while the meter is
      // actually showing green — use gap fresh off the update above rather
      // than the frame-start `t`, so a hit that itself pushes into green
      // still counts immediately instead of needing one more frame.
      var passLanded = false;
      if (gap/GAP_MAX > GREEN_T){
        greenStreak += 1;
        if (greenStreak >= GREEN_STREAK_TARGET){
          greenStreak = 0;
          passLanded = true;
          setBPM(Math.min(BPM_MAX, BPM + 2));
          playSfx('levelup');
          // A bonus chunk of real distance on top of the steady per-hit
          // trickle above, rewarding a clean streak instead of being the
          // *only* thing that moves the track.
          worldScroll += WORLD_SCROLL_PER_PASS;
          playerD += WORLD_SCROLL_PER_PASS;
          // gap is otherwise capped at GAP_MAX (see the ordinary hit-gain
          // line above), so without this the bear — parented to the player
          // and only ever repositioned via gap/GAP_MAX — would get dragged
          // along for this same jump with no visible change in how far
          // behind it is, reading as the bear teleporting forward in
          // lockstep with the player instead of being left behind. Letting
          // gap briefly exceed GAP_MAX (same conversion ratio as
          // hitGainAmt's own playerD share, just inverted) gives the bear
          // room to actually fall back further than its usual ceiling; the
          // ordinary WALK_SPEED decay a few lines down then eats back into
          // that surplus at its normal slow pace, same as any other gap
          // value above where it "should" settle. Still hard-capped at
          // PASS_GAP_MAX — back-to-back passes would otherwise stack this
          // without limit, and confirmed in play: past a certain distance
          // the bear is already far enough off-screen/out of frame that any
          // further growth just risks visibly odd behavior for no
          // perceptible payoff (the bear reappearing that far back already
          // reads as a clean "left behind", not a jarring warp).
          gap = Math.min(PASS_GAP_MAX, gap + WORLD_SCROLL_PER_PASS * (GAP_MAX/PLAYER_RETREAT_RANGE));
          var passScoreGain = Math.round(SCORE_PASS_BONUS * (BPM/SCORE_BASE_BPM));
          score += passScoreGain;
          showScorePopup(passScoreGain, 'PASS ');
        }
      } else {
        greenStreak = 0;
      }
      // A physical step (Walk_Backwards, one play-through) per successful
      // press — not an animation tied to how long the key happens to be
      // held. Bypasses setPlayerAnim's same-state no-op check so back-to-back
      // hits each restart the clip from frame 0 instead of the second one
      // being silently ignored. Walk_Backwards is a single clip covering one
      // side's step; mirrored via scale.x (same trick as the bear's attack
      // side) so 左足/L actually steps with the left foot and 右足/R with the
      // right, instead of both buttons playing the identical animation and
      // the distance-per-press never actually reading as a real step. The
      // one press that actually completes a pass (passLanded) plays Jog
      // instead — see its own loading for why a plain step isn't enough to
      // sell that particular hit's extra distance. Jog isn't a side-specific
      // clip like Walk_Backwards, so it always plays un-mirrored regardless
      // of which lane happened to complete the pass.
      if (passLanded && playerBonusAction){
        if (playerModel) playerModel.scale.x = PLAYER_MODEL_SCALE;
        if (playerIdleAction) playerIdleAction.stop();
        if (playerWalkAction) playerWalkAction.stop();
        if (playerRecoverAction) playerRecoverAction.stop();
        playerBonusAction.reset().play();
        walkStepTimer = bonusDuration;
        playerAnimState = 'bonus';
      } else if (playerWalkAction){
        if (playerModel) playerModel.scale.x = (lane === 'L' ? 1 : -1) * PLAYER_MODEL_SCALE;
        if (playerIdleAction) playerIdleAction.stop();
        // A bonus Jog (or a kinoko pickup's Fixing_Kneeling — see
        // handleRecover()) from just before this hit can still be clamped
        // on its last frame here (LoopOnce/clampWhenFinished holds the pose
        // but never stops the action on its own) — same class of bug as the
        // knockback blend noted below, stopped explicitly for the same
        // reason.
        if (playerBonusAction) playerBonusAction.stop();
        if (playerRecoverAction) playerRecoverAction.stop();
        playerWalkAction.reset().play();
        walkStepTimer = walkStepDuration;
        playerAnimState = 'walk';
      }
    } else {
      applyMissPenalty(lane);
    }
  }

  function stageActivate(){
    if (state === 'title'){ beginRun(); cardTitle.classList.remove('visible'); cardOver.classList.remove('visible'); }
    else if (state === 'gameover'){
      if (performance.now() - gameoverEnteredAt < GAMEOVER_INPUT_DELAY) return;
      state='title'; resetGame(); stopGameoverBgm(); cardOver.classList.remove('visible'); cardTitle.classList.add('visible'); playDropIn(titleLogo);
    }
    else if (state === 'playing'){ pauseGame(); }
    else if (state === 'paused'){ resumeGame(); }
  }
  // Tapping the empty stage — not any of the lane/dodge/recover buttons,
  // which stop this same click from bubbling here (see their own listeners
  // below) — pauses mid-run and resumes on the next tap. No mid-air state to
  // preserve: gap/HP/BPM are simply left exactly where they were (frame()'s
  // per-frame updates are gated on state==='playing'/'knockback'/'gettingup',
  // same freeze every other non-playing state already gets for free), only
  // combo/greenStreak reset — same "clean restart of the current streak,
  // not a punishing full reset" the countdown itself already implies.
  function pauseGame(){
    state = 'paused';
    stopBgm();
    cardPaused.classList.add('visible');
    playDropIn(pausedLogo);
  }
  function resumeGame(){
    combo = 1; greenStreak = 0;
    cardPaused.classList.remove('visible');
    state = 'playing';
    startLeadIn(true);
  }
  // Same reset the gameover->title transition already uses — bails out of
  // the run entirely rather than resuming it, so gap/HP/score/streak are
  // fully cleared, not just combo/greenStreak like a plain resume.
  function quitToTitle(){
    state = 'title';
    resetGame();
    stopBgm();
    cardPaused.classList.remove('visible');
    cardTitle.classList.add('visible');
    playDropIn(titleLogo);
  }
  // stopPropagation: without it, this click also bubbles to stageActivate()
  // — which by then sees state now already 'title' (quitToTitle() just set
  // it) and immediately beginRun()s a brand new run right underneath the
  // button press that was supposed to back out to the title screen instead.
  btnPauseToTitle.addEventListener('click', function(e){
    e.stopPropagation();
    quitToTitle();
  });

  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if (k==='z' || k==='arrowleft'){ if(!e.repeat){ e.preventDefault(); handleLane('L'); } }
    else if (k==='x' || k==='arrowright'){ if(!e.repeat){ e.preventDefault(); handleLane('R'); } }
    else if (k==='c'){ if(!e.repeat){ e.preventDefault(); handleDodge(); } }
    else if (k==='v'){ if(!e.repeat){ e.preventDefault(); handleRecover(); } }
    else if (k==='d'){ if(!e.repeat){ debugMapOn = !debugMapOn; debugMapCanvas.hidden = !debugMapOn; } }
    // Debug-only: replays the player's track-switch pose in place, with no
    // state/BGM/BPM side effects at all — for checking a clip on the actual
    // rigged model in the actual scene without needing to play through to a
    // real tier crossing every time.
    else if (k==='j'){ if(!e.repeat){
      if (playerVictoryAction) playerVictoryAction.reset().play();
    } }
  }, {passive:false});

  // Debug-only top-down overlay (D to toggle) — shows the player/bear's
  // actual world position against the dressed terrain's currently-recycled
  // window, so a "why is the ground bare here" question can be answered by
  // looking instead of guessing from synthetic tests that don't reproduce
  // real play. Everything here is plain world coordinates now — no anchor,
  // no rotation to account for.
  var debugMapPlayerWorld = new THREE.Vector3();
  var debugMapBearWorld = new THREE.Vector3();
  function drawDebugMap(){
    var ctx = debugMapCtx;
    var W = debugMapCanvas.width, H = debugMapCanvas.height;
    ctx.clearRect(0, 0, W, H);

    player.getWorldPosition(debugMapPlayerWorld);
    bear.getWorldPosition(debugMapBearWorld);

    ctx.fillStyle = '#cfe8b0';
    ctx.font = '11px monospace';
    ctx.textBaseline = 'top';
    var lines = [
      'state:' + state,
      't=' + (gap/GAP_MAX).toFixed(2) + ' gap=' + gap.toFixed(1),
      'worldScroll=' + worldScroll.toFixed(1),
      'playerD=' + playerD.toFixed(1) + ' displayD=' + displayD.toFixed(1)
    ];
    lines.forEach(function(line, i){ ctx.fillText(line, 6, 4 + i*13); });

    var mapTop = 58, mapH = 150;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.strokeRect(0.5, mapTop + 0.5, W - 1, mapH - 1);

    var scale = 0.75; // px per world unit
    var cx = W/2, cy = mapTop + mapH/2;
    function toCanvas(wx, wz){
      return { x: cx + (wx - debugMapPlayerWorld.x) * scale, y: cy + (wz - debugMapPlayerWorld.z) * scale };
    }
    // The recycled window each terrain group is currently drawing tiles/trees
    // from — see wrapZ() near the top — centered on the player, same X extent
    // the tree/grass placement code itself uses.
    function drawWindowRect(xMin, xMax, depth, color, dash){
      var zMin = debugMapPlayerWorld.z - depth/2, zMax = debugMapPlayerWorld.z + depth/2;
      var corners = [[xMin,zMin],[xMax,zMin],[xMax,zMax],[xMin,zMax]];
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, mapTop, W, mapH);
      ctx.clip();
      ctx.strokeStyle = color;
      ctx.setLineDash(dash || []);
      ctx.beginPath();
      corners.forEach(function(c, i){
        var p = toCanvas(c[0], c[1]);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
    drawWindowRect(-70, 70, TREE_WRAP_DEPTH, 'rgba(120,200,120,0.55)', [3, 3]);
    drawWindowRect(-56.7, 56.7, GRASS_WRAP_DEPTH, 'rgba(255,220,90,0.85)', []);

    // Every tree's actual current world position (not just the recycling
    // window it's drawn from) — only worth the extra per-tree draw calls
    // while this overlay is even on screen (see debugMapOn), so it doesn't
    // cost anything during normal play.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, mapTop, W, mapH);
    ctx.clip();
    ctx.fillStyle = 'rgba(120,200,120,0.9)';
    treeInstances.forEach(function(tr){
      var p = toCanvas(tr.obj.position.x, tr.obj.position.z);
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();

    // The current kinoko spawn, if any — same clip region as the trees
    // above, drawn bigger and in its own color since there's only ever one
    // and it's worth being able to spot at a glance (was it actually
    // spawned? where, relative to the player?).
    if (kinokoObj && kinokoObj.visible){
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, mapTop, W, mapH);
      ctx.clip();
      var kpp = toCanvas(kinokoObj.position.x, kinokoObj.position.z);
      // KINOKO_PICKUP_RADIUS ring first (underneath the dot) — this is the
      // actual pickup check (handleRecover()): plain straight-line distance
      // from the player to the kinoko's own rendered position, so standing
      // anywhere inside this circle on the map is reachable.
      ctx.strokeStyle = '#5cffb0';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(kpp.x, kpp.y, KINOKO_PICKUP_RADIUS*scale, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#ffd633';
      ctx.beginPath(); ctx.arc(kpp.x, kpp.y, 4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    if (poisonKinokoObj && poisonKinokoObj.visible){
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, mapTop, W, mapH);
      ctx.clip();
      var pkpp = toCanvas(poisonKinokoObj.position.x, poisonKinokoObj.position.z);
      ctx.strokeStyle = '#c07bff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pkpp.x, pkpp.y, KINOKO_PICKUP_RADIUS*scale, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#c07bff';
      ctx.beginPath(); ctx.arc(pkpp.x, pkpp.y, 4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    var pp = toCanvas(debugMapPlayerWorld.x, debugMapPlayerWorld.z);
    ctx.fillStyle = '#5fb2ff';
    ctx.beginPath(); ctx.arc(pp.x, pp.y, 4, 0, Math.PI*2); ctx.fill();

    var bp = toCanvas(debugMapBearWorld.x, debugMapBearWorld.z);
    ctx.fillStyle = '#ff6a4a';
    ctx.beginPath(); ctx.arc(bp.x, bp.y, 4, 0, Math.PI*2); ctx.fill();

    // Lap overview: the player's retreat traces a real athletics-track
    // shape — two straights joined by a semicircular curve at each end (see
    // pathAt() near the top) — so the local window above never shows "the
    // track" itself, only ever-recycled terrain around the player. This
    // second panel draws the actual outline (sampled from the very same
    // pathAt() the game itself positions everything with) and a marker at
    // the player's current spot on it, so the real shape and lap progress
    // can both be seen directly instead of just asserted.
    var ovTop = mapTop + mapH + 20, ovH = H - ovTop - 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.strokeRect(0.5, ovTop + 0.5, W - 1, ovH - 1);
    var lap = Math.floor(displayD / TRACK_PERIMETER);
    var lapProgress = displayD % TRACK_PERIMETER;
    if (lapProgress < 0) lapProgress += TRACK_PERIMETER;
    ctx.fillStyle = '#cfe8b0';
    ctx.fillText('lap ' + lap + '  ' + lapProgress.toFixed(0) + '/' + TRACK_PERIMETER.toFixed(0), 6, ovTop - 13);
    var trackW = 2*TRACK_CURVE_R, trackH = TRACK_STRAIGHT + 2*TRACK_CURVE_R;
    var ovPad = 10;
    var ovScale = Math.min((W - ovPad*2)/trackW, (ovH - ovPad*2)/trackH);
    var ovCx = W/2, ovCy = ovTop + ovH/2;
    function ovToCanvas(x, z){
      return { x: ovCx + (x - TRACK_CURVE_R) * ovScale, y: ovCy + (z - TRACK_STRAIGHT/2) * ovScale };
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    var OV_SAMPLES = 80;
    for (var oi = 0; oi <= OV_SAMPLES; oi++){
      var ovPP = pathAt((oi/OV_SAMPLES) * TRACK_PERIMETER);
      var ovP = ovToCanvas(ovPP.x, ovPP.z);
      if (oi === 0) ctx.moveTo(ovP.x, ovP.y); else ctx.lineTo(ovP.x, ovP.y);
    }
    ctx.stroke();
    var curPP = pathAt(displayD);
    var curP = ovToCanvas(curPP.x, curPP.z);
    ctx.fillStyle = '#5fb2ff';
    ctx.beginPath(); ctx.arc(curP.x, curP.y, 4, 0, Math.PI*2); ctx.fill();
  }
  // stopPropagation on all four: stageWrap's own click listener

  btnRecover.innerHTML = ICON_MUSHROOM;

  // unlike every other button above) — muting is something you want to be
  // able to flip from the title screen or mid-run alike, and toggling gain
  // on the persistent sfxGain/bgmGain nodes (see their own declaration)
  // never touches playback position, so there's no timing risk in doing it
  // at any moment.
  function updateSfxMuteUI(){

  btnSfxMute.addEventListener('click', function(){

  btnBgmMute.addEventListener('click', function(){
