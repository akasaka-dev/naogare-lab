<!DOCTYPE html>
<html lang="ja">
<head>
<!--
  黄昏のフォー・イン・ア・ロウ
  Created by naogare — https://www.youtube.com/@NMLabo
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="naogare">
<title>LineUp4 - 4個並べ対戦ゲーム</title>
<style>
  :root {
    --bg: #1e293b;
    --board: #2563eb;
    --slot: #0f172a;
    --p1: #ef4444;
    --p2: #eab308;
    --text: #f1f5f9;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* ---- Audio toggles (always visible, above every screen) ---- */
  #audioControls {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    z-index: 20;
    display: flex;
    gap: 8px;
  }
  .audio-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(15, 23, 42, 0.72);
    border: 1.5px solid rgba(148, 163, 184, 0.45);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(4px);
  }
  .audio-btn .audio-icon { font-size: 0.95rem; line-height: 1; }
  .audio-btn .kana-icon {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--accent);
  }
  .audio-btn.muted .kana-icon { color: inherit; }
  .audio-btn.muted {
    border-color: rgba(148, 163, 184, 0.25);
    color: rgba(241, 245, 249, 0.45);
  }
  .audio-btn.muted .audio-icon { filter: grayscale(1); opacity: 0.6; }
  @media (max-width: 480px) {
    .audio-btn .audio-label { display: none; }
    .audio-btn { padding: 8px; }
  }

  /* ---- Splash / title screen ---- */
  #splashScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  #splashScreen.show { opacity: 1; }
  #splashScreen.hide { opacity: 0; pointer-events: none; }
  #splashScreen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* title.webp is a wide landscape illustration — on narrow/portrait screens
     "cover" crops off the characters and part of the logo at the sides, so
     switch to "contain" (full artwork visible, letterboxed) there instead. */
  @media (max-aspect-ratio: 1/1) {
    #splashScreen img { object-fit: contain; }
  }

  /* ---- Full-screen CPU character backdrop (shown during play) ---- */
  #charBgWrap {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #charBgWrap.show { opacity: 1; }
  #charBgImg {
    height: 96vh;
    max-width: 62vw;
    object-fit: contain;
    object-position: bottom right;
    filter: drop-shadow(0 10px 34px rgba(0,0,0,0.65));
    -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 38%, rgba(0,0,0,0) 92%);
    mask-image: linear-gradient(to left, rgba(0,0,0,1) 38%, rgba(0,0,0,0) 92%);
  }
  #charBgOverlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
    background: linear-gradient(to right,
      rgba(10, 15, 30, 1) 0%,
      rgba(10, 15, 30, 0.88) 32%,
      rgba(10, 15, 30, 0.4) 58%,
      rgba(10, 15, 30, 0) 82%);
  }
  #charBgOverlay.show { opacity: 1; }

  /* On narrow screens there's no side-by-side space: the desktop layout
     (character peeking in from the right, page content to its left) leaves
     the character almost entirely masked out. Switch to a centered figure
     standing behind the bottom of the screen, fading out before it reaches
     the UI text up top, instead. */
  @media (max-width: 640px) {
    /* The board is opaque and claims the center/bottom of the screen, so a
       bottom-anchored character just disappears behind it. Put the character
       in a header band above the board instead — cropped to the upper body
       via object-fit:cover, faded out before it reaches the board — so it
       shows through behind the status text without the two fighting for the
       same space. */
    #charBgWrap { justify-content: center; align-items: flex-start; }
    #charBgImg {
      width: 100vw;
      max-width: 100vw;
      height: 36vh;
      max-height: 36vh;
      object-fit: cover;
      object-position: top center;
      opacity: 0.5;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 55%, rgba(0,0,0,0) 100%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 55%, rgba(0,0,0,0) 100%);
    }
    #charBgOverlay {
      background: linear-gradient(to bottom,
        rgba(10, 15, 30, 0.35) 0%,
        rgba(10, 15, 30, 0.08) 30%,
        rgba(10, 15, 30, 0) 45%);
    }
  }

  .page-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.15rem, 6.2vw, 1.8rem);
    letter-spacing: 0.05em;
    overflow-wrap: break-word;
    max-width: 100%;
  }
  .hidden { display: none !important; }

  /* ---- Title screen ---- */
  #titleScreen, #onlineScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 36px 30px;
    background: rgba(15, 23, 42, 0.55);
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    width: 100%;
    max-width: min(820px, 92vw);
    box-sizing: border-box;
  }
  @media (max-width: 480px) {
    #titleScreen, #onlineScreen { padding: 28px 18px; gap: 14px; }
  }
  #titleScreen p.subtitle, #onlineScreen p.subtitle {
    margin: -8px 0 4px;
    opacity: 0.75;
    font-size: 0.95rem;
  }
  #debugTrigger { user-select: none; }

  /* ---- Online multiplayer (create/join room) ---- */
  .online-join-row {
    display: flex;
    gap: 8px;
  }
  #onlineJoinCode {
    background: #0f172a;
    border: 2px solid #334155;
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    width: 140px;
    text-align: center;
  }
  #onlineJoinCode:focus { outline: none; border-color: var(--accent); }
  #onlineJoinBtn {
    padding: 10px 18px;
    border-radius: 10px;
  }
  .online-error {
    color: var(--p1);
    font-size: 0.85rem;
    min-height: 1.2em;
    margin: 0;
  }
  .online-room-code {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: var(--accent);
    background: #0f172a;
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 14px 24px;
  }
  .online-waiting-text {
    font-size: 0.95rem;
    margin: 0;
    animation: onlinePulse 1.6s ease-in-out infinite;
  }
  @keyframes onlinePulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.95; }
  }
  .mode-options {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-btn {
    background: #0f172a;
    border: 2px solid var(--accent);
    color: var(--text);
    padding: 22px 28px;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 180px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .mode-btn .emoji { font-size: 1.8rem; display: block; margin-bottom: 6px; }
  .mode-btn-sub {
    display: block;
    font-size: 0.68rem;
    font-weight: 500;
    opacity: 0.65;
    margin-top: 4px;
  }
  .mode-btn:hover {
    background: var(--accent);
    color: #0f172a;
    transform: translateY(-3px);
  }
  .mode-btn:hover .mode-btn-sub { color: #0f172a; opacity: 0.8; }

  .back-to-splash-btn {
    background: transparent;
    border: none;
    color: var(--text);
    opacity: 0.65;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 6px 10px;
  }
  .back-to-splash-btn:hover { opacity: 1; text-decoration: underline; }

  .credit {
    margin: 4px 0 0;
    font-size: 0.72rem;
    opacity: 0.45;
    letter-spacing: 0.02em;
  }
  .credit strong { font-weight: 700; opacity: 0.9; }
  .credit a {
    color: inherit;
    opacity: 0.8;
    text-decoration: none;
    border-bottom: 1px dotted currentColor;
  }
  .credit a:hover { opacity: 1; }

  /* ---- Ladder result overlay (shown between/after CPU matches) ---- */
  #resultOverlay {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 8, 18, 0.82);
    padding: 20px;
  }
  .result-card {
    background: rgba(15, 23, 42, 0.96);
    border: 2px solid var(--accent);
    border-radius: 18px;
    padding: 28px 30px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  }
  .result-portrait {
    width: 100%;
    height: 190px;
    border-radius: 12px;
    background: #0f172a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    margin-bottom: 14px;
  }
  .result-portrait:empty { display: none; margin: 0; }
  .result-portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  .result-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .result-message {
    font-size: 0.9rem;
    opacity: 0.85;
    line-height: 1.6;
    margin-bottom: 20px;
    white-space: pre-line;
  }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-actions button {
    width: 100%;
  }
  .result-actions .secondary {
    background: transparent;
    border: 2px solid #475569;
    color: var(--text);
  }

  /* ---- All-clear ending ---- */
  #endingScreen {
    position: fixed;
    inset: 0;
    z-index: 9;
    background: #000;
    overflow: hidden;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #endingScreen.show { opacity: 1; }
  #endingScroll {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  #endingScroll img {
    display: block;
    width: 100%;
    height: auto;
  }
  #endingScroll img.pan {
    animation: endingPan 22s ease-in-out forwards;
  }
  @keyframes endingPan {
    0%, 10% { transform: translateY(0); }
    90%, 100% { transform: translateY(calc(-100% + 100vh)); }
  }
  .ending-hint {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 10;
    color: var(--text);
    background: rgba(15, 23, 42, 0.65);
    border: 1.5px solid rgba(148, 163, 184, 0.45);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    pointer-events: none;
    opacity: 0;
    animation: endingHintFade 2s ease 1s forwards;
  }
  @keyframes endingHintFade {
    to { opacity: 0.9; }
  }

  /* ---- Online emote picker (flick/drag-scroll strip) + incoming popup ---- */
  /* max-width must stay tied to the viewport (vw), not just a flat px cap:
     #emoteScroller's 25 fixed-width icons give it a large intrinsic content
     width, and on portrait phones a flat 480px let that intrinsic width
     inflate #gameScreen (an auto-width flex column) past the viewport,
     clipping the board's side columns under body's overflow-x:hidden. */
  #onlineEmoteBar {
    width: 100%;
    max-width: min(480px, 92vw);
    margin-top: 14px;
  }
  #emoteScroller {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    padding: 4px 4px 10px;
    cursor: grab;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #emoteScroller::-webkit-scrollbar { display: none; }
  #emoteScroller.dragging { cursor: grabbing; }
  .emote-icon-btn {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    padding: 4px;
    border-radius: 12px;
    background: #0f172a;
    border: 2px solid #334155;
    cursor: pointer;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .emote-icon-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .emote-icon-btn:hover { border-color: var(--accent); }
  .emote-icon-btn:active { transform: scale(0.92); }

  #incomingEmote {
    position: fixed;
    top: 16vh;
    left: 50%;
    z-index: 8;
    width: 120px;
    height: 120px;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -12px) scale(0.5);
    transition: opacity 0.25s ease, transform 0.25s ease;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
  }
  #incomingEmote img { width: 100%; height: 100%; object-fit: contain; }
  #incomingEmote.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  /* Feedback for your OWN tap: a clone of the tapped icon rises from the
     button and fades, so it's clear the tap registered (opponent's popup
     via #incomingEmote is the only feedback that existed before). */
  .emote-fly {
    position: fixed;
    width: 44px;
    height: 44px;
    object-fit: contain;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: none;
    z-index: 9;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.9s ease 0.2s;
  }
  .emote-fly.rise {
    transform: translate(-50%, calc(-50% - 38vh)) scale(1.3);
    opacity: 0;
  }

  /* ---- Turn-order coin toss ---- */
  #turnDecideOverlay {
    position: fixed;
    inset: 0;
    z-index: 7;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 8, 18, 0.82);
  }
  .turn-decide-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .coin-wrap { perspective: 400px; }
  .coin {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--p1);
    box-shadow: 0 0 20px 6px rgba(255,255,255,0.18), 0 8px 20px rgba(0,0,0,0.5);
    animation: coinSpin 0.15s linear infinite;
  }
  .coin.settled { animation: coinSettle 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes coinSpin {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(0.12); }
  }
  @keyframes coinSettle {
    0% { transform: scaleX(0.12); }
    55% { transform: scaleX(1.18) scaleY(0.85); }
    75% { transform: scaleX(0.92) scaleY(1.06); }
    100% { transform: scaleX(1) scaleY(1); }
  }
  .turn-decide-text {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    opacity: 0;
    transition: opacity 0.25s ease;
    text-align: center;
  }
  .turn-decide-text.show { opacity: 1; }

  /* ---- Game screen ---- */
  #gameScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #status {
    font-size: 1.15rem;
    margin-bottom: 14px;
    min-height: 1.6em;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  .turn-indicator {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3) inset;
  }
  .turn-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    box-shadow: 0 0 0 2px var(--p2);
  }
  #modeLabel {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #opponentAvatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
  }

  /* ---- CPU speech bubble ---- */
  /* Sits where the game title used to be — reserves its slot only in CPU
     mode (toggled via the .hidden utility class in JS); the text itself
     still cross-fades in/out per line via the .show class. */
  #speechBubble {
    width: 100%;
    max-width: 420px;
    min-height: 64px;
    box-sizing: border-box;
    background: rgba(15, 23, 42, 0.94);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 12px 18px;
    margin: 0 0 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #speechBubble.show {
    opacity: 1;
    transform: translateY(0);
  }
  #speechBubble .bubble-name {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
  }
  #speechBubble .bubble-text {
    font-size: 0.92rem;
    line-height: 1.55;
  }
  #board-wrap {
    background: var(--board);
    padding: 10px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    position: relative;
  }
  #board-wrap.locked { pointer-events: none; opacity: 0.85; }
  #board {
    display: grid;
    grid-template-columns: repeat(7, minmax(38px, 60px));
    gap: 8px;
  }
  .col-hitzone {
    position: relative;
    cursor: pointer;
    aspect-ratio: 1 / 1;
  }
  .cell {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--slot);
    position: relative;
    transition: transform 0.15s ease;
  }
  .cell.p1 { background: var(--p1); box-shadow: 0 0 10px rgba(239,68,68,0.7); }
  .cell.p2 { background: var(--p2); box-shadow: 0 0 10px rgba(234,179,8,0.7); }
  .cell.drop {
    /* Purely cosmetic — game state already updates instantly on click,
       so this playing out slowly never blocks the next move. */
    animation: drop 1.1s;
    transform-origin: bottom center;
  }
  .cell.win {
    animation: pulse 0.8s ease-in-out infinite;
    box-shadow: 0 0 18px 4px var(--accent);
  }
  @keyframes drop {
    0%   { transform: translateY(-260%) scale(1, 1);         animation-timing-function: cubic-bezier(0.2, 0, 1, 0.35); }
    10%  { transform: translateY(-250%) scale(1, 1);         animation-timing-function: cubic-bezier(0.2, 0, 1, 0.35); }
    58%  { transform: translateY(0) scale(1, 1);              animation-timing-function: ease-out; }
    68%  { transform: translateY(3%) scale(1.1, 0.88);        animation-timing-function: ease-out; }
    80%  { transform: translateY(-7%) scale(0.96, 1.05);      animation-timing-function: ease-out; }
    91%  { transform: translateY(2%) scale(1.03, 0.97);       animation-timing-function: ease-out; }
    97%  { transform: translateY(-1%) scale(0.99, 1.01); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .col-hitzone:hover .cell:not(.p1):not(.p2) {
    background: #1e293b;
  }
  #controls {
    margin-top: 18px;
    display: flex;
    gap: 12px;
  }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.9); }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    filter: none;
    pointer-events: none;
  }
  #titleBtn {
    background: transparent;
    border: 2px solid #475569;
    color: var(--text);
  }
  #score {
    margin-top: 14px;
    display: flex;
    gap: 20px;
    font-size: 0.95rem;
    opacity: 0.85;
  }
</style>
</head>
<body>

  <!-- Always-on-top audio toggles — visible through every screen (splash, title, game, results) -->
  <div id="audioControls">
    <button id="bgmToggle" class="audio-btn" type="button" aria-label="BGMのオン/オフ" aria-pressed="true">

<script>
(function () {
  // ---------- Audio: looping BGM (file-based, per-screen tracks) + synthesized SFX (Web Audio API) ----------
  // Music lives in bgm/: title.mp3 plays on the splash/title screens, bgm.mp3
  // plays during actual matches. Either file can be missing (bgm.mp3 isn't
  // made yet) — playback just silently no-ops until it shows up. SFX are
  // generated on the fly via Web Audio API so they work immediately, no files
  // needed. Both toggles persist via localStorage and stay visible/functional
  // across every screen (splash, title, game, result overlay).
  // Some contexts (sandboxed embeds, certain mobile in-app browsers, strict
  // private-browsing modes) throw on any localStorage access rather than
  // just failing quietly — guard every call so a blocked storage API can
  // never take the rest of the game down with it.
  function safeStorageGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeStorageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
  }

  const SoundMgr = (function () {
    const STORAGE_BGM = 'lineup4_bgm_on';
    const STORAGE_SE = 'lineup4_se_on';
    let bgmOn = safeStorageGet(STORAGE_BGM) !== '0';
    let seOn = safeStorageGet(STORAGE_SE) !== '0';
    let unlocked = false;
    let ctx = null;

    // 'title' and 'game' are fixed tracks; 'level:N' is resolved to bgm/LVN.mp3
    // for a per-character theme, falling back to the generic game track (and
    // from there, silence) wherever a more specific file hasn't been added yet.
    const TITLE_URL = 'bgm/title.mp3';
    const GAME_URL = 'bgm/bgm.mp3';
    const ENDING_URL = 'bgm/ending.mp3';
    function levelUrl(level) { return 'bgm/LV' + level + '.mp3'; }
    function urlForKey(key) {
      if (key === 'title') return TITLE_URL;
      if (key === 'game') return GAME_URL;
      if (key === 'ending') return ENDING_URL;
      if (key.indexOf('level:') === 0) return levelUrl(key.slice(6));
      return null;
    }

    const BGM_VOLUME = 0.35;
    const trackMissing = {};
    let currentTrackKey = null;

    const bgmEl = document.getElementById('bgmAudio');
    bgmEl.volume = BGM_VOLUME;

    function ensureContext() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function fadeVolume(target, duration) {
      const start = bgmEl.volume;
      const t0 = performance.now();
      function step(now) {
        const t = Math.min(1, (now - t0) / duration);
        bgmEl.volume = start + (target - start) * t;
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function playTrack(key, fallbackKey) {
      if (trackMissing[key]) {
        if (fallbackKey) playTrack(fallbackKey, fallbackKey === 'game' ? null : 'game');
        return;
      }
      if (currentTrackKey === key) {
        if (bgmOn && unlocked) bgmEl.play().catch(() => {});
        return;
      }
      currentTrackKey = key;
      const switchSrc = () => {
        const thisKey = key;
        bgmEl.onerror = () => {
          trackMissing[thisKey] = true;
          if (fallbackKey && currentTrackKey === thisKey) {
            playTrack(fallbackKey, fallbackKey === 'game' ? null : 'game');
          }
        };
        bgmEl.src = urlForKey(key);
        if (bgmOn && unlocked) {
          bgmEl.volume = 0;
          bgmEl.play().then(() => fadeVolume(BGM_VOLUME, 500)).catch(() => {});
        } else {
          bgmEl.volume = BGM_VOLUME;
        }
      };
      if (!bgmEl.paused) {
        fadeVolume(0, 250);
        setTimeout(() => { bgmEl.pause(); switchSrc(); }, 260);
      } else {
        switchSrc();
      }
    }

    // Prefer a level-specific theme (bgm/LV{level}.mp3); silently falls back
    // to the shared game track if that file doesn't exist for this level yet.
    function playLevelTrack(level) {
      playTrack('level:' + level, 'game');
    }

    function tone(freq, duration, type, gainPeak, delay) {
      if (!seOn) return;
      const audioCtx = ensureContext();
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(gainPeak || 0.15, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    }

    return {
      unlock() {
        if (unlocked) return;
        unlocked = true;
        ensureContext();
        playTrack(currentTrackKey || 'title');
      },
      playTrack,
      playLevelTrack,
      setBgmOn(v) {
        bgmOn = v;
        safeStorageSet(STORAGE_BGM, v ? '1' : '0');
        if (v) {
          if (unlocked) bgmEl.play().catch(() => {});
        } else {
          bgmEl.pause();
        }
      },
      setSeOn(v) {
        seOn = v;
        safeStorageSet(STORAGE_SE, v ? '1' : '0');
      },
      isBgmOn: () => bgmOn,
      isSeOn: () => seOn,
      seClick() { tone(520, 0.09, 'triangle', 0.12); },
      seDrop() { tone(160, 0.16, 'sine', 0.22); tone(90, 0.22, 'sine', 0.15, 0.03); },
      seWin() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, i * 0.09)); },
      seLose() { [392, 329.63, 261.63, 196].forEach((f, i) => tone(f, 0.28, 'sawtooth', 0.1, i * 0.11)); },
      seDraw() { tone(300, 0.2, 'sine', 0.12); tone(300, 0.2, 'sine', 0.12, 0.15); },
    };
  })();

  const bgmToggleBtn = document.getElementById('bgmToggle');
  const seToggleBtn = document.getElementById('seToggle');
  function refreshAudioButtons() {
    const bgmIcon = bgmToggleBtn.querySelector('.audio-icon');
    const seIcon = seToggleBtn.querySelector('.audio-icon');
    bgmToggleBtn.classList.toggle('muted', !SoundMgr.isBgmOn());
    bgmToggleBtn.setAttribute('aria-pressed', String(SoundMgr.isBgmOn()));
    bgmIcon.textContent = SoundMgr.isBgmOn() ? '🎵' : '🔇';
    seToggleBtn.classList.toggle('muted', !SoundMgr.isSeOn());
    seToggleBtn.setAttribute('aria-pressed', String(SoundMgr.isSeOn()));
    seIcon.textContent = SoundMgr.isSeOn() ? '🔔' : '🔕';
  }
  refreshAudioButtons();
  bgmToggleBtn.addEventListener('click', () => {
    SoundMgr.unlock();
    SoundMgr.setBgmOn(!SoundMgr.isBgmOn());
    refreshAudioButtons();
  });
  seToggleBtn.addEventListener('click', () => {
    SoundMgr.unlock();
    SoundMgr.setSeOn(!SoundMgr.isSeOn());
    SoundMgr.seClick();
    refreshAudioButtons();
  });

  // ---------- Kana mode: UI text only (buttons, labels, status messages).
  // Character names/dialogue are left as-is — this is about making the game's
  // own chrome readable without kanji, not a full localization pass. K()
  // picks the right string for whichever mode is active *at the moment it's
  // called*, so text built dynamically (status line, result overlays, etc.)
  // always reflects the current mode with no extra wiring; only text that's
  // set once into static HTML needs applyKanaMode() to re-run on toggle.
  const KANA_STORAGE_KEY = 'lineup4_kana_on';
  let kanaMode = safeStorageGet(KANA_STORAGE_KEY) === '1';
  function K(kanji, kana) { return kanaMode ? kana : kanji; }

  const kanaToggleBtn = document.getElementById('kanaToggle');
  function refreshKanaButton() {
    kanaToggleBtn.classList.toggle('muted', !kanaMode);
    kanaToggleBtn.setAttribute('aria-pressed', String(kanaMode));
  }
  refreshKanaButton();
  kanaToggleBtn.addEventListener('click', () => {
    SoundMgr.unlock();
    SoundMgr.seClick();
    kanaMode = !kanaMode;
    safeStorageSet(KANA_STORAGE_KEY, kanaMode ? '1' : '0');
    refreshKanaButton();
    applyKanaMode();
  });

  // Re-renders every *statically*-placed UI string (button labels, headings,
  // placeholders) for the current kanaMode. Dynamic strings (status line,
  // result overlays, ...) don't need this — they already call K() fresh each
  // time they run — but if a match is already in progress we also nudge the
  // couple of screens that only render once at match start.
  function applyKanaMode() {
    document.getElementById('titlePrefix').textContent = K('黄昏のフォー・イン・ア・', 'たそがれのフォー・イン・ア・');
    document.getElementById('titleSubtitle').textContent = K('遊び方を選んでください', 'あそびかたをえらんでください');
    document.getElementById('pvpBtnLabel').textContent = K('対人戦', 'たいじんせん');
    document.getElementById('cpuBtnLabel').textContent = K('CPU戦', 'CPUせん');
    document.getElementById('cpuBtnSub').textContent = K('LV1からの勝ち抜き', 'LV1からのかちぬき');
    document.getElementById('onlineBtnLabel').textContent = K('オンライン対戦', 'オンラインたいせん');
    document.getElementById('onlineBtnSub').textContent = K('友達を招待', 'ともだちをしょうたい');
    const backLabel = K('← タイトルに戻る', '← タイトルにもどる');
    document.getElementById('backToSplashBtn').textContent = backLabel;
    document.getElementById('onlineBackBtn').textContent = backLabel;

    document.getElementById('onlineHeading').textContent = '🌐 ' + K('オンライン対戦', 'オンラインたいせん');
    document.getElementById('onlineIntro').textContent = K('友達を招待して対戦しましょう', 'ともだちをしょうたいしてたいせんしましょう');
    document.getElementById('onlineCreateBtnLabel').textContent = K('部屋を作る', 'へやをつくる');
    document.getElementById('onlineOrJoin').textContent = K('または、もらったコードで参加', 'または、もらったコードでさんか');
    document.getElementById('onlineJoinCode').placeholder = K('部屋コード', 'へやコード');
    document.getElementById('onlineJoinBtn').textContent = K('参加する', 'さんかする');
    document.getElementById('onlineShareInstructions').textContent = K('このコードを友達に伝えるか、URLを共有してください', 'このコードをともだちにつたえるか、URLをきょうゆうしてください');
    document.getElementById('onlineCopyBtn').textContent = K('招待URLをコピー', 'しょうたいURLをコピー');
    document.getElementById('onlineWaitingText').textContent = K('対戦相手を待っています…', 'たいせんあいてをまっています…');
    document.getElementById('onlineCancelBtn').textContent = 'キャンセル';

    resetBtn.textContent = K('最初からやり直す', 'さいしょからやりなおす');
    titleBtn.textContent = K('タイトルに戻る', 'タイトルにもどる');

    // If a match is already up, refresh what's currently on screen too.
    if (!gameScreen.classList.contains('hidden')) {
      if (mode === 'pvp') {
        modeLabelEl.textContent = K('対人戦モード', 'たいじんせんモード');
      } else if (mode === 'online' && online) {
        modeLabelEl.textContent = `${K('オンライン対戦', 'オンラインたいせん')}（${K('部屋', 'へや')}: ${online.code}） ／ ${K('あなたは', 'あなたは')}${online.myPlayer === 1 ? K('赤', 'あか') : K('黄', 'き')}`;
      }
      if (typeof currentPlayer !== 'undefined' && !gameOver) updateStatus();
      updateScoreboard();
    }
  }

  // ---------- Splash screen ----------
  const splashScreen = document.getElementById('splashScreen');
  function showSplash() {
    SoundMgr.playTrack('title');
    splashScreen.classList.remove('hide');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => splashScreen.classList.add('show'));
    });
  }
  function hideSplash() {
    SoundMgr.unlock();
    SoundMgr.seClick();
    splashScreen.classList.remove('show');
    splashScreen.classList.add('hide');
  }
  showSplash();
  splashScreen.addEventListener('click', () => {
    hideSplash();
    // A friend's invite link (?room=CODE) skips straight to joining that room.
    const roomParam = new URLSearchParams(location.search).get('room');
    if (roomParam) {
      const code = roomParam.trim().toUpperCase();
      goToOnlineScreen();
      onlineJoinCodeEl.value = code;
      joinOnlineRoom(code);
    }
  });

  document.getElementById('backToSplashBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    showSplash();
  });

  const ROWS = 6;
  const COLS = 7;
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');
  const titleBtn = document.getElementById('titleBtn');
  const score1El = document.getElementById('score1');
  const score2El = document.getElementById('score2');
  const boardWrap = document.getElementById('board-wrap');
  const modeLabelEl = document.getElementById('modeLabel');

  const titleScreen = document.getElementById('titleScreen');
  const gameScreen = document.getElementById('gameScreen');
  const pvpBtn = document.getElementById('pvpBtn');
  const cpuBtn = document.getElementById('cpuBtn');
  const onlineBtn = document.getElementById('onlineBtn');

  // ---------- CPU character roster ----------
  // 5-stage strength ladder. `depth` = minimax search depth, `wildness` = chance
  // the character ignores the calculated best move in favor of a rough/random one
  // (a winning move is always taken regardless, so weaker levels never look "broken").
  const CHARACTERS = [
    { level: 1, name: '荒くれストライカー', stars: 2, img: 'chara/LV1.webp', emoji: '👊',
      desc: '力任せで攻めてくるチンピラ系', depth: 1, wildness: 0.40,
      lines: {
        normal: [
          'へへっ、どこに置こうが俺の勝ちだぜ！',
          '考えすぎんな！　ガツンと来いよ！',
          'その一手、俺には丸見えだぜ！',
          'おいおい、そんなところに置いていいのか？',
          'まだまだ！　ここからひっくり返してやる！',
        ],

  const PUPPETS = {
    fox: '🦊 きつね',
    owl: '🦉 ふくろう',
    mouse: '🐭 ねずみ',
    badger: '🦡 あなぐま',
  };
  function speakerName(ch, speakerKey) {
    return speakerKey === 'master' ? ch.name : (PUPPETS[speakerKey] || speakerKey);
  }

  let grid, currentPlayer, gameOver, cellEls;
  let scores = { 1: 0, 2: 0 };
  let mode = 'pvp'; // 'pvp' | 'cpu' | 'online'
  let currentChar = null;
  let ladderIndex = 0; // index into CHARACTERS for the current CPU ladder run
  let cpuThinking = false;
  let online = null; // { code, token, myPlayer, rev, timer, busy } while in an online match
  // Pending setTimeout that will call handleLadderOutcome() after a CPU
  // match's win/lose/draw line finishes playing. Must be cancelled by
  // initGame() — otherwise clicking "retry" while it's still pending lets it
  // fire mid-way through the NEW match and pop up a stale result overlay.
  let ladderOutcomeTimer = null;

  // ---------- Title screen wiring ----------
  function starString(n) {
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  }

  pvpBtn.addEventListener('click', () => { SoundMgr.seClick(); startGame('pvp'); });
  cpuBtn.addEventListener('click', () => { SoundMgr.seClick(); startLadder(); });

  function startLadder() {
    ladderIndex = 0;
    currentChar = CHARACTERS[0];
    startGame('cpu');
  }

  // ---------- Online multiplayer (friend invite via room code / URL) ----------
  // Server is authoritative: the Worker (src/line4-online.js) owns the grid,
  // turn order and win/draw detection in a dedicated D1 database. This client
  // only ever sends "I choose column N" and renders whatever state comes back
  // — it never decides a win/turn locally the way the pvp/cpu modes do.
  const ONLINE_API = '/api/line4';
  const ONLINE_POLL_MS = 1300;
  const onlineScreenEl = document.getElementById('onlineScreen');
  const onlineMenuEl = document.getElementById('onlineMenu');
  const onlineWaitingEl = document.getElementById('onlineWaiting');
  const onlineErrorEl = document.getElementById('onlineError');
  const onlineRoomCodeEl = document.getElementById('onlineRoomCode');
  const onlineJoinCodeEl = document.getElementById('onlineJoinCode');

  async function apiPost(path, body) {
    const res = await fetch(ONLINE_API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    return res.json();
  }
  async function apiGet(path) {
    const res = await fetch(ONLINE_API + path);
    return res.json();
  }

  function onlineErrorMessages() {
    return {
      room_not_found: K('部屋が見つかりませんでした。コードを確認してください。', 'へやがみつかりませんでした。コードをかくにんしてください。'),
      room_full: K('その部屋にはすでに2人揃っています。', 'そのへやにはすでに2にんそろっています。'),
      invalid_body: K('コードを入力してください。', 'コードをにゅうりょくしてください。'),
      server_error: K('通信エラーが発生しました。もう一度お試しください。', 'つうしんエラーがはっせいしました。もういちどおためしください。'),
    };
  }
  function showOnlineError(code) {
    onlineErrorEl.textContent = onlineErrorMessages()[code] || onlineErrorMessages().server_error;
  }
  function clearOnlineError() {
    onlineErrorEl.textContent = '';
  }

  function showOnlineMenu() {
    stopOnlinePolling();
    online = null;
    onlineWaitingEl.classList.add('hidden');
    onlineMenuEl.classList.remove('hidden');
    clearOnlineError();
  }

  function goToOnlineScreen() {
    titleScreen.classList.add('hidden');
    onlineScreenEl.classList.remove('hidden');
    showOnlineMenu();
  }

  onlineBtn.addEventListener('click', () => { SoundMgr.seClick(); goToOnlineScreen(); });
  document.getElementById('onlineBackBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    onlineScreenEl.classList.add('hidden');
    titleScreen.classList.remove('hidden');
  });
  document.getElementById('onlineCancelBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    showOnlineMenu();
  });

  function inviteUrl(code) {
    const url = new URL(location.href);
    url.search = '?room=' + code;
    return url.toString();
  }

  document.getElementById('onlineCopyBtn').addEventListener('click', async (e) => {
    SoundMgr.seClick();
    const url = inviteUrl(online.code);
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(url);
      const original = btn.textContent;
      btn.textContent = 'コピーしました！';
      setTimeout(() => { btn.textContent = original; }, 1500);
    } catch (err) {
      window.prompt('このURLをコピーして送ってください:', url);
    }
  });

  async function createOnlineRoom() {
    clearOnlineError();
    const res = await apiPost('/room');
    if (!res.ok) { showOnlineError(res.error); return; }
    online = { code: res.code, token: res.token, myPlayer: 1, rev: res.state.rev, emoteRev: res.state.emoteRev || 0, timer: null, busy: false };
    onlineMenuEl.classList.add('hidden');
    onlineWaitingEl.classList.remove('hidden');
    onlineRoomCodeEl.textContent = res.code;
    pollForOpponent();
  }

  function pollForOpponent() {
    online.timer = setInterval(async () => {
      if (!online) return;
      try {
        const res = await apiGet(`/room/${online.code}/state`);
        if (res.ok && res.state.hasP2) {
          stopOnlinePolling();
          beginOnlineMatch(res.state);
        }
      } catch (e) { /* transient — try again next tick */ }
    }, ONLINE_POLL_MS);
  }

  async function joinOnlineRoom(code) {
    clearOnlineError();
    if (!code) { showOnlineError('invalid_body'); return; }
    const res = await apiPost(`/room/${code}/join`);
    if (!res.ok) { showOnlineError(res.error); return; }
    online = { code, token: res.token, myPlayer: 2, rev: res.state.rev, emoteRev: res.state.emoteRev || 0, timer: null, busy: false };
    beginOnlineMatch(res.state);
  }

  document.getElementById('onlineCreateBtn').addEventListener('click', () => { SoundMgr.seClick(); createOnlineRoom(); });
  document.getElementById('onlineJoinBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    joinOnlineRoom(onlineJoinCodeEl.value.trim().toUpperCase());
  });
  onlineJoinCodeEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('onlineJoinBtn').click();
  });

  function stopOnlinePolling() {
    if (online && online.timer) { clearInterval(online.timer); online.timer = null; }
  }

  function startOnlinePolling() {
    stopOnlinePolling();
    online.timer = setInterval(async () => {
      if (!online || online.busy) return;
      try {
        const res = await apiGet(`/room/${online.code}/state`);
        if (!res.ok) return;
        // Emote check rides on this same poll — no separate request needed.
        if (res.state.emoteRev !== online.emoteRev) {
          online.emoteRev = res.state.emoteRev;
          if (res.state.emoteBy && res.state.emoteBy !== online.myPlayer) {
            showIncomingEmote(res.state.emote);
          }
        }
        if (res.state.rev !== online.rev) applyOnlineState(res.state);
      } catch (e) { /* transient — try again next tick */ }
    }, ONLINE_POLL_MS);
  }

  const ONLINE_EMOTE_COOLDOWN_MS = 1500;
  let onlineEmoteCooldownUntil = 0;
  function flyEmoteFromButton(btn, iconId) {
    const rect = btn.getBoundingClientRect();
    const fly = document.createElement('img');
    fly.src = `emotes/${iconId}.webp`;
    fly.alt = '';
    fly.className = 'emote-fly';
    fly.style.left = `${rect.left + rect.width / 2}px`;
    fly.style.top = `${rect.top + rect.height / 2}px`;
    document.body.appendChild(fly);
    requestAnimationFrame(() => requestAnimationFrame(() => fly.classList.add('rise')));
    fly.addEventListener('transitionend', () => fly.remove());
    setTimeout(() => fly.remove(), 1400); // safety net if transitionend never fires
  }

  async function sendOnlineEmote(emoji, btn) {
    if (!online || mode !== 'online') return;
    const now = Date.now();
    if (now < onlineEmoteCooldownUntil) return;
    onlineEmoteCooldownUntil = now + ONLINE_EMOTE_COOLDOWN_MS;
    if (btn) flyEmoteFromButton(btn, emoji);
    try {
      const res = await apiPost(`/room/${online.code}/emote`, { token: online.token, emote: emoji });
      if (res.ok) online.emoteRev = res.state.emoteRev; // it's our own — don't pop it up for ourselves
    } catch (e) { /* not critical — just drop it */ }
  }

  function showIncomingEmote(iconId) {
    const el = document.getElementById('incomingEmote');
    document.getElementById('incomingEmoteIcon').src = `emotes/${iconId}.webp`;
    SoundMgr.seClick();
    el.classList.remove('show');
    void el.offsetWidth; // restart the pop animation even if one is already mid-flight
    el.classList.add('show');
    clearTimeout(showIncomingEmote._t);
    showIncomingEmote._t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // 25-icon picker: flicks/drags to scroll (native touch scrolling handles
  // that on its own), tap an icon to send. Only mouse pointers get a custom
  // click-and-drag pan, since a mouse has no native drag-to-scroll — touch
  // and pen are left to the browser's own momentum scrolling untouched, and
  // mobile browsers already suppress a click when a touch ends up scrolling.
  (function setupEmoteScroller() {
    const scroller = document.getElementById('emoteScroller');
    let isDown = false;
    let dragged = false;
    let startX = 0;
    let startScrollLeft = 0;

    scroller.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse') return;
      isDown = true;
      dragged = false;
      startX = e.clientX;
      startScrollLeft = scroller.scrollLeft;
      scroller.classList.add('dragging');
    });
    scroller.addEventListener('pointermove', (e) => {
      if (!isDown || e.pointerType !== 'mouse') return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 6) dragged = true;
      scroller.scrollLeft = startScrollLeft - dx;
    });
    function endDrag(e) {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      isDown = false;
      scroller.classList.remove('dragging');
    }
    scroller.addEventListener('pointerup', endDrag);
    scroller.addEventListener('pointercancel', endDrag);
    scroller.addEventListener('pointerleave', endDrag);

    scroller.addEventListener('click', (e) => {
      if (dragged) { dragged = false; return; } // that was a drag, not a tap
      const btn = e.target.closest('.emote-icon-btn');
      if (!btn) return;
      SoundMgr.seClick();
      sendOnlineEmote(btn.dataset.emote, btn);
    });
  })();

  function beginOnlineMatch(state) {
    mode = 'online';
    onlineScreenEl.classList.add('hidden');
    titleScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    document.getElementById('speechBubble').classList.add('hidden');
    document.getElementById('score').classList.add('hidden');
    resetBtn.classList.add('hidden');
    document.getElementById('onlineEmoteBar').classList.remove('hidden');
    setCharBackground(null);
    SoundMgr.playTrack('game');
    modeLabelEl.textContent = `${K('オンライン対戦', 'オンラインたいせん')}（${K('部屋', 'へや')}: ${online.code}） ／ ${K('あなたは', 'あなたは')}${online.myPlayer === 1 ? K('赤', 'あか') : K('黄', 'き')}`;

    grid = state.grid;
    gameOver = false;
    cellEls = [];
    buildBoard();
    hideBubble();
    updateStatus(K('先攻・後攻を決めています…', 'せんこう・こうこうをきめています…'));
    boardWrap.classList.add('locked');
    online.rev = state.rev;
    online.emoteRev = state.emoteRev || 0;
    decideStartingPlayer((starter) => {
      currentPlayer = starter;
      boardWrap.classList.remove('locked');
      updateStatus();
      startOnlinePolling();
    }, state.startingPlayer);
  }

  async function submitOnlineMove(col) {
    if (!online || online.busy || gameOver) return;
    if (currentPlayer !== online.myPlayer) return;
    online.busy = true;
    boardWrap.classList.add('locked');
    try {
      const res = await apiPost(`/room/${online.code}/move`, { token: online.token, col });
      if (res.ok) {
        applyOnlineState(res.state);
      } else {
        boardWrap.classList.remove('locked');
      }
    } catch (e) {
      boardWrap.classList.remove('locked');
    }
    online.busy = false;
  }

  // Renders whatever the server says the room looks like now — used both for
  // the response to our own move and for a poll that picked up the opponent's.
  function applyOnlineState(state) {
    if (!online || state.rev === online.rev) return;
    online.rev = state.rev;

    // Find the single cell that changed since our local copy and animate it
    // the same way a local drop does, then adopt the server grid as-is.
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === 0 && state.grid[r][c] !== 0) {
          const player = state.grid[r][c];
          cellEls[r][c].classList.add(player === 1 ? 'p1' : 'p2', 'drop');
          SoundMgr.seDrop();
        }
      }
    }
    grid = state.grid;
    currentPlayer = state.currentPlayer;
    gameOver = state.gameOver;

    if (state.gameOver) {
      stopOnlinePolling();
      document.getElementById('onlineEmoteBar').classList.add('hidden');
      if (state.winLine) state.winLine.forEach(([r, c]) => cellEls[r][c].classList.add('win'));
      const iWon = state.winner === String(online.myPlayer);
      const isDraw = state.winner === 'draw';
      if (isDraw) {
        updateStatus(K('引き分けです！', 'ひきわけです！'));
        SoundMgr.seDraw();
      } else {
        const winnerLabel = state.winner === '1' ? K('プレイヤー1（赤）', 'プレイヤー1（あか）') : K('プレイヤー2（黄）', 'プレイヤー2（き）');
        updateStatus(`🎉 ${winnerLabel}${K('の勝利！', 'のしょうり！')}`);
        if (iWon) SoundMgr.seWin(); else SoundMgr.seLose();
      }
      setTimeout(() => {
        showResultOverlay({
          title: isDraw ? K('引き分け', 'ひきわけ') : (iWon ? K('勝利！', 'しょうり！') : K('敗北……', 'はいぼく……')),
          message: isDraw ? K('オンライン対戦は引き分けに終わりました。', 'オンラインたいせんはひきわけにおわりました。') : (iWon ? K('相手に勝利しました！', 'あいてにしょうりしました！') : K('相手に敗れました……', 'あいてにやぶれました……')),
          buttons: [{ label: K('タイトルに戻る', 'タイトルにもどる'), primary: true, onClick: goToTitle }],
        });
      }, 1200);
      return;
    }

    boardWrap.classList.remove('locked');
    updateStatus();
  }

  // ---------- Hidden debug menu: double-click the "ロ" in the title ----------
  document.getElementById('debugTrigger').addEventListener('dblclick', (e) => {
    e.preventDefault();
    const overlay = document.getElementById('debugLevelOverlay');
    const actions = document.getElementById('debugLevelActions');
    actions.innerHTML = '';
    CHARACTERS.forEach((ch, idx) => {
      const b = document.createElement('button');
      b.textContent = `LV.${ch.level} ${ch.name}`;
      if (idx > 0) b.classList.add('secondary');
      b.addEventListener('click', () => {
        SoundMgr.seClick();
        overlay.classList.add('hidden');
        ladderIndex = idx;
        currentChar = ch;
        startGame('cpu');
      });
      actions.appendChild(b);
    });
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'キャンセル';
    cancelBtn.classList.add('secondary');
    cancelBtn.addEventListener('click', () => overlay.classList.add('hidden'));
    actions.appendChild(cancelBtn);
    overlay.classList.remove('hidden');
  });

  function startGame(selectedMode) {
    mode = selectedMode;
    titleScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    resetBtn.classList.remove('hidden');
    document.getElementById('score').classList.remove('hidden');
    const speechBubbleEl = document.getElementById('speechBubble');
    if (mode === 'cpu' && currentChar) {
      SoundMgr.playLevelTrack(currentChar.level);
      modeLabelEl.innerHTML = `
        <img id="opponentAvatar" src="${currentChar.img}" alt=""
             onerror="this.style.display='none'">
        LV.${currentChar.level}/5 ${currentChar.name}（${starString(currentChar.stars)}） ／ ${K('あなたは赤', 'あなたはあか')}`;
      setCharBackground(currentChar);
      speechBubbleEl.classList.remove('hidden');
    } else {
      SoundMgr.playTrack('game');
      modeLabelEl.textContent = K('対人戦モード', 'たいじんせんモード');

  function setCharBackground(ch) {
    const wrap = document.getElementById('charBgWrap');
    const overlay = document.getElementById('charBgOverlay');

      wrap.classList.remove('show');

  function goToTitle() {
    if (ladderOutcomeTimer) { clearTimeout(ladderOutcomeTimer); ladderOutcomeTimer = null; }
    SoundMgr.playTrack('title');
    stopOnlinePolling();
    online = null;
    gameScreen.classList.add('hidden');
    onlineScreenEl.classList.add('hidden');
    titleScreen.classList.remove('hidden');
    document.getElementById('onlineEmoteBar').classList.add('hidden');
    document.getElementById('incomingEmote').classList.remove('show');

    hideBubble();

  // ---------- All-clear ending: slow scroll through ending.webp over ending.mp3 ----------
  function showEndingScreen() {
    SoundMgr.playTrack('ending', 'title');
    const el = document.getElementById('endingScreen');
    const img = el.querySelector('img');
    img.classList.remove('pan');
    void img.offsetWidth; // restart the pan animation each time this is shown
    img.classList.add('pan');
    el.classList.remove('hidden');

  }

  document.getElementById('endingScreen').addEventListener('click', () => {
    SoundMgr.seClick();
    const el = document.getElementById('endingScreen');
    el.classList.remove('show');
    setTimeout(() => el.classList.add('hidden'), 500);
    goToTitle();

  titleBtn.addEventListener('click', () => { SoundMgr.seClick(); goToTitle(); });

  // ---------- Ladder progression (win → next challenger, lose → run over) ----------
  function showResultOverlay({ title, message, portraitImg, portraitEmoji, buttons }) {
    const overlay = document.getElementById('resultOverlay');
    const portraitEl = document.getElementById('resultPortrait');
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMessage').textContent = message;
    portraitEl.innerHTML = portraitImg
      ? `<img src="${portraitImg}" alt="" onerror="this.parentElement.innerHTML='${portraitEmoji || ''}'">`
      : (portraitEmoji || '');

    actionsEl.innerHTML = '';
    buttons.forEach(btn => {
      const b = document.createElement('button');
      b.textContent = btn.label;
      if (!btn.primary) b.classList.add('secondary');
      b.addEventListener('click', () => {

        overlay.classList.add('hidden');
        btn.onClick();
      });
      actionsEl.appendChild(b);
    });
    overlay.classList.remove('hidden');
  }

  function handleLadderOutcome(result) {
    if (result === 'draw') {
      showResultOverlay({
        title: K('引き分け', 'ひきわけ'),
        message: `${currentChar.name} ${K('との勝負は引き分けに終わりました。', 'とのしょうぶはひきわけにおわりました。')}`,
        portraitImg: currentChar.img,
        portraitEmoji: currentChar.emoji,
        buttons: [
          { label: K('もう一度対戦する', 'もういちどたいせんする'), primary: true, onClick: () => initGame() },
          { label: K('タイトルに戻る', 'タイトルにもどる'), onClick: goToTitle },
        ],
      });
      return;
    }

    if (result === 'lose') {
      showResultOverlay({
        title: K('敗北……', 'はいぼく……'),
        message: `LV.${currentChar.level} ${currentChar.name} ${K('に敗れました。', 'にやぶれました。')}\n${K('到達レベル', 'とうたつレベル')}: LV.${currentChar.level}`,
        portraitImg: currentChar.img,
        portraitEmoji: currentChar.emoji,
        buttons: [
          { label: K('このレベルに再挑戦する', 'このレベルにさいちょうせんする'), primary: true, onClick: () => startGame('cpu') },
          { label: K('LV1からやり直す', 'LV1からやりなおす'), onClick: startLadder },
          { label: K('タイトルに戻る', 'タイトルにもどる'), onClick: goToTitle },
        ],
      });
      return;
    }

    // result === 'win'
    if (ladderIndex >= CHARACTERS.length - 1) {
      showEndingScreen();
      return;
    }

    const beaten = currentChar;
    const next = CHARACTERS[ladderIndex + 1];
    showResultOverlay({
      title: `LV.${beaten.level} ${beaten.name} ${K('撃破！', 'げきは！')}`,
      message: `${K('次の刺客が現れた……', 'つぎのしかくがあらわれた……')}\nLV.${next.level} ${next.name}`,
      portraitImg: next.img,
      portraitEmoji: next.emoji,
      buttons: [
        { label: K('対戦開始', 'たいせんかいし'), primary: true, onClick: () => {
            ladderIndex++;
            currentChar = next;
            startGame('cpu');
          } },
        { label: K('ここでやめる（タイトルへ）', 'ここでやめる（タイトルへ）'), onClick: goToTitle },
      ],
    });
  }

  // ---------- Core game ----------
  function initGame() {
    if (ladderOutcomeTimer) { clearTimeout(ladderOutcomeTimer); ladderOutcomeTimer = null; }
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    gameOver = false;
    resetBtn.disabled = false;
    cpuThinking = false;
    buildBoard();
    hideBubble();
    updateStatus(K('先攻・後攻を決めています…', 'せんこう・こうこうをきめています…'));
    boardWrap.classList.add('locked');
    decideStartingPlayer((starter) => {
      currentPlayer = starter;
      boardWrap.classList.remove('locked');
      updateStatus();
      if (mode === 'cpu' && currentPlayer === 2 && !gameOver) {
        triggerCpuMove();
      }
    });
  }

  // Brief (~2s) coin-toss animation deciding who moves first, run before
  // every match (fresh game, reset, and each new CPU ladder opponent).
  function decideStartingPlayer(onDone, forcedStarter) {
    const overlay = document.getElementById('turnDecideOverlay');
    const coin = document.getElementById('turnCoin');
    const textEl = document.getElementById('turnDecideText');
    const starter = forcedStarter != null ? forcedStarter : (Math.random() < 0.5 ? 1 : 2);
    const starterLabel = starter === 1
      ? (mode === 'cpu' ? K('あなた（赤）', 'あなた（あか）') : K('プレイヤー1（赤）', 'プレイヤー1（あか）'))
      : (mode === 'cpu' ? opponentLabel() : K('プレイヤー2（黄）', 'プレイヤー2（き）'));

    coin.classList.remove('settled');
    coin.style.background = 'var(--p1)';
    textEl.classList.remove('show');
    textEl.textContent = K('先攻・後攻を決めています…', 'せんこう・こうこうをきめています…');
    overlay.classList.remove('hidden');

    let flip = 0;
    const flickerTimer = setInterval(() => {
      flip++;
      coin.style.background = flip % 2 === 0 ? 'var(--p1)' : 'var(--p2)';
    }, 110);

    setTimeout(() => {
      clearInterval(flickerTimer);
      coin.style.background = starter === 1 ? 'var(--p1)' : 'var(--p2)';
      coin.classList.add('settled');
      SoundMgr.seDrop();
      textEl.textContent = `${starterLabel}${K('の先攻です！', 'のせんこうです！')}`;
      textEl.classList.add('show');
    }, 1250);

    setTimeout(() => {
      overlay.classList.add('hidden');
      onDone(starter);
    }, 2000);
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    cellEls = [];
    for (let r = 0; r < ROWS; r++) {
      cellEls.push([]);
      for (let c = 0; c < COLS; c++) {
        const hitzone = document.createElement('div');
        hitzone.className = 'col-hitzone';
        hitzone.dataset.col = c;
        const cell = document.createElement('div');
        cell.className = 'cell';
        hitzone.appendChild(cell);
        hitzone.addEventListener('click', () => handleColumnClick(c));
        boardEl.appendChild(hitzone);
        cellEls[r].push(cell);
      }
    }
  }

  function opponentLabel() {
    return mode === 'cpu' && currentChar ? currentChar.name : K('プレイヤー2（黄）', 'プレイヤー2（き）');
  }

  function updateStatus(message) {
    if (message) {
      statusEl.innerHTML = message;
      return;
    }
    let indicator = `<span class="turn-indicator" style="background:var(--p1)"></span>`;
    let name = K('プレイヤー1（赤）', 'プレイヤー1（あか）');
    if (currentPlayer === 2) {
      name = opponentLabel();
      indicator = (mode === 'cpu' && currentChar)
        ? `<img class="turn-avatar" src="${currentChar.img}" alt="" onerror="this.outerHTML='<span class=&quot;turn-indicator&quot; style=&quot;background:var(--p2)&quot;></span>'">`
        : `<span class="turn-indicator" style="background:var(--p2)"></span>`;
    }
    statusEl.innerHTML = `${indicator} ${name}${K('の番です', 'のばんです')}`;
  }

  function handleColumnClick(col) {
    if (gameOver || cpuThinking) return;
    if (mode === 'cpu' && currentPlayer === 2) return; // block manual clicks during CPU turn
    if (mode === 'online') { submitOnlineMove(col); return; }
    dropPiece(col, currentPlayer);
  }

  function dropPiece(col, player) {
    const targetRow = getNextOpenRow(grid, col);
    if (targetRow === -1) return false;

    grid[targetRow][col] = player;
    const cellEl = cellEls[targetRow][col];
    cellEl.classList.add(player === 1 ? 'p1' : 'p2', 'drop');
    SoundMgr.seDrop();

    const winLine = checkWin(targetRow, col, player);
    if (winLine) {
      gameOver = true;
      winLine.forEach(([r, c]) => cellEls[r][c].classList.add('win'));
      scores[player]++;
      updateScoreboard();
      const name = player === 1 ? K('プレイヤー1（赤）', 'プレイヤー1（あか）') : opponentLabel();
      updateStatus(`🎉 ${name}${K('の勝利！', 'のしょうり！')}`);
      if (mode === 'cpu' && currentChar) {
        resetBtn.disabled = true; // re-enabled by initGame() once the next match actually starts
        if (player === 2) SoundMgr.seLose(); else SoundMgr.seWin();
        const spokenMs = speak(currentChar, player === 2 ? 'victory' : 'defeat');
        ladderOutcomeTimer = setTimeout(() => handleLadderOutcome(player === 1 ? 'win' : 'lose'), Math.max(1800, spokenMs + 600));
      } else {
        SoundMgr.seWin();
      }
      return true;
    }

    if (isBoardFull()) {
      gameOver = true;
      updateStatus(K('引き分けです！', 'ひきわけです！'));
      hideBubble();
      SoundMgr.seDraw();
      if (mode === 'cpu' && currentChar) {
        resetBtn.disabled = true; // re-enabled by initGame() once the next match actually starts
        ladderOutcomeTimer = setTimeout(() => handleLadderOutcome('draw'), 1000);
      }
      return true;
    }

    currentPlayer = currentPlayer === 1 ? 2 : 1;
    updateStatus();

    if (mode === 'cpu' && player === 2 && currentChar) {
      if (findImmediateWin(grid, 1) !== null) speak(currentChar, 'aboutToLose');
      else if (findImmediateWin(grid, 2) !== null) speak(currentChar, 'aboutToWin');
      else speak(currentChar, 'normal');
    }

    if (mode === 'cpu' && currentPlayer === 2 && !gameOver) {
      triggerCpuMove();
    }
    return true;
  }

  // ---------- CPU speech bubble ----------
  // Most characters speak a single line per category. LV5 (傀儡師) instead has
  // multi-speaker conversations (master + 4 puppets) — see PUPPETS above.
  // speak() returns how long (ms) the bubble will be showing, so callers can
  // delay any follow-up (e.g. the ladder result overlay) until it's done.
  let conversationTimer = null;

  function lineDelay(text) {
    return Math.max(1300, Math.min(2600, text.length * 110));
  }

  function showSingleLine(name, text) {
    const bubble = document.getElementById('speechBubble');
    document.getElementById('bubbleName').textContent = name;
    document.getElementById('bubbleText').textContent = text;
    bubble.classList.remove('show');
    void bubble.offsetWidth; // restart the fade/slide animation
    bubble.classList.add('show');
    return lineDelay(text);
  }

  function playConversation(ch, convo) {
    if (conversationTimer) { clearTimeout(conversationTimer); conversationTimer = null; }
    let i = 0;
    function step() {
      const line = convo[i];
      i++;
      showSingleLine(speakerName(ch, line.speaker), line.text);
      if (i < convo.length) {
        conversationTimer = setTimeout(step, lineDelay(line.text));
      }
    }
    step();
    return convo.reduce((sum, line) => sum + lineDelay(line.text), 0);
  }

  function speak(ch, category) {
    if (!ch || !ch.lines) return 0;
    const lineSet = (kanaMode && ch.linesKana) ? ch.linesKana : ch.lines;
    const data = lineSet[category];
    if (!data) return 0;

    if (category === 'victory' || category === 'defeat') {
      return Array.isArray(data) && typeof data[0] === 'object'
        ? playConversation(ch, data)
        : showSingleLine(ch.name, data);
    }

    if (!data.length) return 0;
    const picked = data[Math.floor(Math.random() * data.length)];
    return Array.isArray(picked)
      ? playConversation(ch, picked)
      : showSingleLine(ch.name, picked);
  }

  function hideBubble() {
    if (conversationTimer) { clearTimeout(conversationTimer); conversationTimer = null; }
    document.getElementById('speechBubble').classList.remove('show');
  }

  function triggerCpuMove() {
    cpuThinking = true;
    boardWrap.classList.add('locked');
    const thinkingAvatar = currentChar
      ? `<img class="turn-avatar" src="${currentChar.img}" alt="" onerror="this.outerHTML='<span class=&quot;turn-indicator&quot; style=&quot;background:var(--p2)&quot;></span>'">`
      : `<span class="turn-indicator" style="background:var(--p2)"></span>`;
    updateStatus(`${thinkingAvatar} ${opponentLabel()}${K('が考え中...', 'がかんがえちゅう...')}`);
    setTimeout(() => {
      const col = getCpuMove();
      cpuThinking = false;
      boardWrap.classList.remove('locked');
      if (col !== null) dropPiece(col, 2);
    }, 450);
  }

  function isBoardFull() {
    return grid[0].every(cell => cell !== 0);
  }

  function getNextOpenRow(g, col) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (g[r][col] === 0) return r;
    }
    return -1;
  }

  function checkWin(row, col, player) {
    const directions = [
      [[0, 1], [0, -1]],   // horizontal
      [[1, 0], [-1, 0]],   // vertical
      [[1, 1], [-1, -1]],  // diagonal \
      [[1, -1], [-1, 1]],  // diagonal /
    ];

    for (const pair of directions) {
      let line = [[row, col]];
      for (const [dr, dc] of pair) {
        let r = row + dr;
        let c = col + dc;
        while (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] === player) {
          line.push([r, c]);
          r += dr;
          c += dc;
        }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }

  function updateScoreboard() {
    score1El.textContent = `${K('プレイヤー1（赤）', 'プレイヤー1（あか）')}: ${scores[1]}${K('勝', 'しょう')}`;
    score2El.textContent = `${opponentLabel()}: ${scores[2]}${K('勝', 'しょう')}`;
  }

  resetBtn.addEventListener('click', () => { SoundMgr.seClick(); initGame(); });

  // ---------- CPU AI (minimax with alpha-beta pruning) ----------
  function getValidCols(g) {
    const cols = [];
    for (let c = 0; c < COLS; c++) if (g[0][c] === 0) cols.push(c);
    return cols;
  }

  function cloneGrid(g) {
    return g.map(row => row.slice());
  }

  function winningMoveGrid(g, player) {
    // horizontal
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        if (g[r][c] === player && g[r][c+1] === player && g[r][c+2] === player && g[r][c+3] === player) return true;
      }
    }
    // vertical
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r <= ROWS - 4; r++) {
        if (g[r][c] === player && g[r+1][c] === player && g[r+2][c] === player && g[r+3][c] === player) return true;
      }
    }
    // diagonal down-right
    for (let r = 0; r <= ROWS - 4; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        if (g[r][c] === player && g[r+1][c+1] === player && g[r+2][c+2] === player && g[r+3][c+3] === player) return true;
      }
    }
    // diagonal up-right
    for (let r = 3; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        if (g[r][c] === player && g[r-1][c+1] === player && g[r-2][c+2] === player && g[r-3][c+3] === player) return true;
      }
    }
    return false;
  }

  function evaluateWindow(win, piece) {
    const opp = piece === 1 ? 2 : 1;
    let score = 0;
    const countPiece = win.filter(v => v === piece).length;
    const countEmpty = win.filter(v => v === 0).length;
    const countOpp = win.filter(v => v === opp).length;
    if (countPiece === 4) score += 100;
    else if (countPiece === 3 && countEmpty === 1) score += 5;
    else if (countPiece === 2 && countEmpty === 2) score += 2;
    if (countOpp === 3 && countEmpty === 1) score -= 4;
    return score;
  }

  function scorePosition(g, piece) {
    let score = 0;
    const centerCol = Math.floor(COLS / 2);
    const centerCount = g.reduce((acc, row) => acc + (row[centerCol] === piece ? 1 : 0), 0);
    score += centerCount * 3;

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        score += evaluateWindow([g[r][c], g[r][c+1], g[r][c+2], g[r][c+3]], piece);
      }
    }
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r <= ROWS - 4; r++) {
        score += evaluateWindow([g[r][c], g[r+1][c], g[r+2][c], g[r+3][c]], piece);
      }
    }
    for (let r = 0; r <= ROWS - 4; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        score += evaluateWindow([g[r][c], g[r+1][c+1], g[r+2][c+2], g[r+3][c+3]], piece);
      }
    }
    for (let r = 3; r < ROWS; r++) {
      for (let c = 0; c <= COLS - 4; c++) {
        score += evaluateWindow([g[r][c], g[r-1][c+1], g[r-2][c+2], g[r-3][c+3]], piece);
      }
    }
    return score;
  }

  function isTerminalNode(g) {
    return winningMoveGrid(g, 1) || winningMoveGrid(g, 2) || getValidCols(g).length === 0;
  }

  function minimax(g, depth, alpha, beta, maximizing) {
    const validCols = getValidCols(g);
    const terminal = isTerminalNode(g);

    if (depth === 0 || terminal) {
      if (terminal) {
        if (winningMoveGrid(g, 2)) return [null, 10000000];
        if (winningMoveGrid(g, 1)) return [null, -10000000];
        return [null, 0];
      }
      return [null, scorePosition(g, 2)];
    }

    if (maximizing) {
      let value = -Infinity;
      let column = validCols[Math.floor(Math.random() * validCols.length)];
      for (const col of validCols) {
        const row = getNextOpenRow(g, col);
        const gCopy = cloneGrid(g);
        gCopy[row][col] = 2;
        const newScore = minimax(gCopy, depth - 1, alpha, beta, false)[1];
        if (newScore > value) { value = newScore; column = col; }
        alpha = Math.max(alpha, value);
        if (alpha >= beta) break;
      }
      return [column, value];
    } else {
      let value = Infinity;
      let column = validCols[Math.floor(Math.random() * validCols.length)];
      for (const col of validCols) {
        const row = getNextOpenRow(g, col);
        const gCopy = cloneGrid(g);
        gCopy[row][col] = 1;
        const newScore = minimax(gCopy, depth - 1, alpha, beta, true)[1];
        if (newScore < value) { value = newScore; column = col; }
        beta = Math.min(beta, value);
        if (alpha >= beta) break;
      }
      return [column, value];
    }
  }

  // Returns a column that would immediately win for `player`, or null.
  function findImmediateWin(g, player) {
    for (const col of getValidCols(g)) {
      const row = getNextOpenRow(g, col);
      const gCopy = cloneGrid(g);
      gCopy[row][col] = player;
      if (winningMoveGrid(gCopy, player)) return col;
    }
    return null;
  }

  function getCpuMove() {
    const validCols = getValidCols(grid);
    if (validCols.length === 0) return null;

    // Always take a winning move on offer, regardless of character strength,
    // so weaker levels never look "broken" by missing a free win.
    const winCol = findImmediateWin(grid, 2);
    if (winCol !== null) return winCol;

    const wildness = currentChar ? currentChar.wildness : 0;
    if (wildness > 0 && Math.random() < wildness) {
      return validCols[Math.floor(Math.random() * validCols.length)];
    }

    const depth = currentChar ? currentChar.depth : 3;
    const [col] = minimax(grid, depth, -Infinity, Infinity, true);
    return col === null ? validCols[0] : col;
  }

  applyKanaMode(); // render the title/online screens in the persisted mode
})();
</script>
