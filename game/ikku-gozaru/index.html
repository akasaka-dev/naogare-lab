<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta property="og:description" content="言葉玉を並べて五・七・五の俳句を詠む、和風の対戦パズルゲーム。A Japanese haiku word-tile battle game (5-7-5 mora).">

<meta name="twitter:title" content="一句ござる！ | Ikku Gozaru">
<meta name="twitter:description" content="言葉玉を並べて五・七・五の俳句を詠む、和風の対戦パズルゲーム。A Japanese haiku word-tile battle game (5-7-5 mora).">
<meta name="twitter:image" content="assets/title_poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sumi:#F5EEDC;
    --sumi-2:#EAE1C7;
    --sumi-3:#DED2AE;
    --washi:#2B2318;
    --washi-dim:#5C5140;
    --washi-faint:#8C7F62;
    --on-accent:#F7F1E2;
    --border:#CDBB8E;
    --border-soft:#D9CBA0;
    --hanko:#B23A26;
    --hanko-deep:#8f2d1e;
    --indigo:#3E5E7E;
    --indigo-deep:#2A4258;
    --gold:#A8791F;
    --ok:#4C7A4C;
    --warn:#A8791F;
    --bad:#9C3B2A;
    --spring:#B24A68;
    --summer:#2E6B45;
    --autumn:#96591C;
    --winter:#3D5F82;
    --kireji:#6F4F92;
    --filler:#6E6852;
    --font-display:'游明朝体','Yu Mincho','YuMincho','Hiragino Mincho ProN','Noto Serif JP',serif;
    --font-body:'游ゴシック体','Yu Gothic Medium','YuGothic','Hiragino Kaku Gothic ProN','Meiryo','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, #FFFBF0 0%, var(--sumi) 55%),
      var(--sumi);
    color:var(--washi);
    font-family:var(--font-body);
    min-height:100vh;
    padding:0rem 0rem 0rem;
    display:flex;
    justify-content:center;
  }
  .board{
    width:100%;
    max-width:720px;
    display:flex;
    flex-direction:column;
    gap:1.4rem;
  }
  .board--wide{
    max-width:1500px;
  }
  .hidden{display:none !important;}

  .loading-overlay{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1rem;
    background:
      radial-gradient(ellipse at 50% -10%, #FFFBF0 0%, var(--sumi) 55%),
      var(--sumi);
    transition:opacity .4s ease;
  }
  .loading-overlay__title{
    font-family:var(--font-display);
    font-size:1.5rem;
    letter-spacing:.1em;
    color:var(--washi);
  }
  .loading-overlay__bar{
    width:min(70%, 320px);
    height:8px;
    border-radius:999px;
    background:var(--sumi-3);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .loading-overlay__fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--hanko), var(--gold));
    transition:width .2s ease;
  }
  .loading-overlay__pct{
    font-family:var(--font-body);
    font-size:.85rem;
    color:var(--washi-dim);
  }

  /* ---- generic panel ---- */
  .panel{
    background:
      radial-gradient(circle at 15% 20%, rgba(43,35,24,0.035), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(43,35,24,0.03), transparent 45%),
      var(--sumi-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:1.6rem;
  }

  /* ---- title screen ---- */
  .hero{
    text-align:center;
    padding:0;
    position:relative;
  }
  .hero__poster-frame{
    position:relative;
    width:100%;
    aspect-ratio:700/1050;
    max-height:min(1000px, calc(100vh - 3rem));
    overflow:hidden;
    border-radius:6px;
    --pan-distance:0px;
  }
  .hero__poster{
    display:block;
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:auto;
    opacity:0;
    transform:translateY(0);
    animation:posterReveal 3.2s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay:0.15s;
  }
  @keyframes posterReveal{
    0%{opacity:0;transform:translateY(0);}
    18%{opacity:1;}
    100%{opacity:1;transform:translateY(calc(-1 * var(--pan-distance)));}
  }
  @media (prefers-reduced-motion:reduce){
    .hero__poster{animation:none;opacity:1;transform:translateY(calc(-1 * var(--pan-distance)));}
  }
  .version-label{
    position:fixed;
    right:0.6rem;
    bottom:0.6rem;
    z-index:60;
    font-family:var(--font-body);
    font-size:0.7rem;
    color:rgba(247,241,226,.55);
    text-shadow:0 1px 3px rgba(0,0,0,.8);
    pointer-events:none;
  }
  .hero__actions{
    position:fixed;
    left:50%;
    bottom:1rem;
    transform:translateX(-50%);
    width:100%;
    max-width:720px;
    z-index:50;
    display:flex;
    justify-content:center;
    gap:0.8rem;
    flex-wrap:wrap;
    padding:0 1rem;
    box-sizing:border-box;
  }
  .hero__actions .btn{box-shadow:0 2px 10px rgba(0,0,0,.5);}
  .hero__actions .btn--ghost{background:rgba(23,20,15,.55);backdrop-filter:blur(2px);color:var(--on-accent);border-color:rgba(247,241,226,.6);}
  .hero__actions .btn--ghost:hover{background:rgba(23,20,15,.75);border-color:var(--on-accent);color:var(--on-accent);}
  .sound-toggle:hover{background:rgba(23,20,15,.75);border-color:var(--on-accent);color:var(--on-accent);}

  .tutorial{
    padding:2rem 1.6rem 2.2rem;
  }
  @media (orientation:portrait){
    .tutorial{
      min-height:calc(100vh - 2.4rem);
      min-height:calc(100dvh - 2.4rem);
      display:flex;
      flex-direction:column;
      justify-content:center;
      box-sizing:border-box;
    }
  }
  .tutorial__progress{
    display:flex;
    justify-content:center;
    gap:0.4rem;
    margin-bottom:1.8rem;
  }
  .tutorial__dot{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--border);
  }
  .tutorial__dot.active{background:var(--hanko);}
  .tutorial__body{
    min-height:340px;
    text-align:center;
  }
  .tutorial-title{
    font-family:var(--font-display);
    font-size:1.35rem;
    margin:0 0 1.4rem;
    letter-spacing:0.04em;
  }
  .tutorial-rules{
    text-align:left;
    display:grid;
    gap:0.8rem;
    max-width:30em;
    margin:0 auto;
    font-size:0.92rem;
    color:var(--washi-dim);
    line-height:1.8;
  }
  .tutorial-rules li{list-style:none;display:flex;gap:0.6rem;}
  .tutorial-rules li::before{content:"—";color:var(--hanko);flex-shrink:0;}
  .tutorial-judge__portrait{
    width:calc(100% + 3.2rem);
    margin:0 -1.6rem;
  }
  .tutorial-judge__portrait img{width:100%;height:auto;display:block;}
  .tutorial__nav{
    display:flex;
    justify-content:space-between;
    margin-top:1.8rem;
    gap:0.8rem;
  }
  .btn{
    font-family:var(--font-body);
    font-size:0.95rem;
    letter-spacing:0.06em;
    padding:0.85rem 2rem;
    border-radius:4px;
    border:1px solid var(--hanko);
    background:var(--hanko);
    color:var(--on-accent);
    cursor:pointer;
    transition:background 0.15s, transform 0.1s, border-color 0.15s;
  }
  .btn:hover{background:var(--hanko-deep);border-color:var(--hanko-deep);}
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn--ghost{
    background:transparent;
    border:1px solid var(--border-soft);
    color:var(--washi-dim);
  }
  .btn--ghost:hover{border-color:var(--washi-faint);color:var(--washi);background:transparent;}
  .btn--indigo{background:var(--indigo);border-color:var(--indigo);}
  .btn--indigo:hover{background:var(--indigo-deep);border-color:var(--indigo-deep);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  /* ---- story screen ---- */
  .story-panel{
    position:relative;
    overflow:hidden;
  }
  @media (orientation:portrait){
    .story-panel{
      min-height:calc(100vh - 2.4rem);
      min-height:calc(100dvh - 2.4rem);
      display:flex;
      align-items:center;
    }
    .story-content{
      width:100%;
    }
  }
  .story-illust{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0.52;
  }
  @media (orientation:portrait){
    .story-illust{
      animation:storyIllustPan 28s ease-in-out infinite alternate;
    }
  }
  @keyframes storyIllustPan{
    0%{background-position:0% center;}
    100%{background-position:100% center;}
  }
  @media (prefers-reduced-motion:reduce){
    .story-illust{animation:none;}
  }
  .story-scrim{
    position:absolute;
    inset:0;
    background:rgba(245,238,220,0.6);
  }
  .story-content{
    position:relative;
    z-index:1;
    padding:1.8rem 1.6rem 2rem;
  }
  .story-meta{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    column-gap:0.7rem;
    row-gap:0.2rem;
    margin-bottom:1rem;
    padding-bottom:0.8rem;
    border-bottom:1px solid var(--border);
  }
  .story-act{
    font-family:var(--font-display);
    font-size:1.15rem;
    color:var(--hanko);
    letter-spacing:0.04em;
  }
  .story-name{
    font-family:var(--font-display);
    font-size:1.02rem;
    color:var(--washi);
  }
  .story-season-place{
    font-size:0.82rem;
    color:var(--washi-faint);
    margin-left:auto;
  }
  .story-text{
    font-size:0.95rem;
    line-height:1.95;
    color:var(--washi-dim);
    text-align:justify;
  }
  .story-nav{
    display:flex;
    justify-content:center;
    margin-top:1.8rem;
  }

  /* ---- ending screen ---- */
  .ending-panel{
    position:relative;
    overflow:hidden;
    padding:0;
    height:min(680px, calc(100vh - 2.4rem));
    height:min(680px, calc(100dvh - 2.4rem));
    background:#000;
  }
  .ending-bg{
    position:absolute;
    inset:0;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    opacity:0.45;
    transition:opacity 7s ease;
  }
  .ending-bg.reveal{opacity:1;}
  .ending-scrim{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(20,15,10,.78), rgba(20,15,10,.5) 30%, rgba(20,15,10,.5) 70%, rgba(20,15,10,.78));
    transition:opacity 7s ease;
  }
  .ending-scrim.reveal{opacity:0;}
  .ending-crawl-viewport{
    position:relative;
    z-index:1;
    height:100%;
    overflow:hidden;
  }
  .ending-crawl{
    position:absolute;
    left:0; right:0;
    padding:0 2.2rem;
    box-sizing:border-box;
    text-align:center;
    color:#f7f1e2;
    font-family:var(--font-display);
    line-height:2.1;
    font-size:clamp(14px, 2.6vw, 18px);
    white-space:pre-wrap;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  .ending-prompt{
    position:absolute;
    left:0; right:0; bottom:6%;
    z-index:2;
    text-align:center;
    color:#f7f1e2;
    font-size:0.8rem;
    letter-spacing:0.06em;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.6s ease;
    text-shadow:0 1px 4px rgba(0,0,0,.7);
  }
  .ending-prompt.show{
    opacity:0.9;
    animation:endingPromptPulse 1.8s ease-in-out infinite;
  }
  @keyframes endingPromptPulse{
    0%,100%{opacity:0.55;}
    50%{opacity:0.95;}
  }
  @media (prefers-reduced-motion:reduce){
    .ending-prompt.show{animation:none;}
  }

  /* ---- ending twist (co-op setup) ---- */
  .ending-twist-panel{
    position:relative;
    overflow:hidden;
    padding:0;
    background:#000;
    cursor:pointer;
    height:min(680px, calc(100vh - 2.4rem));
    height:min(680px, calc(100dvh - 2.4rem));
  }
  .ending-twist-bg{
    position:absolute;
    inset:0;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    opacity:0;
    transition:opacity 3s ease;
  }
  .ending-twist-bg.reveal{opacity:1;}
  .ending-twist-panel .ending-crawl-viewport{
    transition:opacity 1.5s ease;
  }
  .ending-twist-panel .ending-crawl-viewport.dim{opacity:0.35;}
  .ending-twist-flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    z-index:3;
    pointer-events:none;
  }
  .ending-twist-flash.impact{
    animation:endingTwistFlash 0.5s ease-out forwards;
  }
  @keyframes endingTwistFlash{
    0%{opacity:0;}
    12%{opacity:0.92;}
    100%{opacity:0;}
  }
  .ending-twist-logo{
    position:absolute;
    inset:0;
    background-size:72%;
    background-repeat:no-repeat;
    background-position:center;
    opacity:0;
    transform:scale(1.6);
    z-index:4;
    pointer-events:none;
  }
  .ending-twist-logo.impact{
    animation:endingTwistLogoIn 0.6s cubic-bezier(.17,.89,.32,1.49) forwards;
  }
  @keyframes endingTwistLogoIn{
    0%{opacity:0; transform:scale(1.6);}
    55%{opacity:1; transform:scale(0.93);}
    100%{opacity:1; transform:scale(1);}
  }
  @media (orientation:portrait){
    .ending-twist-panel{
      height:calc(100vh - 2.4rem);
      height:calc(100dvh - 2.4rem);
    }
  }
  @media (prefers-reduced-motion:reduce){
    .ending-twist-bg{transition:none;}
    .ending-twist-panel .ending-crawl-viewport{transition:none;}
    .ending-twist-flash.impact{animation:none;}
    .ending-twist-logo.impact{animation:none; opacity:1; transform:scale(1);}
  }

  @media (orientation:landscape){
    .story-panel{
      min-height:calc(100vh - 2.4rem);
      min-height:calc(100dvh - 2.4rem);
      display:flex;
      align-items:center;
      container-type:inline-size;
    }
    .story-content{
      width:100%;
    }
    .story-act{ font-size:clamp(1.15rem, 1.6cqw, 1.6rem); }
    .story-name{ font-size:clamp(1.02rem, 1.4cqw, 1.4rem); }
    .story-season-place{ font-size:clamp(0.82rem, 1.1cqw, 1.05rem); }
    .story-text{ font-size:clamp(0.95rem, 1.35cqw, 1.3rem); }
    .ending-panel{
      height:calc(100vh - 2.4rem);
      height:calc(100dvh - 2.4rem);
    }
    .ending-twist-panel{
      height:calc(100vh - 2.4rem);
      height:calc(100dvh - 2.4rem);
    }
  }

  /* ---- play screen (image-backed stage) ---- */
  .stage-panel{
    padding:0;
    overflow:hidden;
    position:relative;
    container-type:inline-size;
    width:100%;
    margin:0 auto;
  }
  .countdown-overlay{
    position:absolute;
    inset:0;
    background:rgba(23,20,15,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
  }
  .countdown-num{
    position:relative;
    z-index:2;
    font-family:var(--font-display);
    font-size:5.5rem;
    color:var(--gold);
    letter-spacing:0.05em;
    text-shadow:0 0 24px rgba(201,162,39,.85), 0 4px 12px rgba(0,0,0,.85);
  }
  .countdown-judges{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:1;
  }
  .countdown-judge-mark{
    position:absolute;
    max-height:36%;
    max-width:30%;
    width:auto;
    height:auto;
    opacity:0;
    filter:drop-shadow(0 4px 14px rgba(0,0,0,.7));
    animation-name:countdownJudgeFade;
    animation-timing-function:ease-in-out;
    animation-fill-mode:both;
  }
  .countdown-judge-mark--featured{
    max-height:62%;
    max-width:46%;
    z-index:1;
    filter:drop-shadow(0 6px 22px rgba(201,162,39,.75)) drop-shadow(0 4px 14px rgba(0,0,0,.8));
  }
  .countdown-judge-mark--grid{
    max-height:24%;
    max-width:20%;
  }
  @keyframes countdownJudgeFade{
    0%{opacity:0; transform:scale(0.85);}
    30%{opacity:1; transform:scale(1);}
    55%{opacity:1; transform:scale(1);}
    100%{opacity:0; transform:scale(0.9);}
  }
  @media (prefers-reduced-motion:reduce){
    .countdown-judge-mark{animation:none; opacity:1;}
  }
  .countdown-num.pulse{
    animation:countdownPulse 0.75s ease-out;
  }
  @keyframes countdownPulse{
    0%{opacity:0; transform:scale(1.7);}
    35%{opacity:1; transform:scale(1);}
    100%{opacity:1; transform:scale(1);}
  }
  @media (prefers-reduced-motion:reduce){
    .countdown-num.pulse{animation:none;}
  }
  .stage-frame{
    position:relative;
    width:100%;
    aspect-ratio:1080/1920;
    background-size:100% 100%;
    background-repeat:no-repeat;
    border-radius:6px;
    margin:0 auto;
    overflow:hidden;
    font-family:var(--font-body);
  }
  @media (orientation:portrait){
    .stage-frame{
      aspect-ratio:auto;
      height:calc(100vh - 2.4rem);
      height:calc(100dvh - 2.4rem);
    }
  }
  .stage-meter{
    position:absolute;
    left:64.81%; width:31.48%; top:3.23%; height:2.08%;
    display:flex; align-items:center; justify-content:center;
    padding:0 9%;
    box-sizing:border-box;
  }
  .stage-meter__track{
    position:relative;
    width:100%; height:52%;
    background:rgba(0,0,0,.5);
    border-radius:20px;
    overflow:hidden;
  }
  .stage-meter__fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:100%;
    background:linear-gradient(90deg, var(--gold), #e8c96a);
    transition:width 0.25s linear, background 0.3s;
  }
  .stage-meter__fill.low{background:#e8402c;}
  .stage-act-num{
    position:absolute;
    left:23.15%; width:12.50%; top:10.16%; height:3.91%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display);
    font-size:clamp(20px, 4.2cqw, 32px);
    color:#f3d98a;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
    font-variant-numeric:tabular-nums;
  }
  .stage-season-badge{
    position:absolute;
    left:51.06%; width:8.34%; top:9.77%; height:4.68%;
    z-index:2;
    background-size:100% 100%;
    background-repeat:no-repeat;
    background-position:center;
    pointer-events:none;
  }
  .stage-season-text{
    position:absolute;
    left:59.72%; width:11.11%; top:10.68%; height:2.86%;
    display:flex; align-items:center; justify-content:center;
    color:#f3d98a;
    font-size:clamp(12px, 1.9cqw, 15px);
    letter-spacing:0.02em;
    white-space:nowrap;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  .stage-timer-num{
    position:absolute;
    left:75.46%; width:12.96%; top:9.90%; height:5.21%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display);
    font-size:clamp(18px, 3.8cqw, 28px);
    color:var(--hanko);
    text-shadow:0 1px 2px rgba(255,255,255,.4);
    font-variant-numeric:tabular-nums;
    transition:color 0.3s;
  }
  .stage-timer-num.low{color:#e8402c;}

  .stage-row{
    position:absolute;
    left:20.83%; width:68.06%;
    padding:0.4rem 0.6rem;
    box-sizing:border-box;
    cursor:pointer;
    border-radius:6px;
    transition:box-shadow 0.15s;
    overflow:visible;
  }
  .stage-row[data-line="0"]{top:16.67%; min-height:11.98%;}
  .stage-row[data-line="1"]{top:30.99%; min-height:11.72%;}
  .stage-row[data-line="2"]{top:45.05%; min-height:12.50%;}
  .stage-row.active{box-shadow:0 0 0 3px var(--gold) inset;}
  .stage-row--locked{box-shadow:0 0 0 3px #d98bb0 inset;}
  .stage-row__count{

  function shuffle(arr){
    var a = arr.slice();

  function judgeKigo(ctx){
    if(ctx.emptyLines>0 || ctx.badKireji){
      var failComments = ctx.emptyLines>0 ? FAIL_KIGO_EMPTY : FAIL_KIGO_KIREJI;
      return {score:0, comment:pick(failComments), tier:'neg'};
    }
    var score;
    if(!ctx.hasKigo){ score=rand(1,3); }
    else if(ctx.matchingSeasonKigoCount>=2){ score=rand(9,10); }
    else if(ctx.matchingSeasonKigoCount===1){ score=rand(6,8); }
    else { score=rand(4,5); }
    if(ctx.mixedSeasons) score = clamp(score-4,1,10);
    if(ctx.hasDisruptiveWord) score = clamp(score-1,1,10);
    var tierId = !ctx.hasKigo ? 'neg' : (score<=5 ? 'mid' : 'pos');
    var comments;
    if(ctx.hasKigo && ctx.mixedSeasons){ comments = MIXED_KIGO; }
    else { comments = tierId==='neg' ? NEG_KIGO : (tierId==='mid' ? MID_KIGO : POS_KIGO); }
    return {score:score, comment:pick(comments), tier:tierId};
  }
  function judgeRhythm(ctx){
    if(ctx.emptyLines>0 || ctx.badKireji){
      var failComments = ctx.emptyLines>0 ? FAIL_RHYTHM_EMPTY : FAIL_RHYTHM_KIREJI;
      return {score:0, comment:pick(failComments), tier:'neg'};
    }
    var score, comments, tierId;
    if(ctx.exactMatch){ score=rand(9,10); comments=POS_RHYTHM; tierId='pos'; }
    else if(ctx.totalMoraDiff<=2){ score=rand(6,8); comments=MID_RHYTHM; tierId='mid'; }
    else if(ctx.totalMoraDiff<=5){ score=rand(3,5); comments=LOW_RHYTHM; tierId='low'; }
    else { score=rand(1,2); comments=NEG_RHYTHM; tierId='neg'; }
    return {score:score, comment:pick(comments), tier:tierId};
  }
  function judgeMood(ctx){
    if(ctx.emptyLines>0 || ctx.badKireji){
      var failComments = ctx.emptyLines>0 ? FAIL_MOOD_EMPTY : FAIL_MOOD_KIREJI;
      return {score:0, comment:pick(failComments), tier:'neg'};
    }
    var score = 5;
    if(!ctx.mixedSeasons) score+=2; else score-=2;
    if(ctx.hasKireji) score+=2;
    if(ctx.hasDisruptiveWord) score-=2;
    if(ctx.hasEiraWord) score+=2;
    score += randInt(-1,1);
    score = clamp(score,1,10);
    var tierId = score>=8?'pos':(score>=5?'mid':'neg');
    var tier = score>=8?POS_MOOD:(score>=5?MID_MOOD:NEG_MOOD);
    if(ctx.hasEiraWord && tierId==='pos') tier = EIRA_MOOD;
    return {score:score, comment:pick(tier), tier:tierId};
  }
  function judgeSpeed(ctx){
    var score, tier, tierId;
    if(ctx.timedOut){ score=rand(1,3); tier=NEG_SPEED; tierId='neg'; }
    else if(ctx.timeLeftFraction>0.81){ score=rand(9,10); tier=POS_SPEED; tierId='pos'; }
    else if(ctx.timeLeftFraction>0.71){ score=rand(7,8); tier=POS_SPEED; tierId='pos'; }
    else if(ctx.timeLeftFraction>0.51){ score=rand(5,6); tier=MID_SPEED; tierId='mid'; }
    else if(ctx.timeLeftFraction>0.21){ score=rand(4,5); tier=LOW_SPEED; tierId='low'; }
    else { score=rand(1,3); tier=LOW_SPEED; tierId='low'; }
    return {score:score, comment:pick(tier), tier:tierId};
  }
  function judgeOriginality(ctx){
    var score = Math.round(1 + (ctx.avgRarity-1)*4.5) + randInt(-1,1);
    if(ctx.hasDisruptiveWord) score += 3;
    if(ctx.uniqueWordsRatio<1) score-=3;
    score = clamp(score,1,10);
    var tierId = score>=8?'pos':(score>=5?'mid':'neg');
    var tier = score>=8?POS_ORIG:(score>=5?MID_ORIG:NEG_ORIG);
    return {score:score, comment:pick(tier), tier:tierId};
  }
  function judgeBalance(ctx){
    if(ctx.emptyLines>0 || ctx.badKireji){
      var failComments = ctx.emptyLines>0 ? FAIL_BAL_EMPTY : FAIL_BAL_KIREJI;
      return {score:0, comment:pick(failComments), tier:'neg'};
    }
    var base=5;
    if(ctx.exactMatch) base+=2;
    if(ctx.hasKigo) base+=1;
    if(ctx.seasonMatch) base+=1;
    if(ctx.mixedSeasons) base-=1;
    base += randInt(-1,1);
    base = clamp(base,1,10);
    var tierId = base>=8?'pos':(base>=5?'mid':'neg');
    var tier = base>=8?POS_BAL:(base>=5?MID_BAL:NEG_BAL);
    return {score:base, comment:pick(tier), tier:tierId};
  }

  function pickJudges(n, place){
    var requiredId = PLACE_REQUIRED_JUDGE[place];
    var required = requiredId ? JUDGES.filter(function(j){ return j.id===requiredId; }) : [];
    var rest = JUDGES.filter(function(j){ return j.id!==requiredId; });
    var remaining = sample(rest, Math.max(0, n-required.length));
    return shuffle(required.concat(remaining));
  }
  function selectJudgesForStage(stage){
    var fixedJudgeIds = STAGE_FIXED_JUDGE_IDS[stage];

      ? shuffle(JUDGES.filter(function(j){ return fixedJudgeIds.indexOf(j.id)>=0; }))
      : pickJudges(judgeCount, stagePlace);
    return {chosen:chosen, requiredId:requiredId};
  }

  var DISRUPTIVE_CHANCE = 0.3;
  var EIRA_MIX_STAGE = 9;
  var EIRA_MIX_COUNT = 2;
  function makeTileCopy(w,tag){
    var copy = {};
    for(var k in w) copy[k]=w[k];
    copy.uid = 'w'+Date.now()+'_'+(tag||'')+Math.floor(Math.random()*100000);
    return copy;
  }
  function drawTiles(season, stage){
    var seasonWords = WORDS.filter(function(w){ return w.season===season && !w.disruptive && !w.eira; });
    var otherWords = WORDS.filter(function(w){ return w.season && w.season!==season && !w.disruptive && !w.eira; });
    var kirejiWords = WORDS.filter(function(w){ return w.kireji && !w.disruptive; });
    var fillerWords = WORDS.filter(function(w){ return !w.season && !w.kireji && !w.disruptive && !w.eira; });
    var disruptiveWords = WORDS.filter(function(w){ return w.disruptive; });
    var eiraWords = WORDS.filter(function(w){ return w.eira && (!w.season || w.season===season); });
    var includeDisruptive = Math.random() < DISRUPTIVE_CHANCE;
    var includeEira = stage===EIRA_MIX_STAGE;
    var fillerCount = (includeDisruptive ? 4 : 5) - (includeEira ? EIRA_MIX_COUNT : 0);
    var picked = sample(seasonWords,3)
      .concat(sample(otherWords,3))
      .concat(sample(kirejiWords,2))
      .concat(sample(fillerWords, Math.max(0,fillerCount)));
    if(includeDisruptive) picked = picked.concat(sample(disruptiveWords,1));
    if(includeEira) picked = picked.concat(sample(eiraWords, EIRA_MIX_COUNT));
    return shuffle(picked).map(function(w,i){ return makeTileCopy(w, i+'_'); });
  }

  function timeLimitForStage(stage){
    return Math.max(45 - (stage-1)*2, 20);
  }
  function rivalScoreFor(stage, judgeCount, hasRequiredJudge){
    if(hasRequiredJudge){
      return Math.round(70 + stage*13 + rand(0,10));
    }
    var base = 140 + stage*11 + rand(0,18);
    var scale = (judgeCount || 3) / 3;
    return Math.round(base * scale);
  }

  function buildCtx(){
    var moras = state.lines.map(function(line){ return line.reduce(function(s,w){ return s+w.m; },0); });
    var totalMoraDiff = moras.reduce(function(s,m,i){ return s+Math.abs(m-TARGETS[i]); },0);
    var exactMatch = moras.every(function(m,i){ return m===TARGETS[i]; });
    var allWords = state.lines[0].concat(state.lines[1], state.lines[2]);
    var kigoWords = allWords.filter(function(w){ return w.kigo; });
    var hasKigo = kigoWords.length>0;
    var seasonsUsed = {};
    kigoWords.forEach(function(w){ if(w.season) seasonsUsed[w.season]=true; });
    var seasonMatch = kigoWords.some(function(w){ return w.season===state.season; });
    var matchingSeasonKigoCount = kigoWords.filter(function(w){ return w.season===state.season; }).length;
    var mixedSeasons = Object.keys(seasonsUsed).length>1;
    var hasKireji = allWords.some(function(w){ return w.kireji; });
    var startsWithKireji = allWords.length>0 && !!allWords[0].kireji;
    var consecutiveKireji = allWords.some(function(w,i){ return i>0 && w.kireji && allWords[i-1].kireji; });
    var badKireji = startsWithKireji || consecutiveKireji;
    var hasDisruptiveWord = allWords.some(function(w){ return w.disruptive; });
    var hasEiraWord = allWords.some(function(w){ return w.eira; });
    var emptyLines = state.lines.filter(function(l){ return l.length===0; }).length;
    var uniqueTexts = {};
    allWords.forEach(function(w){ uniqueTexts[w.t]=true; });
    var uniqueWordsRatio = allWords.length ? Object.keys(uniqueTexts).length/allWords.length : 1;
    var avgRarity = allWords.length ? allWords.reduce(function(s,w){ return s+w.rarity; },0)/allWords.length : 0;
    var timeLeftFraction = state.timeLimit ? clamp(state.timeLeft/state.timeLimit,0,1) : 0;
    return {
      moras:moras, totalMoraDiff:totalMoraDiff, exactMatch:exactMatch, allWords:allWords,
      hasKigo:hasKigo, seasonMatch:seasonMatch, matchingSeasonKigoCount:matchingSeasonKigoCount, mixedSeasons:mixedSeasons, hasKireji:hasKireji,
      startsWithKireji:startsWithKireji, consecutiveKireji:consecutiveKireji, badKireji:badKireji,
      hasDisruptiveWord:hasDisruptiveWord, hasEiraWord:hasEiraWord,
      emptyLines:emptyLines, uniqueWordsRatio:uniqueWordsRatio, avgRarity:avgRarity,
      timeLeftFraction:timeLeftFraction, timedOut:state.timedOut
    };
  }

  var JUDGE_ROWS_SAFE_LEFT = 2, JUDGE_ROWS_SAFE_WIDTH = 96;
  var JUDGE_ROWS_SAFE_TOP = 16.75;
  var JUDGE_BG_RATIO = 1080/1920;
  var JUDGE_ITEM_RATIO = 2164/580;
  var JUDGE_ROW_GAP_PCT_TIGHT = 0.4;

  var JUDGE_LANDSCAPE_MQ = '(min-width:640px)';
  function isJudgeLandscape(){
    return window.matchMedia(JUDGE_LANDSCAPE_MQ).matches;
  }
  function isLandscapeOrientation(){
    return window.matchMedia('(orientation: landscape)').matches;
  }
  var JUDGE_COLS_SAFE_LEFT = 6.58, JUDGE_COLS_SAFE_WIDTH = 86.72;
  var JUDGE_COLS_SAFE_TOP = 19.69, JUDGE_COLS_SAFE_HEIGHT = 64.26;
  var JUDGE_BG_RATIO_H = 1672/941;
  var JUDGE_COL_GAP_PCT = 1.2;

  function computeJudgeRowLayoutPortrait(n){
    var safeTop = JUDGE_ROWS_SAFE_TOP;
    var safeHeight = 97 - safeTop;
    var naturalHeight = JUDGE_BG_RATIO * (JUDGE_ROWS_SAFE_WIDTH / JUDGE_ITEM_RATIO);
    var gapPct = n<=3 ? naturalHeight*0.5 : JUDGE_ROW_GAP_PCT_TIGHT;
    var totalNeeded = n*naturalHeight + (n-1)*gapPct;
    var rowHeight = totalNeeded <= safeHeight ? naturalHeight : (safeHeight - (n-1)*gapPct) / n;
    var actualTotal = n*rowHeight + (n-1)*gapPct;
    var startTop = safeTop + Math.max(0, (safeHeight-actualTotal)/2);
    var rowWidth = JUDGE_ROWS_SAFE_WIDTH;
    var rowLeft = JUDGE_ROWS_SAFE_LEFT;
    var rows = [];
    for(var i=0;i<n;i++){
      rows.push({
        top: startTop + i*(rowHeight+gapPct),
        left: rowLeft,
        width: rowWidth,
        height: rowHeight
      });
    }
    return rows;
  }
  function computeJudgeRowLayoutLandscape(n){
    var cols = 2;
    var rowGap = 1.5;
    var numRows = Math.ceil(n/cols);
    var colWidth = (JUDGE_COLS_SAFE_WIDTH - JUDGE_COL_GAP_PCT*(cols-1)) / cols;
    var rowHeight = colWidth * JUDGE_BG_RATIO_H / JUDGE_ITEM_RATIO;
    var totalHeight = numRows*rowHeight + (numRows-1)*rowGap;
    if(totalHeight > JUDGE_COLS_SAFE_HEIGHT){
      var scale = JUDGE_COLS_SAFE_HEIGHT / totalHeight;
      colWidth *= scale;
      rowHeight *= scale;
      totalHeight = JUDGE_COLS_SAFE_HEIGHT;
    }
    var startTop = JUDGE_COLS_SAFE_TOP + Math.max(0, (JUDGE_COLS_SAFE_HEIGHT - totalHeight)/2);
    var rows = [];
    for(var i=0;i<n;i++){
      var rowIdx = Math.floor(i/cols);
      var colIdx = i%cols;
      var itemsInRow = Math.min(cols, n - rowIdx*cols);
      var rowLeft;
      if(itemsInRow < cols){
        var rowContentWidth = itemsInRow*colWidth + (itemsInRow-1)*JUDGE_COL_GAP_PCT;
        rowLeft = JUDGE_COLS_SAFE_LEFT + (JUDGE_COLS_SAFE_WIDTH - rowContentWidth)/2;
      } else {
        rowLeft = JUDGE_COLS_SAFE_LEFT;
      }
      rows.push({
        top: startTop + rowIdx*(rowHeight+rowGap),
        left: rowLeft + colIdx*(colWidth+JUDGE_COL_GAP_PCT),
        width: colWidth,
        height: rowHeight
      });
    }
    return rows;
  }
  function computeJudgeRowLayout(n){
    return isJudgeLandscape() ? computeJudgeRowLayoutLandscape(n) : computeJudgeRowLayoutPortrait(n);
  }
  function judgeItemHTML(i){
    return '<div class="judge-item" id="judgeItem'+i+'" style="background-image:url('+PLAY_ASSETS.judge_item+')">'
      + '<div class="judge-item__avatar"><img id="judgeAvatar'+i+'" src="" alt=""></div>'
      + '<div class="judge-item__info">'
      +   '<div class="judge-item__name" id="judgeName'+i+'"></div>'
      +   '<div class="judge-item__tag" id="judgeTag'+i+'"></div>'
      +   '<div class="judge-item__comment" id="judgeComment'+i+'"></div>'
      + '</div>'
      + '<div class="judge-item__score" id="judgeScore'+i+'"></div>'
      + '</div>';
  }
  function renderJudgeRows(results){
    els.judgeBg.style.backgroundImage = 'url('+(isJudgeLandscape() ? PLAY_ASSETS.judge_bg_h : PLAY_ASSETS.judge_bg)+')';
    var n = results.length;
    var layout = computeJudgeRowLayout(n);
    els.judgeRows.innerHTML = results.map(function(r,i){ return judgeItemHTML(i); }).join('');
    results.forEach(function(r,i){
      var item = document.getElementById('judgeItem'+i);
      var pos = layout[i];
      item.style.left = pos.left+'%';
      item.style.top = pos.top+'%';
      item.style.width = pos.width+'%';
      item.style.height = pos.height+'%';
      item.style.animationDelay = (i*0.15)+'s';
      document.getElementById('judgeAvatar'+i).src = pickFace(r.judge.id,r.tier);
      document.getElementById('judgeName'+i).textContent = r.judge.name;
      document.getElementById('judgeTag'+i).textContent = r.judge.tag;
      document.getElementById('judgeComment'+i).textContent = r.comment;
      document.getElementById('judgeScore'+i).textContent = r.score;
    });
  }

  function applyResultBg(){
    var isMechaStage = state.stage>=MECHA_STAGE_START;
    var resultBgKey = isLandscapeOrientation() ? (isMechaStage ? 'result_bg_h2' : 'result_bg_h') : (isMechaStage ? 'result_bg2' : 'result_bg');
    els.resultBg.style.backgroundImage = 'url('+PLAY_ASSETS[resultBgKey]+')';
    els.screenResult.classList.toggle('result-mecha', isMechaStage);
  }
  window.addEventListener('resize', function(){
    if(!els.screenResult.classList.contains('hidden')) applyResultBg();
  });

  function goToJudgeScreen(ctx){
    showScreen('judge');
    els.judgeHeadingAct.textContent = '第'+state.stage+'幕　審査';

    var chosen = state.judges;
    var requiredId = state.requiredJudgeId;
    var results = chosen.map(function(j){
      var r = j.fn(ctx);
      return {judge:j, score:r.score, comment:r.comment, tier:r.tier};
    });
    renderJudgeRows(results);

    var total = results.reduce(function(s,r){
      var weight = requiredId ? (r.judge.id===requiredId ? 10 : 5) : 10;
      return s + r.score*weight;
    }, 0);
    var rival = rivalScoreFor(state.stage, chosen.length, !!requiredId);
    if((ctx.badKireji || ctx.emptyLines>0) && (requiredId==='speed' || requiredId==='orig')){
      total = Math.min(total, Math.max(0, rival - CLOSE_LOSS_MARGIN));
    }
    if(state.stage>=EIRA_MIX_STAGE && !ctx.hasEiraWord){
      total = Math.min(total, Math.max(0, rival - CLOSE_LOSS_MARGIN));
    }
    var rivalHaiku = BOSS_RIVAL_HAIKU[state.stage] ? pick(BOSS_RIVAL_HAIKU[state.stage]) : pick(RIVAL_HAIKU[state.season]);

    els.screenJudge.onclick = function(){
      var win = total>rival;
      showScreen('result');
      applyResultBg();
      els.youHaiku.innerHTML = haikuLinesHTML(state.lines.map(function(line){
        return line.map(function(w){ return w.t; }).join(' ') || '（無言）';
      }));
      els.youNote.textContent = playerNote(ctx, win);
      els.rivalHaikuEl.innerHTML = haikuLinesHTML(rivalHaiku.lines);
      els.rivalNote.textContent = rivalHaiku.note;
      els.shareXBtn.onclick = function(){
        var url = 'https://twitter.com/intent/tweet?text='+encodeURIComponent(buildShareText(total));
        openShareWindow(url);
      };
      els.shareThreadsBtn.onclick = function(){
        var url = 'https://www.threads.net/intent/post?text='+encodeURIComponent(buildShareText(total));
        openShareWindow(url);
      };
      if(win && state.stage>state.best){
        state.best = state.stage;
        localStorage.setItem('haiku_battle_best', String(state.best));
      }
      if(!els.resultHeroRival.getAttribute('src')) els.resultHeroRival.src = PLAY_ASSETS.hero_rival;
      els.verdictBannerImg.src = win ? PLAY_ASSETS.victory_banner : PLAY_ASSETS.loser_banner;
      els.verdictBannerImg.alt = win ? '勝利！' : '敗北！';
      els.youScore.textContent = total;
      els.rivalScore.textContent = rival;

      state.lastResult = {
        score: total,
        haiku: state.lines.map(function(line){
          return line.map(function(w){ return w.t; }).join(' ') || '（無言）';
        }).join('\n'),
        submitted: false
      };

      els.resultPrimaryBtn.classList.remove('hidden');
      if(state.stage===FINAL_STAGE){
        els.resultPrimaryBtn.textContent = 'エンディングへ';
        els.resultPrimaryBtn.onclick = function(){ showEnding(win ? 'ending1' : 'ending2'); };
      } else if(state.stage===LAST_STAGE){
        if(win){
          els.resultPrimaryBtn.textContent = 'エンディングへ';
          els.resultPrimaryBtn.onclick = function(){ showEnding('ending3'); };
        } else if(state.retryCount < MAX_RETRIES){
          var remaining3 = MAX_RETRIES - state.retryCount;
          els.resultPrimaryBtn.textContent = 'もう一度挑戦する（残り'+remaining3+'回）';
          els.resultPrimaryBtn.onclick = function(){ retryStage(); };
        } else {
          els.resultPrimaryBtn.classList.add('hidden');
        }
      } else if(win){
        els.resultPrimaryBtn.textContent = '次の幕へ';
        els.resultPrimaryBtn.onclick = function(){ newStage(state.stage+1); };
      } else if(state.retryCount < MAX_RETRIES){
        var remaining = MAX_RETRIES - state.retryCount;
        els.resultPrimaryBtn.textContent = 'もう一度挑戦する（残り'+remaining+'回）';
        els.resultPrimaryBtn.onclick = function(){ retryStage(); };
      } else {
        els.resultPrimaryBtn.classList.add('hidden');
      }
      els.resultTitleBtn.onclick = function(){ showScreen('title'); };
    };
  }

  function setupPosterPan(){
    var frame = document.querySelector('.hero__poster-frame');
    var img = document.querySelector('.hero__poster');
    if(!frame || !img) return;
    function apply(){
      var frameH = frame.getBoundingClientRect().height;
      var ratio = (img.naturalHeight && img.naturalWidth) ? img.naturalHeight/img.naturalWidth : 1050/700;
      var renderedImgH = frame.getBoundingClientRect().width * ratio;
      var overflow = Math.max(0, renderedImgH - frameH);
      frame.style.setProperty('--pan-distance', overflow.toFixed(1)+'px');
    }
    if(img.complete) apply(); else img.addEventListener('load', apply);
    window.addEventListener('resize', apply);
  }

  function setupStageAssets(){
    els.btnReset.style.backgroundImage = 'url('+PLAY_ASSETS.btn_reset+')';
    els.btnSubmit.style.backgroundImage = 'url('+PLAY_ASSETS.btn_submit+')';
  }

  function formatRankingDate(iso){
    var d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleString('ja-JP', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
  }

  function renderRankingRows(container, list, kind){
    container.innerHTML = '';
    if(!list || !list.length){
      var empty = document.createElement('div');
      empty.className = 'list-empty';
      empty.textContent = 'まだ登録がありません';
      container.appendChild(empty);
      return;
    }
    list.forEach(function(row, i){
      var el = document.createElement('div');
      el.className = 'list-row';
      if(kind==='ranking'){
        var rank = document.createElement('span');
        rank.className = 'list-row__rank';
        rank.textContent = (i+1)+'位';
        el.appendChild(rank);
      }
      var haiku = document.createElement('span');
      haiku.className = 'list-row__haiku';
      haiku.textContent = row.haiku;
      el.appendChild(haiku);
      var score = document.createElement('span');
      score.className = 'list-row__score';
      score.textContent = row.score+'点';
      el.appendChild(score);
      if(kind==='recent'){
        var date = document.createElement('span');
        date.className = 'list-row__date';
        date.textContent = formatRankingDate(row.created_at);
        el.appendChild(date);
      }
      container.appendChild(el);
    });
  }

  function setRankingTab(tab){
    els.tabRankingBtn.classList.toggle('active', tab==='ranking');
    els.tabRecentBtn.classList.toggle('active', tab==='recent');
    els.rankingListRanking.classList.toggle('hidden', tab!=='ranking');
    els.rankingListRecent.classList.toggle('hidden', tab!=='recent');
  }

  function loadRankingData(){
    els.rankingMsg.textContent = '読み込み中…';
    Promise.all([
      fetch('/api/ikku-gozaru/ranking').then(function(r){ if(!r.ok) throw new Error('ranking'); return r.json(); }),
      fetch('/api/ikku-gozaru/recent').then(function(r){ if(!r.ok) throw new Error('recent'); return r.json(); })
    ]).then(function(res){
      if(!res[0].ok || !res[1].ok) throw new Error('bad response');
      els.rankingMsg.textContent = '';
      renderRankingRows(els.rankingListRanking, res[0].results, 'ranking');
      renderRankingRows(els.rankingListRecent, res[1].results, 'recent');
    }).catch(function(){
      els.rankingMsg.textContent = 'ランキングを取得できませんでした。';
    });
  }

  var rankingReturnScreen = 'result';

  function goToRankingScreen(returnTo){
    rankingReturnScreen = returnTo || 'result';
    els.btnRankingBack.textContent = rankingReturnScreen==='title' ? 'タイトルへ戻る' : '結果へ戻る';
    setRankingTab('ranking');
    showScreen('ranking');
    loadRankingData();
  }

  function submitScoreIfNeeded(onDone){
    if(!state.lastResult || state.lastResult.submitted){ onDone(); return; }
    fetch('/api/ikku-gozaru/score', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({score: state.lastResult.score, haiku: state.lastResult.haiku})
    }).then(function(res){
      if(!res.ok) throw new Error('submit failed');
      return res.json();
    }).then(function(data){
      if(data.ok) state.lastResult.submitted = true;
      onDone();
    }).catch(function(){
      onDone();
    });
  }

  function setupRankingUI(){
    els.listScreenBg.style.backgroundImage = 'url('+PLAY_ASSETS.hero_rival+')';
    els.tabRankingBtn.onclick = function(){ setRankingTab('ranking'); };
    els.tabRecentBtn.onclick = function(){ setRankingTab('recent'); };
    els.btnRankingBack.onclick = function(){ showScreen(rankingReturnScreen); };
    els.btnTitleRanking.onclick = function(){ goToRankingScreen('title'); };
    els.btnRankingIcon.onclick = function(){
      if(!state.lastResult || state.lastResult.submitted){
        goToRankingScreen('result');
        return;
      }
      els.rankingConfirm.classList.remove('hidden');
    };
    els.btnConfirmRegister.onclick = function(){
      els.rankingConfirm.classList.add('hidden');
      submitScoreIfNeeded(goToRankingScreen);
    };
    els.btnSkipRegister.onclick = function(){
      els.rankingConfirm.classList.add('hidden');
      goToRankingScreen();
    };
  }

  function collectPreloadUrls(){
    var urls = Object.values(PLAY_ASSETS);
    [JUDGE_FACES, JUDGE_FACES_MECHA].forEach(function(faceSet){
      Object.keys(faceSet).forEach(function(judgeId){
        var tiers = faceSet[judgeId];
        Object.keys(tiers).forEach(function(tier){
          urls = urls.concat(tiers[tier]);
        });
      });
    });
    return Array.from(new Set(urls));
  }

  function preloadAllImages(onDone){
    var urls = collectPreloadUrls();
    var total = urls.length;
    var loaded = 0;
    if(total===0){ onDone(); return; }
    function tick(){
      loaded++;
      var pct = Math.round(loaded/total*100);
      els.loadingFill.style.width = pct+'%';
      els.loadingPct.textContent = '読み込み中… '+pct+'%';
      if(loaded>=total) onDone();
    }
    urls.forEach(function(url){
      var img = new Image();
      img.onload = tick;
      img.onerror = tick;
      img.src = url;
    });
    setTimeout(onDone, 15000);
  }

  els.heroPosterImg.src = PLAY_ASSETS.title_poster;
  setupPosterPan();
  setupStageAssets();
  setupRankingUI();
  preloadAllImages(function(){
    if(els.loadingOverlay.classList.contains('hidden')) return;
    els.loadingOverlay.classList.add('hidden');
    showScreen('title');
  });
})();
</script>
</body>
</html>
