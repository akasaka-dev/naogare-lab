<meta charset="UTF-8">

<title>LineUp4 3D - 立体4個並べ対戦ゲーム</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --bg: #1e293b;
    --board: #2563eb;
    --slot: #0f172a;
    --p1: #ef4444;
    --p2: #eab308;
    --text: #f1f5f9;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  /* Game UI: no text selection, no long-press callout/search, no double-tap or pinch page zoom. */
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  img, canvas { -webkit-user-drag: none; -webkit-touch-callout: none; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* ---- Audio toggles (always visible, above every screen) ---- */
  #audioControls {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    z-index: 20;
    display: flex;
    gap: 8px;
  }
  .audio-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(15, 23, 42, 0.72);
    border: 1.5px solid rgba(148, 163, 184, 0.45);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(4px);
  }
  .audio-btn .audio-icon { font-size: 0.95rem; line-height: 1; }
  .audio-btn .kana-icon {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--accent);
  }
  .audio-btn.muted .kana-icon { color: inherit; }
  .audio-btn.muted {
    border-color: rgba(148, 163, 184, 0.25);
    color: rgba(241, 245, 249, 0.45);
  }
  .audio-btn.muted .audio-icon { filter: grayscale(1); opacity: 0.6; }
  @media (max-width: 480px) {
    .audio-btn .audio-label { display: none; }
    .audio-btn { padding: 8px; }
  }

  /* ---- Splash / title screen ---- */
  #splashScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  #splashScreen.show { opacity: 1; }
  #splashScreen.hide { opacity: 0; pointer-events: none; }
  #splashScreen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* title.webp is a wide landscape illustration — on narrow/portrait screens
     "cover" crops off the characters and part of the logo at the sides, so
     switch to "contain" (full artwork visible, letterboxed) there instead. */
  @media (max-aspect-ratio: 1/1) {
    #splashScreen img { object-fit: contain; }
  }

  /* ---- Full-screen CPU character backdrop (shown during play) ---- */
  #charBgWrap {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #charBgWrap.show { opacity: 1; }
  #charBgImg {
    height: 96vh;
    max-width: 62vw;
    object-fit: contain;
    object-position: bottom right;
    filter: drop-shadow(0 10px 34px rgba(0,0,0,0.65));
    -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 38%, rgba(0,0,0,0) 92%);
    mask-image: linear-gradient(to left, rgba(0,0,0,1) 38%, rgba(0,0,0,0) 92%);
  }
  #charBgOverlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
    background: linear-gradient(to right,
      rgba(10, 15, 30, 1) 0%,
      rgba(10, 15, 30, 0.88) 32%,
      rgba(10, 15, 30, 0.4) 58%,
      rgba(10, 15, 30, 0) 82%);
  }
  #charBgOverlay.show { opacity: 1; }

  /* On narrow screens there's no side-by-side space: the desktop layout
     (character peeking in from the right, page content to its left) leaves
     the character almost entirely masked out. Switch to a centered figure
     standing behind the bottom of the screen, fading out before it reaches
     the UI text up top, instead. */
  @media (max-width: 640px) {
    /* The board is opaque and claims the center/bottom of the screen, so a
       bottom-anchored character just disappears behind it. Put the character
       in a header band above the board instead — cropped to the upper body
       via object-fit:cover, faded out before it reaches the board — so it
       shows through behind the status text without the two fighting for the
       same space. */
    #charBgWrap { justify-content: center; align-items: flex-start; }
    #charBgImg {
      width: 100vw;
      max-width: 100vw;
      height: 36vh;
      max-height: 36vh;
      object-fit: cover;
      object-position: top center;
      opacity: 0.5;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 55%, rgba(0,0,0,0) 100%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 55%, rgba(0,0,0,0) 100%);
    }
    #charBgOverlay {
      background: linear-gradient(to bottom,
        rgba(10, 15, 30, 0.35) 0%,
        rgba(10, 15, 30, 0.08) 30%,
        rgba(10, 15, 30, 0) 45%);
    }
  }

  .page-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.15rem, 6.2vw, 1.8rem);
    letter-spacing: 0.05em;
    overflow-wrap: break-word;
    max-width: 100%;
  }
  .hidden { display: none !important; }

  /* ---- Title screen ---- */
  #titleScreen, #onlineScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 36px 30px;
    background: rgba(15, 23, 42, 0.55);
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    width: 100%;
    max-width: min(820px, 92vw);
    box-sizing: border-box;
  }
  @media (max-width: 480px) {
    #titleScreen, #onlineScreen { padding: 28px 18px; gap: 14px; }
  }
  #titleScreen p.subtitle, #onlineScreen p.subtitle {
    margin: -8px 0 4px;
    opacity: 0.75;
    font-size: 0.95rem;
  }
  #debugTrigger { user-select: none; }

  /* ---- Online multiplayer (create/join room) ---- */
  .player-name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.85rem;
    opacity: 0.9;
    margin-top: -6px;
  }
  #playerNameInput, .name-input {
    background: #0f172a;
    border: 2px solid #334155;
    color: var(--text);
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 0.95rem;
    width: 130px;
    text-align: center;
  }
  #playerNameInput:focus, .name-input:focus { outline: none; border-color: var(--accent); }
  #onlineJoinConfirm {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .online-join-row {
    display: flex;
    gap: 8px;
  }
  #onlineJoinCode {
    background: #0f172a;
    border: 2px solid #334155;
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    width: 140px;
    text-align: center;
  }
  #onlineJoinCode:focus { outline: none; border-color: var(--accent); }
  #onlineJoinBtn {
    padding: 10px 18px;
    border-radius: 10px;
  }
  .online-error {
    color: var(--p1);
    font-size: 0.85rem;
    min-height: 1.2em;
    margin: 0;
  }
  .online-room-code {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: var(--accent);
    background: #0f172a;
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 14px 24px;
  }
  .online-waiting-text {
    font-size: 0.95rem;
    margin: 0;
    animation: onlinePulse 1.6s ease-in-out infinite;
  }
  @keyframes onlinePulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.95; }
  }
  .mode-options {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-btn {
    background: #0f172a;
    border: 2px solid var(--accent);
    color: var(--text);
    padding: 22px 28px;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 180px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .mode-btn .emoji { font-size: 1.8rem; display: block; margin-bottom: 6px; }
  .mode-btn-sub {
    display: block;
    font-size: 0.68rem;
    font-weight: 500;
    opacity: 0.65;
    margin-top: 4px;
  }
  .mode-btn:hover {
    background: var(--accent);
    color: #0f172a;
    transform: translateY(-3px);
  }
  .mode-btn:hover .mode-btn-sub { color: #0f172a; opacity: 0.8; }

  .back-to-splash-btn {
    background: transparent;
    border: none;
    color: var(--text);
    opacity: 0.65;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 6px 10px;
  }
  .back-to-splash-btn:hover { opacity: 1; text-decoration: underline; }

  .credit {
    margin: 4px 0 0;
    font-size: 0.72rem;
    opacity: 0.45;
    letter-spacing: 0.02em;
  }
  .credit strong { font-weight: 700; opacity: 0.9; }
  .credit a {
    color: inherit;
    opacity: 0.8;
    text-decoration: none;
    border-bottom: 1px dotted currentColor;
  }
  .credit a:hover { opacity: 1; }

  /* ---- Ladder result overlay (shown between/after CPU matches) ---- */
  #resultOverlay {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 8, 18, 0.82);
    padding: 20px;
  }
  .result-card {
    background: rgba(15, 23, 42, 0.96);
    border: 2px solid var(--accent);
    border-radius: 18px;
    padding: 28px 30px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  }
  .result-portrait {
    width: 100%;
    height: 190px;
    border-radius: 12px;
    background: #0f172a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    margin-bottom: 14px;
  }
  .result-portrait:empty { display: none; margin: 0; }
  .result-portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  .result-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .result-message {
    font-size: 0.9rem;
    opacity: 0.85;
    line-height: 1.6;
    margin-bottom: 20px;
    white-space: pre-line;
  }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-actions button {
    width: 100%;
  }
  .result-actions .secondary {
    background: transparent;
    border: 2px solid #475569;
    color: var(--text);
  }
  /* Online post-game countdown ("leave in N seconds") — see tickPostGameCountdown() */
  .result-note {
    margin-top: 12px;
    font-size: 0.8rem;
    opacity: 0.7;
  }

  /* ---- おまけ: post-clear slideshow (see openOmake()) ---- */
  #omakeBtn.hidden { display: none; }
  #omakeScreen {
    position: fixed;
    inset: 0;
    z-index: 14;
    background: #000;
    overflow: hidden;
    user-select: none;
    touch-action: pan-y;
  }
  #omakeScreen.hidden { display: none; }
  #omakeStage { position: absolute; inset: 0; }
  .omake-slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }
  .omake-slide.show { opacity: 1; animation: omakeDrift 9s linear forwards; }
  @keyframes omakeDrift { from { transform: scale(1); } to { transform: scale(1.05); } }
  #omakeCaption {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px);
    text-align: center;
    color: #f6f1e7;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "MS PMincho", serif;
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.95);
    pointer-events: none;
  }
  #omakeBackBtn {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    background: rgba(15, 23, 42, 0.72);
    border: 1.5px solid rgba(148, 163, 184, 0.5);
    color: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }
  #omakeControls {
    position: absolute;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(15, 23, 42, 0.72);
    border: 1.5px solid rgba(148, 163, 184, 0.4);
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 0.85rem;
    max-width: calc(100vw - 24px);
  }
  #omakeControls button {
    background: transparent;
    border: 1.5px solid rgba(148, 163, 184, 0.5);
    color: inherit;
    border-radius: 50%;
    width: 34px; height: 34px;
    font-size: 0.95rem;
    cursor: pointer;
    padding: 0;
  }
  #omakeControls select {
    background: #0f172a;
    color: inherit;
    border: 1.5px solid rgba(148, 163, 184, 0.5);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.85rem;
    font-family: inherit;
    min-width: 0;
  }

  /* ---- All-clear ending ---- */
  #endingScreen {
    position: fixed;
    inset: 0;
    z-index: 9;
    background: #000;
    overflow: hidden;
    cursor: grab;
    touch-action: none; /* the crawl is drag-scrubbed by hand, not natively scrolled */
    user-select: none; /* otherwise a mouse-drag over the crawl text selects it instead of scrubbing */
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #endingScreen.dragging { cursor: grabbing; }
  #endingScreen.show { opacity: 1; }
  #endingScroll {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  #endingScroll img {
    display: block;
    position: absolute;
    left: 50%;
    top: 0;
    -webkit-user-drag: none; /* native image drag would otherwise hijack the crawl-scrub gesture on desktop */
    /* min-width/min-height (not plain width/height) is the pure-CSS
       "cover" trick: the browser grows whichever axis is needed to fully
       cover the screen, so no black #endingScreen background can ever
       show through even on a phone taller than ending2.webp's own 2:1
       ratio — it crops a bit off the sides instead. */
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    /* Base centering, also the animation's 0% state — starts on the
       BOTTOM of the artwork (feet) and pans up to the top (sky/faces) by
       the end, so the scene doesn't close on a close-up of someone's boots. */
    transform: translate(-50%, calc(-100% + 100vh));
  }
  #endingScroll img.pan {
    animation: endingPan 90s ease-in-out forwards;
  }
  @keyframes endingPan {
    0%, 10% { transform: translate(-50%, calc(-100% + 100vh)); }
    90%, 100% { transform: translate(-50%, 0); }
  }
  /* Narration crawl overlaid on the artwork — see showEndingScreen(). Its
     start/end transform is set inline (via the Web Animations API) once the
     text is built and its rendered height is known, so it always scrolls
     fully clear of the screen regardless of how much text is in it. */
  #endingTextWrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #endingTextCrawl {
    position: absolute;
    left: 50%;
    top: 0;
    width: min(560px, 86vw);
    text-align: center;
    color: #f6f1e7;
    font-size: clamp(0.95rem, 2.6vw, 1.1rem);
    line-height: 1.9;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.9);
  }
  #endingTextCrawl p { margin: 0 0 2.6em; white-space: pre-line; }
  .ending-hint {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 10;
    color: var(--text);
    background: rgba(15, 23, 42, 0.65);
    border: 1.5px solid rgba(148, 163, 184, 0.45);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    pointer-events: none;
    opacity: 0;
    animation: endingHintFade 2s ease 1s forwards;
  }
  @keyframes endingHintFade {
    to { opacity: 0.9; }
  }

  /* ---- Online emote picker (flick/drag-scroll strip) + incoming popup ---- */
  /* max-width must stay tied to the viewport (vw), not just a flat px cap:
     #emoteScroller's 25 fixed-width icons give it a large intrinsic content
     width, and on portrait phones a flat 480px let that intrinsic width
     inflate #gameScreen (an auto-width flex column) past the viewport,
     clipping the board's side columns under body's overflow-x:hidden. */
  #onlineEmoteBar {
    width: 100%;
    max-width: min(480px, 92vw);
    margin-top: 14px;
  }
  /* Applied for the post-game grace window (see resultNote/POST_GAME_WINDOW_MS)
     so the emote strip stays reachable above the result overlay's backdrop
     instead of being hidden underneath it — pinned to the bottom of the
     viewport with a higher z-index than #resultOverlay (6). */
  #onlineEmoteBar.postgame {
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 7;
    background: rgba(15, 23, 42, 0.9);
    border: 2px solid #334155;
    border-radius: 16px;
    padding: 6px 8px 2px;
    margin-top: 0;
  }
  #emoteScroller {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    padding: 4px 4px 10px;
    cursor: grab;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #emoteScroller::-webkit-scrollbar { display: none; }
  #emoteScroller.dragging { cursor: grabbing; }
  .emote-icon-btn {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    padding: 4px;
    border-radius: 12px;
    background: #0f172a;
    border: 2px solid #334155;
    cursor: pointer;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .emote-icon-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .emote-icon-btn:hover { border-color: var(--accent); }
  .emote-icon-btn:active { transform: scale(0.92); }

  #incomingEmote {
    position: fixed;
    top: 16vh;
    left: 50%;
    z-index: 8;
    width: 120px;
    height: 120px;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -12px) scale(0.5);
    transition: opacity 0.25s ease, transform 0.25s ease;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
  }
  #incomingEmote img { width: 100%; height: 100%; object-fit: contain; }
  #incomingEmote.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  /* Feedback for your OWN tap: a clone of the tapped icon rises from the
     button and fades, so it's clear the tap registered (opponent's popup
     via #incomingEmote is the only feedback that existed before). */
  .emote-fly {
    position: fixed;
    width: 44px;
    height: 44px;
    object-fit: contain;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: none;
    z-index: 9;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.9s ease 0.2s;
  }
  .emote-fly.rise {
    transform: translate(-50%, calc(-50% - 38vh)) scale(1.3);
    opacity: 0;
  }

  /* ---- Turn-order coin toss ---- */
  #turnDecideOverlay {
    position: fixed;
    inset: 0;
    z-index: 7;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 8, 18, 0.82);
  }
  .turn-decide-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .coin-wrap { perspective: 400px; }
  .coin {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--p1);
    box-shadow: 0 0 20px 6px rgba(255,255,255,0.18), 0 8px 20px rgba(0,0,0,0.5);
    animation: coinSpin 0.15s linear infinite;
  }
  .coin.settled { animation: coinSettle 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes coinSpin {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(0.12); }
  }
  @keyframes coinSettle {
    0% { transform: scaleX(0.12); }
    55% { transform: scaleX(1.18) scaleY(0.85); }
    75% { transform: scaleX(0.92) scaleY(1.06); }
    100% { transform: scaleX(1) scaleY(1); }
  }
  .turn-decide-text {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    opacity: 0;
    transition: opacity 0.25s ease;
    text-align: center;
  }
  .turn-decide-text.show { opacity: 1; }

  /* ---- Game screen ---- */
  #gameScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #status {
    font-size: 1.15rem;
    margin-bottom: 14px;
    min-height: 1.6em;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  #turnTimeoutWarning {
    font-size: 0.85rem;
    font-weight: 700;
    color: #f59e0b;
    margin: -8px 0 12px;
  }
  .turn-indicator {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3) inset;
  }
  .turn-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    box-shadow: 0 0 0 2px var(--p2);
  }
  #modeLabel {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #opponentAvatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
  }

  /* ---- CPU speech bubble ---- */
  /* Sits where the game title used to be — reserves its slot only in CPU
     mode (toggled via the .hidden utility class in JS); the text itself
     still cross-fades in/out per line via the .show class. */
  #speechBubble {
    width: 100%;
    max-width: 420px;
    min-height: 64px;
    box-sizing: border-box;
    background: rgba(15, 23, 42, 0.94);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 12px 18px;
    margin: 0 0 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #speechBubble.show {
    opacity: 1;
    transform: translateY(0);
  }
  #speechBubble .bubble-name {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
  }
  #speechBubble .bubble-text {
    font-size: 0.92rem;
    line-height: 1.55;
  }
  #board-wrap {
    background: rgba(15, 23, 42, 0.55);
    padding: 4px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    position: relative;
  }
  /* The 3D view stays draggable while locked (CPU thinking / coin toss) so the
     player can keep looking around; taps are ignored in JS instead. */
  #board-wrap.locked { opacity: 0.92; }
  #board {
    position: relative;
    width: min(92vw, 540px, 62vh);
    height: min(92vw, 540px, 62vh);
    min-width: 260px;
    min-height: 260px;
    touch-action: none;   /* drags orbit the camera instead of scrolling the page */
    user-select: none;
    cursor: grab;
  }
  #board:active { cursor: grabbing; }
  #board canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .board-hint {
    margin: 8px 0 0;
    font-size: 0.78rem;
    opacity: 0.65;
    text-align: center;
    max-width: 92vw;
  }
  .title-3d {
    font-size: 0.62em;
    letter-spacing: 0.12em;
    color: var(--accent);
    white-space: nowrap;
  }
  .col-hitzone {
    position: relative;
    cursor: pointer;
    aspect-ratio: 1 / 1;
  }
  .cell {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--slot);
    position: relative;
    transition: transform 0.15s ease;
  }
  .cell.p1 { background: var(--p1); box-shadow: 0 0 10px rgba(239,68,68,0.7); }
  .cell.p2 { background: var(--p2); box-shadow: 0 0 10px rgba(234,179,8,0.7); }
  .cell.drop {
    /* Purely cosmetic — game state already updates instantly on click,
       so this playing out slowly never blocks the next move. */
    animation: drop 1.1s;
    transform-origin: bottom center;
  }
  .cell.win {
    animation: pulse 0.8s ease-in-out infinite;
    box-shadow: 0 0 18px 4px var(--accent);
  }
  @keyframes drop {
    0%   { transform: translateY(-260%) scale(1, 1);         animation-timing-function: cubic-bezier(0.2, 0, 1, 0.35); }
    10%  { transform: translateY(-250%) scale(1, 1);         animation-timing-function: cubic-bezier(0.2, 0, 1, 0.35); }
    58%  { transform: translateY(0) scale(1, 1);              animation-timing-function: ease-out; }
    68%  { transform: translateY(3%) scale(1.1, 0.88);        animation-timing-function: ease-out; }
    80%  { transform: translateY(-7%) scale(0.96, 1.05);      animation-timing-function: ease-out; }
    91%  { transform: translateY(2%) scale(1.03, 0.97);       animation-timing-function: ease-out; }
    97%  { transform: translateY(-1%) scale(0.99, 1.01); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .col-hitzone:hover .cell:not(.p1):not(.p2) {
    background: #1e293b;
  }

    margin-top: 18px;
    display: flex;
    gap: 12px;

    border: none;

<script>
(function () {
  // ---------- Audio: looping BGM (file-based, per-screen tracks) + synthesized SFX (Web Audio API) ----------
  // Music lives in bgm/: title.mp3 plays on the splash/title screens, bgm.mp3
  // plays during actual matches. Either file can be missing (bgm.mp3 isn't
  // made yet) — playback just silently no-ops until it shows up. SFX are
  // generated on the fly via Web Audio API so they work immediately, no files
  // needed. Both toggles persist via localStorage and stay visible/functional
  // across every screen (splash, title, game, result overlay).
  // Some contexts (sandboxed embeds, certain mobile in-app browsers, strict
  // private-browsing modes) throw on any localStorage access rather than
  // just failing quietly — guard every call so a blocked storage API can
  // never take the rest of the game down with it.
  function safeStorageGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeStorageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
  }

  const SoundMgr = (function () {
    const STORAGE_BGM = 'lineup4_bgm_on';
    const STORAGE_SE = 'lineup4_se_on';
    let bgmOn = safeStorageGet(STORAGE_BGM) !== '0';
    let seOn = safeStorageGet(STORAGE_SE) !== '0';
    let unlocked = false;
    let ctx = null;

    // 'title' and 'game' are fixed tracks; 'level:N' is resolved to bgm/LVN.mp3
    // for a per-character theme, falling back to the generic game track (and
    // from there, silence) wherever a more specific file hasn't been added yet.
    const TITLE_URL = 'bgm/title.mp3';
    const GAME_URL = 'bgm/bgm.mp3';
    const ENDING_URL = 'bgm/ending.mp3';
    function levelUrl(level) { return 'bgm/LV' + level + '.mp3'; }
    function urlForKey(key) {
      if (key === 'title') return TITLE_URL;
      if (key === 'game') return GAME_URL;
      if (key === 'ending') return ENDING_URL;
      if (key.indexOf('level:') === 0) return levelUrl(key.slice(6));
      return null;
    }

    const BGM_VOLUME = 0.35;
    const trackMissing = {};
    let currentTrackKey = null;
    let endingLoop = false; // おまけ asks for the ending theme on repeat

    const bgmEl = document.getElementById('bgmAudio');
    bgmEl.volume = BGM_VOLUME;

    function ensureContext() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function fadeVolume(target, duration) {
      const start = bgmEl.volume;
      const t0 = performance.now();
      function step(now) {
        const t = Math.min(1, (now - t0) / duration);
        bgmEl.volume = start + (target - start) * t;
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function playTrack(key, fallbackKey) {
      if (trackMissing[key]) {
        if (fallbackKey) playTrack(fallbackKey, fallbackKey === 'game' ? null : 'game');
        return;
      }
      if (currentTrackKey === key) {
        if (bgmOn && unlocked) bgmEl.play().catch(() => {});
        return;
      }
      currentTrackKey = key;
      const switchSrc = () => {
        const thisKey = key;
        bgmEl.onerror = () => {
          trackMissing[thisKey] = true;
          if (fallbackKey && currentTrackKey === thisKey) {
            playTrack(fallbackKey, fallbackKey === 'game' ? null : 'game');
          }
        };
        bgmEl.src = urlForKey(key);
        bgmEl.loop = key !== 'ending' || endingLoop; // the ending theme plays once, except in おまけ
        if (bgmOn && unlocked) {
          bgmEl.volume = 0;
          bgmEl.play().then(() => fadeVolume(BGM_VOLUME, 500)).catch(() => {});
        } else {
          bgmEl.volume = BGM_VOLUME;
        }
      };
      if (!bgmEl.paused) {
        fadeVolume(0, 250);
        setTimeout(() => { bgmEl.pause(); switchSrc(); }, 260);
      } else {
        switchSrc();
      }
    }

    // Prefer a level-specific theme (bgm/LV{level}.mp3); silently falls back
    // to the shared game track if that file doesn't exist for this level yet.
    function playLevelTrack(level) {
      playTrack('level:' + level, 'game');
    }

    function tone(freq, duration, type, gainPeak, delay) {
      if (!seOn) return;
      const audioCtx = ensureContext();
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(gainPeak || 0.15, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    }

    return {
      unlock() {
        if (unlocked) return;
        unlocked = true;
        ensureContext();
        playTrack(currentTrackKey || 'title');
      },
      playTrack,
      playLevelTrack,
      setEndingLoop(v) {
        endingLoop = !!v;
        if (currentTrackKey === 'ending') bgmEl.loop = endingLoop;
      },
      stop() {
        fadeVolume(0, 250);
        setTimeout(() => bgmEl.pause(), 260);
        currentTrackKey = null; // so a later playTrack() re-inits fully instead of just resuming
      },
      setBgmOn(v) {
        bgmOn = v;
        safeStorageSet(STORAGE_BGM, v ? '1' : '0');
        if (v) {
          if (unlocked) bgmEl.play().catch(() => {});
        } else {
          bgmEl.pause();
        }
      },
      setSeOn(v) {
        seOn = v;
        safeStorageSet(STORAGE_SE, v ? '1' : '0');
      },
      isBgmOn: () => bgmOn,
      isSeOn: () => seOn,
      seClick() { tone(520, 0.09, 'triangle', 0.12); },
      seDrop() { tone(160, 0.16, 'sine', 0.22); tone(90, 0.22, 'sine', 0.15, 0.03); },
      seWin() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, i * 0.09)); },
      seLose() { [392, 329.63, 261.63, 196].forEach((f, i) => tone(f, 0.28, 'sawtooth', 0.1, i * 0.11)); },
      seDraw() { tone(300, 0.2, 'sine', 0.12); tone(300, 0.2, 'sine', 0.12, 0.15); },
    };
  })();

  // Minimal HTML-escaping for the couple of spots that build a status string
  // via innerHTML (for a colored-dot/avatar prefix) and splice a name into
  // it — online mode means that name can be the OPPONENT's, so it must never
  // be trusted as markup. Everywhere else a name is used with .textContent,
  // which is already safe regardless.
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const PUPPETS = {
    fox: '🦊 きつね',

    return speakerKey === 'master' ? ch.name : (PUPPETS[speakerKey] || speakerKey);
  }

  let grid, currentPlayer, gameOver, cellEls;
  let scores = { 1: 0, 2: 0 };
  let mode = 'pvp'; // 'pvp' | 'cpu' | 'online'
  let currentChar = null;
  let ladderIndex = 0; // index into CHARACTERS for the current CPU ladder run
  let cpuThinking = false;
  let online = null; // { code, token, myPlayer, rev, timer, busy } while in an online match
  // Pending setTimeout that will call handleLadderOutcome() after a CPU
  // match's win/lose/draw line finishes playing. Must be cancelled by
  // initGame() — otherwise clicking "retry" while it's still pending lets it
  // fire mid-way through the NEW match and pop up a stale result overlay.
  let ladderOutcomeTimer = null;

  // ---------- Title screen wiring ----------
  function starString(n) {
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  }

  pvpBtn.addEventListener('click', () => { SoundMgr.seClick(); startGame('pvp'); });
  cpuBtn.addEventListener('click', () => { SoundMgr.seClick(); startLadder(); });

  function startLadder() {
    ladderIndex = 0;
    currentChar = CHARACTERS[0];
    startGame('cpu');
  }

  // NOTE (line4-third): everything in this online section is inherited from line4 and
  // is NOT wired up for the 3D board yet (the title button is hidden; it still
  // addresses a 2D grid via cellEls/ROWS/COLS). Rebuild it for 4x4x4 before enabling.
  // ---------- Online multiplayer (friend invite via room code / URL) ----------
  // Server is authoritative: the Worker (src/line4-online.js) owns the grid,
  // turn order and win/draw detection in a dedicated D1 database. This client
  // only ever sends "I choose column N" and renders whatever state comes back
  // — it never decides a win/turn locally the way the pvp/cpu modes do.
  const ONLINE_API = '/api/line4';
  const ONLINE_POLL_MS = 1300;

  // Mirrors TURN_TIMEOUT_MS / the 30s warning point in src/line4-online.js —
  // the server is what actually enforces the forfeit (checked lazily on the
  // next /state poll from either side); this is purely the countdown display.
  const TURN_TIMEOUT_MS = 60000;
  const TURN_TIMEOUT_WARNING_MS = 30000;
  // How long the post-game emote/leave window stays open — mirrors (and
  // must stay a bit under) FINISHED_ROOM_GRACE_MS in src/line4-online.js.
  const POST_GAME_WINDOW_MS = 30000;

  // #resultOverlay is a direct child of <body>, but #onlineEmoteBar normally
  // lives inside .page-content (position:relative + z-index:1, its own
  // stacking context) — so no z-index on the emote bar, however high, could
  // ever out-rank the overlay; it only LOOKED like it was on top while
  // actually eating no clicks (confirmed via elementFromPoint). Reparenting
  // it to <body> during the post-game window makes it a real sibling of
  // #resultOverlay so z-index:7 vs 6 finally applies, then it's moved back
  // next to the board once the window ends.
  function pinEmoteBarForPostGame() {
    document.body.appendChild(document.getElementById('onlineEmoteBar'));
  }
  function restoreEmoteBarPosition() {
    document.getElementById('board-wrap').insertAdjacentElement('afterend', document.getElementById('onlineEmoteBar'));
  }

  // Called from the finished/leave room after either a decisive win/loss/draw:
  // stops the post-game countdown, tears down the emote bar's temporary
  // "postgame" positioning, and returns to the title screen. If *I* was the
  // winner, also tells the server so the room frees up immediately instead
  // of waiting for FINISHED_ROOM_GRACE_MS — a loser leaving needs no such
  // call (the winner might still request a rematch), so this is skipped
  // when online.wonLastMatch is falsy. Fire-and-forget: the values are read
  // synchronously before goToTitle() clears `online`, so it's safe even
  // though the request itself resolves after we've already left.
  function leavePostGameRoom() {
    if (online) {
      online.postGameDeadline = null;
      if (online.wonLastMatch) {
        apiPost(`/room/${online.code}/leave`, { token: online.token }).catch(() => {});
      }
    }
    document.getElementById('resultOverlay').classList.add('hidden');
    goToTitle();
  }

  function tickPostGameCountdown() {
    const noteEl = document.getElementById('resultNote');
    if (mode !== 'online' || !online || !online.postGameDeadline) {
      noteEl.textContent = '';
      return;
    }
    const remaining = online.postGameDeadline - Date.now();
    if (remaining <= 0) {
      leavePostGameRoom();
      return;
    }
    const seconds = Math.ceil(remaining / 1000);
    noteEl.textContent = `⏱ ${K(`あと${seconds}秒で退室します`, `あと${seconds}びょうでたいしゅつします`)}`;
  }

  setInterval(() => {
    tickPostGameCountdown();
    const warnEl = document.getElementById('turnTimeoutWarning');
    if (mode !== 'online' || !online || gameOver || !online.turnStartedAt) {
      warnEl.classList.add('hidden');
      return;
    }
    const remaining = TURN_TIMEOUT_MS - (Date.now() - online.turnStartedAt);
    if (remaining <= 0 || remaining > TURN_TIMEOUT_WARNING_MS) {
      warnEl.classList.add('hidden');
      return;
    }
    const seconds = Math.ceil(remaining / 1000);
    const isMyTurn = currentPlayer === online.myPlayer;
    warnEl.textContent = isMyTurn
      ? `⏱ ${K(`あと${seconds}秒で時間切れになります`, `あと${seconds}びょうでじかんぎれになります`)}`
      : `⏱ ${K(`相手が操作していません…あと${seconds}秒で不戦勝になります`, `あいてがそうさしていません…あと${seconds}びょうでふせんしょうになります`)}`;
    warnEl.classList.remove('hidden');
  }, 1000);

  const onlineScreenEl = document.getElementById('onlineScreen');
  const onlineMenuEl = document.getElementById('onlineMenu');

  const onlineErrorEl = document.getElementById('onlineError');
  const onlineRoomCodeEl = document.getElementById('onlineRoomCode');
  const onlineJoinCodeEl = document.getElementById('onlineJoinCode');

  async function apiPost(path, body) {
    const res = await fetch(ONLINE_API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    return res.json();
  }
  async function apiGet(path) {
    const res = await fetch(ONLINE_API + path);
    return res.json();
  }

  function onlineErrorMessages() {
    return {
      room_not_found: K('部屋が見つかりませんでした。コードを確認してください。', 'へやがみつかりませんでした。コードをかくにんしてください。'),
      room_full: K('その部屋は現在対戦中です。', 'そのへやはげんざいたいせんちゅうです。'),
      invalid_body: K('コードを入力してください。', 'コードをにゅうりょくしてください。'),
      server_error: K('通信エラーが発生しました。もう一度お試しください。', 'つうしんエラーがはっせいしました。もういちどおためしください。'),
    };
  }
  // "3分12秒" / "45秒" — used only for the room_full detail message below.
  function formatElapsed(ms) {
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const min = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    if (min <= 0) return K(`${sec}秒`, `${sec}びょう`);
    return K(`${min}分${sec}秒`, `${min}ふん${sec}びょう`);
  }
  // room_full carries the occupied room's state (names/streaks/match start
  // time) so we can tell a blocked joiner who's playing instead of just
  // "in use" — falls back to the plain message if state is missing.
  function roomFullDetailMessage(state) {
    if (!state || !state.p1Name || !state.p2Name) return null;
    const p1 = state.p1Name, p2 = state.p2Name;
    let msg = `${p1}${K('さんと', 'さんと')}${p2}${K('さんが対戦中', 'さんがたいせんちゅう')}`;
    const parts = [];
    if (state.matchStartedAt) {
      parts.push(`${K('経過', 'けいか')}${formatElapsed(Date.now() - state.matchStartedAt)}`);
    }
    const leader = state.p1Streak >= state.p2Streak ? { name: p1, streak: state.p1Streak } : { name: p2, streak: state.p2Streak };
    if (leader.streak > 0) {
      parts.push(`${leader.name}${K('さんが', 'さんが')}${leader.streak}${K('連勝中', 'れんしょうちゅう')}`);
    }
    if (parts.length) msg += `（${parts.join('／')}）`;
    return msg;
  }
  function showOnlineError(code, res) {
    const detail = code === 'room_full' && res && roomFullDetailMessage(res.state);
    onlineErrorEl.textContent = detail || onlineErrorMessages()[code] || onlineErrorMessages().server_error;
  }
  function clearOnlineError() {
    onlineErrorEl.textContent = '';
  }

  function showOnlineMenu() {
    stopOnlinePolling();
    online = null;
    onlineWaitingEl.classList.add('hidden');
    hideJoinConfirm();
    onlineMenuEl.classList.remove('hidden');
    clearOnlineError();
  }

  function goToOnlineScreen() {
    titleScreen.classList.add('hidden');
    onlineScreenEl.classList.remove('hidden');
    showOnlineMenu();
  }

  onlineBtn.addEventListener('click', () => { SoundMgr.seClick(); goToOnlineScreen(); });
  document.getElementById('onlineBackBtn').addEventListener('click', () => {

    titleScreen.classList.remove('hidden');

  document.getElementById('onlineCancelBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    // Waiting for a *new challenger* after a win is a different context than
    // waiting right after creating a room — cancelling there should abandon
    // the streak and go home, not drop into the create/join menu.
    if (online && online.awaitingRematch) goToTitle();

  async function createOnlineRoom() {
    clearOnlineError();
    const res = await apiPost('/room', { name: getPlayerName() });
    if (!res.ok) { showOnlineError(res.error); return; }
    online = { code: res.code, token: res.token, myPlayer: 1, rev: res.state.rev, emoteRev: res.state.emoteRev || 0, timer: null, busy: false, awaitingRematch: false };
    onlineMenuEl.classList.add('hidden');
    onlineWaitingEl.classList.remove('hidden');
    onlineRoomCodeEl.textContent = res.code;
    // requestRematch() overwrites this with a streak message — reset it here
    // so a fresh room never shows leftover text from an earlier rematch wait.
    document.getElementById('onlineWaitingText').textContent = K('対戦相手を待っています…', 'たいせんあいてをまっています…');
    pollForOpponent();
  }

  // Used both right after creating a room (waiting for p2) and after a win,
  // once the winner opts to stay (waiting for a new challenger to fill
  // whichever slot the loser just vacated) — so it checks "is the OTHER
  // slot filled" symmetrically rather than assuming p2.
  function pollForOpponent() {
    online.timer = setInterval(async () => {
      if (!online) return;
      try {
        const res = await apiGet(`/room/${online.code}/state`);
        const opponentSlotFilled = online.myPlayer === 1 ? res.state.hasP2 : res.state.hasP1;
        if (res.ok && opponentSlotFilled) {
          stopOnlinePolling();
          beginOnlineMatch(res.state);
        }
      } catch (e) { /* transient — try again next tick */ }
    }, ONLINE_POLL_MS);
  }

  // Entering a code no longer joins immediately — it peeks at the room first
  // (GET /state, no side effects) so we can ask "play against 〇〇さん?"
  // before actually taking a seat. Both the manual join button and the
  // ?room=CODE invite-link auto-join (see the splash click handler above)
  // go through this same confirm step.
  let pendingJoinCode = null;
  let pendingJoinState = null;

  function renderJoinConfirmText() {
    const el = document.getElementById('onlineJoinConfirmText');
    if (!pendingJoinState) return;
    const state = pendingJoinState;
    const opponentName = state.hasP1 ? state.p1Name : (state.hasP2 ? state.p2Name : null);
    el.textContent = opponentName
      ? `${opponentName}${K('さんと対戦します。開始しますか？', 'さんとたいせんします。かいししますか？')}`
      : K('この部屋に参加します。開始しますか？', 'このへやにさんかします。かいししますか？');
  }

  function showJoinConfirm(code, state) {
    pendingJoinCode = code;
    pendingJoinState = state;
    renderJoinConfirmText();
    document.getElementById('onlineJoinNameInput').value = getPlayerName();
    onlineMenuEl.classList.add('hidden');
    document.getElementById('onlineJoinConfirm').classList.remove('hidden');
  }

  function hideJoinConfirm() {
    pendingJoinCode = null;
    pendingJoinState = null;
    document.getElementById('onlineJoinConfirm').classList.add('hidden');
  }

  async function joinOnlineRoom(code) {
    clearOnlineError();
    if (!code) { showOnlineError('invalid_body'); return; }
    const res = await apiGet(`/room/${code}/state`);
    if (!res.ok) { showOnlineError(res.error); return; }
    if (res.state.hasP1 && res.state.hasP2) {
      onlineErrorEl.textContent = roomFullDetailMessage(res.state) || onlineErrorMessages().room_full;
      return;
    }
    showJoinConfirm(code, res.state);
  }

  document.getElementById('onlineJoinConfirmBtn').addEventListener('click', async () => {
    SoundMgr.seClick();
    const code = pendingJoinCode;
    // The name field here IS playerNameInput's value everywhere else reads
    // from (getPlayerName()) — write-through to storage so a change made
    // right before this match sticks for later matches too.
    playerNameInput.value = document.getElementById('onlineJoinNameInput').value;
    safeStorageSet(NAME_STORAGE_KEY, getPlayerName());
    hideJoinConfirm();
    const res = await apiPost(`/room/${code}/join`, { name: getPlayerName() });
    if (!res.ok) {
      onlineMenuEl.classList.remove('hidden');
      showOnlineError(res.error, res);
      return;
    }
    online = { code, token: res.token, myPlayer: res.player, rev: res.state.rev, emoteRev: res.state.emoteRev || 0, timer: null, busy: false, awaitingRematch: false };
    beginOnlineMatch(res.state);
  });
  document.getElementById('onlineJoinCancelBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    hideJoinConfirm();
    onlineMenuEl.classList.remove('hidden');
  });

  // "Winner stays on": called from the win result overlay. Vacates the
  // loser's slot server-side and reuses the same waiting-room UI/polling as
  // a freshly created room while a new challenger joins via the same code.
  async function requestRematch() {
    online.postGameDeadline = null;
    restoreEmoteBarPosition();
    document.getElementById('onlineEmoteBar').classList.remove('postgame');
    document.getElementById('onlineEmoteBar').classList.add('hidden');
    document.getElementById('resultNote').textContent = '';
    try {
      const res = await apiPost(`/room/${online.code}/rematch`, { token: online.token });
      if (!res.ok) { goToTitle(); return; }
      online.rev = res.state.rev;
      online.awaitingRematch = true;
      const myStreak = online.myPlayer === 1 ? res.state.p1Streak : res.state.p2Streak;
      gameScreen.classList.add('hidden');
      onlineScreenEl.classList.remove('hidden');
      onlineMenuEl.classList.add('hidden');
      onlineWaitingEl.classList.remove('hidden');
      onlineRoomCodeEl.textContent = online.code;
      document.getElementById('onlineWaitingText').textContent =
        `${myStreak}${K('連勝中！次の挑戦者を待っています…', 'れんしょうちゅう！つぎのちょうせんしゃをまっています…')}`;
      pollForOpponent();
    } catch (e) {
      goToTitle();
    }
  }

  document.getElementById('onlineCreateBtn').addEventListener('click', () => { SoundMgr.seClick(); createOnlineRoom(); });
  document.getElementById('onlineJoinBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    joinOnlineRoom(onlineJoinCodeEl.value.trim().toUpperCase());
  });
  onlineJoinCodeEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('onlineJoinBtn').click();
  });

  function stopOnlinePolling() {
    if (online && online.timer) { clearInterval(online.timer); online.timer = null; }
  }

  function startOnlinePolling() {
    stopOnlinePolling();
    online.timer = setInterval(async () => {
      if (!online || online.busy) return;
      try {
        const res = await apiGet(`/room/${online.code}/state`);
        if (!res.ok) return;
        // Emote check rides on this same poll — no separate request needed.
        if (res.state.emoteRev !== online.emoteRev) {
          online.emoteRev = res.state.emoteRev;
          if (res.state.emoteBy && res.state.emoteBy !== online.myPlayer) {
            showIncomingEmote(res.state.emote);
          }
        }
        if (res.state.rev !== online.rev) applyOnlineState(res.state);
      } catch (e) { /* transient — try again next tick */ }
    }, ONLINE_POLL_MS);
  }

  const ONLINE_EMOTE_COOLDOWN_MS = 1500;
  let onlineEmoteCooldownUntil = 0;
  function flyEmoteFromButton(btn, iconId) {
    const rect = btn.getBoundingClientRect();
    const fly = document.createElement('img');
    fly.src = `emotes/${iconId}.webp`;
    fly.alt = '';
    fly.className = 'emote-fly';
    fly.style.left = `${rect.left + rect.width / 2}px`;
    fly.style.top = `${rect.top + rect.height / 2}px`;
    document.body.appendChild(fly);
    requestAnimationFrame(() => requestAnimationFrame(() => fly.classList.add('rise')));
    fly.addEventListener('transitionend', () => fly.remove());
    setTimeout(() => fly.remove(), 1400); // safety net if transitionend never fires
  }

  async function sendOnlineEmote(emoji, btn) {
    if (!online || mode !== 'online') return;
    const now = Date.now();
    if (now < onlineEmoteCooldownUntil) return;
    onlineEmoteCooldownUntil = now + ONLINE_EMOTE_COOLDOWN_MS;
    if (btn) flyEmoteFromButton(btn, emoji);
    try {
      const res = await apiPost(`/room/${online.code}/emote`, { token: online.token, emote: emoji });
      if (res.ok) online.emoteRev = res.state.emoteRev; // it's our own — don't pop it up for ourselves
    } catch (e) { /* not critical — just drop it */ }
  }

  function showIncomingEmote(iconId) {
    const el = document.getElementById('incomingEmote');
    document.getElementById('incomingEmoteIcon').src = `emotes/${iconId}.webp`;
    SoundMgr.seClick();
    el.classList.remove('show');
    void el.offsetWidth; // restart the pop animation even if one is already mid-flight
    el.classList.add('show');
    clearTimeout(showIncomingEmote._t);
    showIncomingEmote._t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // 25-icon picker: flicks/drags to scroll (native touch scrolling handles
  // that on its own), tap an icon to send. Only mouse pointers get a custom
  // click-and-drag pan, since a mouse has no native drag-to-scroll — touch
  // and pen are left to the browser's own momentum scrolling untouched, and
  // mobile browsers already suppress a click when a touch ends up scrolling.
  (function setupEmoteScroller() {
    const scroller = document.getElementById('emoteScroller');
    let isDown = false;
    let dragged = false;
    let startX = 0;
    let startScrollLeft = 0;

    scroller.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse') return;
      isDown = true;
      dragged = false;
      startX = e.clientX;
      startScrollLeft = scroller.scrollLeft;
      scroller.classList.add('dragging');
    });
    scroller.addEventListener('pointermove', (e) => {
      if (!isDown || e.pointerType !== 'mouse') return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 6) dragged = true;
      scroller.scrollLeft = startScrollLeft - dx;
    });
    function endDrag(e) {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      isDown = false;
      scroller.classList.remove('dragging');
    }
    scroller.addEventListener('pointerup', endDrag);
    scroller.addEventListener('pointercancel', endDrag);
    scroller.addEventListener('pointerleave', endDrag);

    scroller.addEventListener('click', (e) => {
      if (dragged) { dragged = false; return; } // that was a drag, not a tap
      const btn = e.target.closest('.emote-icon-btn');
      if (!btn) return;
      SoundMgr.seClick();
      sendOnlineEmote(btn.dataset.emote, btn);
    });
  })();

    online.awaitingRematch = false;
    online.postGameDeadline = null;

      + (opponentStreak > 0 ? `（${K('相手は', 'あいては')}${opponentStreak}${K('連勝中', 'れんしょうちゅう')}）` : '');

  async function submitOnlineMove(col) {
    if (!online || online.busy || gameOver) return;
    if (currentPlayer !== online.myPlayer) return;
    online.busy = true;
    boardWrap.classList.add('locked');
    try {
      const res = await apiPost(`/room/${online.code}/move`, { token: online.token, col });
      if (res.ok) {
        applyOnlineState(res.state);
      } else {
        boardWrap.classList.remove('locked');
      }
    } catch (e) {
      boardWrap.classList.remove('locked');
    }
    online.busy = false;
  }

  // Renders whatever the server says the room looks like now — used both for
  // the response to our own move and for a poll that picked up the opponent's.
  function applyOnlineState(state) {
    if (!online || state.rev === online.rev) return;
    // We're sitting on the post-game result screen and the room just went
    // back to "not game over" under us — that's not a new match starting,
    // it's the room having been vacated (the opponent left, or it expired
    // server-side per FINISHED_ROOM_GRACE_MS). Without this, the code below
    // would silently redraw an empty board underneath our still-visible
    // result overlay instead of just sending us home too.
    if (online.postGameDeadline && !state.gameOver) {
      leavePostGameRoom();
      return;
    }
    online.rev = state.rev;
    online.turnStartedAt = state.turnStartedAt;

    // Find the single cell that changed since our local copy and animate it
    // the same way a local drop does, then adopt the server grid as-is.
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === 0 && state.grid[r][c] !== 0) {
          const player = state.grid[r][c];
          cellEls[r][c].classList.add(player === 1 ? 'p1' : 'p2', 'drop');
          SoundMgr.seDrop();
        }
      }
    }
    grid = state.grid;
    currentPlayer = state.currentPlayer;
    gameOver = state.gameOver;

    if (state.gameOver) {
      // Polling stays on through the post-game grace window (see
      // tickPostGameCountdown/leavePostGameRoom below) — opponent emotes
      // still arrive via the same poll, and this early-return guard at the
      // top of applyOnlineState() makes re-entrant calls on the same rev a
      // no-op, so it's safe to keep ticking.
      if (state.winLine) state.winLine.forEach(([r, c]) => cellEls[r][c].classList.add('win'));
      const iWon = state.winner === String(online.myPlayer);
      online.wonLastMatch = iWon; // read by leavePostGameRoom() to notify the server
      const isDraw = state.winner === 'draw';
      if (isDraw) {
        updateStatus(K('引き分けです！', 'ひきわけです！'));
        SoundMgr.seDraw();
      } else {
        const winnerLabel = state.winner === '1' ? player1Label() : player2Label();
        updateStatus(`🎉 ${escapeHtml(winnerLabel)}${K('の勝利！', 'のしょうり！')}`);
        if (iWon) SoundMgr.seWin(); else SoundMgr.seLose();
      }
      const myStreak = online.myPlayer === 1 ? state.p1Streak : state.p2Streak;
      setTimeout(() => {
        if (!online) return;
        // Keep the emote strip up (re-pinned above the modal backdrop) so
        // both players can send a quick thanks/gg — see req: 30秒間スタンプ.
        pinEmoteBarForPostGame();
        document.getElementById('onlineEmoteBar').classList.add('postgame');
        online.postGameDeadline = Date.now() + POST_GAME_WINDOW_MS;
        if (iWon) {
          showResultOverlay({
            title: K('勝利！', 'しょうり！'),
            message: `${K('相手に勝利しました！', 'あいてにしょうりしました！')}\n${myStreak}${K('連勝中！', 'れんしょうちゅう！')}`,
            buttons: [
              { label: K('次の挑戦者を待つ', 'つぎのちょうせんしゃをまつ'), primary: true, onClick: requestRematch },
              { label: K('退室する', 'たいしゅつする'), onClick: leavePostGameRoom },
            ],
          });
        } else {
          showResultOverlay({
            title: isDraw ? K('引き分け', 'ひきわけ') : K('敗北……', 'はいぼく……'),
            message: isDraw ? K('オンライン対戦は引き分けに終わりました。', 'オンラインたいせんはひきわけにおわりました。') : K('相手に敗れました……', 'あいてにやぶれました……'),
            buttons: [{ label: K('退室する', 'たいしゅつする'), primary: true, onClick: leavePostGameRoom }],
          });
        }
      }, 1200);
      return;
    }

    boardWrap.classList.remove('locked');
    updateStatus();
  }

  const OMAKE_SLIDE_MS = 7000;
  // [track key, label]; keys match SoundMgr.playTrack(). LV1-LV3 have no theme
  // of their own (they use the shared battle track), so they aren't listed.
  const OMAKE_BGMS = [

  function omakeSlides() {

    ];

  function omakeShow(index) {
    if (!omake) return;
    const n = omake.slides.length;
    omake.i = ((index % n) + n) % n;
    const slide = omake.slides[omake.i];
    clearTimeout(omake.timer);
    const stage = document.getElementById('omakeStage');
    // A brand-new <img> per slide (not swapping .src on one element): same
    // stale-pixel precaution as the story screen's freshStoryTextEl().
    const img = document.createElement('img');
    img.className = 'omake-slide';
    img.alt = '';
    img.draggable = false;
    const myOmake = omake;
    // Only the most recently requested slide may ever be revealed: with quick
    // next/prev presses a slower-loading earlier image could otherwise finish
    // after a newer one and pop up with the wrong picture/caption, and
    // abandoned never-shown <img>s would pile up in the DOM.
    stage.querySelectorAll('.omake-slide:not(.show):not(.leaving)').forEach((el) => el.remove());
    omake.cur = img;
    const reveal = () => {
      if (omake !== myOmake || omake.cur !== img) { img.remove(); return; }
      stage.querySelectorAll('.omake-slide.show').forEach((old) => {
        old.classList.remove('show');
        old.classList.add('leaving'); // fading out; removed below once the fade is done
        setTimeout(() => old.remove(), 1400);
      });
      requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add('show')));
      document.getElementById('omakeCaption').textContent = slide.cap();
      if (omake.playing) omake.timer = setTimeout(() => omakeShow(omake.i + 1), OMAKE_SLIDE_MS);
      new Image().src = omake.slides[(omake.i + 1) % n].src; // warm the next one
    };
    img.onload = reveal;
    img.onerror = () => {
      img.remove();
      if (omake === myOmake && omake.cur === img) omake.timer = setTimeout(() => omakeShow(omake.i + 1), 300);
    };
    img.src = slide.src;
    stage.appendChild(img);
  }

  function omakeSetPlaying(v) {
    if (!omake) return;
    omake.playing = v;
    document.getElementById('omakePlayBtn').textContent = v ? '⏸' : '▶';
    clearTimeout(omake.timer);
    if (v) omake.timer = setTimeout(() => omakeShow(omake.i + 1), OMAKE_SLIDE_MS);
  }

  function omakeApplyBgm(key) {
    if (key === 'off') SoundMgr.stop();
    else SoundMgr.playTrack(key, 'game');

  function openOmake() {
    if (omake) return;
    omake = { slides: omakeSlides(), i: 0, timer: null, playing: true };
    document.getElementById('omakeStage').innerHTML = '';
    document.getElementById('omakePlayBtn').textContent = '⏸';
    renderOmakeBgmOptions();
    document.getElementById('omakeBgmSelect').value = 'title';
    SoundMgr.setEndingLoop(true); // only matters if the ending theme gets picked from the list
    omakeApplyBgm('title');
    document.getElementById('omakeScreen').classList.remove('hidden');
    omakeShow(0);
  }

  function closeOmake() {
    if (!omake) return;
    clearTimeout(omake.timer);
    omake = null;
    document.getElementById('omakeScreen').classList.add('hidden');
    document.getElementById('omakeStage').innerHTML = '';
    SoundMgr.setEndingLoop(false);
    SoundMgr.playTrack('title');
  }

  (function setupOmake() {
    document.getElementById('omakeBtn').addEventListener('click', () => { SoundMgr.seClick(); openOmake(); });
    document.getElementById('omakeBackBtn').addEventListener('click', () => { SoundMgr.seClick(); closeOmake(); });
    document.getElementById('omakePrevBtn').addEventListener('click', () => { if (omake) omakeShow(omake.i - 1); });
    document.getElementById('omakeNextBtn').addEventListener('click', () => { if (omake) omakeShow(omake.i + 1); });
    document.getElementById('omakePlayBtn').addEventListener('click', () => { if (omake) omakeSetPlaying(!omake.playing); });
    document.getElementById('omakeBgmSelect').addEventListener('change', (e) => omakeApplyBgm(e.target.value));
    document.addEventListener('keydown', (e) => {
      if (!omake || e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowRight') omakeShow(omake.i + 1);
      else if (e.key === 'ArrowLeft') omakeShow(omake.i - 1);
      else if (e.key === ' ') { e.preventDefault(); omakeSetPlaying(!omake.playing); }
      else if (e.key === 'Escape') closeOmake();
    });
    // Swipe left/right on the picture to step through slides.
    const screenEl = document.getElementById('omakeScreen');
    let downX = null;
    screenEl.addEventListener('pointerdown', (e) => { if (e.target.closest('#omakeControls, #omakeBackBtn')) return; downX = e.clientX; });
    screenEl.addEventListener('pointerup', (e) => {
      if (downX === null || !omake) { downX = null; return; }
      const dx = e.clientX - downX;
      downX = null;
      if (Math.abs(dx) > 50) omakeShow(omake.i + (dx < 0 ? 1 : -1));
    });
    screenEl.addEventListener('pointercancel', () => { downX = null; });
  })();

    '「いとはもう、つながっていないというのに」',
    'よんひきはだれひとり、かれのそばをはなれなかった。',
    'くぐつしはしばらくかれらをみつめると、\nはじめておだやかにわらった。',
    '「なるほど……」',
    '「あやつっていたつもりだったのは、\nわたしのほうだったのかもしれませんね」',
    '{name}はなにもいわず、かれらにせをむける。',
    'ながかったたたかいはおわった。',
    'とうをおりていく{name}のはいごで、\nちいさなこえがきこえた。',
    '「マスター、いたい？」',
    '「……すこしだけね」',
    '「じゃあ、ここにいる」',
