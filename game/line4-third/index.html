    'たそがれのとう。\nもう、かれらをつなぐ糸はない。\nそれでもかれのかたわらには、よっつのかげがならんでいた',
  ];

  let endingCrawlAnim = null;
  let endingBgmTimer = null;
  let endingCrawlTotalMs = 0;
  let endingCrawlFinished = false; // click-to-title is only honored once this is true

  function stopEndingCrawl() {
    if (endingCrawlAnim) { endingCrawlAnim.cancel(); endingCrawlAnim = null; }
    if (endingBgmTimer) { clearTimeout(endingBgmTimer); endingBgmTimer = null; }
  }

  function showEndingScreen() {
    unlockOmake(); // clearing the game (or the debug menu's ending) unlocks おまけ
    SoundMgr.stop(); // the previous track (e.g. LV5's battle theme) would
                      // otherwise just keep looping until ending.mp3 kicks in
    const el = document.getElementById('endingScreen');
    const img = el.querySelector('img');
    img.classList.remove('pan');
    void img.offsetWidth; // restart the pan animation each time this is shown
    img.classList.add('pan');
    el.classList.remove('hidden');
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));

    stopEndingCrawl();
    endingCrawlFinished = false;
    const wrap = document.getElementById('endingTextWrap');
    const crawl = document.getElementById('endingTextCrawl');
    const lines = kanaMode ? ENDING_TEXT_KANA : ENDING_TEXT;
    crawl.innerHTML = '';
    lines.forEach(text => {
      const p = document.createElement('p');
      p.textContent = text.replace(/\{name\}/g, getPlayerName());
      crawl.appendChild(p);
    });

    // Pace the crawl by how much text there actually is, so editing ENDING_TEXT
    // later doesn't require re-tuning a hardcoded duration.
    const charCount = lines.join('').length;
    const totalMs = Math.max(45000, Math.min(120000, charCount * 150));
    endingCrawlTotalMs = totalMs;
    const startY = wrap.clientHeight;
    const endY = -crawl.scrollHeight;
    crawl.style.transform = `translate(-50%, ${startY}px)`;
    endingCrawlAnim = crawl.animate(
      [
        { transform: `translate(-50%, ${startY}px)` },
        { transform: `translate(-50%, ${endY}px)` },
      ],
      { duration: totalMs, easing: 'linear', fill: 'forwards' }
    );
    endingCrawlAnim.onfinish = () => { endingCrawlFinished = true; };
    // Let the ending theme swell in a few seconds before the crawl finishes,
    // rather than the moment the screen appears.
    endingBgmTimer = setTimeout(() => SoundMgr.playTrack('ending', 'title'), Math.max(0, totalMs - 5000));
  }

  // Drag up/down to scrub the crawl back and forth (a young player found the
  // auto-pace too fast to read) — pauses the WAAPI animation and scrubs its
  // currentTime while dragging, then resumes auto-play on release. Shares
  // the "was this a drag or a tap" pattern already used by the emote
  // scroller, since a plain tap still needs to return to the title screen.
  (function setupEndingCrawlDrag() {
    const screen = document.getElementById('endingScreen');
    let isDown = false;
    let dragged = false;
    let startClientY = 0;
    let startTime = 0;

    screen.addEventListener('pointerdown', (e) => {
      if (!endingCrawlAnim) return;
      isDown = true;
      dragged = false;
      startClientY = e.clientY;
      startTime = endingCrawlAnim.currentTime || 0;
      endingCrawlAnim.pause();
    });
    screen.addEventListener('pointermove', (e) => {
      if (!isDown || !endingCrawlAnim) return;
      const dy = e.clientY - startClientY;
      if (Math.abs(dy) > 6) dragged = true;
      if (!dragged) return;
      screen.classList.add('dragging');
      const wrap = document.getElementById('endingTextWrap');
      const crawl = document.getElementById('endingTextCrawl');
      const travelPx = wrap.clientHeight + crawl.scrollHeight;
      // Dragging down (positive dy) reveals earlier text — i.e. rewinds.
      const deltaTime = travelPx > 0 ? -(dy / travelPx) * endingCrawlTotalMs : 0;
      const newTime = Math.max(0, Math.min(endingCrawlTotalMs, startTime + deltaTime));
      endingCrawlAnim.currentTime = newTime;
    });
    function endDrag() {
      if (!isDown) return;
      isDown = false;
      screen.classList.remove('dragging');
      if (dragged && endingCrawlAnim) {
        if (endingBgmTimer) { clearTimeout(endingBgmTimer); endingBgmTimer = null; }
        if (endingCrawlAnim.currentTime >= endingCrawlTotalMs) {
          // .play() on an animation already at its end rewinds it to the
          // start instead of finishing it (per spec) — .finish() is what
          // actually fires onfinish here, so dragged-to-the-end doesn't
          // silently restart the whole crawl.
          endingCrawlAnim.finish();
          SoundMgr.playTrack('ending', 'title');
        } else {
          endingCrawlAnim.play();
          // Re-time the BGM cue relative to the scrubbed position, or it'd
          // fire on the original schedule regardless of where the crawl is now.
          const remaining = endingCrawlTotalMs - endingCrawlAnim.currentTime;
          endingBgmTimer = setTimeout(() => SoundMgr.playTrack('ending', 'title'), Math.max(0, remaining - 5000));
        }
      }
    }
    screen.addEventListener('pointerup', endDrag);
    screen.addEventListener('pointercancel', endDrag);
    screen.addEventListener('pointerleave', endDrag);

    screen.addEventListener('click', () => {
      if (dragged) { dragged = false; return; } // that was a drag, not a tap
      if (!endingCrawlFinished) return; // a slightly-off drag can register as a click — ignore it until the crawl has actually played through
      SoundMgr.seClick();
      stopEndingCrawl();
      screen.classList.remove('show');
      setTimeout(() => screen.classList.add('hidden'), 500);
      goToTitle();
    });
  })();

  titleBtn.addEventListener('click', () => { SoundMgr.seClick(); goToTitle(); });

  // ---------- Ladder progression (win → next challenger, lose → run over) ----------
  function showResultOverlay({ title, message, portraitImg, portraitEmoji, buttons }) {
    const overlay = document.getElementById('resultOverlay');
    const portraitEl = document.getElementById('resultPortrait');
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMessage').textContent = message;
    portraitEl.innerHTML = portraitImg
      ? `<img src="${portraitImg}" alt="" onerror="this.parentElement.innerHTML='${portraitEmoji || ''}'">`
      : (portraitEmoji || '');
    const actionsEl = document.getElementById('resultActions');
    actionsEl.innerHTML = '';
    buttons.forEach(btn => {
      const b = document.createElement('button');
      b.textContent = btn.label;
      if (!btn.primary) b.classList.add('secondary');
      b.addEventListener('click', () => {
        SoundMgr.seClick();
        overlay.classList.add('hidden');
        btn.onClick();
      });
      actionsEl.appendChild(b);
    });
    overlay.classList.remove('hidden');
  }

  function handleLadderOutcome(result) {
    if (result === 'draw') {
      showResultOverlay({
        title: K('引き分け', 'ひきわけ'),
        message: `${currentChar.name} ${K('との勝負は引き分けに終わりました。', 'とのしょうぶはひきわけにおわりました。')}`,
        portraitImg: currentChar.img,
        portraitEmoji: currentChar.emoji,
        buttons: [
          { label: K('もう一度対戦する', 'もういちどたいせんする'), primary: true, onClick: () => initGame() },
          { label: K('タイトルに戻る', 'タイトルにもどる'), onClick: goToTitle },
        ],
      });
      return;
    }

    if (result === 'lose') {
      showResultOverlay({
        title: K('敗北……', 'はいぼく……'),
        message: `LV.${currentChar.level} ${currentChar.name} ${K('に敗れました。', 'にやぶれました。')}\n${K('到達レベル', 'とうたつレベル')}: LV.${currentChar.level}`,
        portraitImg: currentChar.img,
        portraitEmoji: currentChar.emoji,
        buttons: [
          { label: K('このレベルに再挑戦する', 'このレベルにさいちょうせんする'), primary: true, onClick: () => startGame('cpu') },
          { label: K('LV1からやり直す', 'LV1からやりなおす'), onClick: startLadder },
          { label: K('タイトルに戻る', 'タイトルにもどる'), onClick: goToTitle },
        ],
      });
      return;
    }

    // result === 'win'
    if (ladderIndex >= CHARACTERS.length - 1) {
      showEndingScreen();
      return;
    }

    const beaten = currentChar;
    const next = CHARACTERS[ladderIndex + 1];
    showResultOverlay({
      title: `LV.${beaten.level} ${beaten.name} ${K('撃破！', 'げきは！')}`,
      message: `${K('次の刺客が現れた……', 'つぎのしかくがあらわれた……')}\nLV.${next.level} ${next.name}`,
      portraitImg: next.img,
      portraitEmoji: next.emoji,
      buttons: [
        { label: K('対戦開始', 'たいせんかいし'), primary: true, onClick: () => {
            ladderIndex++;
            currentChar = next;
            startGame('cpu');
          } },
        { label: K('ここでやめる（タイトルへ）', 'ここでやめる（タイトルへ）'), onClick: goToTitle },
      ],
    });
  }

  // ---------- Core game ----------
  function initGame() {
    if (ladderOutcomeTimer) { clearTimeout(ladderOutcomeTimer); ladderOutcomeTimer = null; }
    grid = newGrid();
    gameOver = false;
    resetBtn.disabled = false;
    cpuThinking = false;
    buildBoard();
    hideBubble();
    updateStatus(K('先攻・後攻を決めています…', 'せんこう・こうこうをきめています…'));
    boardWrap.classList.add('locked');
    decideStartingPlayer((starter) => {
      currentPlayer = starter;
      boardWrap.classList.remove('locked');
      updateStatus();
      if (mode === 'cpu' && currentPlayer === 2 && !gameOver) {
        triggerCpuMove();
      }
    });
  }

  // Brief (~2s) coin-toss animation deciding who moves first, run before
  // every match (fresh game, reset, and each new CPU ladder opponent).
  function decideStartingPlayer(onDone, forcedStarter) {
    const overlay = document.getElementById('turnDecideOverlay');
    const coin = document.getElementById('turnCoin');
    const textEl = document.getElementById('turnDecideText');
    const starter = forcedStarter != null ? forcedStarter : (Math.random() < 0.5 ? 1 : 2);
    const starterLabel = starter === 1 ? player1Label() : player2Label();

    coin.classList.remove('settled');
    coin.style.background = 'var(--p1)';
    textEl.classList.remove('show');
    textEl.textContent = K('先攻・後攻を決めています…', 'せんこう・こうこうをきめています…');
    overlay.classList.remove('hidden');

    let flip = 0;
    const flickerTimer = setInterval(() => {
      flip++;
      coin.style.background = flip % 2 === 0 ? 'var(--p1)' : 'var(--p2)';
    }, 110);

    setTimeout(() => {
      clearInterval(flickerTimer);
      coin.style.background = starter === 1 ? 'var(--p1)' : 'var(--p2)';
      coin.classList.add('settled');
      SoundMgr.seDrop();
      textEl.textContent = `${starterLabel}${K('の先攻です！', 'のせんこうです！')}`;
      textEl.classList.add('show');
    }, 1250);

    setTimeout(() => {
      overlay.classList.add('hidden');
      onDone(starter);
    }, 2000);
  }

  function buildBoard() {
    pendingCell = -1;
    if (Board3D.init(boardEl)) Board3D.reset();
  }

  // Player-1 side: PvP keeps the plain label (no single "you" when two
  // people share a screen); CPU/online show the chosen player name instead
  // — with no color suffix, since the turn indicator dot already conveys
  // that everywhere this is used.
  function player1Label() {
    if (mode === 'pvp') return K('プレイヤー1（赤）', 'プレイヤー1（あか）');
    if (mode === 'online') return online.myPlayer === 1 ? getPlayerName() : online.opponentName;
    return getPlayerName();
  }
  function player2Label() {
    if (mode === 'cpu') return currentChar ? currentChar.name : K('プレイヤー2（黄）', 'プレイヤー2（き）');
    if (mode === 'online') return online.myPlayer === 2 ? getPlayerName() : online.opponentName;
    return K('プレイヤー2（黄）', 'プレイヤー2（き）');
  }

  function updateStatus(message) {
    if (message) {
      statusEl.innerHTML = message;
      return;
    }
    let indicator = `<span class="turn-indicator" style="background:var(--p1)"></span>`;
    let name = player1Label();
    if (currentPlayer === 2) {
      name = player2Label();
      indicator = (mode === 'cpu' && currentChar)
        ? `<img class="turn-avatar" src="${currentChar.img}" alt="" onerror="this.outerHTML='<span class=&quot;turn-indicator&quot; style=&quot;background:var(--p2)&quot;></span>'">`
        : `<span class="turn-indicator" style="background:var(--p2)"></span>`;
    }
    statusEl.innerHTML = `${indicator} ${escapeHtml(name)}${K('の番です', 'のばんです')}`;
  }

  function handleCellClick(idx) {
    if (gameOver || cpuThinking) return;
    if (mode === 'cpu' && currentPlayer === 2) return; // block manual clicks during CPU turn
    dropPiece(idx, currentPlayer);
  }

  function dropPiece(idx, player) {
    if (grid[idx] !== 0) return false;

    pendingCell = -1;
    Board3D.clearGhost();
    grid[idx] = player;
    Board3D.placeBall(idx, player);
    SoundMgr.seDrop();

    const winCells = winningLine(grid, idx, player);
    if (winCells) {
      gameOver = true;
      Board3D.showWin(winCells);
      scores[player]++;
      updateScoreboard();
      const name = player === 1 ? player1Label() : player2Label();
      updateStatus(`🎉 ${escapeHtml(name)}${K('の勝利！', 'のしょうり！')}`);
      if (mode === 'cpu' && currentChar) {
        resetBtn.disabled = true; // re-enabled by initGame() once the next match actually starts
        if (player === 2) SoundMgr.seLose(); else SoundMgr.seWin();
        const spokenMs = speak(currentChar, player === 2 ? 'victory' : 'defeat');
        ladderOutcomeTimer = setTimeout(() => handleLadderOutcome(player === 1 ? 'win' : 'lose'), Math.max(1800, spokenMs + 600));
      } else {
        SoundMgr.seWin();
      }
      return true;
    }

    if (isBoardFull(grid)) {
      gameOver = true;
      updateStatus(K('引き分けです！', 'ひきわけです！'));
      hideBubble();
      SoundMgr.seDraw();
      if (mode === 'cpu' && currentChar) {
        resetBtn.disabled = true; // re-enabled by initGame() once the next match actually starts
        ladderOutcomeTimer = setTimeout(() => handleLadderOutcome('draw'), 1000);
      }
      return true;
    }

    currentPlayer = currentPlayer === 1 ? 2 : 1;
    updateStatus();

    if (mode === 'cpu' && player === 2 && currentChar) {
      if (findImmediateWin(grid, 1) !== null) speak(currentChar, 'aboutToLose');
      else if (findImmediateWin(grid, 2) !== null) speak(currentChar, 'aboutToWin');
      else speak(currentChar, 'normal');
    }

    if (mode === 'cpu' && currentPlayer === 2 && !gameOver) {
      triggerCpuMove();
    }
    return true;
  }

  // ---------- CPU speech bubble ----------
  // Most characters speak a single line per category. LV5 (傀儡師) instead has
  // multi-speaker conversations (master + 4 puppets) — see PUPPETS above.
  // speak() returns how long (ms) the bubble will be showing, so callers can
  // delay any follow-up (e.g. the ladder result overlay) until it's done.
  let conversationTimer = null;

  function lineDelay(text) {
    return Math.max(1300, Math.min(2600, text.length * 110));
  }

  function showSingleLine(name, text) {
    const bubble = document.getElementById('speechBubble');
    document.getElementById('bubbleName').textContent = name;
    document.getElementById('bubbleText').textContent = text;
    bubble.classList.remove('show');
    void bubble.offsetWidth; // restart the fade/slide animation
    bubble.classList.add('show');
    return lineDelay(text);
  }

  function playConversation(ch, convo) {
    if (conversationTimer) { clearTimeout(conversationTimer); conversationTimer = null; }
    let i = 0;
    function step() {
      const line = convo[i];
      i++;
      showSingleLine(speakerName(ch, line.speaker), line.text);
      if (i < convo.length) {
        conversationTimer = setTimeout(step, lineDelay(line.text));
      }
    }
    step();
    return convo.reduce((sum, line) => sum + lineDelay(line.text), 0);
  }

  function speak(ch, category) {
    if (!ch || !ch.lines) return 0;
    const lineSet = (kanaMode && ch.linesKana) ? ch.linesKana : ch.lines;
    const data = lineSet[category];
    if (!data) return 0;

    if (category === 'victory' || category === 'defeat') {
      return Array.isArray(data) && typeof data[0] === 'object'
        ? playConversation(ch, data)
        : showSingleLine(ch.name, data);
    }

    if (!data.length) return 0;
    const picked = data[Math.floor(Math.random() * data.length)];
    return Array.isArray(picked)
      ? playConversation(ch, picked)
      : showSingleLine(ch.name, picked);
  }

  function hideBubble() {
    if (conversationTimer) { clearTimeout(conversationTimer); conversationTimer = null; }
    document.getElementById('speechBubble').classList.remove('show');
  }

  function triggerCpuMove() {
    cpuThinking = true;
    boardWrap.classList.add('locked');
    const thinkingAvatar = currentChar
      ? `<img class="turn-avatar" src="${currentChar.img}" alt="" onerror="this.outerHTML='<span class=&quot;turn-indicator&quot; style=&quot;background:var(--p2)&quot;></span>'">`
      : `<span class="turn-indicator" style="background:var(--p2)"></span>`;
    updateStatus(`${thinkingAvatar} ${escapeHtml(player2Label())}${K('が考え中...', 'がかんがえちゅう...')}`);
    setTimeout(() => {
      const col = getCpuMove();
      cpuThinking = false;
      boardWrap.classList.remove('locked');
      if (col !== null) dropPiece(col, 2);
    }, 700); // long enough for the player's own ball to land before the (blocking) search runs
  }

  function updateScoreboard() {
    score1El.textContent = `${player1Label()}: ${scores[1]}${K('勝', 'しょう')}`;
    score2El.textContent = `${player2Label()}: ${scores[2]}${K('勝', 'しょう')}`;
  }

  resetBtn.addEventListener('click', () => { SoundMgr.seClick(); initGame(); });

  // ---------- 4x4x4 free-placement board: pure game logic (no DOM) ----------
  // A ball can go in ANY empty cell (no gravity). Cells are indexed
  // idx = level*16 + y*4 + x (level 0 = bottom); `grid` is a flat array of 64
  // (0 = empty, 1 / 2 = player).
  const N3 = 4;
  const CELL_COUNT = N3 * N3 * N3;

  // All 76 winning lines: every straight run of 4 cells along the 13 distinct
  // directions (3 axes, 6 face diagonals, 4 space diagonals). Cells are listed
  // in order along the line.
  const LINES = (() => {
    const lines = [];
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0 && dz === 0) continue;
      const first = dx !== 0 ? dx : dy !== 0 ? dy : dz;
      if (first < 0) continue; // one of each +/- pair
      for (let z = 0; z < N3; z++) for (let y = 0; y < N3; y++) for (let x = 0; x < N3; x++) {
        const ex = x + 3 * dx, ey = y + 3 * dy, ez = z + 3 * dz;
        if (ex < 0 || ex >= N3 || ey < 0 || ey >= N3 || ez < 0 || ez >= N3) continue;
        const cells = [];
        for (let k = 0; k < 4; k++) cells.push((z + k * dz) * 16 + (y + k * dy) * 4 + (x + k * dx));
        lines.push(cells);
      }
    }
    return lines;
  })();
  const LINES_THROUGH = Array.from({ length: CELL_COUNT }, () => []);
  LINES.forEach((cells, li) => cells.forEach((c) => LINES_THROUGH[c].push(li)));

  function newGrid() { return new Array(CELL_COUNT).fill(0); }
  function getEmptyCells(g) {
    const cells = [];
    for (let i = 0; i < CELL_COUNT; i++) if (g[i] === 0) cells.push(i);
    return cells;
  }
  function isBoardFull(g) { return !g.includes(0); }

  // The four cells of a winning line through `idx` for `player`, or null.
  function winningLine(g, idx, player) {
    for (const li of LINES_THROUGH[idx]) {
      const cells = LINES[li];
      if (g[cells[0]] === player && g[cells[1]] === player && g[cells[2]] === player && g[cells[3]] === player) return cells;
    }
    return null;
  }

  // A cell where `player` would win by placing a ball, or null.
  function findImmediateWin(g, player) {
    for (let i = 0; i < CELL_COUNT; i++) {
      if (g[i] !== 0) continue;
      g[i] = player;
      const win = winningLine(g, i, player) !== null;
      g[i] = 0;
      if (win) return i;
    }
    return null;
  }

  // ---------- CPU AI: negamax + alpha-beta with incremental line counts ----------
  // Each line is scored by how many balls one side has in it while the other
  // side has none (a mixed line is dead). Counts and the running score are
  // kept up to date on make/unmake, so a leaf evaluation is free. A move that
  // completes a line is always played at once, and when the opponent has a
  // single winning cell the only legal reply searched is blocking it (two or
  // more such cells = lost) - that keeps the 64-way branching manageable.
  const LINE_WEIGHT = [0, 1, 5, 30]; // by ball count 0-3 (4 = already won)
  const WIN_SCORE = 100000;
  const POS_WEIGHT = Array.from({ length: CELL_COUNT }, (_, i) => LINES_THROUGH[i].length * 0.15);
  // Cells on the most lines (corners and the 8 inner cells) first: better pruning.
  const CELL_ORDER = Array.from({ length: CELL_COUNT }, (_, i) => i)
    .sort((a, b) => LINES_THROUGH[b].length - LINES_THROUGH[a].length);

  function lineValue(c1, c2) {
    if (c1 > 0 && c2 > 0) return 0;
    if (c1 > 0) return LINE_WEIGHT[c1];
    if (c2 > 0) return -LINE_WEIGHT[c2];
    return 0;
  }

  // Picks a cell for `player` (1 or 2) searching `depth` plies; equally good
  // cells are chosen at random so play isn't repetitive.
  function chooseCpuCell(g, player, depth) {
    const cnt = [null, new Array(LINES.length).fill(0), new Array(LINES.length).fill(0)];
    const board = g.slice();
    let score = 0; // from player 1's point of view
    for (let i = 0; i < CELL_COUNT; i++) {
      const v = board[i];
      if (v) {
        score += v === 1 ? POS_WEIGHT[i] : -POS_WEIGHT[i];
        for (const li of LINES_THROUGH[i]) cnt[v][li]++;
      }
    }
    for (let li = 0; li < LINES.length; li++) score += lineValue(cnt[1][li], cnt[2][li]);

    function place(idx, s) {
      score += (s === 1 ? POS_WEIGHT[idx] : -POS_WEIGHT[idx]);
      for (const li of LINES_THROUGH[idx]) {
        score -= lineValue(cnt[1][li], cnt[2][li]);
        cnt[s][li]++;
        score += lineValue(cnt[1][li], cnt[2][li]);
      }
      board[idx] = s;
    }
    function unplace(idx, s) {
      score -= (s === 1 ? POS_WEIGHT[idx] : -POS_WEIGHT[idx]);
      for (const li of LINES_THROUGH[idx]) {
        score -= lineValue(cnt[1][li], cnt[2][li]);
        cnt[s][li]--;
        score += lineValue(cnt[1][li], cnt[2][li]);
      }
      board[idx] = 0;
    }
    // Would a ball of `s` in this (empty) cell complete a line?
    function wins(idx, s) {
      const c = cnt[s];
      for (const li of LINES_THROUGH[idx]) if (c[li] === 3) return true;
      return false;
    }

    function negamax(d, alpha, beta, s, ply) {
      const o = 3 - s;
      const moves = [];
      let forced = -1, forcedCount = 0;
      for (const i of CELL_ORDER) {
        if (board[i]) continue;
        if (wins(i, s)) return WIN_SCORE - ply; // I can win right now
        if (wins(i, o)) { forced = i; forcedCount++; } // they would win here: I must block
        moves.push(i);
      }
      if (moves.length === 0) return 0; // full board: draw
      if (forcedCount >= 2) return -(WIN_SCORE - ply - 1); // can't stop both
      if (d === 0) return s === 1 ? score : -score;
      const list = forcedCount === 1 ? [forced] : moves;
      let best = -Infinity;
      for (const i of list) {
        place(i, s);
        const v = -negamax(d - 1, -beta, -alpha, o, ply + 1);
        unplace(i, s);
        if (v > best) best = v;
        if (best > alpha) alpha = best;
        if (alpha >= beta) break;
      }
      return best;
    }

    const rootMoves = CELL_ORDER.filter((i) => board[i] === 0);
    if (rootMoves.length === 0) return null;
    // Shuffle so equally-scored cells are picked at random.
    for (let i = rootMoves.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rootMoves[i], rootMoves[j]] = [rootMoves[j], rootMoves[i]];
    }
    const o = 3 - player;
    let bestCell = rootMoves[0], bestVal = -Infinity;
    for (const i of rootMoves) {
      let v;
      if (wins(i, player)) v = WIN_SCORE;
      else {
        place(i, player);
        // window just under the best so far: exact values for ties, cheap cutoffs for worse moves
        v = -negamax(Math.max(0, depth - 1), -Infinity, -(bestVal - 1), o, 1);
        unplace(i, player);
      }
      if (v > bestVal) { bestVal = v; bestCell = i; }
    }
    return bestCell;
  }

  // ---------- 3D board (three.js) ----------
  // Free-placement 4x4x4 lattice, drawn as four stacked layers. Drag to orbit,
  // wheel / pinch to zoom. Tapping near a layer's cells pulls that layer out
  // like a chest drawer: it slides straight out of the chest's front, level,
  // its links to balls in the other layers stretching thin like elastic,
  // so nothing hides its 4x4 cells and they can be picked with no depth
  // ambiguity. Placing a ball, or
  // tapping anywhere off the drawer, slides it straight back in. Balls of the
  // same colour that touch (any of the 26 neighbour directions) are fused with
  // a bridge so the shapes read as solid structures.
  // Purely presentation: game state lives in `grid`; this module draws it and
  // reports what was tapped.
  const Board3D = (() => {
    const SP = 1.5;          // distance between neighbouring cells within a layer
    const LAYER_GAP = 1.1;   // height between layers (tighter, so slanted lines read as lines)
    const BALL_R = 0.45;
    const COLORS = { 1: 0xef4444, 2: 0xeab308 };
    const PLANE_COLOR = 0x5fb4ff;
    const PULL = SP * 4 + 0.8;  // a drawer slides fully clear of the chest
    const PICK_RADIUS = 46;     // px: how near a tap must be to a cell to pull out its layer

    let host = null, renderer = null, scene = null, camera = null, raycaster = null;
    let ready = false, running = false, rafId = 0, resizeObs = null;
    const layers = [];          // one THREE.Group per layer: plate, markers, balls, in-layer bridges
    const plates = [];          // { slab, grid } per layer
    const balls = new Map();    // cell idx -> { mesh, player }
    const bridges = [];         // { mesh, a, b, la, lb, player, win }
    const markers = [];         // 64 small dots showing every cell
    const falling = [];         // balls still dropping into place: { mesh, t0 }
    let ghost = null, hoverCell = -1;
    let pulled = -1;            // the layer pulled out, or -1 (everything in the stack)
    const pullT = [0, 0, 0, 0]; // animated 0 (in the stack) .. 1 (fully out)
    let hoverLayer = -1;        // mouse only: the layer a click would pull out
    let collapsed = false;      // after a win nothing can be pulled out
    let lastT = 0;
    let winMeshes = [], winRod = null, dimmed = false;
    let autoOrbit = false;   // after a win the camera drifts around so the winning line can be seen from the side
    let tapCb = null, hoverCb = null, layerCb = null, releaseCb = null;
    const cam = { theta: 0.62, phi: 0.95, dist: 22 };
    const BASE_TARGET = { x: 0, y: 2.2, z: 0 };
    const target = { x: BASE_TARGET.x, y: BASE_TARGET.y, z: BASE_TARGET.z };
    const drawerDir = { x: 0, z: 1 };   // the chest's front the drawer slides out of
    let camShift = 0;                   // how far the view has followed the drawer (0..1)
    // scratch objects, created once THREE is known to be loaded
    let tA, tB, upVec, qIdentity, invM, lRay;

    function levelY(l) { return 0.8 + l * LAYER_GAP; }
    function layerOf(idx) { return (idx / 16) | 0; }
    // position inside its layer's group
    function localXYZ(idx) {
      const y = ((idx % 16) / 4) | 0, x = idx % 4;
      return new THREE.Vector3((x - 1.5) * SP, 0, (y - 1.5) * SP);
    }
    // world position with every layer in the stack
    function cellXYZ(idx) {
      const v = localXYZ(idx);
      v.y = levelY(layerOf(idx));
      return v;
    }

    function applyCamera() {
      cam.phi = Math.max(0.15, Math.min(1.5, cam.phi));
      cam.dist = Math.max(8, Math.min(30, cam.dist));
      const sp = Math.sin(cam.phi);
      const dist = cam.dist + 3.5 * camShift;   // step back a little while a drawer is out
      camera.position.set(
        target.x + dist * sp * Math.sin(cam.theta),
        target.y + dist * Math.cos(cam.phi),
        target.z + dist * sp * Math.cos(cam.theta)
      );
      camera.lookAt(target.x, target.y, target.z);
    }

    function ballMaterial(player) {
      return new THREE.MeshStandardMaterial({
        color: COLORS[player], roughness: 0.28, metalness: 0.25,
        emissive: COLORS[player], emissiveIntensity: 0.12, transparent: true, opacity: 1,
      });
    }

    function buildScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
      scene.add(new THREE.AmbientLight(0xffffff, 0.62));
      const key = new THREE.DirectionalLight(0xffffff, 0.85);
      key.position.set(6, 12, 8);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x9db8ff, 0.4);
      rim.position.set(-8, 5, -7);
      scene.add(rim);
      tA = new THREE.Vector3(); tB = new THREE.Vector3(); upVec = new THREE.Vector3(0, 1, 0);
      qIdentity = new THREE.Quaternion();
      invM = new THREE.Matrix4(); lRay = new THREE.Ray();

      // base plate under the stack
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(SP * 4 + 1.2, 0.3, SP * 4 + 1.2),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6, metalness: 0.2 })
      );
      base.position.y = -0.15;
      scene.add(base);

      for (let l = 0; l < 4; l++) {
        const g = new THREE.Group();
        g.position.y = levelY(l);
        // translucent plate + grid lines
        const slab = new THREE.Mesh(
          new THREE.PlaneGeometry(SP * 4, SP * 4),
          new THREE.MeshBasicMaterial({ color: PLANE_COLOR, transparent: true, opacity: 0.04, side: THREE.DoubleSide, depthWrite: false })
        );
        slab.rotation.x = -Math.PI / 2;
        g.add(slab);
        const grid = new THREE.GridHelper(SP * 4, 4, PLANE_COLOR, PLANE_COLOR);
        grid.material.transparent = true;
        grid.material.opacity = 0.15;
        g.add(grid);
        plates.push({ slab, grid });
        scene.add(g);
        layers.push(g);
      }
      // a faint dot at every cell so the empty lattice is visible
      for (let i = 0; i < 64; i++) {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 8, 6),
          new THREE.MeshBasicMaterial({ color: 0xcbd5e1, transparent: true, opacity: 0.3 })
        );
        m.position.copy(localXYZ(i));
        layers[layerOf(i)].add(m);
        markers.push(m);
      }

      ghost = new THREE.Mesh(
        new THREE.SphereGeometry(BALL_R, 24, 18),
        new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, roughness: 0.4 })
      );
      ghost.visible = false;
      scene.add(ghost);
      raycaster = new THREE.Raycaster();
    }

    // The chest's "front" is whichever of its four sides faces the camera most;
    // drawers slide straight out of that side, staying level.
    function pickDrawerDir() {
      const sx = Math.sin(cam.theta), cz = Math.cos(cam.theta);
      if (Math.abs(sx) > Math.abs(cz)) { drawerDir.x = Math.sign(sx); drawerDir.z = 0; }
      else { drawerDir.x = 0; drawerDir.z = Math.sign(cz); }
    }

    function setRay(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      raycaster.setFromCamera(new THREE.Vector2(
        ((clientX - rect.left) / rect.width) * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1
      ), camera);
      return rect;
    }
    // Tap on the pulled-out drawer: { cell, inside } (inside = on the plate at all).
    function drawerHit(clientX, clientY) {
      if (pulled < 0 || collapsed) return null;
      setRay(clientX, clientY);
      const g = layers[pulled];
      g.updateMatrixWorld();
      invM.copy(g.matrixWorld).invert();
      lRay.copy(raycaster.ray).applyMatrix4(invM);
      const o = lRay.origin, d = lRay.direction;
      if (Math.abs(d.y) < 1e-6) return null;
      const t = -o.y / d.y;
      if (t <= 0) return null;
      const px = o.x + d.x * t, pz = o.z + d.z * t;
      const lim = 2 * SP + 0.3;
      if (Math.abs(px) > lim || Math.abs(pz) > lim) return { cell: -1, inside: false };
      const cx = Math.max(0, Math.min(3, Math.round(px / SP + 1.5)));
      const cz = Math.max(0, Math.min(3, Math.round(pz / SP + 1.5)));
      return { cell: pulled * 16 + cz * 4 + cx, inside: true };
    }
    // With everything stacked: the layer of the cell (empty or not) drawn
    // nearest to the tap on screen, or -1 if no cell is close.
    function pickLayer(clientX, clientY) {
      if (collapsed) return -1;
      const rect = renderer.domElement.getBoundingClientRect();
      const mx = clientX - rect.left, my = clientY - rect.top;
      scene.updateMatrixWorld();
      let best = -1, bestD = PICK_RADIUS;
      for (let i = 0; i < 64; i++) {
        tB.copy(localXYZ(i));
        layers[layerOf(i)].localToWorld(tB);
        tB.project(camera);
        const sx = (tB.x + 1) / 2 * rect.width, sy = (1 - tB.y) / 2 * rect.height;
        const dd = Math.hypot(sx - mx, sy - my);
        if (dd < bestD) { bestD = dd; best = layerOf(i); }
      }
      return best;
    }

    function setupInput(el) {
      const pointers = new Map();
      // long-press menu / text selection must never open on the 3D view
      el.addEventListener('contextmenu', (e) => e.preventDefault());
      el.addEventListener('selectstart', (e) => e.preventDefault());
      el.addEventListener('dragstart', (e) => e.preventDefault());
      let down = null, pinch = null;
      el.addEventListener('pointerdown', (e) => {
        autoOrbit = false;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { el.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone - harmless */ }
        if (pointers.size === 1) down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
        else {
          down = null;
          const [a, b] = Array.from(pointers.values());
          pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), dist: cam.dist };
        }
      });
      el.addEventListener('pointermove', (e) => {
        const p = pointers.get(e.pointerId);
        if (!p) {
          if (e.pointerType === 'mouse') hover(e.clientX, e.clientY);
          return;
        }
        const dx = e.clientX - p.x, dy = e.clientY - p.y;
        p.x = e.clientX; p.y = e.clientY;
        if (pointers.size >= 2 && pinch) {
          const [a, b] = Array.from(pointers.values());
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d > 0) { cam.dist = pinch.dist * pinch.d / d; applyCamera(); }
          return;
        }
        if (down) {
          if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
          if (down.moved) {
            cam.theta -= dx * 0.008;
            cam.phi -= dy * 0.008;
            applyCamera();
          }
        }
      });
      const end = (e) => {
        const wasTap = down && !down.moved && pointers.size === 1 && performance.now() - down.t < 700 && e.type === 'pointerup';
        pointers.delete(e.pointerId);
        if (pointers.size < 2) pinch = null;
        if (wasTap && !collapsed) {
          if (pulled >= 0) {
            const h = drawerHit(e.clientX, e.clientY);
            if (h && h.inside) { if (tapCb) tapCb(h.cell, e.pointerType); }
            else if (releaseCb) releaseCb();          // tapped off the drawer: slide it back
          } else {
            const l = pickLayer(e.clientX, e.clientY);
            if (l >= 0 && layerCb) layerCb(l);
          }
        }
        if (pointers.size === 0) down = null;
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('pointerleave', (e) => {
        if (e.pointerType !== 'mouse') return;
        if (hoverCb) hoverCb(-1);
        if (hoverLayer !== -1) { hoverLayer = -1; refreshView(); }
      });
      el.addEventListener('wheel', (e) => {
        e.preventDefault();
        cam.dist *= e.deltaY > 0 ? 1.08 : 0.92;
        applyCamera();
      }, { passive: false });
    }
    // mouse hover: preview a cell on the drawer, or light up the layer a click would pull out
    function hover(clientX, clientY) {
      if (pulled >= 0) {
        const h = drawerHit(clientX, clientY);
        if (hoverCb) hoverCb(h && h.inside ? h.cell : -1);
        return;
      }
      const l = pickLayer(clientX, clientY);
      if (l !== hoverLayer) { hoverLayer = l; refreshView(); }
    }

    function resize() {
      if (!ready || !host) return;
      const w = host.clientWidth, h = host.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    // Re-apply everything that depends on the pulled-out layer / occupancy.
    function refreshView() {
      plates.forEach((p, l) => {
        p.slab.visible = p.grid.visible = !collapsed;
        let slab, grid;
        if (l === pulled) { slab = 0.2; grid = 0.75; }
        else if (pulled < 0) { slab = l === hoverLayer ? 0.12 : 0.04; grid = l === hoverLayer ? 0.5 : 0.15; }
        else { slab = 0.03; grid = 0.1; }
        p.slab.material.opacity = slab;
        p.grid.material.opacity = grid;
      });
      markers.forEach((m, i) => {
        m.visible = !balls.has(i);
        const l = layerOf(i);
        if (pulled < 0) { m.material.opacity = 0.35; m.scale.setScalar(1); }
        else if (l === pulled) { m.material.opacity = 0.9; m.scale.setScalar(i === hoverCell ? 2.6 : 1.6); }
        else { m.material.opacity = 0.15; m.scale.setScalar(1); }
      });
      balls.forEach((b, idx) => {
        if (winMeshes.includes(b.mesh)) return;
        b.mesh.material.opacity = dimmed ? 0.28 : (pulled < 0 || layerOf(idx) === pulled ? 1 : 0.4);
      });
      bridges.forEach((br) => {
        if (br.win) return;
        const on = pulled < 0 || (br.la === pulled && br.lb === pulled);
        const stretched = !on && (br.la === pulled || br.lb === pulled);   // elastic link to the drawer
        br.mesh.material.opacity = dimmed ? 0.2 : (on ? 1 : stretched ? 0.6 : 0.35);
      });
    }

    function addBridge(a, b, player) {
      const la = layerOf(a), lb = layerOf(b);
      const same = la === lb;
      // same-layer bridges ride along with the layer; the others live in the
      // scene and stretch (thin, like elastic) while either end is pulled out
      if (same) {
        const pa = localXYZ(a), pb = localXYZ(b);
        const dir = pb.clone().sub(pa);
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, dir.length(), 12, 1, true), ballMaterial(player));
        mesh.position.copy(pa).add(pb).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(upVec, dir.normalize());
        layers[la].add(mesh);
        bridges.push({ mesh, a, b, la, lb, player, win: false });
        return;
      }
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 1, 12, 1, true), ballMaterial(player));
      scene.add(mesh);
      const br = { mesh, a, b, la, lb, player, win: false };
      bridges.push(br);
      stretchBridge(br);
    }
    // a cross-layer bridge spans its two balls wherever their layers are now
    function stretchBridge(br) {
      tA.copy(localXYZ(br.a)).add(layers[br.la].position);
      tB.copy(localXYZ(br.b)).add(layers[br.lb].position);
      const e = Math.max(pullT[br.la], pullT[br.lb]);
      br.mesh.position.addVectors(tA, tB).multiplyScalar(0.5);
      tB.sub(tA);
      const len = tB.length();
      br.mesh.quaternion.setFromUnitVectors(upVec, tB.normalize());
      const r = 1 - 0.6 * e;   // thins to 40% when fully stretched
      br.mesh.scale.set(r, len, r);
    }

    // slide each layer between its place in the chest and fully pulled out;
    // the view pans a little with the drawer so chest and drawer both stay in frame
    function poseLayers() {
      let out = 0;
      for (let l = 0; l < 4; l++) {
        const e = pullT[l];
        layers[l].position.set(drawerDir.x * PULL * e, levelY(l), drawerDir.z * PULL * e);
        if (e > out) out = e;
      }
      for (const br of bridges) {
        if (br.la !== br.lb) stretchBridge(br);
      }
      if (out !== camShift) {
        camShift = out;
        target.x = BASE_TARGET.x + drawerDir.x * PULL * 0.55 * out;
        target.z = BASE_TARGET.z + drawerDir.z * PULL * 0.55 * out;
        if (camera) applyCamera();
      }
    }

    function init(hostEl) {
      if (ready) return true;
      if (typeof THREE === 'undefined') {
        hostEl.textContent = '3Dの読み込みに失敗しました。通信状況を確認して、ページを再読み込みしてください。';
        return false;
      }
      host = hostEl;
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0);
      host.innerHTML = '';
      host.appendChild(renderer.domElement);
      buildScene();
      setupInput(renderer.domElement);
      ready = true;
      applyCamera();
      refreshView();
      resize();
      if (window.ResizeObserver) { resizeObs = new ResizeObserver(resize); resizeObs.observe(host); }
      else window.addEventListener('resize', resize);
      return true;
    }

    // y of a ball dropping into its cell: gravity fall then a small bounce
    function fallY(from, to, t) {
      const H = from - to;
      if (t < 0.62) { const k = t / 0.62; return from - H * k * k; }
      if (t < 0.84) { const k = (t - 0.62) / 0.22; return to + H * 0.1 * 4 * k * (1 - k); }
      return to;
    }

    function tick(now) {
      if (!running) return;
      rafId = requestAnimationFrame(tick);
      const dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000));
      lastT = now;
      const kk = 1 - Math.exp(-dt / 0.045);   // the drawer moves in / out in about 0.15 s
      for (let l = 0; l < 4; l++) {
        const goal = (!collapsed && l === pulled) ? 1 : 0;
        if (pullT[l] !== goal) {
          pullT[l] += (goal - pullT[l]) * kk;
          if (Math.abs(goal - pullT[l]) < 0.003) pullT[l] = goal;
        }
      }
      poseLayers();
      for (let i = falling.length - 1; i >= 0; i--) {
        const f = falling[i];
        const t = Math.min(1, (now - f.t0) / 520);
        f.mesh.position.y = fallY(2.4, 0, t);
        if (t >= 1) falling.splice(i, 1);
      }
      if (autoOrbit) { cam.theta += 0.006; applyCamera(); }
      if (winMeshes.length) {
        const s = Math.sin(now / 160);
        winMeshes.forEach((m) => {
          m.scale.setScalar(1.08 + 0.06 * s);
          m.material.emissiveIntensity = 0.55 + 0.3 * s;
        });
        if (winRod) winRod.material.emissiveIntensity = 0.7 + 0.3 * s;
      }
      renderer.render(scene, camera);
    }

    function setPulled(l) {
      if (l >= 0 && pullT.every((v) => v === 0)) pickDrawerDir();   // fix the front while every drawer is shut
      pulled = l;
      hoverLayer = -1;
      if (ready) refreshView();
    }

    return {
      init,
      onTap(fn) { tapCb = fn; },
      onHover(fn) { hoverCb = fn; },
      onLayerTap(fn) { layerCb = fn; },
      onRelease(fn) { releaseCb = fn; },
      getPulled() { return pulled; },
      pull(l) { if (!collapsed && l >= 0 && l <= 3) setPulled(l); },
      release() { if (pulled >= 0) setPulled(-1); },
      start() {
        if (!ready || running) return;
        running = true;
        resize();
        rafId = requestAnimationFrame(tick);
      },
      stop() { running = false; cancelAnimationFrame(rafId); },
      reset() {
        if (!ready) return;
        balls.forEach((b) => { b.mesh.parent.remove(b.mesh); b.mesh.material.dispose(); });
        balls.clear();
        bridges.forEach((br) => { br.mesh.parent.remove(br.mesh); br.mesh.material.dispose(); });
        bridges.length = 0;
        falling.length = 0;
        winMeshes = [];
        dimmed = false;
        autoOrbit = false;
        if (winRod) { scene.remove(winRod); winRod.material.dispose(); winRod = null; }
        hoverCell = -1;
        ghost.visible = false;
        scene.add(ghost);
        cam.theta = 0.62; cam.phi = 0.95; cam.dist = 22;
        collapsed = false;
        pulled = -1;
        hoverLayer = -1;
        pullT.fill(0);
        applyCamera();
        poseLayers();
        refreshView();
        resize();
      },
      placeBall(idx, player) {
        if (!ready) return;
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 28, 20), ballMaterial(player));
        mesh.position.copy(localXYZ(idx));
        mesh.position.y = 2.4;
        layers[layerOf(idx)].add(mesh);
        balls.set(idx, { mesh, player });
        falling.push({ mesh, t0: performance.now() });
        // fuse with every touching ball of the same colour (all 26 directions)
        const l = layerOf(idx), y = ((idx % 16) / 4) | 0, x = idx % 4;
        for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy && !dz) continue;
          const nx = x + dx, ny = y + dy, nl = l + dz;
          if (nx < 0 || nx > 3 || ny < 0 || ny > 3 || nl < 0 || nl > 3) continue;
          const nIdx = nl * 16 + ny * 4 + nx;
          const nb = balls.get(nIdx);
          if (nb && nb.player === player) addBridge(idx, nIdx, player);
        }
        poseLayers();
        refreshView();
      },
      showWin(cells) {
        if (!ready) return;
        const set = new Set(cells);
        // everything goes back into the stack so the line reads true
        collapsed = true;
        pulled = -1;
        hoverLayer = -1;
        pullT.fill(0);
        poseLayers();
        dimmed = true;
        refreshView();
        winMeshes = cells.map((c) => balls.get(c).mesh);
        winMeshes.forEach((m) => { m.material.opacity = 1; });
        bridges.forEach((br) => {
          // keep the bridges that run along the winning line bright
          const i = cells.indexOf(br.a), j = cells.indexOf(br.b);
          br.win = i >= 0 && j >= 0 && Math.abs(i - j) === 1;
          br.mesh.material.opacity = br.win ? 1 : 0.2;
        });
        balls.forEach((b, idx) => { if (!set.has(idx)) b.mesh.material.opacity = 0.28; });
        // a solid golden rod through the finished line
        const a = cellXYZ(cells[0]), b = cellXYZ(cells[3]);
        const dir = b.clone().sub(a);
        winRod = new THREE.Mesh(
          new THREE.CylinderGeometry(0.1, 0.1, dir.length() + 1.0, 12),
          new THREE.MeshStandardMaterial({ color: 0xfde68a, emissive: 0xfbbf24, emissiveIntensity: 0.8, roughness: 0.3, metalness: 0.4 })
        );
        winRod.position.copy(a).add(b).multiplyScalar(0.5);
        winRod.quaternion.setFromUnitVectors(upVec, dir.normalize());
        scene.add(winRod);
        autoOrbit = true;
      },
      // translucent preview ball at a cell (idx < 0 hides it); it rides along with its layer
      setGhost(idx, player) {
        if (!ready || !ghost) return;
        hoverCell = idx;
        if (idx < 0) { ghost.visible = false; refreshView(); return; }
        layers[layerOf(idx)].add(ghost);
        ghost.position.copy(localXYZ(idx));
        ghost.material.color.setHex(COLORS[player]);
        ghost.visible = true;
        refreshView();
      },
      clearGhost() { if (ghost) { ghost.visible = false; hoverCell = -1; if (ready) refreshView(); } },
    };
  })();

  // ---------- Input glue: taps / hover from the 3D view ----------
  // Tap a layer to pull it out as a drawer, then tap a cell on it. Touch needs
  // two taps on the cell (the first previews the ball with a ghost, the second
  // confirms); a mouse click places straight away, with the same preview on
  // hover. Placing a ball or tapping off the drawer slides it back in.
  // Block the browser's own gestures (iOS ignores user-scalable=no): pinch-zoom, double-tap zoom,
  // long-press menu and text selection - everywhere except real text inputs.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  const isTextField = (e) => e.target.closest && e.target.closest('input, textarea');
  document.addEventListener('contextmenu', (e) => { if (!isTextField(e)) e.preventDefault(); });
  document.addEventListener('selectstart', (e) => { if (!isTextField(e)) e.preventDefault(); });
  let pendingCell = -1;
  function humanCanMove() {
    return !gameOver && !cpuThinking && !(mode === 'cpu' && currentPlayer === 2)
      && !boardWrap.classList.contains('locked');
  }
  function pullLayer(l) {
    pendingCell = -1;
    Board3D.clearGhost();
    Board3D.pull(l);
  }
  function releaseDrawer() {
    pendingCell = -1;
    Board3D.clearGhost();
    Board3D.release();
  }
  Board3D.onTap((cell, pointerType) => {
    if (cell < 0 || !humanCanMove() || grid[cell] !== 0) return;
    if (pointerType === 'mouse' || pendingCell === cell) { handleCellClick(cell); releaseDrawer(); return; }
    pendingCell = cell;
    Board3D.setGhost(cell, currentPlayer);
  });
  Board3D.onHover((cell) => {
    if (pendingCell >= 0) return;
    if (cell < 0 || !humanCanMove() || grid[cell] !== 0) { Board3D.setGhost(-1); return; }
    Board3D.setGhost(cell, currentPlayer);
  });
  Board3D.onLayerTap((l) => { SoundMgr.seClick(); pullLayer(l); });
  Board3D.onRelease(releaseDrawer);
  // desktop: 1-4 pull out that layer (again = push it back), Esc pushes it back
  document.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key >= '1' && e.key <= '4') {
      const l = +e.key - 1;
      if (Board3D.getPulled() === l) releaseDrawer(); else pullLayer(l);
    } else if (e.key === 'Escape') releaseDrawer();
  });

  // `currentChar.depth` is the search depth in plies; `wildness` is the chance
  // of dropping on a random cell instead. A winning cell is always taken.
  function getCpuMove() {
    const empty = getEmptyCells(grid);
    if (empty.length === 0) return null;

    const winCell = findImmediateWin(grid, 2);
    if (winCell !== null) return winCell;

    const wildness = currentChar ? currentChar.wildness : 0;
    if (wildness > 0 && Math.random() < wildness) {
      return empty[Math.floor(Math.random() * empty.length)];
    }

    let depth = currentChar ? currentChar.depth : 3;
    // The opening has 60+ near-equal moves and no tactics to find: searching deep
    // there only freezes the page (~2s at depth 5), so keep it shallow.
    if (grid.filter((v) => v !== 0).length < 4) depth = Math.min(depth, 3);
    const cell = chooseCpuCell(grid, 2, depth);
    return cell === null ? empty[0] : cell;
  }

  applyKanaMode(); // render the title/online screens in the persisted mode
})();
</script>
</body>
</html>
