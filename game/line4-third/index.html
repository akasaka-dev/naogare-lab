<title>LineUp4 3D - 立体4個並べ対戦ゲーム</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --bg: #1e293b;
    --board: #2563eb;
    --slot: #0f172a;
    --p1: #ff4fa3;
    --p2: #3df2d8;
    --text: #f1f5f9;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  /* Game UI: no text selection, no long-press callout/search, no double-tap or pinch page zoom. */
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  img, canvas { -webkit-user-drag: none; -webkit-touch-callout: none; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* ---- Audio toggles (always visible, above every screen) ---- */
  #audioControls {
    position: fixed;
    bottom: max(10px, env(safe-area-inset-bottom));
    right: max(10px, env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    gap: 8px;
  }
  .audio-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(15, 23, 42, 0.72);
    border: 1.5px solid rgba(148, 163, 184, 0.45);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(4px);
  }
  .audio-btn .audio-icon { font-size: 0.95rem; line-height: 1; }
  .audio-btn .kana-icon {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--accent);
  }
  .audio-btn.muted .kana-icon { color: inherit; }
  .audio-btn.muted {
    border-color: rgba(148, 163, 184, 0.25);
    color: rgba(241, 245, 249, 0.45);
  }
  .audio-btn.muted .audio-icon { filter: grayscale(1); opacity: 0.6; }
  @media (max-width: 480px) {
    .audio-btn .audio-label { display: none; }
    .audio-btn { padding: 8px; }
  }

  /* ---- Splash / title screen ---- */
  #splashScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  #splashScreen.show { opacity: 1; }
  #splashScreen.hide { opacity: 0; pointer-events: none; }
  #splashScreen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* title.webp is a wide landscape illustration — on narrow/portrait screens
     "cover" crops off the characters and part of the logo at the sides, so
     switch to "contain" (full artwork visible, letterboxed) there instead. */
  @media (max-aspect-ratio: 1/1) {
    #splashScreen img { object-fit: contain; }
  }

  /* ---- Full-screen CPU character backdrop (shown during play) ---- */
  #charBgWrap {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #charBgWrap.show { opacity: 1; }
  #charBgImg {
    height: 96vh;
    max-width: 62vw;
    object-fit: contain;
    object-position: bottom right;
    filter: drop-shadow(0 10px 34px rgba(0,0,0,0.65));
    -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 38%, rgba(0,0,0,0) 92%);
    mask-image: linear-gradient(to left, rgba(0,0,0,1) 38%, rgba(0,0,0,0) 92%);
  }
  #charBgOverlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
    background: linear-gradient(to right,
      rgba(10, 15, 30, 1) 0%,
      rgba(10, 15, 30, 0.88) 32%,
      rgba(10, 15, 30, 0.4) 58%,
      rgba(10, 15, 30, 0) 82%);
  }
  #charBgOverlay.show { opacity: 1; }

  /* On narrow screens there's no side-by-side space: the desktop layout
     (character peeking in from the right, page content to its left) leaves
     the character almost entirely masked out. Switch to a centered figure
     standing behind the bottom of the screen, fading out before it reaches
     the UI text up top, instead. */
  @media (max-width: 640px) {
    /* The board is opaque and claims the center/bottom of the screen, so a
       bottom-anchored character just disappears behind it. Put the character
       in a header band above the board instead — cropped to the upper body
       via object-fit:cover, faded out before it reaches the board — so it
       shows through behind the status text without the two fighting for the
       same space. */
    /* Same staging as the desktop layout: the full-length figure stands at the
       bottom right, large, behind the (translucent) board. */
    /* taller than the screen is wide is fine: the left edge is simply clipped, so the head
       rises into the free band above the play area instead of hiding behind the board */
    #charBgImg { max-width: 135vw; height: 92vh; }
    /* During a match, sit the whole play area at the bottom of the screen
       (just above the round buttons at the bottom right) so the character's
       face in the header band stays clear of the board. */
    body:has(#gameScreen:not(.hidden)) {
      justify-content: flex-end;
      padding: 8px 8px calc(max(10px, env(safe-area-inset-bottom)) + 48px);
      /* 100vh is taller than what a phone actually shows (URL bar etc.), which made
         the page scrollable; dvh is the real visible height. Lock the page in place
         during a match — the board takes drags, so nothing should scroll. */
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }
    html:has(#gameScreen:not(.hidden)) { overflow: hidden; height: 100%; }
    body:has(#gameScreen:not(.hidden)) #dock { margin-top: 8px; gap: 12px; }
    #speechBubble { min-height: 92px; padding: 18px 12px 10px 10px; gap: 9px; }
    #bubbleAvatar { width: 44px; height: 44px; }
    #speechBubble .bubble-text { font-size: 0.85rem; line-height: 1.5; }
    .deck { width: 64px; height: 90px; }
    body:has(#gameScreen:not(.hidden)) #status { margin-bottom: 6px; }
    #board-wrap #board {
      /* also capped by what's left under the bubble/labels, so short screens shrink the board instead of clipping the bubble */
      width: min(calc(100vw - 16px), 68vh, 68dvh, calc(100dvh - 275px));
      height: min(calc(100vw - 16px), 68vh, 68dvh, calc(100dvh - 275px));
    }
  }

  /* keep the bottom dock clear of the fixed round-button row */
  body:has(#gameScreen:not(.hidden)) {
    padding-bottom: calc(max(10px, env(safe-area-inset-bottom)) + 48px);
  }

  .page-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.15rem, 6.2vw, 1.8rem);
    letter-spacing: 0.05em;
    overflow-wrap: break-word;
    max-width: 100%;
  }
  .hidden { display: none !important; }

  /* ---- Title screen ---- */
  #titleScreen, #onlineScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 36px 30px;
    background: rgba(15, 23, 42, 0.55);
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    width: 100%;
    max-width: min(820px, 92vw);
    box-sizing: border-box;
  }
  @media (max-width: 480px) {
    #titleScreen, #onlineScreen { padding: 28px 18px; gap: 14px; }
  }
  #titleScreen p.subtitle, #onlineScreen p.subtitle {
    margin: -8px 0 4px;
    opacity: 0.75;
    font-size: 0.95rem;
  }
  #debugTrigger { user-select: none; }

  /* ---- Online multiplayer (create/join room) ---- */
  .player-name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.85rem;
    opacity: 0.9;
    margin-top: -6px;
  }
  #playerNameInput, .name-input {
    background: #0f172a;
    border: 2px solid #334155;
    color: var(--text);
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 0.95rem;
    width: 130px;
    text-align: center;
  }
  #playerNameInput:focus, .name-input:focus { outline: none; border-color: var(--accent); }
  #onlineJoinConfirm {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .online-join-row {
    display: flex;
    gap: 8px;
  }
  #onlineJoinCode {
    background: #0f172a;
    border: 2px solid #334155;
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    width: 140px;
    text-align: center;
  }
  #onlineJoinCode:focus { outline: none; border-color: var(--accent); }
  #onlineJoinBtn {
    padding: 10px 18px;
    border-radius: 10px;
  }
  .online-error {
    color: var(--p1);
    font-size: 0.85rem;
    min-height: 1.2em;
    margin: 0;
  }
  .online-room-code {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: var(--accent);
    background: #0f172a;
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 14px 24px;
  }
  .online-waiting-text {
    font-size: 0.95rem;
    margin: 0;
    animation: onlinePulse 1.6s ease-in-out infinite;
  }
  @keyframes onlinePulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.95; }
  }
  .mode-options {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-btn {
    background: #0f172a;
    border: 2px solid var(--accent);
    color: var(--text);
    padding: 22px 28px;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 180px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .mode-btn .emoji { font-size: 1.8rem; display: block; margin-bottom: 6px; }
  .mode-btn-sub {
    display: block;
    font-size: 0.68rem;
    font-weight: 500;
    opacity: 0.65;
    margin-top: 4px;
  }
  .mode-btn:hover {
    background: var(--accent);
    color: #0f172a;
    transform: translateY(-3px);
  }
  .mode-btn:hover .mode-btn-sub { color: #0f172a; opacity: 0.8; }

  .back-to-splash-btn {
    background: transparent;
    border: none;
    color: var(--text);
    opacity: 0.65;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 6px 10px;
  }
  .back-to-splash-btn:hover { opacity: 1; text-decoration: underline; }

  .credit {
    margin: 4px 0 0;
    font-size: 0.72rem;
    opacity: 0.45;
    letter-spacing: 0.02em;
  }
  .credit strong { font-weight: 700; opacity: 0.9; }
  .credit a {
    color: inherit;
    opacity: 0.8;
    text-decoration: none;
    border-bottom: 1px dotted currentColor;
  }
  .credit a:hover { opacity: 1; }

  /* ---- Ladder result overlay (shown between/after CPU matches) ---- */
  #resultOverlay {
    position: fixed;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 8, 18, 0.82);
    padding: 20px;
  }
  .result-card {
    background: rgba(15, 23, 42, 0.96);
    border: 2px solid var(--accent);
    border-radius: 18px;
    padding: 28px 30px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  }
  .result-portrait {
    width: 100%;
    height: 190px;
    border-radius: 12px;
    background: #0f172a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    margin-bottom: 14px;
  }
  .result-portrait:empty { display: none; margin: 0; }
  .result-portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  .result-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .result-message {
    font-size: 0.9rem;
    opacity: 0.85;
    line-height: 1.6;
    margin-bottom: 20px;
    white-space: pre-line;
  }
  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-actions button {
    width: 100%;
  }
  .result-actions .secondary {
    background: transparent;
    border: 2px solid #475569;
    color: var(--text);
  }
  /* Online post-game countdown ("leave in N seconds") — see tickPostGameCountdown() */
  .result-note {
    margin-top: 12px;
    font-size: 0.8rem;
    opacity: 0.7;
  }

  /* ---- おまけ: post-clear slideshow (see openOmake()) ---- */
  #omakeBtn.hidden { display: none; }
  #omakeScreen {
    position: fixed;
    inset: 0;
    z-index: 14;
    background: #000;
    overflow: hidden;
    user-select: none;
    touch-action: pan-y;
  }
  #omakeScreen.hidden { display: none; }
  #omakeStage { position: absolute; inset: 0; }
  .omake-slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }
  .omake-slide.show { opacity: 1; animation: omakeDrift 9s linear forwards; }
  @keyframes omakeDrift { from { transform: scale(1); } to { transform: scale(1.05); } }
  #omakeCaption {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px);
    text-align: center;
    color: #f6f1e7;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "MS PMincho", serif;
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.95);
    pointer-events: none;
  }
  #omakeBackBtn {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    background: rgba(15, 23, 42, 0.72);
    border: 1.5px solid rgba(148, 163, 184, 0.5);
    color: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }
  #omakeControls {
    position: absolute;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(15, 23, 42, 0.72);
    border: 1.5px solid rgba(148, 163, 184, 0.4);
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 0.85rem;
    max-width: calc(100vw - 24px);
  }
  #omakeControls button {
    background: transparent;
    border: 1.5px solid rgba(148, 163, 184, 0.5);
    color: inherit;
    border-radius: 50%;
    width: 34px; height: 34px;
    font-size: 0.95rem;
    cursor: pointer;
    padding: 0;
  }
  #omakeControls select {
    background: #0f172a;
    color: inherit;
    border: 1.5px solid rgba(148, 163, 184, 0.5);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.85rem;
    font-family: inherit;
    min-width: 0;
  }

  /* ---- All-clear ending ---- */
  #endingScreen {
    position: fixed;
    inset: 0;
    z-index: 9;
    background: #000;
    overflow: hidden;
    cursor: grab;
    touch-action: none; /* the crawl is drag-scrubbed by hand, not natively scrolled */
    user-select: none; /* otherwise a mouse-drag over the crawl text selects it instead of scrubbing */
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #endingScreen.dragging { cursor: grabbing; }
  #endingScreen.show { opacity: 1; }
  #endingScroll {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  #endingScroll img {
    display: block;
    position: absolute;
    left: 50%;
    top: 0;
    -webkit-user-drag: none; /* native image drag would otherwise hijack the crawl-scrub gesture on desktop */
    /* min-width/min-height (not plain width/height) is the pure-CSS
       "cover" trick: the browser grows whichever axis is needed to fully
       cover the screen, so no black #endingScreen background can ever
       show through even on a phone taller than ending2.webp's own 2:1
       ratio — it crops a bit off the sides instead. */
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    /* Base centering, also the animation's 0% state — starts on the
       BOTTOM of the artwork (feet) and pans up to the top (sky/faces) by
       the end, so the scene doesn't close on a close-up of someone's boots. */
    transform: translate(-50%, calc(-100% + 100vh));
  }
  #endingScroll img.pan {
    animation: endingPan 90s ease-in-out forwards;
  }
  @keyframes endingPan {
    0%, 10% { transform: translate(-50%, calc(-100% + 100vh)); }
    90%, 100% { transform: translate(-50%, 0); }
  }
  /* Narration crawl overlaid on the artwork — see showEndingScreen(). Its
     start/end transform is set inline (via the Web Animations API) once the
     text is built and its rendered height is known, so it always scrolls
     fully clear of the screen regardless of how much text is in it. */
  #endingTextWrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #endingTextCrawl {
    position: absolute;
    left: 50%;
    top: 0;
    width: min(560px, 86vw);
    text-align: center;
    color: #f6f1e7;
    font-size: clamp(0.95rem, 2.6vw, 1.1rem);
    line-height: 1.9;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.9);
  }
  #endingTextCrawl p { margin: 0 0 2.6em; white-space: pre-line; }
  .ending-hint {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 10;
    color: var(--text);
    background: rgba(15, 23, 42, 0.65);
    border: 1.5px solid rgba(148, 163, 184, 0.45);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    pointer-events: none;
    opacity: 0;
    animation: endingHintFade 2s ease 1s forwards;
  }
  @keyframes endingHintFade {
    to { opacity: 0.9; }
  }

  /* ---- Online emote picker (flick/drag-scroll strip) + incoming popup ---- */
  /* max-width must stay tied to the viewport (vw), not just a flat px cap:
     #emoteScroller's 25 fixed-width icons give it a large intrinsic content
     width, and on portrait phones a flat 480px let that intrinsic width
     inflate #gameScreen (an auto-width flex column) past the viewport,
     clipping the board's side columns under body's overflow-x:hidden. */
  #onlineEmoteBar {
    width: 100%;
    max-width: min(480px, 92vw);
    margin-top: 14px;
  }
  /* Applied for the post-game grace window (see resultNote/POST_GAME_WINDOW_MS)
     so the emote strip stays reachable above the result overlay's backdrop
     instead of being hidden underneath it — pinned to the bottom of the
     viewport with a higher z-index than #resultOverlay (6). */
  #onlineEmoteBar.postgame {
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 7;
    background: rgba(15, 23, 42, 0.9);
    border: 2px solid #334155;
    border-radius: 16px;
    padding: 6px 8px 2px;
    margin-top: 0;
  }
  #emoteScroller {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    padding: 4px 4px 10px;
    cursor: grab;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #emoteScroller::-webkit-scrollbar { display: none; }
  #emoteScroller.dragging { cursor: grabbing; }
  .emote-icon-btn {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    padding: 4px;
    border-radius: 12px;
    background: #0f172a;
    border: 2px solid #334155;
    cursor: pointer;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .emote-icon-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .emote-icon-btn:hover { border-color: var(--accent); }
  .emote-icon-btn:active { transform: scale(0.92); }

  #incomingEmote {
    position: fixed;
    top: 16vh;
    left: 50%;
    z-index: 8;
    width: 120px;
    height: 120px;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -12px) scale(0.5);
    transition: opacity 0.25s ease, transform 0.25s ease;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
  }
  #incomingEmote img { width: 100%; height: 100%; object-fit: contain; }
  #incomingEmote.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  /* Feedback for your OWN tap: a clone of the tapped icon rises from the
     button and fades, so it's clear the tap registered (opponent's popup
     via #incomingEmote is the only feedback that existed before). */
  .emote-fly {
    position: fixed;
    width: 44px;
    height: 44px;
    object-fit: contain;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: none;
    z-index: 9;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.9s ease 0.2s;
  }
  .emote-fly.rise {
    transform: translate(-50%, calc(-50% - 38vh)) scale(1.3);
    opacity: 0;
  }

  /* ---- Turn-order coin toss ---- */
  #turnDecideOverlay {
    position: fixed;
    inset: 0;
    z-index: 7;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 8, 18, 0.82);
  }
  .turn-decide-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .coin-wrap { perspective: 400px; }
  .coin {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--p1);
    box-shadow: 0 0 20px 6px rgba(255,255,255,0.18), 0 8px 20px rgba(0,0,0,0.5);
    animation: coinSpin 0.15s linear infinite;
  }
  .coin.settled { animation: coinSettle 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes coinSpin {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(0.12); }
  }
  @keyframes coinSettle {
    0% { transform: scaleX(0.12); }
    55% { transform: scaleX(1.18) scaleY(0.85); }
    75% { transform: scaleX(0.92) scaleY(1.06); }
    100% { transform: scaleX(1) scaleY(1); }
  }
  .turn-decide-text {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    opacity: 0;
    transition: opacity 0.25s ease;
    text-align: center;
  }
  .turn-decide-text.show { opacity: 1; }

  /* ---- Game screen ---- */
  #gameScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #status {
    font-size: 1.15rem;
    margin-bottom: 14px;
    min-height: 1.6em;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  #turnTimeoutWarning {
    font-size: 0.85rem;
    font-weight: 700;
    color: #f59e0b;
    margin: -8px 0 12px;
  }
  .turn-indicator {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3) inset;
  }
  .turn-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    box-shadow: 0 0 0 2px var(--p2);
  }
  #modeLabel {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #opponentAvatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
  }

  /* ---- Bottom dock: dialogue box (left) + trump-card deck (right) ---- */
  #dock {
    width: 100%;
    max-width: 620px;
    display: flex;
    align-items: stretch;
    gap: 16px;
    margin-top: 14px;
  }
  #dock:has(#speechBubble.hidden):not(.pvp) { display: none; }   /* online: no dock */
  #dock.pvp { justify-content: space-between; padding: 0 10px; box-sizing: border-box; }   /* pvp: just the two decks, one at each side */
  #dock.pvp .deck { align-self: center; }
  .deck.owner1 .deck-card { border-color: #ff4fa3; }
  .deck.owner2 .deck-card { border-color: #3df2d8; }
  .deck.owner1.ready .deck-card { animation-name: deckPulse1; }
  .deck.owner2.ready .deck-card { animation-name: deckPulse2; }
  @keyframes deckPulse1 { 0%, 100% { box-shadow: 0 0 12px rgba(255, 79, 163, 0.7), 0 6px 16px rgba(0, 0, 0, 0.6); } 50% { box-shadow: 0 0 24px rgba(255, 79, 163, 0.95), 0 6px 16px rgba(0, 0, 0, 0.6); } }
  @keyframes deckPulse2 { 0%, 100% { box-shadow: 0 0 12px rgba(61, 242, 216, 0.7), 0 6px 16px rgba(0, 0, 0, 0.6); } 50% { box-shadow: 0 0 24px rgba(61, 242, 216, 0.95), 0 6px 16px rgba(0, 0, 0, 0.6); } }
  #cardFxLayer { position: fixed; inset: 0; z-index: 9000; pointer-events: none; overflow: hidden; }
  .fly-card { position: fixed; transform-origin: center; will-change: transform, opacity, filter; }
  .fly-card .deck-card { box-shadow: 0 0 26px 6px rgba(251, 191, 36, 0.85), 0 0 80px 18px rgba(251, 191, 36, 0.45); }
  .fly-flash {
    position: fixed; width: 380px; height: 380px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, rgba(255, 246, 210, 0.95) 0%, rgba(251, 191, 36, 0.55) 34%, transparent 70%);
    transform: translate(-50%, -50%) scale(0.2);
  }
  .deck.launching .deck-card { visibility: hidden; }
  .deck-card.back {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #4b2f99, #120e2b 72%);
  }
  .deck-card.back .back-mark { font-size: 1.7rem; color: #fde68a; text-shadow: 0 0 12px rgba(251, 191, 36, 0.9); }
  #oppCardLine { font-size: 0.74rem; color: #fde68a; opacity: 0.9; margin: -2px 0 2px; text-align: center; }
  #oppCardLine.used { opacity: 0.5; text-decoration: line-through; }

  #speechBubble {
    flex: 1;
    min-width: 0;
    min-height: 106px;
    position: relative;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 16px 12px 14px;
    background: linear-gradient(160deg, rgba(36, 28, 70, 0.96), rgba(11, 9, 28, 0.96));
    border: 1.5px solid rgba(196, 167, 255, 0.55);
    border-radius: 14px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 10px 26px rgba(0, 0, 0, 0.55), 0 0 18px rgba(139, 92, 246, 0.2);
    opacity: 0.55;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  #speechBubble.show { opacity: 1; transform: translateY(0); }
  #bubbleAvatar {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    background: #0b0a1a;
    border: 2px solid #d4af37;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.45);
  }
  #bubbleAvatar:not([src]), #bubbleAvatar[src=""] { display: none; }
  .bubble-body { flex: 1; min-width: 0; }
  #speechBubble .bubble-name {
    position: absolute;
    top: -11px;
    left: 16px;
    padding: 2px 14px;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #1b1330;
    background: linear-gradient(90deg, #f5d77a, #d4af37);
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  #speechBubble .bubble-name:empty { display: none; }
  #speechBubble .bubble-text {
    font-size: 0.92rem;
    line-height: 1.6;
  }

  /* the card deck: a small stack of cards; the top one shows the held card */
  .deck {
    position: relative;
    flex: none;
    width: 76px;
    height: 106px;
    align-self: flex-end;
    padding: 0;
    border: 0;
    background: none;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.2s ease;
  }
  .deck.hidden { display: none; }
  .deck::before, .deck::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: linear-gradient(145deg, #2b2057, #120e2b);
    border: 1.5px solid rgba(167, 139, 250, 0.5);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  }
  .deck::before { transform: translate(7px, 5px) rotate(5deg); opacity: 0.75; }
  .deck::after { transform: translate(3.5px, 2.5px) rotate(2.5deg); opacity: 0.9; }
  .deck.empty::before, .deck.empty::after { display: none; }
  .deck:hover { transform: translateY(-4px); }
  .deck.used, .deck.empty { cursor: default; }
  .deck.used:hover, .deck.empty:hover { transform: none; }
  .deck-card {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
    overflow: hidden;
    border-radius: 10px;
    border: 2px solid #d4af37;
    background: #0b0a1a;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
  }
  .deck-art { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .deck-card::after {   /* holographic sheen */
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.4) 48%, transparent 64%);
    background-size: 260% 100%;
    background-position: 140% 0;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .deck.ready .deck-card { animation: deckPulse 2.2s ease-in-out infinite; }
  .deck.ready .deck-card::after { animation: deckSheen 3.4s ease-in-out infinite; }
  @keyframes deckPulse {
    0%, 100% { box-shadow: 0 0 14px rgba(251, 191, 36, 0.7), 0 6px 16px rgba(0, 0, 0, 0.6); }
    50% { box-shadow: 0 0 26px rgba(251, 191, 36, 0.95), 0 6px 16px rgba(0, 0, 0, 0.6); }
  }
  @keyframes deckSheen {
    0%, 55% { background-position: 140% 0; }
    100% { background-position: -60% 0; }
  }
  .deck-lv {
    position: absolute;
    top: 4px;
    left: 5px;
    z-index: 2;
    padding: 1px 5px;
    font-size: 0.58rem;
    font-weight: 800;
    color: #fde68a;
    background: rgba(8, 6, 20, 0.78);
    border: 1px solid rgba(212, 175, 55, 0.6);
    border-radius: 6px;
  }
  .deck-name {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    padding: 16px 3px 5px;
    text-align: center;
    font-size: 0.64rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #fde68a;
    text-shadow: 0 1px 3px #000;
    background: linear-gradient(to bottom, transparent, rgba(8, 6, 20, 0.94) 58%);
  }
  .deck-used {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 3;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: #e2e8f0;
    background: rgba(5, 4, 14, 0.55);
  }
  .deck.used .deck-used { display: flex; }
  .deck.used .deck-art { filter: grayscale(0.9) brightness(0.55); }
  .deck.empty .deck-card {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px;
    font-size: 0.62rem;
    line-height: 1.5;
    color: rgba(226, 232, 240, 0.55);
    border: 2px dashed rgba(148, 163, 184, 0.45);
    background: rgba(15, 23, 42, 0.45);
    box-shadow: none;
  }
  .deck.empty .deck-card::after { display: none; }
  .deck.deal { animation: deckDeal 0.65s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
  @keyframes deckDeal {
    from { transform: translateY(-40px) rotate(-12deg) scale(0.7); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  #board-wrap {
    background: rgba(15, 23, 42, 0.55);
    padding: 4px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    position: relative;
  }
  /* The 3D view stays draggable while locked (CPU thinking / coin toss) so the
     player can keep looking around; taps are ignored in JS instead. */
  #board-wrap.locked { opacity: 0.92; }
  #board {
    position: relative;
    width: min(calc(100vw - 24px), 720px, 68vh);
    height: min(calc(100vw - 24px), 720px, 68vh);
    /* leave room for the labels, the bottom dock and the button row */
    width: min(calc(100vw - 24px), 720px, 68vh, calc(100dvh - 290px));
    height: min(calc(100vw - 24px), 720px, 68vh, calc(100dvh - 290px));
    min-width: 260px;
    min-height: 260px;
    touch-action: none;   /* drags orbit the camera instead of scrolling the page */
    user-select: none;
    cursor: grab;
  }
  #board:active { cursor: grabbing; }
  #board canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .title-3d {
    font-size: 0.62em;
    letter-spacing: 0.12em;
    color: var(--accent);
    white-space: nowrap;
  }
  .col-hitzone {
    position: relative;
    cursor: pointer;
    aspect-ratio: 1 / 1;
  }
  .cell {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--slot);
    position: relative;
    transition: transform 0.15s ease;
  }
  .cell.p1 { background: var(--p1); box-shadow: 0 0 10px rgba(255,79,163,0.7); }
  .cell.p2 { background: var(--p2); box-shadow: 0 0 10px rgba(61,242,216,0.7); }
  .cell.drop {
    /* Purely cosmetic — game state already updates instantly on click,
       so this playing out slowly never blocks the next move. */
    animation: drop 1.1s;
    transform-origin: bottom center;
  }
  .cell.win {
    animation: pulse 0.8s ease-in-out infinite;
    box-shadow: 0 0 18px 4px var(--accent);
  }
  @keyframes drop {
    0%   { transform: translateY(-260%) scale(1, 1);         animation-timing-function: cubic-bezier(0.2, 0, 1, 0.35); }
    10%  { transform: translateY(-250%) scale(1, 1);         animation-timing-function: cubic-bezier(0.2, 0, 1, 0.35); }
    58%  { transform: translateY(0) scale(1, 1);              animation-timing-function: ease-out; }
    68%  { transform: translateY(3%) scale(1.1, 0.88);        animation-timing-function: ease-out; }
    80%  { transform: translateY(-7%) scale(0.96, 1.05);      animation-timing-function: ease-out; }
    91%  { transform: translateY(2%) scale(1.03, 0.97);       animation-timing-function: ease-out; }
    97%  { transform: translateY(-1%) scale(0.99, 1.01); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .col-hitzone:hover .cell:not(.p1):not(.p2) {
    background: #1e293b;
  }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { filter: brightness(0.9); }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    filter: none;
    pointer-events: none;
  }

  /* ---- Prologue before a CPU run: black screen, white text, tap for the next line ---- */
  #storyOverlay {
    position: fixed;
    inset: 0;
    z-index: 15;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    cursor: pointer;
  }
  #storyOverlay.hidden { display: none; }
  #storyText {
    color: #fff;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "MS PMincho", serif;
    font-size: 1.05rem;
    line-height: 2.1;
    white-space: pre-line;
    max-width: 480px;
    text-align: left;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #storyText.show { opacity: 1; }
  #storySkipBtn {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    background: rgba(15, 23, 42, 0.72);
    border: 1.5px solid rgba(148, 163, 184, 0.5);
    color: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }
  #storySkipBtn:hover { background: rgba(30, 41, 59, 0.9); color: #fff; }
  /* bottom-left: the round sound / kana buttons live at the bottom right */
  #storyHint {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: max(20px, env(safe-area-inset-left));
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

  <!-- Always-on-top audio toggles — visible through every screen (splash, title, game, results) -->
  <div id="audioControls">
    <button id="titleBtn" class="audio-btn hidden" type="button" aria-label="タイトルに戻る">
      <span class="audio-icon">🏠</span>
    </button>
    <button id="bgmToggle" class="audio-btn" type="button" aria-label="BGMのオン/オフ" aria-pressed="true">
      <span class="audio-icon">🎵</span><span class="audio-label">BGM</span>
    </button>
    <button id="seToggle" class="audio-btn" type="button" aria-label="効果音のオン/オフ" aria-pressed="true">
      <span class="audio-icon">🔔</span><span class="audio-label">SE</span>
    </button>
    <button id="kanaToggle" class="audio-btn" type="button" aria-label="かなモードのオン/オフ" aria-pressed="false">
      <span class="audio-icon kana-icon">あ</span><span class="audio-label">かな</span>
    </button>
  </div>
  <audio id="bgmAudio" preload="none"></audio>

  <div id="splashScreen">
    <img src="title.webp" alt="黄昏のフォー・イン・ア・ロウ タイトル">
  </div>

  <div id="charBgWrap"><img id="charBgImg" src="" alt=""></div>
  <div id="charBgOverlay"></div>

  <div class="page-content">

  <!-- Title / mode select screen -->
  <div id="titleScreen">
    <h1><span id="titlePrefix">黄昏のフォー・イン・ア・</span><span id="debugTrigger">ロ</span>ウ <span class="title-3d">3D</span></h1>
    <p class="subtitle" id="titleSubtitle">遊び方を選んでください</p>
    <div class="player-name-row">
      <label for="playerNameInput" id="playerNameLabel"></label>
      <input type="text" id="playerNameInput" maxlength="10" autocomplete="off">
    </div>
    <div class="mode-options" id="modeOptions">
      <button class="mode-btn" id="pvpBtn"><span class="emoji">🧑‍🤝‍🧑</span><span id="pvpBtnLabel"></span></button>
      <button class="mode-btn" id="cpuBtn"><span class="emoji">🤖</span><span id="cpuBtnLabel"></span><br><span class="mode-btn-sub" id="cpuBtnSub"></span></button>
      <button class="mode-btn" id="onlineBtn" style="display:none"><span class="emoji">🌐</span><span id="onlineBtnLabel"></span><br><span class="mode-btn-sub" id="onlineBtnSub"></span></button>
      <button class="mode-btn hidden" id="omakeBtn"><span class="emoji">🎁</span><span id="omakeBtnLabel"></span><br><span class="mode-btn-sub" id="omakeBtnSub"></span></button>
    </div>
    <button class="back-to-splash-btn" id="backToSplashBtn"></button>
    <p class="credit">
      Created by <strong>naogare</strong> ／
      <a href="https://www.youtube.com/@NMLabo" target="_blank" rel="noopener noreferrer">YouTube: NMLabo</a>
    </p>
  </div>

  <!-- Online multiplayer: create/join a room, then wait for the opponent -->
  <div id="onlineScreen" class="hidden">
    <h1 id="onlineHeading"></h1>
    <div id="onlineMenu">
      <p class="subtitle" id="onlineIntro"></p>
      <button class="mode-btn" id="onlineCreateBtn"><span class="emoji">🚪</span><span id="onlineCreateBtnLabel"></span></button>
      <p class="subtitle" id="onlineOrJoin" style="margin-top:14px;"></p>
      <div class="online-join-row">
        <input type="text" id="onlineJoinCode" placeholder="部屋コード" maxlength="6" autocomplete="off" autocapitalize="characters">
        <button id="onlineJoinBtn"></button>
      </div>
      <p class="online-error" id="onlineError"></p>
      <button class="back-to-splash-btn" id="onlineBackBtn"></button>
    </div>
    <div id="onlineWaiting" class="hidden">
      <p class="subtitle" id="onlineShareInstructions"></p>
      <div class="online-room-code" id="onlineRoomCode"></div>
      <button id="onlineCopyBtn"></button>
      <p class="online-waiting-text" id="onlineWaitingText"></p>
      <button class="back-to-splash-btn" id="onlineCancelBtn"></button>
    </div>
    <div id="onlineJoinConfirm" class="hidden">
      <p class="subtitle" id="onlineJoinConfirmText"></p>
      <div class="player-name-row">
        <label for="onlineJoinNameInput" id="onlineJoinNameLabel"></label>
        <input type="text" id="onlineJoinNameInput" class="name-input" maxlength="10" autocomplete="off">
      </div>
      <button id="onlineJoinConfirmBtn"></button>
      <button class="back-to-splash-btn" id="onlineJoinCancelBtn"></button>
    </div>
  </div>

  <div id="cardFxLayer"></div>

  <!-- Game screen -->
  <div id="gameScreen" class="hidden">
    <div id="modeLabel"></div>
    <div id="oppCardLine" class="hidden"></div>
    <div id="status"></div>
    <div id="turnTimeoutWarning" class="hidden"></div>
    <div id="board-wrap">
      <div id="board"></div>
    </div>
    <!-- Bottom dock (CPU matches): the character's dialogue box + the trump-card deck -->
    <div id="dock">
      <div id="speechBubble" class="hidden">
        <img id="bubbleAvatar" alt="" draggable="false">
        <div class="bubble-body">
          <div class="bubble-name" id="bubbleName"></div>
          <div class="bubble-text" id="bubbleText"></div>

<script>
(function () {
  // ---------- Audio: looping BGM (file-based, per-screen tracks) + synthesized SFX (Web Audio API) ----------
  // Music lives in bgm/: title.mp3 plays on the splash/title screens, bgm.mp3
  // plays during actual matches. Either file can be missing (bgm.mp3 isn't
  // made yet) — playback just silently no-ops until it shows up. SFX are
  // generated on the fly via Web Audio API so they work immediately, no files
  // needed. Both toggles persist via localStorage and stay visible/functional
  // across every screen (splash, title, game, result overlay).
  // Some contexts (sandboxed embeds, certain mobile in-app browsers, strict
  // private-browsing modes) throw on any localStorage access rather than
  // just failing quietly — guard every call so a blocked storage API can
  // never take the rest of the game down with it.
  function safeStorageGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeStorageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
  }

  const SoundMgr = (function () {
    const STORAGE_BGM = 'lineup4_bgm_on';
    const STORAGE_SE = 'lineup4_se_on';
    let bgmOn = safeStorageGet(STORAGE_BGM) !== '0';
    let seOn = safeStorageGet(STORAGE_SE) !== '0';
    let unlocked = false;
    let ctx = null;

    // 'title' and 'game' are fixed tracks; 'level:N' is resolved to bgm/LVN.mp3
    // for a per-character theme, falling back to the generic game track (and
    // from there, silence) wherever a more specific file hasn't been added yet.
    const TITLE_URL = 'bgm/title.mp3';
    const GAME_URL = 'bgm/bgm.mp3';
    const ENDING_URL = 'bgm/ending.mp3';
    function levelUrl(level) { return 'bgm/LV' + level + '.mp3'; }
    function urlForKey(key) {
      if (key === 'title') return TITLE_URL;
      if (key === 'game') return GAME_URL;
      if (key === 'ending') return ENDING_URL;
      if (key.indexOf('level:') === 0) return levelUrl(key.slice(6));
      return null;
    }

    const BGM_VOLUME = 0.35;
    const trackMissing = {};
    let currentTrackKey = null;
    let endingLoop = false; // おまけ asks for the ending theme on repeat

    const bgmEl = document.getElementById('bgmAudio');
    bgmEl.volume = BGM_VOLUME;

    function ensureContext() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function fadeVolume(target, duration) {
      const start = bgmEl.volume;
      const t0 = performance.now();
      function step(now) {
        // rAF's timestamp can be slightly earlier than t0 -> keep t (and the volume) inside 0..1
        const t = Math.max(0, Math.min(1, (now - t0) / duration));
        bgmEl.volume = Math.max(0, Math.min(1, start + (target - start) * t));
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function playTrack(key, fallbackKey) {
      if (trackMissing[key]) {
        if (fallbackKey) playTrack(fallbackKey, fallbackKey === 'game' ? null : 'game');
        return;
      }
      if (currentTrackKey === key) {
        if (bgmOn && unlocked) bgmEl.play().catch(() => {});
        return;
      }
      currentTrackKey = key;
      const switchSrc = () => {
        const thisKey = key;
        bgmEl.onerror = () => {
          trackMissing[thisKey] = true;
          if (fallbackKey && currentTrackKey === thisKey) {
            playTrack(fallbackKey, fallbackKey === 'game' ? null : 'game');
          }
        };
        bgmEl.src = urlForKey(key);
        bgmEl.loop = key !== 'ending' || endingLoop; // the ending theme plays once, except in おまけ
        if (bgmOn && unlocked) {
          bgmEl.volume = 0;
          bgmEl.play().then(() => fadeVolume(BGM_VOLUME, 500)).catch(() => {});
        } else {
          bgmEl.volume = BGM_VOLUME;
        }
      };
      if (!bgmEl.paused) {
        fadeVolume(0, 250);
        setTimeout(() => { bgmEl.pause(); switchSrc(); }, 260);
      } else {
        switchSrc();
      }
    }

    // Prefer a level-specific theme (bgm/LV{level}.mp3); silently falls back
    // to the shared game track if that file doesn't exist for this level yet.
    function playLevelTrack(level) {
      playTrack('level:' + level, 'game');
    }

    function tone(freq, duration, type, gainPeak, delay) {
      if (!seOn) return;
      const audioCtx = ensureContext();
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(gainPeak || 0.15, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    }

    return {
      unlock() {
        if (unlocked) return;
        unlocked = true;
        ensureContext();
        playTrack(currentTrackKey || 'title');
      },
      playTrack,
      playLevelTrack,
      setEndingLoop(v) {
        endingLoop = !!v;
        if (currentTrackKey === 'ending') bgmEl.loop = endingLoop;
      },
      stop() {
        fadeVolume(0, 250);
        setTimeout(() => bgmEl.pause(), 260);
        currentTrackKey = null; // so a later playTrack() re-inits fully instead of just resuming
      },
      setBgmOn(v) {
        bgmOn = v;
        safeStorageSet(STORAGE_BGM, v ? '1' : '0');
        if (v) {
          if (unlocked) bgmEl.play().catch(() => {});
        } else {
          bgmEl.pause();
        }
      },
      setSeOn(v) {
        seOn = v;
        safeStorageSet(STORAGE_SE, v ? '1' : '0');
      },
      isBgmOn: () => bgmOn,
      isSeOn: () => seOn,
      seClick() { tone(520, 0.09, 'triangle', 0.12); },
      seDrop() { tone(160, 0.16, 'sine', 0.22); tone(90, 0.22, 'sine', 0.15, 0.03); },
      seWin() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, i * 0.09)); },
      seLose() { [392, 329.63, 261.63, 196].forEach((f, i) => tone(f, 0.28, 'sawtooth', 0.1, i * 0.11)); },
      seDraw() { tone(300, 0.2, 'sine', 0.12); tone(300, 0.2, 'sine', 0.12, 0.15); },
      seBurst() { tone(180, 0.35, 'sawtooth', 0.09); tone(740, 0.4, 'sine', 0.13, 0.02); tone(1480, 0.3, 'triangle', 0.09, 0.07); },
      seCard() { tone(660, 0.12, 'triangle', 0.12); tone(880, 0.16, 'triangle', 0.12, 0.08); tone(1320, 0.26, 'sine', 0.1, 0.18); },
    };
  })();

  const bgmToggleBtn = document.getElementById('bgmToggle');
  const seToggleBtn = document.getElementById('seToggle');
  function refreshAudioButtons() {
    const bgmIcon = bgmToggleBtn.querySelector('.audio-icon');
    const seIcon = seToggleBtn.querySelector('.audio-icon');
    bgmToggleBtn.classList.toggle('muted', !SoundMgr.isBgmOn());
    bgmToggleBtn.setAttribute('aria-pressed', String(SoundMgr.isBgmOn()));
    bgmIcon.textContent = SoundMgr.isBgmOn() ? '🎵' : '🔇';
    seToggleBtn.classList.toggle('muted', !SoundMgr.isSeOn());
    seToggleBtn.setAttribute('aria-pressed', String(SoundMgr.isSeOn()));
    seIcon.textContent = SoundMgr.isSeOn() ? '🔔' : '🔕';
  }
  refreshAudioButtons();
  bgmToggleBtn.addEventListener('click', () => {
    SoundMgr.unlock();
    SoundMgr.setBgmOn(!SoundMgr.isBgmOn());
    refreshAudioButtons();
  });
  seToggleBtn.addEventListener('click', () => {
    SoundMgr.unlock();
    SoundMgr.setSeOn(!SoundMgr.isSeOn());
    SoundMgr.seClick();
    refreshAudioButtons();
  });

  // ---------- Player name: shown in place of "プレイヤー1" in CPU/online
  // mode (PvP keeps the plain プレイヤー1/2 labels — there's no single
  // "you" when two people share one screen), the ending's "あなた", and
  // synced to the opponent in online play. Defaults to "ノア" so players
  // who don't care can just ignore the field entirely.
  const NAME_STORAGE_KEY = 'lineup4_player_name';
  const DEFAULT_PLAYER_NAME = 'ノア';
  const MAX_PLAYER_NAME_LENGTH = 10;
  const playerNameInput = document.getElementById('playerNameInput');
  playerNameInput.value = safeStorageGet(NAME_STORAGE_KEY) || DEFAULT_PLAYER_NAME;
  playerNameInput.addEventListener('input', () => {
    safeStorageSet(NAME_STORAGE_KEY, playerNameInput.value.slice(0, MAX_PLAYER_NAME_LENGTH));
  });
  function getPlayerName() {
    return playerNameInput.value.trim().slice(0, MAX_PLAYER_NAME_LENGTH) || DEFAULT_PLAYER_NAME;
  }
  // Minimal HTML-escaping for the couple of spots that build a status string
  // via innerHTML (for a colored-dot/avatar prefix) and splice a name into
  // it — online mode means that name can be the OPPONENT's, so it must never
  // be trusted as markup. Everywhere else a name is used with .textContent,
  // which is already safe regardless.
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---------- Kana mode: UI text only (buttons, labels, status messages).
  // Character names/dialogue are left as-is — this is about making the game's
  // own chrome readable without kanji, not a full localization pass. K()
  // picks the right string for whichever mode is active *at the moment it's
  // called*, so text built dynamically (status line, result overlays, etc.)
  // always reflects the current mode with no extra wiring; only text that's
  // set once into static HTML needs applyKanaMode() to re-run on toggle.
  const KANA_STORAGE_KEY = 'lineup4_kana_on';
  let kanaMode = safeStorageGet(KANA_STORAGE_KEY) === '1';
  function K(kanji, kana) { return kanaMode ? kana : kanji; }

  const kanaToggleBtn = document.getElementById('kanaToggle');
  function refreshKanaButton() {
    kanaToggleBtn.classList.toggle('muted', !kanaMode);
    kanaToggleBtn.setAttribute('aria-pressed', String(kanaMode));
  }
  refreshKanaButton();
  kanaToggleBtn.addEventListener('click', () => {
    SoundMgr.unlock();
    SoundMgr.seClick();
    kanaMode = !kanaMode;
    safeStorageSet(KANA_STORAGE_KEY, kanaMode ? '1' : '0');
    refreshKanaButton();
    applyKanaMode();
  });

  // Re-renders every *statically*-placed UI string (button labels, headings,
  // placeholders) for the current kanaMode. Dynamic strings (status line,
  // result overlays, ...) don't need this — they already call K() fresh each
  // time they run — but if a match is already in progress we also nudge the
  // couple of screens that only render once at match start.
  function applyKanaMode() {
    document.getElementById('titlePrefix').textContent = K('黄昏のフォー・イン・ア・', 'たそがれのフォー・イン・ア・');
    document.getElementById('titleSubtitle').textContent = K('遊び方を選んでください', 'あそびかたをえらんでください');
    document.getElementById('playerNameLabel').textContent = K('プレイヤー名', 'プレイヤーめい');
    document.getElementById('pvpBtnLabel').textContent = K('対人戦', 'たいじんせん');
    document.getElementById('cpuBtnLabel').textContent = K('CPU戦', 'CPUせん');
    document.getElementById('cpuBtnSub').textContent = K('LV1からの勝ち抜き', 'LV1からのかちぬき');
    document.getElementById('onlineBtnLabel').textContent = K('オンライン対戦', 'オンラインたいせん');
    document.getElementById('onlineBtnSub').textContent = K('友達を招待', 'ともだちをしょうたい');
    document.getElementById('omakeBtnLabel').textContent = K('おまけ', 'おまけ');
    document.getElementById('omakeBtnSub').textContent = K('クリア特典・スライドショー', 'クリアとくてん・スライドショー');
    document.getElementById('omakeBackBtn').textContent = K('タイトルへ', 'タイトルへ');
    renderOmakeBgmOptions();
    const backLabel = K('← タイトルに戻る', '← タイトルにもどる');
    document.getElementById('backToSplashBtn').textContent = backLabel;
    document.getElementById('onlineBackBtn').textContent = backLabel;

    document.getElementById('onlineHeading').textContent = '🌐 ' + K('オンライン対戦', 'オンラインたいせん');
    document.getElementById('onlineIntro').textContent = K('友達を招待して対戦しましょう', 'ともだちをしょうたいしてたいせんしましょう');
    document.getElementById('onlineCreateBtnLabel').textContent = K('部屋を作る', 'へやをつくる');
    document.getElementById('onlineOrJoin').textContent = K('または、もらったコードで参加', 'または、もらったコードでさんか');
    document.getElementById('onlineJoinCode').placeholder = K('部屋コード', 'へやコード');
    document.getElementById('onlineJoinBtn').textContent = K('参加する', 'さんかする');
    document.getElementById('onlineShareInstructions').textContent = K('このコードを友達に伝えるか、URLを共有してください', 'このコードをともだちにつたえるか、URLをきょうゆうしてください');
    document.getElementById('onlineCopyBtn').textContent = K('招待URLをコピー', 'しょうたいURLをコピー');
    document.getElementById('onlineWaitingText').textContent = K('対戦相手を待っています…', 'たいせんあいてをまっています…');
    document.getElementById('onlineCancelBtn').textContent = 'キャンセル';
    document.getElementById('onlineJoinNameLabel').textContent = K('プレイヤー名', 'プレイヤーめい');
    document.getElementById('onlineJoinConfirmBtn').textContent = K('開始する', 'かいしする');
    document.getElementById('onlineJoinCancelBtn').textContent = 'キャンセル';
    renderJoinConfirmText();
    deckShown[1] = deckShown[2] = undefined; updateCardButton();
    document.getElementById('storyHint').textContent = K('タップして進む', 'タップですすむ');
    document.getElementById('storySkipBtn').textContent = K('スキップ ≫', 'スキップ ≫');
    document.getElementById('endingHint').textContent = K('ドラッグで読み返せます／クリックでタイトルへ', 'ドラッグでよみかえせます／クリックでタイトルへ');

    titleBtn.setAttribute('aria-label', K('タイトルに戻る', 'タイトルにもどる'));

    // If a match is already up, refresh what's currently on screen too.
    if (!gameScreen.classList.contains('hidden')) {
      if (mode === 'pvp') {
        modeLabelEl.textContent = K('対人戦モード', 'たいじんせんモード');
      } else if (mode === 'online' && online) {
        modeLabelEl.textContent = `${K('オンライン対戦', 'オンラインたいせん')}（${K('部屋', 'へや')}: ${online.code}） ／ ${K('あなたは', 'あなたは')}${online.myPlayer === 1 ? K('ピンク', 'ぴんく') : K('ミント', 'みんと')}`;
      }
      if (typeof currentPlayer !== 'undefined' && !gameOver) updateStatus();
    }
  }

  // ---------- Splash screen ----------
  const splashScreen = document.getElementById('splashScreen');
  function showSplash() {
    SoundMgr.playTrack('title');
    splashScreen.classList.remove('hide');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => splashScreen.classList.add('show'));
    });
  }
  function hideSplash() {
    SoundMgr.unlock();
    SoundMgr.seClick();
    splashScreen.classList.remove('show');
    splashScreen.classList.add('hide');
  }
  showSplash();
  splashScreen.addEventListener('click', () => {
    hideSplash();
    // (Online play isn't available in the 3D version yet, so there is no ?room=CODE auto-join.)
  });

  document.getElementById('backToSplashBtn').addEventListener('click', () => {
    SoundMgr.seClick();
    showSplash();
  });

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const titleBtn = document.getElementById('titleBtn');
  const boardWrap = document.getElementById('board-wrap');
  const modeLabelEl = document.getElementById('modeLabel');

  const titleScreen = document.getElementById('titleScreen');
  const gameScreen = document.getElementById('gameScreen');
  const pvpBtn = document.getElementById('pvpBtn');
  const cpuBtn = document.getElementById('cpuBtn');
  const onlineBtn = document.getElementById('onlineBtn');

  // ---------- CPU character roster ----------
  // 5-stage strength ladder. `depth` = minimax search depth, `wildness` = chance
  // the character ignores the calculated best move in favor of a rough/random one
  // (a winning move is always taken regardless, so weaker levels never look "broken").
  const CHARACTERS = [
    { level: 1, name: 'からくり騎士', stars: 2, img: 'chara/LV1.webp', emoji: '⚙️',
      desc: '', depth: 1, wildness: 0.6, cardChance: 0.1, // 3D: tuned offline so a beginner wins ~40-50%
      // TODO: placeholder lines until the real dialogue is written
      lines: {
        normal: ['まだ台詞がありません。'],

  // `sealed` = the walls to draw (defaults to all; a card in flight draws the old set until it lands)

  function resetCardState() {

  }
  function flashStatus(msg) {
    updateStatus(msg);

  // why player p cannot play their card right now ('' = they can)
  function cardBlocker(p) {
    if (cs.used[p]) return K('このカードは、この対戦ではもう使いました', 'このカードは、このたいせんではもうつかいました');
    if (!humanCanMove() || p !== currentPlayer) return K('自分の番に使えます', 'じぶんのばんにつかえます');
    if (playableCells().length <= 2) return K('盤面の空きが少なくて使えません', 'ばんめんのあきがすくなくてつかえません');

    if (lv !== null && CARDS[lv].id === 'copy' && copiedLevel(p) === null) return K('写せるカードがありません（相手のカードは使用済み、または写せません）', 'うつせるカードがありません（あいてのカードはしようずみ、またはうつせません）');

    SoundMgr.seClick();

    if (targeting) { cancelTargeting(); return; }
    const lv = cardLevelOf(p);
    if (lv === null) { flashStatus(K('敵に勝つとカードが手に入ります', 'てきにかつとカードがてにはいります')); return; }
    // PvP: the other player's card stays secret until it is played
    if (deckHidden(p) && p !== currentPlayer) { flashStatus(K('相手のカードは、使うまでわかりません', 'あいてのカードは、つかうまでわかりません')); return; }

  // 鏡写し: the level of the card player p would be copying (null = nothing to copy)
  function copiedLevel(p) {

  }

    const lv = cardLevelOf(p);
    if (lv === null || cardBlocker(p)) return;

    const choices = cardChoices(id, p, grid, cs);

    }

  function beginTargeting(p, id, cands, effLv) {
    targeting = { player: p, id, cands, picked: -1, effLv };

    Board3D.clearGhost();
    Board3D.setPickSet(cands);
    refreshMarks();
    const how = id === 'usurp' ? K('自分の色にする球を', 'じぶんのいろにするたまを') : K('壁を置く場所を', 'かべをおくばしょを');

    targeting = null;

  // a tap while a card waits for its target
  function handleTargetTap(cell, pointerType) {
    const t = targeting;
    if (t.cands) {   // pick one of the lit balls (touch: tap once to mark it, again to confirm)
      if (cell < 0 || !t.cands.includes(cell)) return;
      if (pointerType === 'mouse' || t.picked === cell) { commitCard(t.player, { target: cell, effLv: t.effLv }); return; }
      t.picked = cell;

    if (pointerType === 'mouse' || pendingCell === cell) { pendingCell = -1; Board3D.clearGhost(); commitCard(t.player, { target: cell, effLv: t.effLv }); return; }
    pendingCell = cell;
    Board3D.setGhost(cell, t.player);
  }

  // ---- the show: the card flies out of its deck, glows in the middle of the screen and fades; then the
  // effect plays on the board (light gathers, then bursts) and the board changes at the moment of impact.
  const CARD_FX = {
    gear: { kind: 'shatter', color: 0xffc266, from: 'around' },
    raven: { kind: 'spawn', color: 0xb98cff, from: 'above' },
    seal: { kind: 'wall', color: 0xc084fc, from: 'around' },
    usurp: { kind: 'recolor', color: null, from: 'around' },
  };
  function cpuCardOrigin() {
    const r = document.getElementById('bubbleAvatar').getBoundingClientRect();

  }
  function originOf(p) {
    return mode === 'cpu' && p === 2 ? cpuCardOrigin() : deckEls[p].getBoundingClientRect();
  }
  function flyCard(lv, from, deckEl) {
    return new Promise((resolve) => {
      const W = from.width || 76, H = from.height || 106;
      const el = document.createElement('div');
      el.className = 'fly-card';
      el.style.cssText = `left:${from.left}px;top:${from.top}px;width:${W}px;height:${H}px;`;
      el.innerHTML = deckFaceHTML(lv);
      const flash = document.createElement('div');
      flash.className = 'fly-flash';
      const cx = window.innerWidth / 2, cy = window.innerHeight * 0.42;
      flash.style.left = `${cx}px`;
      flash.style.top = `${cy}px`;
      fxLayer.append(flash, el);
      if (deckEl) deckEl.classList.add('launching');
      const dx = cx - (from.left + W / 2), dy = cy - (from.top + H / 2);
      const sc = Math.min(3.2, Math.min(window.innerWidth, 560) * 0.46 / W);
      let finished = false;
      const end = () => {
        if (finished) return;
        finished = true;
        el.remove(); flash.remove();
        if (deckEl) deckEl.classList.remove('launching');
        resolve();
      };
      try {
        el.animate([
          { transform: 'translate(0px, 0px) scale(1) rotate(0deg)', opacity: 1, filter: 'brightness(1)', offset: 0 },
          { transform: `translate(${dx * 0.85}px, ${dy * 0.85 - 36}px) scale(${sc * 0.85}) rotate(-6deg)`, opacity: 1, filter: 'brightness(1.1)', offset: 0.36 },
          { transform: `translate(${dx}px, ${dy}px) scale(${sc}) rotate(0deg)`, opacity: 1, filter: 'brightness(1.6)', offset: 0.68 },
          { transform: `translate(${dx}px, ${dy}px) scale(${sc * 1.3}) rotate(0deg)`, opacity: 0, filter: 'brightness(4)', offset: 1 },
        ], { duration: 1500, easing: 'ease-in-out', fill: 'forwards' }).onfinish = end;
        flash.animate([
          { transform: 'translate(-50%, -50%) scale(0.2)', opacity: 0, offset: 0 },
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 0.95, offset: 0.7 },
          { transform: 'translate(-50%, -50%) scale(2.6)', opacity: 0, offset: 1 },
        ], { duration: 1500, easing: 'ease-out', fill: 'forwards' });
      } catch (e) { end(); }
      setTimeout(end, 2300);   // safety: never leave the game waiting on an animation
    });
  }
  // plays the whole show for player p's card `lv` (effLv = the card whose effect it is; differs for a copy)
  function presentCard(p, lv, effLv, r, prevSealed, done) {
    SoundMgr.seCard();
    const style = CARD_FX[CARDS[effLv].id] || CARD_FX.gear;
    const color = style.color !== null ? style.color : (p === 1 ? 0xff4fa3 : 0x3df2d8);
    flyCard(lv, originOf(p), deckEls[p])
      .then(() => {
        updateCardButton();   // the deck now shows the card as used (and face up in PvP)
        if (effLv === lv) return null;
        // 鏡写し: the opponent's card is revealed, flying out of its own deck
        return flyCard(effLv, originOf(3 - p), null);
      })
      .then(() => Board3D.fx({
        cells: r.cells || [r.cell], kind: style.kind, color, from: style.from,
        onImpact: () => { Board3D.sync(grid); refreshMarks(); SoundMgr.seBurst(); },
      }))
      .catch(() => { Board3D.sync(grid); refreshMarks(); })
      .then(() => setTimeout(done, 300));
  }
  // Plays player p's card (with the chosen target, if any) and moves the game on.
  function commitCard(p, o) {
    const lv = cardLevelOf(p);
    const effLv = o.effLv || lv;
    const t = targeting;
    targeting = null;
    Board3D.setPickSet(null);
    const prevSealed = cs.sealed.slice();
    const r = applyCard(CARDS[effLv].id, p, grid, cs, {
      depth: currentChar ? currentChar.depth : 3, smart: false, cands: t ? t.cands : undefined, target: o.target,
    });
    pendingCell = -1;
    Board3D.clearGhost();
    if (!r.ok) { refreshMarks(); flashStatus(K('このカードは使えませんでした', 'このカードはつかえませんでした')); return; }
    boardWrap.classList.add('locked');
    refreshMarks(prevSealed);
    updateStatus(`🃏 ${cardName(effLv)}${K('を使った！', 'をつかった！')}`);   // replaces the "tap a target" prompt
    presentCard(p, lv, effLv, r, prevSealed, () => {
      boardWrap.classList.remove('locked');
      const said = `🃏 ${cardName(effLv)}${K('を使った！', 'をつかった！')}`;
      if (r.win) { handleWin(p, r.win); return; }
      if (noPlayableCell()) { endAsDraw(); return; }
      if (r.endsTurn) {   // the card was this turn's move

  }

  // The CPU plays its own character's card (once per match): to stop a threat, or now and then.
  // Calls back with false (not played), true (played), 'turn' (it was the CPU's move) or 'win' (the game ended).
  function cpuTryCard(cb) {
    const ch = currentChar;
    if (!ch || mode !== 'cpu' || gameOver || playableCells().length <= 2) { cb(false); return; }
    const lv = ch.level;
    let effLv = lv;
    if (CARDS[lv].id === 'copy') {   // 鏡写し: it copies the card the player carries
      effLv = copiedLevel(2);
      if (effLv === null) { cb(false); return; }
    }
    const id = CARDS[effLv].id;
    if (!wantsCard(id, grid, cs, 2, ch.cardChance)) { cb(false); return; }
    const r = applyCard(id, 2, grid, cs, { depth: 3, smart: true });
    if (!r.ok) { cb(false); return; }
    showSingleLine(ch.name, `「${cardName(lv)}」！`);
    updateStatus(`🃏 ${escapeHtml(ch.name)}${K('は', 'は')}「${cardName(lv)}」${K('を使った！', 'をつかった！')}`);
    const prevSealed = [];   // (walls are only drawn when the effect lands)
    presentCard(2, lv, effLv, r, prevSealed, () => {
      if (r.win) { handleWin(2, r.win); cb('win'); return; }
      if (noPlayableCell()) { endAsDraw(); cb('win'); return; }
      cb(r.endsTurn ? 'turn' : true);
    });
  }

  let storyLineIndex = 0;

  // Double rAF: makes the browser register opacity:0 as a real paint before
  // the class is added, otherwise the fade can silently never play.
  function fadeStoryTextIn(textEl) {
    requestAnimationFrame(() => requestAnimationFrame(() => textEl.classList.add('show')));

  // previous line on some phones (GPU-composited opacity layer).
  function freshStoryTextEl(text) {
    const old = document.getElementById('storyText');
    const el = old.cloneNode(false);

      finished = true;
      overlay.classList.add('hidden');
      overlay.onclick = null;
