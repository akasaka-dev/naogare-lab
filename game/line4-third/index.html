        if (e.life[i] <= 0) { e.col[k] = e.col[k + 1] = e.col[k + 2] = 0; continue; }
        e.life[i] -= dts;
        if (e.life[i] <= 0) { e.col[k] = e.col[k + 1] = e.col[k + 2] = 0; continue; }
        const u = e.life[i] / e.max[i];                      // 1 when born, 0 when it dies
        e.vel[k + 1] *= 1 - dts * 0.45;                      // rising slows down
        e.pos[k] += (e.vel[k] + Math.sin(t * 2.3 + e.seed[i]) * 0.22) * dts;
        e.pos[k + 1] += e.vel[k + 1] * dts;
        e.pos[k + 2] += (e.vel[k + 2] + Math.cos(t * 2.0 + e.seed[i]) * 0.22) * dts;
        const b = Math.pow(u, 0.7) * (0.65 + 0.35 * Math.sin(t * 24 + e.seed[i] * 5));
        e.col[k] = e.rgb[k] * b; e.col[k + 1] = e.rgb[k + 1] * b; e.col[k + 2] = e.rgb[k + 2] * b;
      }
      e.geo.attributes.position.needsUpdate = true;
      e.geo.attributes.color.needsUpdate = true;
    }

    // a spark of light with a short fading tail: 3 sprites
    function makeRunner() {
      const r = [];
      for (let j = 0; j < RUN_SCALE.length; j++) { const s = makeGlow(); scene.add(s); r.push(s); }
      return r;
    }
    function setRunnersColor(runners, color) { runners.forEach((set) => set.forEach((s) => s.material.color.copy(color))); }
    function setRunnersVisible(runners, v) { runners.forEach((set) => set.forEach((s) => { s.visible = v; })); }
    // put a runner at position u (in edges) along the cube walk around `center`
    function placeRunner(set, center, u, op) {
      const h = CELL / 2;
      for (let j = 0; j < RUN_SCALE.length; j++) {
        const uu = (((u - j * RUN_STEP) % 8) + 8) % 8;
        const seg = Math.floor(uu), f = uu - seg;
        const v0 = CYC[seg], v1 = CYC[(seg + 1) % 8];
        const s = set[j];
        s.position.set(
          center.x + (v0[0] + (v1[0] - v0[0]) * f) * h,
          center.y + (v0[1] + (v1[1] - v0[1]) * f) * h,
          center.z + (v0[2] + (v1[2] - v0[2]) * f) * h
        );
        s.scale.setScalar(RUN_SCALE[j]);
        s.material.opacity = op * RUN_FADE[j];
      }
    }

    // a merged particle system (one draw call) for every stream of one colour
    function makeFlow(size, cap) {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(cap * 3), col = new Float32Array(cap * 3);
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      geo.setDrawRange(0, 0);
      const pts = new THREE.Points(geo, new THREE.PointsMaterial({
        size, map: glowTex, vertexColors: true, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      pts.frustumCulled = false;
      scene.add(pts);
      return { pts, geo, pos, col, cap, defs: [] };
    }
    // `n` particles drifting from a to b (world points), each wobbling around the line
    function addStream(flow, a, b, n, color, owner, wobble, speed) {
      const d = b.clone().sub(a), len = d.length();
      const dir = d.clone().normalize();
      const ref = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
      const p1 = new THREE.Vector3().crossVectors(dir, ref).normalize();
      const p2 = new THREE.Vector3().crossVectors(dir, p1).normalize();
      for (let k = 0; k < n && flow.defs.length < flow.cap; k++) {
        flow.defs.push({
          a, d, p1, p2, owner,
          r: color.r, g: color.g, b: color.b,
          phase: (k + Math.random() * 0.8) / n,
          speed: speed * (0.75 + Math.random() * 0.5),
          wob: wobble * (0.4 + Math.random() * 0.9),
          w1: Math.random() * 6.28, w2: 2 + Math.random() * 3,
        });
      }
      flow.geo.setDrawRange(0, flow.defs.length);
    }
    function updateFlow(flow, now) {
      const t = now / 1000;
      for (let i = 0; i < flow.defs.length; i++) {
        const q = flow.defs[i];
        const u = (q.phase + t * q.speed) % 1;
        const env = Math.sin(u * Math.PI);                  // fade in at the source, out at the target
        const w = q.wob * (0.35 + env);
        const s1 = Math.sin(t * q.w2 + q.w1) * w, s2 = Math.cos(t * q.w2 * 0.8 + q.w1) * w;
        const k = i * 3;
        flow.pos[k] = q.a.x + q.d.x * u + q.p1.x * s1 + q.p2.x * s2;
        flow.pos[k + 1] = q.a.y + q.d.y * u + q.p1.y * s1 + q.p2.y * s2;
        flow.pos[k + 2] = q.a.z + q.d.z * u + q.p1.z * s1 + q.p2.z * s2;
        const tw = (0.55 + 0.45 * Math.sin(t * 9 + q.w1 * 3)) * Math.sqrt(env) * q.owner.bright;
        flow.col[k] = q.r * tw; flow.col[k + 1] = q.g * tw; flow.col[k + 2] = q.b * tw;
      }
      flow.geo.attributes.position.needsUpdate = true;
      flow.geo.attributes.color.needsUpdate = true;
    }

    // ---- trump-card effects: light gathers into a cell (swirling in), then bursts out / shatters / materialises ----
    const FX_CAP = 900;
    function makeFxPool() {
      const geo = new THREE.BufferGeometry();
      const f = {
        pos: new Float32Array(FX_CAP * 3), col: new Float32Array(FX_CAP * 3), rgb: new Float32Array(FX_CAP * 3),
        s: new Float32Array(FX_CAP * 3), t: new Float32Array(FX_CAP * 3), v: new Float32Array(FX_CAP * 3),
        t0: new Float32Array(FX_CAP), ti: new Float32Array(FX_CAP), end: new Float32Array(FX_CAP), grav: new Float32Array(FX_CAP),
        next: 0, geo,
      };
      f.end.fill(-1);
      geo.setAttribute('position', new THREE.BufferAttribute(f.pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(f.col, 3));
      const pts = new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.75, map: glowTex, vertexColors: true, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      pts.frustumCulled = false;
      scene.add(pts);
      return f;
    }
    // a vertical beam texture: a hot narrow core inside a soft glow, fading out toward both ends
    let beamTex = null;
    function beamTexture() {
      if (beamTex) return beamTex;
      const W = 64, H = 256, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d'), img = g.createImageData(W, H);
      for (let y = 0; y < H; y++) {
        const v = Math.abs((y + 0.5) / H * 2 - 1);
        for (let x = 0; x < W; x++) {
          const u = Math.abs((x + 0.5) / W * 2 - 1);
          const a = Math.min(1, 0.5 * Math.pow(1 - u, 1.6) + 0.95 * Math.pow(1 - u, 7)) * Math.pow(1 - v, 1.3);
          const i = (y * W + x) * 4;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
          img.data[i + 3] = Math.round(a * 255);
        }
      }
      g.putImageData(img, 0, 0);
      beamTex = new THREE.CanvasTexture(c);
      return beamTex;
    }
    function fxEnd(g) {
      const i = fxGroups.indexOf(g);
      if (i >= 0) fxGroups.splice(i, 1);
      g.parts.forEach((p) => {
        [p.glow, p.flash].forEach((o) => { scene.remove(o); o.material.dispose(); });
        scene.remove(p.pillar);
        p.pillar.children.forEach((m) => { m.geometry.dispose(); m.material.dispose(); });
      });
      if (!g.fired) { g.fired = true; if (g.onImpact) g.onImpact(); }
      if (!g.resolved) { g.resolved = true; g.resolve(); }
    }
    function updateFx(dts) {
      fxClock += dts;
      const f = fxPool;
      if (f) {
        for (let i = 0; i < FX_CAP; i++) {
          const k = i * 3;
          if (f.end[i] <= fxClock || fxClock < f.t0[i]) { f.col[k] = f.col[k + 1] = f.col[k + 2] = 0; continue; }
          let b;
          if (fxClock < f.ti[i]) {   // gathering: spiral in, speeding up
            const q = (fxClock - f.t0[i]) / (f.ti[i] - f.t0[i]);
            const r = 1 - q * q;
            const a = r * 1.8, ca = Math.cos(a), sa = Math.sin(a);
            const rx = f.s[k] - f.t[k], rz = f.s[k + 2] - f.t[k + 2];
            f.pos[k] = f.t[k] + (rx * ca - rz * sa) * r;
            f.pos[k + 1] = f.t[k + 1] + (f.s[k + 1] - f.t[k + 1]) * r;
            f.pos[k + 2] = f.t[k + 2] + (rx * sa + rz * ca) * r;
            b = 0.3 + 0.7 * q;
          } else {                    // bursting out
            const v = fxClock - f.ti[i], B = f.end[i] - f.ti[i];
            f.pos[k] = f.t[k] + f.v[k] * v;
            f.pos[k + 1] = f.t[k + 1] + f.v[k + 1] * v + 0.5 * f.grav[i] * v * v;
            f.pos[k + 2] = f.t[k + 2] + f.v[k + 2] * v;
            b = Math.max(0, 1 - v / B);
          }
          f.col[k] = f.rgb[k] * b; f.col[k + 1] = f.rgb[k + 1] * b; f.col[k + 2] = f.rgb[k + 2] * b;
        }
        f.geo.attributes.position.needsUpdate = true;
        f.geo.attributes.color.needsUpdate = true;
      }
      fxGroups.slice().forEach((g) => {
        if (!g.fired && fxClock >= g.ti) { g.fired = true; if (g.onImpact) g.onImpact(); }
        const v = fxClock - g.ti;
        g.parts.forEach((p) => {
          if (v < 0) {   // charging: a halo grows in the cell
            const q = (fxClock - g.t0) / (g.ti - g.t0);
            p.glow.visible = true; p.glow.scale.setScalar(0.4 + 2.8 * q * q); p.glow.material.opacity = 0.3 + 0.7 * q;
            p.flash.visible = p.pillar.visible = false;
          } else {       // impact: flash and a pillar of light
            p.glow.visible = false;
            const fl = Math.max(0, 1 - v / 0.6);
            p.flash.visible = fl > 0; p.flash.scale.setScalar(3 + 6 * Math.min(1, v / 0.3)); p.flash.material.opacity = fl;
            // the beam shoots up through the cell, then thins out and fades
            const pq = Math.min(1, v / 1.3);
            const w = 1.15 - 0.85 * pq;
            p.pillar.visible = pq < 1;
            p.pillar.scale.set(w, Math.min(1, v / 0.12 + 0.05), w);
            const bo = Math.pow(1 - pq, 1.3);
            p.pillar.children.forEach((m) => { m.material.opacity = bo; });
          }
        });
        if (v >= 1.2) fxEnd(g);
      });
    }
    // spec: { cells, color, kind: 'shatter' | 'spawn' | 'wall' | 'recolor', from: 'around' | 'above', onImpact }.
    // The promise resolves once the effect has played out; onImpact runs at the moment the light lands.
    function fxBurst(spec) {
      return new Promise((resolve) => {
        if (!ready || !fxPool || !spec.cells || !spec.cells.length) { if (spec.onImpact) spec.onImpact(); resolve(); return; }
        const kind = spec.kind || 'burst', f = fxPool;
        const gather = 0.95, t0 = fxClock, ti = t0 + gather;
        const base = new THREE.Color(spec.color || 0xffffff);
        const col = new THREE.Color();
        const g = { t0, ti, parts: [], fired: false, resolved: false, onImpact: spec.onImpact, resolve };
        spec.cells.forEach((cell) => {
          const c = cellPosArr[cell];
          for (let n = 0; n < 80; n++) {
            const i = f.next; f.next = (f.next + 1) % FX_CAP;
            const k = i * 3;
            if (spec.from === 'above') {
              f.s[k] = c.x + (Math.random() - 0.5) * 2.4; f.s[k + 1] = c.y + 3 + Math.random() * 3.5; f.s[k + 2] = c.z + (Math.random() - 0.5) * 2.4;
            } else {
              const th = Math.random() * 6.283, ph = Math.acos(2 * Math.random() - 1), R = 2.2 + Math.random() * 1.6;
              f.s[k] = c.x + R * Math.sin(ph) * Math.cos(th); f.s[k + 1] = c.y + R * Math.cos(ph); f.s[k + 2] = c.z + R * Math.sin(ph) * Math.sin(th);
            }
            f.t[k] = c.x + (Math.random() - 0.5) * 0.3; f.t[k + 1] = c.y + (Math.random() - 0.5) * 0.3; f.t[k + 2] = c.z + (Math.random() - 0.5) * 0.3;
            f.t0[i] = t0 + Math.random() * 0.3;
            f.ti[i] = ti;
            const th2 = Math.random() * 6.283, ph2 = Math.acos(2 * Math.random() - 1);
            const sp = kind === 'shatter' ? 3 + Math.random() * 3.5 : kind === 'spawn' ? 1.2 + Math.random() * 2.2 : 2 + Math.random() * 3;
            f.v[k] = sp * Math.sin(ph2) * Math.cos(th2);
            f.v[k + 1] = sp * Math.cos(ph2) + (kind === 'shatter' ? 1.5 : 0);
            f.v[k + 2] = sp * Math.sin(ph2) * Math.sin(th2);
            f.grav[i] = kind === 'shatter' ? -7 : kind === 'spawn' ? 0 : -1;
            f.end[i] = ti + 0.6 + Math.random() * 0.6;
            col.copy(base).lerp(white, 0.15 + Math.random() * 0.55);
            f.rgb[k] = col.r; f.rgb[k + 1] = col.g; f.rgb[k + 2] = col.b;
          }
          const mkGlow = (op) => { const s2 = makeGlow(); s2.position.copy(c); s2.material.color.copy(base); s2.material.opacity = op; scene.add(s2); return s2; };
          const glow = mkGlow(0.3), flash = mkGlow(1);
          flash.material.color.lerp(white, 0.5);
          // a beam of light: two crossed soft-edged strips (look like a glowing column from any side)
          const pillar = new THREE.Group();
          for (let k = 0; k < 2; k++) {
            const strip = new THREE.Mesh(
              new THREE.PlaneGeometry(1.6, 9.5),
              new THREE.MeshBasicMaterial({ map: beamTexture(), color: base.clone().lerp(white, 0.35), transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            strip.rotation.y = k * Math.PI / 2;
            pillar.add(strip);
          }
          pillar.position.copy(c); pillar.visible = false; scene.add(pillar);
          g.parts.push({ glow, flash, pillar });
        });
        fxGroups.push(g);
        setTimeout(() => { if (fxGroups.includes(g)) fxEnd(g); }, (gather + 2) * 1000);   // safety (a paused tab)
      });
    }

    function buildScene() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
      tA = new THREE.Vector3(); upVec = new THREE.Vector3(0, 1, 0);
      tmpColor = new THREE.Color(); white = new THREE.Color(0xffffff);
      glowTex = makeGlowTexture();
      flameTex = makeFlameTexture();

      // no floor: the block floats, so it can be turned and looked at from any side

      const boxGeo = new THREE.BoxGeometry(CELL, CELL, CELL);
      const edgeGeo = new THREE.EdgesGeometry(boxGeo);
      for (let i = 0; i < 64; i++) {
        const p = cellXYZ(i);
        cellPosArr.push(p);
        const faceMat =new THREE.MeshBasicMaterial({ color: EDGE_BASE, transparent: true, opacity: 0.035, depthWrite: false });
        const box = new THREE.Mesh(boxGeo, faceMat);
        box.position.copy(p);
        scene.add(box);
        const edgeMat = new THREE.LineBasicMaterial({ color: EDGE_BASE, transparent: true, opacity: 0.22 });
        const edges = new THREE.LineSegments(edgeGeo, edgeMat);
        edges.position.copy(p);
        scene.add(edges);
        const flame = makeFlame();
        const glow = makeGlow();
        glow.position.copy(p);
        scene.add(glow);
        const runners = [makeRunner(), makeRunner()];
        setRunnersVisible(runners, false);
        cells.push({ faceMat, edgeMat, edgeBase: 0.22, flame, glow, runners, player: 0, t0: 0, win: false, m: 1, ph: 0, em: 0 });
      }
      flows[1] = makeFlow(0.8, 8000);
      flows[2] = makeFlow(0.8, 8000);
      flows.gold = makeFlow(0.95, 400);
      embers = makeEmbers();
      fxPool = makeFxPool();
      ghostRunners = [makeRunner(), makeRunner()];
      setRunnersVisible(ghostRunners, false);

      // the ghost: a pulsing light in the cell about to be played
      ghostFlame = makeFlame();
      ghostGlow = makeGlow();
      scene.add(ghostGlow);
      // depth guide: a thin vertical line of light through the ghost's whole column,
      // with a ring at each end of it
      guide = new THREE.Mesh(
        new THREE.CylinderGeometry(0.03, 0.03, 1, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      guide.visible = false;
      scene.add(guide);
      // the same for the two horizontal directions (along x and along z), fainter than the vertical one
      guideH = [0, 1].map((k) => {
        const m = new THREE.Mesh(
          new THREE.CylinderGeometry(0.022, 0.022, 1, 8),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        if (k === 0) m.rotation.z = Math.PI / 2; else m.rotation.x = Math.PI / 2;
        m.visible = false;
        scene.add(m);
        return m;
      });
      rings = [];
      for (let k = 0; k < 2; k++) {
        const r = new THREE.Mesh(
          new THREE.RingGeometry(0.4, 0.55, 32),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        r.rotation.x = -Math.PI / 2;
        r.visible = false;
        scene.add(r);
        rings.push(r);
      }
    }

    // The EMPTY cell nearest to this screen point (within PICK_RADIUS of the view
    // width), or -1. When two cells sit nearly on top of each other on screen the
    // one nearer the camera wins.
    function pickCell(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      const mx = clientX - rect.left, my = clientY - rect.top;
      const maxD = PICK_RADIUS * rect.width * (pickSet ? 1.8 : 1);
      camera.updateMatrixWorld();
      let best = -1, bestD = Infinity, bestZ = Infinity;
      for (let i = 0; i < 64; i++) {
        if (pickSet ? !pickSet.has(i) : occupied.has(i)) continue;
        tA.copy(cellXYZ(i)).project(camera);
        const dd = Math.hypot((tA.x + 1) / 2 * rect.width - mx, (1 - tA.y) / 2 * rect.height - my);
        if (dd > maxD) continue;
        if (dd < bestD - 8 || (dd < bestD + 8 && tA.z < bestZ)) { best = i; bestD = dd; bestZ = tA.z; }
      }
      return best;
    }

    function setupInput(el) {
      const pointers = new Map();
      // long-press menu / text selection must never open on the 3D view
      el.addEventListener('contextmenu', (e) => e.preventDefault());
      el.addEventListener('selectstart', (e) => e.preventDefault());
      el.addEventListener('dragstart', (e) => e.preventDefault());
      let down = null, pinch = null;
      // A lost pointerup/pointercancel (system gesture, notification pull-down,
      // app switch...) would leave a "ghost finger" in `pointers`: every later
      // single touch would then count as a pinch (zoom only, no orbit, no tap).
      // So: forget everything whenever it cannot possibly still be true.
      const resetPointers = () => { pointers.clear(); down = null; pinch = null; };
      el.addEventListener('pointerdown', (e) => {
        autoOrbit = false;
        // a primary pointer starts a fresh gesture: no other finger can be down
        if (e.isPrimary) resetPointers();
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { el.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone - harmless */ }
        if (pointers.size === 1) down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
        else {
          down = null;
          const [a, b] = Array.from(pointers.values());
          pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), dist: cam.dist };
        }
      });
      el.addEventListener('pointermove', (e) => {
        const p = pointers.get(e.pointerId);
        if (!p) {
          if (e.pointerType === 'mouse' && hoverCb) hoverCb(pickCell(e.clientX, e.clientY));
          return;
        }
        const dx = e.clientX - p.x, dy = e.clientY - p.y;
        p.x = e.clientX; p.y = e.clientY;
        if (pointers.size >= 2 && pinch) {
          const [a, b] = Array.from(pointers.values());
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d > 0) { cam.dist = pinch.dist * pinch.d / d; applyCamera(); }
          return;
        }
        if (down) {
          if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
          if (down.moved) {
            cam.theta -= dx * 0.008;
            cam.phi -= dy * 0.008;
            applyCamera();
          }
        }
      });
      const end = (e) => {
        const wasTap = down && !down.moved && pointers.size === 1 && performance.now() - down.t < 700 && e.type === 'pointerup';
        pointers.delete(e.pointerId);
        if (pointers.size < 2) pinch = null;
        if (wasTap && tapCb) tapCb(pickCell(e.clientX, e.clientY), e.pointerType);
        if (pointers.size === 0) down = null;
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('lostpointercapture', (e) => { if (pointers.has(e.pointerId)) end(e); });
      // no finger left on the screen at all -> nothing can be pressed any more
      const noTouches = (e) => { if (!e.touches || e.touches.length === 0) resetPointers(); };
      document.addEventListener('touchend', noTouches, { passive: true });
      document.addEventListener('touchcancel', noTouches, { passive: true });
      window.addEventListener('blur', resetPointers);
      document.addEventListener('visibilitychange', resetPointers);
      el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && hoverCb) hoverCb(-1); });
      el.addEventListener('wheel', (e) => {
        e.preventDefault();
        cam.dist *= e.deltaY > 0 ? 1.08 : 0.92;
        applyCamera();
      }, { passive: false });
    }

    function resize() {
      if (!ready || !host) return;
      const w = host.clientWidth, h = host.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    // Re-apply everything that depends on the ghost / occupancy / win state.
    function refreshView() {
      const gl = ghostCell >= 0 ? layerOf(ghostCell) : -1;
      for (let i = 0; i < 64; i++) {
        const c = cells[i];
        const inGl = gl >= 0 && layerOf(i) === gl;
        const lit = c.player !== 0;
        let edgeOp = inGl ? 0.5 : 0.2, faceOp = inGl ? 0.07 : 0.03;
        let edgeCol = EDGE_BASE;
        if (lit) {
          edgeCol = lightColor(c.player, 0.1).getHex();
          edgeOp = 1; faceOp = 0.22;
        }
        const mk = marks[i];
        let faceCol = -1;
        if (mk === 'seal' && !lit) { edgeCol = 0xc084fc; edgeOp = 1; faceOp = 0.9; faceCol = 0x1b0f36; }   // a wall: a dark solid block
        else if (mk === 'hint' && !lit) { edgeCol = 0xfde047; edgeOp = 1; faceOp = 0.5; faceCol = edgeCol; }
        else if (mk === 'cand') { edgeCol = 0xfde047; edgeOp = 1; faceOp = 0.42; faceCol = edgeCol; }   // a ball a card may take
        else if (mk === 'pick') { edgeCol = 0xffffff; edgeOp = 1; faceOp = 0.7; faceCol = edgeCol; }
        if (i === ghostCell) { edgeCol = lightColor(ghostPlayer, 0.2).getHex(); edgeOp = 1; faceOp = 0.18; faceCol = -1; }
        c.edgeMat.color.setHex(edgeCol);
        c.edgeMat.opacity = c.edgeBase = edgeOp;
        c.faceMat.color.setHex(faceCol >= 0 ? faceCol : (lit || i === ghostCell ? edgeCol : EDGE_BASE));
        c.faceMat.opacity = faceOp;
        // how bright this light burns: dimmed after a win, faded when another layer is being aimed at
        c.m = dimmed ? (c.win ? 1 : 0.22) : (gl < 0 || inGl ? 1 : 0.5);
        setFlameVisible(c.flame, lit);
        c.glow.visible = lit;
        setRunnersVisible(c.runners, lit);
      }
      bridges.forEach((br) => {
        const bothIn = gl < 0 || (layerOf(br.a) === gl && layerOf(br.b) === gl);
        br.bright = br.win ? 1 : dimmed ? 0.15 : (bothIn ? 1 : 0.4);
      });
    }

    // a fizzing stream of light particles between two lit cells of the same colour
    function addBridge(a, b, player) {
      const br = { a, b, player, win: false, bright: 1 };
      bridges.push(br);
      const pa = cellXYZ(a), pb = cellXYZ(b);
      const n = Math.max(10, Math.round(pa.distanceTo(pb) * 16));
      addStream(flows[player], pa, pb, n, lightColor(player, 0.35).clone(), br, 0.07, 0.42);
    }

    function init(hostEl) {
      if (ready) return true;
      if (typeof THREE === 'undefined') {
        hostEl.textContent = '3Dの読み込みに失敗しました。通信状況を確認して、ページを再読み込みしてください。';
        return false;
      }
      host = hostEl;
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0);
      host.innerHTML = '';
      host.appendChild(renderer.domElement);
      buildScene();
      setupInput(renderer.domElement);
      ready = true;
      applyCamera();
      refreshView();
      resize();
      if (window.ResizeObserver) { resizeObs = new ResizeObserver(resize); resizeObs.observe(host); }
      else window.addEventListener('resize', resize);
      return true;
    }

    let lastTick = 0, ghostPh = 0;
    function tick(now) {
      if (!running) return;
      rafId = requestAnimationFrame(tick);
      const dts = Math.min(0.05, Math.max(0, (now - lastTick) / 1000));
      lastTick = now;
      for (let i = 0; i < 64; i++) {
        const c = cells[i];
        if (!c.player) continue;
        // ignite: a quick flash that settles into a gentle breathing glow
        const k = Math.min(1, (now - c.t0) / 520);
        const ease = 1 - Math.pow(1 - k, 3);
        const flash = k < 1 ? Math.sin(k * Math.PI) * 1.1 : 0;
        const breathe = 1 + 0.06 * Math.sin(now / 520 + i);
        const win = c.win ? 1.35 + 0.25 * Math.sin(now / 170) : 1;
        c.glow.scale.setScalar(2.9 * (ease + flash) * breathe * win + 0.001);
        c.glow.material.opacity = Math.min(1, c.m * (0.85 + 0.2 * flash));
        // the flame leaps up when lit, then flickers; a winning flame burns higher and faster
        animateFlame(c.flame, cellPosArr[i], now / 1000 * (c.win ? 1.7 : 1), i * 1.3,
          (ease + flash * 0.5) * (c.win ? 1.25 : 0.95), c.m);
        // sparks running around the cell's edges (faster for the winning line, and while igniting)
        const rate = c.win ? 1.6 : (k < 1 ? 1.2 : 0.5);
        c.ph += dts * rate;   // accumulate, so a change of speed never makes the spark jump
        // now and then a spark flies off (a steady shower from the winning line)
        c.em += dts * (c.win ? 4 : 0.45) * c.m;
        while (c.em >= 1) { c.em -= 1; spawnEmber(cellPosArr[i], c.player); }
        const u = c.ph + i * 0.37;
        const sp = c.m;
        placeRunner(c.runners[0], cellPosArr[i], u, sp);
        placeRunner(c.runners[1], cellPosArr[i], u + 4, sp);
      }
      // the unlit lattice shimmers: a slow wave of brightness rises through the edges
      for (let i = 0; i < 64; i++) {
        const c = cells[i];
        if (c.player || i === ghostCell) continue;
        const wave = 0.5 + 0.5 * Math.sin(now / 1100 - layerOf(i) * 1.1 - (i % 4) * 0.5 - ((i % 16) >> 2) * 0.35);
        c.edgeMat.opacity = c.edgeBase * (0.7 + 0.8 * wave * wave);
      }
      if (ghostCell >= 0) {
        const s = 1 + 0.14 * Math.sin(now / 200);
        ghostGlow.scale.setScalar(2.5 * s);
        ghostGlow.material.opacity = 0.6 + 0.25 * Math.sin(now / 200);
        animateFlame(ghostFlame, cellPosArr[ghostCell], now / 1000, 0.7, 0.8 * s, 0.75);
        ghostPh += dts * 1.0;
        const u = ghostPh;
        placeRunner(ghostRunners[0], cellPosArr[ghostCell], u, 1);
        placeRunner(ghostRunners[1], cellPosArr[ghostCell], u + 4, 1);
      }
      updateEmbers(dts, now);
      updateFx(dts);
      updateFlow(flows[1], now);
      updateFlow(flows[2], now);
      if (flows.gold.defs.length) updateFlow(flows.gold, now);
      if (autoOrbit) { cam.theta += 0.006; applyCamera(); }
      renderer.render(scene, camera);
    }

    function hideGhost() {
      ghostCell = -1;
      if (ghostFlame) {
        setFlameVisible(ghostFlame, false);
        ghostGlow.visible = guide.visible = false;
        guideH.forEach((m) => { m.visible = false; });
        rings.forEach((r) => { r.visible = false; });
        setRunnersVisible(ghostRunners, false);
      }
    }
    function clearFlow(flow) { flow.defs.length = 0; flow.geo.setDrawRange(0, 0); }

    return {
      init,
      onTap(fn) { tapCb = fn; },
      onHover(fn) { hoverCb = fn; },
      start() {
        if (!ready || running) return;
        running = true;
        resize();
        rafId = requestAnimationFrame(tick);
      },
      stop() { running = false; cancelAnimationFrame(rafId); },
      // trump-card outlines on empty cells
      setMarks(m) { marks = m || {}; if (ready) refreshView(); },
      // taps may only pick these cells (occupied ones too); null = any empty cell again
      setPickSet(a) { pickSet = a ? new Set(a) : null; },
      // a trump card's effect: light gathers into the cells, then bursts (see fxBurst)
      fx: fxBurst,
      // redraw every light from a grid (after a card removed / recoloured a ball), without replaying ignitions
      sync(g) {
        if (!ready) return;
        occupied.clear();
        cells.forEach((c) => {
          c.player = 0; c.win = false; c.m = 1; setFlameVisible(c.flame, false); c.glow.visible = false;
          setRunnersVisible(c.runners, false);
        });
        bridges.length = 0;
        clearFlow(flows[1]); clearFlow(flows[2]); clearFlow(flows.gold);
        embers.life.fill(0);
        hideGhost();
        for (let i = 0; i < 64; i++) if (g[i]) this.placeBall(i, g[i], true);
        refreshView();
      },
      reset() {
        if (!ready) return;
        marks = {};
        pickSet = null;
        fxGroups.slice().forEach(fxEnd);
        occupied.clear();
        cells.forEach((c) => {
          c.player = 0; c.win = false; c.m = 1; setFlameVisible(c.flame, false); c.glow.visible = false;
          setRunnersVisible(c.runners, false);
        });
        bridges.length = 0;
        clearFlow(flows[1]); clearFlow(flows[2]); clearFlow(flows.gold);
        embers.life.fill(0);
        dimmed = false;
        autoOrbit = false;
        hideGhost();
        cam.theta = 0.62; cam.phi = 0.95; cam.dist = defaultDist();
        applyCamera();
        refreshView();
        resize();
      },
      // light up a cell for `player`
      placeBall(idx, player, quiet) {
        if (!ready) return;
        const c = cells[idx];
        c.player = player;
        c.t0 = quiet ? performance.now() - 5000 : performance.now();
        c.glow.material.color.copy(lightColor(player, 0.0));
        setFlameColor(c.flame, player);
        setRunnersColor(c.runners, lightColor(player, 0.55));
        c.em = Math.random();
        if (!quiet) for (let n = 0; n < 16; n++) spawnEmber(cellPosArr[idx], player);   // a burst of sparks as it ignites
        occupied.add(idx);
        // join every touching light of the same colour (all 26 directions)
        const l = layerOf(idx), y = ((idx % 16) / 4) | 0, x = idx % 4;
        for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy && !dz) continue;
          const nx = x + dx, ny = y + dy, nl = l + dz;
          if (nx < 0 || nx > 3 || ny < 0 || ny > 3 || nl < 0 || nl > 3) continue;
          const nIdx = nl * 16 + ny * 4 + nx;
          if (cells[nIdx].player === player) addBridge(idx, nIdx, player);
        }
        refreshView();
      },
      showWin(winCells) {
        if (!ready) return;
        const set = new Set(winCells);
        dimmed = true;
        hideGhost();
        cells.forEach((c, i) => { c.win = set.has(i); });
        bridges.forEach((br) => {
          // keep the beams that run along the winning line bright
          const i = winCells.indexOf(br.a), j = winCells.indexOf(br.b);
          br.win = i >= 0 && j >= 0 && Math.abs(i - j) === 1;
        });
        refreshView();
        // a dense golden stream of light pouring along the finished line
        const a = cellXYZ(winCells[0]), b = cellXYZ(winCells[3]);
        const dir = b.clone().sub(a).normalize();
        a.addScaledVector(dir, -0.7); b.addScaledVector(dir, 0.7);
        clearFlow(flows.gold);
        addStream(flows.gold, a, b, 90, new THREE.Color(0xfff1b0), { bright: 1 }, 0.12, 0.55);
        autoOrbit = true;
      },
      // the pulsing ghost light in a cell, with its depth guide (idx < 0 hides it)
      setGhost(idx, player) {
        if (!ready || !ghostFlame) return;
        if (idx < 0) { hideGhost(); refreshView(); return; }
        ghostCell = idx;
        ghostPlayer = player;
        const p = cellXYZ(idx);
        ghostGlow.position.copy(p);
        setFlameColor(ghostFlame, player);
        ghostGlow.material.color.copy(lightColor(player, 0.0));
        setFlameVisible(ghostFlame, true);
        ghostGlow.visible = true;
        setRunnersColor(ghostRunners, lightColor(player, 0.55));
        setRunnersVisible(ghostRunners, true);
        guide.material.color.copy(lightColor(player, 0.3));
        // the whole column through this cell: from just below its lowest cell to just above its highest
        const yLo = levelY(0) - CELL / 2 - 0.1, yHi = levelY(3) + CELL / 2 + 0.1;
        guide.position.set(p.x, (yLo + yHi) / 2, p.z);
        guide.scale.set(1, yHi - yLo, 1);
        guide.visible = true;
        // and along x / z through the cell, across the whole block
        const lo = -1.5 * SP - CELL / 2 - 0.1, hi = 1.5 * SP + CELL / 2 + 0.1;
        guideH[0].position.set((lo + hi) / 2, p.y, p.z); guideH[0].scale.set(1, hi - lo, 1);
        guideH[1].position.set(p.x, p.y, (lo + hi) / 2); guideH[1].scale.set(1, hi - lo, 1);
        guideH.forEach((m) => { m.material.color.copy(lightColor(player, 0.3)); m.visible = true; });
        rings.forEach((r, k) => {
          r.material.color.copy(lightColor(player, 0.3));
          r.position.set(p.x, k === 0 ? yLo : yHi, p.z);
          r.visible = true;
        });
        refreshView();
      },
      clearGhost() { if (ghostFlame) { hideGhost(); if (ready) refreshView(); } },
    };
  })();

  // ---------- Input glue: taps / hover from the 3D view ----------
  // Touch needs two taps (the first previews the light with a ghost and depth
  // guide, the second on the same ghost confirms; tapping elsewhere moves the
  // ghost, tapping empty space drops it) so a perspective-view mis-tap never
  // costs a move. A mouse click places straight away, with the same preview
  // on hover.
  // Block the browser's own gestures (iOS ignores user-scalable=no): pinch-zoom, double-tap zoom,
  // long-press menu and text selection - everywhere except real text inputs.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  const isTextField = (e) => e.target.closest && e.target.closest('input, textarea');
  document.addEventListener('contextmenu', (e) => { if (!isTextField(e)) e.preventDefault(); });
  document.addEventListener('selectstart', (e) => { if (!isTextField(e)) e.preventDefault(); });
  let pendingCell = -1;
  function humanCanMove() {
    return !gameOver && !cpuThinking && !(mode === 'cpu' && currentPlayer === 2)
      && !boardWrap.classList.contains('locked');
  }
  Board3D.onTap((cell, pointerType) => {
    if (!humanCanMove()) return;
    if (targeting) { handleTargetTap(cell, pointerType); return; }
    if (cell < 0 || grid[cell] !== 0 || isSealed(cell)) { pendingCell = -1; Board3D.clearGhost(); return; }
    if (pointerType === 'mouse' || pendingCell === cell) { handleCellClick(cell); return; }
    pendingCell = cell;
    Board3D.setGhost(cell, currentPlayer);
  });
  Board3D.onHover((cell) => {
    if (pendingCell >= 0 || targeting) return;
    if (cell < 0 || !humanCanMove() || grid[cell] !== 0 || isSealed(cell)) { Board3D.setGhost(-1); return; }
    Board3D.setGhost(cell, currentPlayer);
  });

  applyKanaMode(); // render the title/online screens in the persisted mode
})();
</script>
</body>
</html>
